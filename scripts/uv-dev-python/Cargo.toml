[package]
name = "uv-dev-python"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "2"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.2" }
serde_json = "1.0.145"
uv-python-types = { path = "../../crates/uv-python-types" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
