name = "project-recursive-extra-projection"
description = "A conditional extra reaches an extra on an otherwise unconditional package."

[root]
requires_python = ">=3.12,<3.15"
requires = ["a"]

[root.optional_dependencies]
feature = ["b[loop]; sys_platform == 'linux'"]

[expected]
satisfiable = true

[testgen]
disable = true

[packages.a.versions."1.0.0"]
requires_python = ">=3.12,<3.15"
sdist = false

[packages.a.versions."1.0.0".extras]
loop = ["b", "c"]

[packages.b.versions."1.0.0"]
requires_python = ">=3.12,<3.15"
sdist = false

[packages.b.versions."1.0.0".extras]
loop = ["a[loop]"]

[packages.c.versions."1.0.0"]
requires_python = ">=3.12,<3.15"
sdist = false
