name = "pip-check"
description = "A small dependency graph for checking installed package compatibility."

[root]
requires = ["parent"]

[expected]
satisfiable = true

[expected.packages]
parent = "1.0.0"
child = "3.6"
second-child = "2.2.1"

[packages.parent.versions."1.0.0"]
requires = ["child>=2.5,<4", "second-child>=1.21.1,<3"]
sdist_backend = "in-tree"

[packages.child.versions."2.4"]
sdist_backend = "in-tree"
[packages.child.versions."3.6"]
sdist_backend = "in-tree"

[packages.second-child.versions."1.20"]
sdist_backend = "in-tree"
[packages.second-child.versions."2.2.1"]
sdist_backend = "in-tree"

[packages.requires-python.versions."1.0.0"]
requires_python = ">=3.8"
sdist_backend = "in-tree"

[testgen]
disable = true
