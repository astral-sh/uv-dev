[packages.ruff.versions."0.3.4"]
requires_python = ">=3.8"
scripts = { ruff = "ruff:main" }
init_py = '''
from pathlib import Path
import sys

def main():
    if "--version" in sys.argv:
        print("ruff 0.3.4")
    elif len(sys.argv) > 1 and sys.argv[1] == "format":
        path = Path("main.py")
        assert path.read_text() == "x    = 1"
        path.write_text("x = 1\n")
        print("1 file reformatted")
    else:
        raise SystemExit(2)
'''
sdist_backend = "in-tree"

