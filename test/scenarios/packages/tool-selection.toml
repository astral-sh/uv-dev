name = "tool-selection"
description = "Executable packages for selecting locked and environment-provided tools."

[root]
requires = ["ty"]

[expected]
satisfiable = true

[packages.ty.versions."0.0.16"]
requires_python = ">=3.8"
upload_time = "2026-02-11T00:00:00Z"
scripts = { ty = "ty:main" }
init_py = '''
import sys

__version__ = "0.0.16"

def main():
    if "--version" in sys.argv:
        print("ty " + __version__)
    elif len(sys.argv) > 1 and sys.argv[1] == "check":
        print("All checks passed!")
    else:
        raise SystemExit(2)
'''
sdist_backend = "in-tree"

