name = "alternative-dependencies-mixed-unavailability"
description = "Alternative parent releases require dependency ranges that fail for different reasons: yanked releases and disabled source builds."

[root]
requires = ["parent"]

[expected]
satisfiable = false
explanation = "Distinct yanked and no-build incompatibilities must remain visible, including the no-build hint."

[packages.parent.versions."1.0.0"]
requires = ["dependency>=1,<2"]

[packages.parent.versions."2.0.0"]
requires = ["dependency>=2,<3"]

[packages.dependency.versions."1.0.0"]
yanked = true
sdist = false

[packages.dependency.versions."1.5.0"]
yanked = true
sdist = false

[packages.dependency.versions."2.0.0"]
wheel = false

[packages.dependency.versions."2.5.0"]
wheel = false

[resolver_options]
no_build = ["dependency"]
