name = "unpinned-sparse-root-incompatible-with-root-version"
description = "A root requirement does not become a pin merely because only one version is listed."

[root]
requires = ["b==1.0.0", "a>=2.0.0,<3.0.0"]

[expected]
satisfiable = false

[packages.a.versions."2.0.0"]
requires = ["b>=2.0.0"]

[packages.b.versions."1.0.0"]

[packages.b.versions."2.0.0"]

