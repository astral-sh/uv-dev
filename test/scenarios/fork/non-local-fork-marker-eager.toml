name = "fork-non-local-fork-marker-eager"
description = '''
The root needs `a` only on Windows. Visiting `a` creates a Python-version fork,
but its missing dependency is active only outside Windows. Every child must
discard root requirements excluded by that child's environment.
'''

[testgen]
disable = true

[resolver_options]
universal = true

[expected]
satisfiable = true

[root]
requires_python = ">=3.12,<3.15"
requires = ["a; sys_platform == 'win32'"]

[packages.a.versions."1.0.0"]
requires = ["missing; python_version >= '3.13' and sys_platform != 'win32'"]
sdist = false
