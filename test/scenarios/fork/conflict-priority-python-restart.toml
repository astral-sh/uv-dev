name = "fork-conflict-priority-python-restart"
description = '''
The Python 3.14 Windows fork is satisfiable after restarting without `a`, but
the pending Python 3.13 fork is not. Repeated conflicts on the virtual Python
constraint must not change its fixed priority or interrupt the resolver.
'''

[testgen]
disable = true

[resolver_options]
universal = true

[expected]
satisfiable = false

[root]
requires_python = ">=3.13,<3.15"
requires = [
  "a==1; python_full_version < '3.14'",
  "b>=1,<3; sys_platform == 'win32'",
  "b<2; sys_platform != 'win32'",
]

[packages.a.versions."1.0.0"]
requires = ["c"]
sdist = false

[packages.b.versions."2.0.0"]
sdist = false

[packages.c.versions."1.0.0"]
requires_python = ">=3.14"
requires = ["a>=2"]
sdist = false

[packages.c.versions."2.0.0"]
requires = ["b<2"]
sdist = false
