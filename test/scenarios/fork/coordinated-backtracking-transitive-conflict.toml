name = "coordinated-backtracking-transitive-conflict"
description = '''
The flexible fork can use either shared version according to its direct range,
but its root requires leaf 2. Selecting shared 1 also requires leaf 1, so a
coordinated attempt to reuse the constrained fork's shared version must fail
without invalidating the original flexible-fork solution. A dependency chain
delays the constrained fork until the flexible fork can finish.
'''

[testgen]
disable = true

[resolver_options]
universal = true

[expected]
satisfiable = true

[root]
requires_python = ">=3.11,<3.13"
requires = [
  "flexible; python_version < '3.12'",
  "leaf==2.0.0; python_version < '3.12'",
  "delayed; python_version >= '3.12'",
]

[packages.flexible.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["shared>=1.0.0,<=2.0.0"]

[packages.constrained.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["shared==1.0.0"]

[packages.delayed.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["delay-one"]

[packages.delay-one.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["delay-two"]

[packages.delay-two.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["constrained"]

[packages.shared.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["leaf==1.0.0"]

[packages.shared.versions."2.0.0"]
requires_python = ">=3.11"
requires = ["leaf==2.0.0"]

[packages.leaf.versions."1.0.0"]
requires_python = ">=3.11"

[packages.leaf.versions."2.0.0"]
requires_python = ">=3.11"
