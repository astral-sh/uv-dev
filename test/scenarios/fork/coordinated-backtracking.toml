name = "coordinated-backtracking"
description = '''
Two environment forks share a transitive dependency. The flexible package can
use either version, while the constrained and incompatible packages require
different versions. Solving the flexible fork first requires revisiting its
selected version to reach a common solution with the constrained fork. A
dependency chain delays discovery of the constrained fork's shared dependency
until the flexible fork can finish, even when fork decisions are interleaved.
The switchable package requires changing an earlier parent decision as well.
'''

[testgen]
disable = true

[resolver_options]
universal = true

[expected]
satisfiable = true

[root]
requires_python = ">=3.11,<3.13"
requires = [
  "flexible; python_version < '3.12'",
  "delayed; python_version >= '3.12'",
]

[packages.flexible.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["shared>=1.0.0,<=2.0.0"]

[packages.constrained.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["shared==1.0.0"]

[packages.delayed.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["delay-one"]

[packages.delay-one.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["delay-two"]

[packages.delay-two.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["constrained"]

[packages.incompatible.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["shared==2.0.0"]

[packages.switchable.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["shared==1.0.0"]

[packages.switchable.versions."2.0.0"]
requires_python = ">=3.11"
requires = ["shared==2.0.0"]

[packages.fallible-switchable.versions."1.0.0"]
requires_python = ">=3.11"
requires = ["shared==1.0.0", "unavailable"]

[packages.fallible-switchable.versions."2.0.0"]
requires_python = ">=3.11"
requires = ["shared==2.0.0"]

[packages.shared.versions."1.0.0"]
requires_python = ">=3.11"

[packages.shared.versions."2.0.0"]
requires_python = ">=3.11"
