name = "fork-non-local-fork-marker-transitive"
description = '''
Two parents are required everywhere, but their constraints on `c` apply on
disjoint platforms. Both versions can coexist in the universal lock.
'''

[resolver_options]
universal = true

[expected]
satisfiable = true

[root]
requires = ["a==1.0.0", "b==1.0.0"]

[packages.a.versions."1.0.0"]
requires = ["c<2.0.0 ; sys_platform == 'linux'"]

[packages.b.versions."1.0.0"]
requires = ["c>=2.0.0 ; sys_platform == 'darwin'"]

[packages.c.versions."1.0.0"]
[packages.c.versions."2.0.0"]
