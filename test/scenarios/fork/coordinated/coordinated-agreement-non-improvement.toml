name = "coordinated-agreement-non-improvement"
description = '''
The earlier fork can eliminate the first duplicate by downgrading
`switchable-a`. A delayed sibling then selects `leaf==2` before introducing
`shared-b==1`. Downgrading `switchable-b` would make `shared-b` consistent, but
would also introduce `leaf==1` and create a duplicate of `leaf`. The second
agreement must be rejected because it does not improve the total number of
duplicate versions. The first accepted agreement must remain in effect.
'''

[testgen]
kind = "lock"

[environment]
python = "3.12"

[resolver_options]
universal = true
fork_strategy = "fewest"
environments = ["python_version == '3.12'", "python_version == '3.13'"]

[expected]
satisfiable = true

[root]
requires_python = ">=3.12,<3.14"
requires = [
  "switchable-a; python_version < '3.13'",
  "switchable-b; python_version < '3.13'",
  "later-entry; python_version >= '3.13'",
]

[packages.switchable-a.versions."1.0.0"]
requires = ["shared-a==1.0.0"]

[packages.switchable-a.versions."2.0.0"]
requires = ["shared-a==2.0.0"]

[packages.switchable-b.versions."1.0.0"]
requires = ["shared-b==1.0.0", "leaf==1.0.0"]

[packages.switchable-b.versions."2.0.0"]
requires = ["shared-b==2.0.0", "leaf==2.0.0"]

[packages.later-entry.versions."1.0.0"]
requires = ["start-one"]

[packages.start-one.versions."1.0.0"]
requires = ["start-two"]

[packages.start-two.versions."1.0.0"]
requires = ["start-three"]

[packages.start-three.versions."1.0.0"]
requires = ["start-four"]

[packages.start-four.versions."1.0.0"]
requires = ["start-five"]

[packages.start-five.versions."1.0.0"]
requires = ["stage-a"]

[packages.stage-a.versions."1.0.0"]
requires = ["shared-a==1.0.0", "trade-gate"]

[packages.trade-gate.versions."1.0.0"]
requires = ["leaf==2.0.0", "trade-delay-one"]

[packages.trade-delay-one.versions."1.0.0"]
requires = ["trade-delay-two"]

[packages.trade-delay-two.versions."1.0.0"]
requires = ["trade-delay-three"]

[packages.trade-delay-three.versions."1.0.0"]
requires = ["shared-b==1.0.0"]

[packages.shared-a.versions."1.0.0"]
[packages.shared-a.versions."2.0.0"]
[packages.shared-b.versions."1.0.0"]
[packages.shared-b.versions."2.0.0"]
[packages.leaf.versions."1.0.0"]
[packages.leaf.versions."2.0.0"]
