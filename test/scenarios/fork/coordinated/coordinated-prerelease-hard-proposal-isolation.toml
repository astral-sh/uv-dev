name = "coordinated-prerelease-hard-proposal-isolation"
description = '''
The earlier broad fork finishes with stable `shared==2` before a delayed sibling
requires `shared==2.5rc1`. Although the earlier version range contains that
prerelease, a hard cross-fork agreement must not force a prerelease into the
completed stable solution. Only stable versions are hard coordination
proposals.
'''

[testgen]
kind = "lock"

[environment]
python = "3.12"

[resolver_options]
universal = true
fork_strategy = "fewest"
environments = ["python_version == '3.12'", "python_version == '3.13'"]

[expected]
satisfiable = true
explanation = "The completed broad fork retains stable `shared==2`, while the delayed fork uses `shared==2.5rc1`."

[root]
requires_python = ">=3.12,<3.14"
requires = [
  "stable-parent; python_version < '3.13'",
  "later-entry; python_version >= '3.13'",
]

[packages.stable-parent.versions."1.0.0"]
requires = ["shared>=1.0.0,<3.0.0"]

[packages.later-entry.versions."1.0.0"]
requires = ["delay-one"]

[packages.delay-one.versions."1.0.0"]
requires = ["delay-two"]

[packages.delay-two.versions."1.0.0"]
requires = ["prerelease-parent"]

[packages.prerelease-parent.versions."1.0.0"]
requires = ["shared==2.5.0rc1"]

[packages.shared.versions."1.0.0"]
[packages.shared.versions."2.0.0"]
[packages.shared.versions."2.5.0rc1"]
