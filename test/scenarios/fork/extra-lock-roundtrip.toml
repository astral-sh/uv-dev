name = "fork-extra-lock-roundtrip"

[root]
requires_python = ">=3.12,<3.15"
requires = [
  "a[feature]==1; python_full_version < '3.14'",
  "b>=1,<3; sys_platform == 'win32'",
  "b[feature]<2; sys_platform != 'win32'",
]

[expected]
satisfiable = true

[packages.a.versions."1.0.0"]
sdist = false

[packages.a.versions."1.0.0".extras]
feature = ["c; python_full_version >= '3.13'"]

[packages.b.versions."1.0.0"]
sdist = false

[packages.b.versions."1.0.0".extras]
feature = ["a[feature]==1; python_full_version < '3.14' or sys_platform == 'darwin'"]

[packages.b.versions."2.0.0"]
sdist = false

[packages.c.versions."1.0.0"]
requires = ["a>=2"]
requires_python = ">=3.14"
sdist = false

[packages.c.versions."2.0.0"]
requires = ["b[feature]!=2; sys_platform == 'win32'"]
sdist = false

[testgen]
disable = true
