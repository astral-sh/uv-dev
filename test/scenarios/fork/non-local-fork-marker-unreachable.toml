name = "fork-non-local-fork-marker-unreachable"
description = '''
The root only needs `a` on Windows, while `a` only needs `missing` elsewhere.
The two requirements never apply together, so `missing` is unreachable in
every environment.
'''

[testgen]
disable = true

[resolver_options]
universal = true

[expected]
satisfiable = true

[root]
requires_python = ">=3.12,<3.15"
requires = ["a; sys_platform == 'win32'"]

[packages.a.versions."1.0.0"]
requires = ["missing; sys_platform != 'win32'"]
sdist = false
