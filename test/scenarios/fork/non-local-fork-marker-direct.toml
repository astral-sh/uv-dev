name = "fork-non-local-fork-marker-direct"
description = '''
The roots require different versions of `c` through parents that are needed on
disjoint platforms. Both versions can coexist in the universal lock.
'''

[resolver_options]
universal = true

[expected]
satisfiable = true

[root]
requires = [
  "a==1.0.0 ; sys_platform == 'linux'",
  "b==1.0.0 ; sys_platform == 'darwin'",
]

[packages.a.versions."1.0.0"]
requires = ["c<2.0.0"]

[packages.b.versions."1.0.0"]
requires = ["c>=2.0.0"]

[packages.c.versions."1.0.0"]
[packages.c.versions."2.0.0"]
