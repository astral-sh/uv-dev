# The reviewed policy source is compiled into the action so its pre hook does not
# depend on checking out or executing the pull request's repository contents.
version = 1
source_revision = "67537ee5494df2920018969040af9c8cfee16723"

[groups.actions]
allow = [
  "github.com",
  "api.github.com",
  "codeload.github.com",
  "*.actions.githubusercontent.com",
  # GitHub's published Actions storage accounts and observed runner services.
  # https://api.github.com/meta -> domains.actions_inbound.full_domains
  "productionresultssa0.blob.core.windows.net",
  "productionresultssa1.blob.core.windows.net",
  "productionresultssa2.blob.core.windows.net",
  "productionresultssa3.blob.core.windows.net",
  "productionresultssa4.blob.core.windows.net",
  "productionresultssa5.blob.core.windows.net",
  "productionresultssa6.blob.core.windows.net",
  "productionresultssa7.blob.core.windows.net",
  "productionresultssa8.blob.core.windows.net",
  "productionresultssa9.blob.core.windows.net",
  "productionresultssa10.blob.core.windows.net",
  "productionresultssa11.blob.core.windows.net",
  "productionresultssa12.blob.core.windows.net",
  "productionresultssa13.blob.core.windows.net",
  "productionresultssa14.blob.core.windows.net",
  "productionresultssa15.blob.core.windows.net",
  "productionresultssa16.blob.core.windows.net",
  "productionresultssa17.blob.core.windows.net",
  "productionresultssa18.blob.core.windows.net",
  "productionresultssa19.blob.core.windows.net",
  "hosted-compute-request-orchestrator-prod-eus-01.githubapp.com",
  "hosted-compute-request-orchestrator-prod-eus-02.githubapp.com",
  "hosted-compute-request-orchestrator-prod-iad-01.githubapp.com",
  "hosted-compute-request-orchestrator-prod-iad-02.githubapp.com",
  "hosted-compute-watchdog-prod-eus-01.githubapp.com",
  "hosted-compute-watchdog-prod-eus-02.githubapp.com",
  "hosted-compute-watchdog-prod-iad-01.githubapp.com",
  "hosted-compute-watchdog-prod-iad-02.githubapp.com",
]

[groups.github-downloads]
allow = [
  "objects.githubusercontent.com",
  "objects-origin.githubusercontent.com",
  "release-assets.githubusercontent.com",
  "raw.githubusercontent.com",
]

[groups.rust-toolchain]
allow = ["static.rust-lang.org"]

[groups.rust-registry]
allow = ["crates.io", "index.crates.io", "static.crates.io"]

[groups.python]
allow = ["pypi.org", "files.pythonhosted.org", "releases.astral.sh"]

[groups.node]
allow = ["registry.npmjs.org"]

[profiles.github]
groups = ["actions"]
codex = ["issue-triage"]

[profiles.rustfmt]
groups = ["actions", "rust-toolchain"]

[profiles.prettier]
groups = ["actions", "node"]

[profiles.python-checks]
groups = ["actions", "github-downloads", "python"]

[profiles.rust-checks]
groups = ["actions", "github-downloads", "rust-toolchain", "rust-registry"]

[profiles.codex-create-bug-test]
groups = ["actions", "github-downloads"]
codex = ["create-bug-test"]

# Initial rollout candidates. These are reviewed starting policies, not claims
# that an unobserved job has already passed or that its dependencies are fixed.
[jobs."check-fmt.yml/rust"]
profile = "rustfmt"
privileges = "drop"

[jobs."check-fmt.yml/prettier"]
profile = "prettier"
privileges = "drop"

[jobs."check-fmt.yml/python"]
profile = "python-checks"
privileges = "drop"

[jobs."check-lock.yml/lock"]
profile = "python-checks"
privileges = "drop"

[jobs."check-lint.yml/ruff"]
profile = "python-checks"
privileges = "drop"

[jobs."check-lint.yml/ty"]
profile = "python-checks"
privileges = "drop"

[jobs."check-lint.yml/clippy-ubuntu"]
profile = "rust-checks"
privileges = "drop"
