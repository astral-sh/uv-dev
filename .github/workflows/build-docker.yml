# Build Docker images and save release candidates in Depot Registry.
#
# Uses Depot for multi-platform builds. Includes both a `uv` base image, which
# contains the `uv` and `uvx` binaries in a scratch image, and common base images
# with uv installed.
#
# On pull requests, CI builds the images when Docker-related files change.
# Images are not saved unless a trusted development-image push is requested.
#
# Releases, including dry-runs, save the images in Depot Registry. The returned
# artifact records their build IDs, digests, tags, and annotations for
# `publish-docker.yml`.
name: "Build Docker images"

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
        default: ""
      push-dev:
        required: false
        type: boolean
        default: false
    outputs:
      manifest:
        description: "Artifact ID for the saved Docker image manifest"
        value: ${{ jobs.docker-manifest.outputs.artifact-id }}
      publish-dev:
        description: "Whether to publish the saved development images"
        value: ${{ inputs.push-dev && jobs.docker-plan.outputs.push == 'true' }}

env:
  ACTIONS_CACHE_MODE: none
  DEPOT_PROJECT_PROD_UV: 7hd4vdzmw5 # prod/uv
  DEPOT_PROJECT_DEV_UV: v094vdzkdt # dev/uv
  DEPOT_PROJECT_DEV_UV_DEV: c3ht4lmvqh # dev/uv-dev
  UV_GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.push-dev && 'uv-dev' || 'uv' }}
  UV_DOCKERHUB_IMAGE: ${{ !inputs.push-dev && 'docker.io/astral/uv' || '' }}
  UV_LOCKED: 1

permissions:
  contents: read

jobs:
  docker-plan:
    name: plan
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      depot-project-id: ${{ steps.plan.outputs.depot-project-id }}
      login: ${{ steps.plan.outputs.login }}
      push: ${{ steps.plan.outputs.push }}
      push-version: ${{ steps.plan.outputs.push-version }}
      save: ${{ steps.plan.outputs.save }}
      tag: ${{ steps.plan.outputs.tag }}
      extra-images: ${{ steps.extra-images.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/docker

      - name: Plan images
        env:
          DRY_RUN: ${{ inputs.plan == '' || fromJson(inputs.plan).announcement_tag_is_implicit }}
          # Release dry-runs also exercise the Depot Registry handoff.
          RELEASE_BUILD: ${{ inputs.plan != '' }}
          TAG: ${{ inputs.plan != '' && fromJson(inputs.plan).announcement_tag }}
          PUSH_DEV: ${{ inputs.push-dev }}
          IS_LOCAL_PR: ${{ github.repository == 'astral-sh/uv' && github.event.pull_request.head.repo.full_name == github.repository }}
          IS_UV_DEV_PR: ${{ github.repository == 'astral-sh/uv-dev' && github.event.pull_request.head.repo.full_name == github.repository }}
        id: plan
        run: ./scripts/docker/plan-build.sh

      - name: Generate extra image matrix
        id: extra-images
        env:
          LOGIN: ${{ steps.plan.outputs.login }}
        run: ./scripts/docker/generate-image-matrix.sh

  docker-build-base:
    name: build uv
    needs: docker-plan
    env:
      DEPOT_PROJECT_ID: ${{ needs.docker-plan.outputs.depot-project-id }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # for Depot OIDC
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # Authenticate read-only pulls to avoid Docker Hub's anonymous rate limits.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.docker-plan.outputs.login == 'true' }}
        with:
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Check tag consistency
        if: ${{ needs.docker-plan.outputs.push-version == 'true' }}
        env:
          TAG: ${{ needs.docker-plan.outputs.tag }}
        run: |
          version=$(grep "version = " pyproject.toml | sed -e 's/version = "\(.*\)"/\1/g')
          if [ "${TAG}" != "${version}" ]; then
            echo "The input tag does not match the version from pyproject.toml:" >&2
            echo "${TAG}" >&2
            echo "${version}" >&2
            exit 1
          fi
          echo "Releasing ${version}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.UV_GHCR_IMAGE }}
            ${{ env.UV_DOCKERHUB_IMAGE }}
          # Set `org.opencontainers.image.version` to the release version,
          # rather than the branch name.
          tags: |
            type=raw,value=dry-run,enable=${{ needs.docker-plan.outputs.push == 'false' }}
            type=pep440,pattern={{ version }},value=${{ needs.docker-plan.outputs.tag }},enable=${{ needs.docker-plan.outputs.push-version == 'true' }}
            type=pep440,pattern={{ major }}.{{ minor }},value=${{ needs.docker-plan.outputs.tag }},enable=${{ needs.docker-plan.outputs.push-version == 'true' }}
            type=sha,enable=${{ inputs.push-dev }}

      - name: Build and save image
        id: build
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ env.DEPOT_PROJECT_ID }}
          context: .
          platforms: linux/amd64,linux/arm64
          save: ${{ needs.docker-plan.outputs.save }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Record image
        if: ${{ needs.docker-plan.outputs.save == 'true' }}
        env:
          NAME: uv
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: ./scripts/docker/record-image.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.docker-plan.outputs.save == 'true' }}
        with:
          name: docker-image-uv
          path: uv.json
          overwrite: true

  docker-build-extra:
    name: build ${{ matrix.image-mapping }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs:
      - docker-plan
      - docker-build-base
    env:
      DEPOT_PROJECT_ID: ${{ needs.docker-plan.outputs.depot-project-id }}
    permissions:
      contents: read
      id-token: write # for Depot OIDC
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.docker-plan.outputs.extra-images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/docker

      # Authenticate read-only pulls to avoid Docker Hub's anonymous rate limits.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.docker-plan.outputs.login == 'true' }}
        with:
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ needs.docker-plan.outputs.login == 'true' }}
        with:
          registry: dhi.io
          username: astralshbot
          password: ${{ secrets.DOCKERHUB_TOKEN_RO }}

      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Authenticate to Depot Registry
        if: ${{ needs.docker-plan.outputs.save == 'true' }}
        env:
          BUILD_ID: ${{ needs.docker-build-base.outputs.build-id }}
        run: ./scripts/docker/depot-login.sh

      - name: Generate Dockerfile and tags
        id: dockerfile
        env:
          VERSION: ${{ needs.docker-plan.outputs.tag }}
          PUSH_DEV: ${{ inputs.push-dev }}
          # When the new base image is not saved, use the registry's `latest` tag.
          UV_BASE_IMAGE: ${{ needs.docker-plan.outputs.save == 'true' && format('registry.depot.dev/{0}@{1}', env.DEPOT_PROJECT_ID, needs.docker-build-base.outputs.image-digest) || format('{0}:latest', env.UV_GHCR_IMAGE) }}
          IMAGE_MAPPING: ${{ matrix.image-mapping }}
        run: ./scripts/docker/generate-dockerfile.sh "$RUNNER_TEMP/docker-build"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        # GHCR uses index-level annotations for image metadata.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.UV_GHCR_IMAGE }}
            ${{ env.UV_DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            ${{ env.TAG_PATTERNS }}

      - name: Build and save image
        id: build
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          context: ${{ runner.temp }}/docker-build
          project: ${{ env.DEPOT_PROJECT_ID }}
          platforms: linux/amd64,linux/arm64
          save: ${{ needs.docker-plan.outputs.save }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Record image
        if: ${{ needs.docker-plan.outputs.save == 'true' }}
        env:
          NAME: ${{ steps.dockerfile.outputs.name }}
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: ./scripts/docker/record-image.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.docker-plan.outputs.save == 'true' }}
        with:
          name: docker-image-${{ steps.dockerfile.outputs.name }}
          path: ${{ steps.dockerfile.outputs.name }}.json
          overwrite: true

  docker-manifest:
    name: collect image manifest
    needs:
      - docker-plan
      - docker-build-base
      - docker-build-extra
    if: ${{ needs.docker-plan.outputs.save == 'true' }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/docker

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-image-*
          path: images
          merge-multiple: true

      - name: Assemble image manifest
        env:
          EXTRA_IMAGES: ${{ needs.docker-plan.outputs.extra-images }}
        run: ./scripts/docker/assemble-manifest.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: docker-manifest
          path: docker-manifest.json
          overwrite: true
