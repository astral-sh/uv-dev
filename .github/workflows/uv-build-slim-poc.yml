name: uv-build-slim parity

on:
  push:
    branches: [poc/uv-build-slim-codegen]
    paths:
      - experiments/uv-build-slim*/**
      - .github/workflows/uv-build-slim-poc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    name: Native reference (${{ matrix.arch }})
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: i686
            target: i686-pc-windows-msvc
          - arch: aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/uv
          ref: bd39416351244f273aeff89d495d4b0804b765a5
          persist-credentials: false
      - name: Build the pinned native backend
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          REFERENCE_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target $env:REFERENCE_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0 build --locked --package uv-build --target $env:REFERENCE_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.arch }}
          path: target/${{ matrix.target }}/debug/uv-build.exe
          if-no-files-found: error

  windows-parity:
    name: ${{ matrix.runtime }}
    needs: native-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - arch: x86_64
            runtime: cpython-3.8.20-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.9.25-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.10.22-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.11.17-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.12.15-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.13.16-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.13.16+freethreaded-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.14.8-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.14.8+freethreaded-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.15.0-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: x86_64
            runtime: cpython-3.15.0+freethreaded-windows-x86_64-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.8.20-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.9.25-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.10.22-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.11.17-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.12.15-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.13.16-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.13.16+freethreaded-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.14.8-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.14.8+freethreaded-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.15.0-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: i686
            runtime: cpython-3.15.0+freethreaded-windows-i686-none
            runner: namespace-profile-windows-2022-x86-64-16x32
          - arch: aarch64
            runtime: cpython-3.11.17-windows-aarch64-none
            runner: github-windows-11-aarch64-8
          - arch: aarch64
            runtime: cpython-3.12.15-windows-aarch64-none
            runner: github-windows-11-aarch64-8
          - arch: aarch64
            runtime: cpython-3.13.16-windows-aarch64-none
            runner: github-windows-11-aarch64-8
          - arch: aarch64
            runtime: cpython-3.13.16+freethreaded-windows-aarch64-none
            runner: github-windows-11-aarch64-8
          - arch: aarch64
            runtime: cpython-3.14.8-windows-aarch64-none
            runner: github-windows-11-aarch64-8
          - arch: aarch64
            runtime: cpython-3.14.8+freethreaded-windows-aarch64-none
            runner: github-windows-11-aarch64-8
          - arch: aarch64
            runtime: cpython-3.15.0-windows-aarch64-none
            runner: github-windows-11-aarch64-8
          - arch: aarch64
            runtime: cpython-3.15.0+freethreaded-windows-aarch64-none
            runner: github-windows-11-aarch64-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/uv
          ref: bd39416351244f273aeff89d495d4b0804b765a5
          path: reference-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.arch }}
          path: native
      - name: Compare generated Python with native Rust
        shell: pwsh
        env:
          PYTHON_RUNTIME: ${{ matrix.runtime }}
        run: |
          python experiments/uv-build-slim-wasm/tools/run_ci.py --uv-source reference-source --reference native/uv-build.exe --runtime $env:PYTHON_RUNTIME --report parity-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parity-${{ matrix.runtime }}
          path: parity-results
          if-no-files-found: warn
