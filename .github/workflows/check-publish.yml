on:
  workflow_call:
    inputs:
      free-runners:
        description: "Whether the selected runners use the free tier"
        required: true
        type: boolean
      runners:
        description: "Resolved runner roles from select-runners"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  cargo-publish-dry-run:
    timeout-minutes: ${{ inputs.free-runners && 40 || 20 }}
    runs-on: ${{ fromJSON(inputs.runners).ubuntu-x86_64-8 }}
    name: "cargo publish dry-run"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: "cargo publish dry-run"
        run: cargo publish --locked --workspace --dry-run
