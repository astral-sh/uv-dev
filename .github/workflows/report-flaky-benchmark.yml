name: "Report flaky benchmark"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The pull request with the CodSpeed report"
        required: true
        type: string
      head_sha:
        description: "The current pull request head SHA"
        required: true
        type: string
      comment_id:
        description: "The CodSpeed issue comment ID"
        required: true
        type: string
      updated_at:
        description: "The CodSpeed comment update timestamp"
        required: true
        type: string

permissions: {}

jobs:
  diagnose:
    if: github.repository == 'astral-sh/uv-dev' && github.ref == 'refs/heads/main'
    runs-on: github-ubuntu-24.04-x86_64-4
    environment: automations
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.diagnose.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Collect CodSpeed report"
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          COMMENT_ID: ${{ inputs.comment_id }}
          UPDATED_AT: ${{ inputs.updated_at }}
        run: |
          python3 scripts/report-flaky-benchmark.py collect \
            --pull-request "$PULL_REQUEST" --head-sha "$HEAD_SHA" \
            --comment-id "$COMMENT_ID" --updated-at "$UPDATED_AT" \
            --context .benchmark-flake-event.json >> "$GITHUB_OUTPUT"

      - name: "Diagnose benchmark changes"
        id: diagnose
        if: steps.context.outputs.ready == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.147.0"
          codex-home: "agents/codex"
          effort: high
          permission-profile: "benchmark-flake"
          safety-strategy: drop-sudo
          allow-users: "*"
          allow-bot-users: "astral-automations-bot[bot]"
          prompt-file: "agents/prompts/report-flaky-benchmark.md"
          output-schema-file: "agents/schemas/benchmark-flake.json"

      - name: "Upload report context"
        if: steps.diagnose.outputs.final-message != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-flake-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark-flake-event.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: "Upload Codex thread"
        if: always() && steps.context.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-benchmark-flake-${{ github.run_id }}-${{ github.run_attempt }}
          path: agents/codex/sessions
          if-no-files-found: warn

  report:
    needs: diagnose
    if: needs.diagnose.outputs.result != ''
    runs-on: github-ubuntu-24.04-x86_64-2
    environment: automations
    timeout-minutes: 5
    concurrency:
      group: benchmark-flake-issues
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # for the uv-dev issue credential broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Download report context"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-flake-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-flake

      - name: "Get uv-dev issue token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv-dev
          permissions: |
            issues: write
            pull_requests: read

      - name: "Report benchmark flakes"
        env:
          DIAGNOSIS: ${{ needs.diagnose.outputs.result }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          printf '%s\n' "$DIAGNOSIS" > "$RUNNER_TEMP/benchmark-flake/diagnosis.json"
          python3 scripts/report-flaky-benchmark.py report \
            --context "$RUNNER_TEMP/benchmark-flake/.benchmark-flake-event.json" \
            --diagnosis "$RUNNER_TEMP/benchmark-flake/diagnosis.json" \
            >> "$GITHUB_STEP_SUMMARY"
