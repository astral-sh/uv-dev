# Publish uv version information to the versions repository.
#
# Assumed to run as a subworkflow of .github/workflows/release.yml; specifically, as a post-announce
# job within `cargo-dist`.
name: publish-versions

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  publish-versions:
    permissions:
      contents: read
      id-token: write # for the credential broker
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: release
    env:
      VERSION: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set branch name"
        run: echo "BRANCH_NAME=update-versions-$VERSION-$(date +%s)" >> $GITHUB_ENV

      - name: "Get versions token"
        id: token
        uses: open-security-tools/ost-simple-sts@88f85462c7e9c9e2fb2745bd5ce4ee163aec0420 # v0.0.5
        with:
          exchange-url: ${{ secrets.RELEASES_STS_API_URL }}/exchange
          audience: ${{ secrets.RELEASES_STS_API_URL }}
          repository: astral-sh/versions
          permissions: |
            contents: write
            pull_requests: write

      - name: "Checkout versions repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/versions
          ref: main
          path: astral-versions
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: "Pin versions repo checkout"
        working-directory: astral-versions
        env:
          ASTRAL_VERSIONS_REF: bfaa684f15a3024c938f151df91df5ad0f9af8ba
        run: |
          git fetch --depth 1 origin "$ASTRAL_VERSIONS_REF"
          git reset --hard "$ASTRAL_VERSIONS_REF"

      - name: "Install uv"
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          enable-cache: false

      - name: "Update versions"
        env:
          PLAN: ${{ inputs.plan }}
        run: printf '%s' "$PLAN" | uv run astral-versions/scripts/convert-cargo-dist-plan.py | uv run astral-versions/scripts/insert-versions.py --name uv

      - name: "Commit versions"
        working-directory: astral-versions
        run: |
          git config user.name "astral-releases-bot[bot]"
          git config user.email "328004183+astral-releases-bot[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "Update uv to version $VERSION"

      - name: "Create Pull Request"
        working-directory: astral-versions
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          pull_request_title="Add uv $VERSION"
          head="$(git rev-parse "refs/heads/$BRANCH_NAME")"

          gh auth setup-git
          git push origin "$head:refs/heads/$BRANCH_NAME"

          gh pr create --repo astral-sh/versions --base main --head "$BRANCH_NAME" \
            --title "$pull_request_title" \
            --body "Automated versions update for $VERSION" \
            --label "automation"

          # An older publication remains usable until the replacement exists.
          replacement="$(
            gh pr view "$BRANCH_NAME" --repo astral-sh/versions \
              --json number,title,baseRefName,headRefName,headRefOid,isCrossRepository,state \
              | jq --exit-status --raw-output --arg title "$pull_request_title" \
                --arg branch "$BRANCH_NAME" --arg head "$head" \
                'select(.title == $title and .baseRefName == "main" and
                  .headRefName == $branch and .headRefOid == $head and
                  .isCrossRepository == false and .state == "OPEN" and
                  (.number | type) == "number" and .number > 0 and
                  .number == (.number | floor)) | .number'
          )"

          # A concurrent publisher with a newer PR must remain available.
          predecessors="$(
            gh pr list --repo astral-sh/versions --state open --base main \
              --label automation --limit 100 \
              --json number,title,headRefName,isCrossRepository,author \
              | jq --raw-output --arg title "$pull_request_title" \
                --arg branch "$BRANCH_NAME" --arg prefix "update-versions-$VERSION-" \
                --argjson replacement "$replacement" \
                '.[] | select(.number < $replacement and
                  .title == $title and .headRefName != $branch and
                  .isCrossRepository == false and (.headRefName | startswith($prefix)) and
                  (.author.login == "app/astral-releases-bot" or
                   .author.login == "astral-versions-bot")) | .number'
          )"
          if [ -n "$predecessors" ]; then
            while IFS= read -r predecessor; do
              gh pr close --repo astral-sh/versions "$predecessor"
            done <<< "$predecessors"
          fi

      - name: "Merge Pull Request"
        if: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit }}
        working-directory: astral-versions
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # Wait for PR to be created before merging
          sleep 10
          # Use admin to bypass required review
          gh pr merge --squash --admin "$BRANCH_NAME"
