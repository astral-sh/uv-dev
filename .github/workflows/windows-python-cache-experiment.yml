name: Windows Python cache experiment
"on":
  push:
    branches:
      - zb/ci-windows-python-cache-20260909
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1
jobs:
  seed:
    name: seed / ${{ matrix.replica }}
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        replica:
          - 1
          - 2
          - 3
          - 4
          - 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: c4be691531385fd7563e2a29d9bfa2e19b4c2025
      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.10
          checksum: f65744f94072152b1f86ba2aace4d01f1124d9a8ecb235805039e3718c36cac2
          enable-cache: true
          cache-python: true
          cache-dependency-glob: .python-versions
          cache-suffix: uv-ci-python-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          save-cache: true
          restore-cache: false
        id: setup-uv
      - name: Install required Python versions
        run: uv python install
      - name: Omit recreatable Python junctions from the cache
        run: |
          Get-ChildItem -LiteralPath $env:UV_PYTHON_INSTALL_DIR |
            Where-Object { $_.Name -match '^cpython-\d+\.\d+-windows-' } |
            ForEach-Object {
              if (-not ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) {
                throw "Expected a minor-version junction: $($_.FullName)"
              }
              [System.IO.Directory]::Delete($_.FullName)
            }
  compare:
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: ${{ matrix.variant }} / ${{ matrix.replica }} / ${{ matrix.partition }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replica:
          - 1
          - 2
          - 3
          - 4
          - 5
        variant:
          - uncached
          - cached
        partition:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: c4be691531385fd7563e2a29d9bfa2e19b4c2025
      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.10
          checksum: f65744f94072152b1f86ba2aace4d01f1124d9a8ecb235805039e3718c36cac2
          enable-cache: ${{ matrix.variant == 'cached' }}
          cache-python: true
          cache-dependency-glob: .python-versions
          cache-suffix: uv-ci-python-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          save-cache: false
        id: setup-uv
      - name: Require the expected interpreter cache
        if: ${{ matrix.variant == 'cached' }}
        env:
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: if ($env:CACHE_HIT -ne 'true') { throw 'Expected an exact Python cache hit' }
      - name: Install required Python versions
        run: uv python install
      - name: Install Rust toolchain
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspaces: ${{ env.UV_WORKSPACE }}
          cache-workspace-crates: "true"
          add-job-id-key: false
          save-if: "false"
      - name: Create NTFS test directory (low hardlink limit)
        run: New-Item -Path "C:\uv" -ItemType Directory -Force
      - name: Create SMB test share (alternative filesystem)
        run: |
          New-Item -Path "C:\uv-smb" -ItemType Directory -Force
          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"
      - name: Install cargo nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-nextest
      - name: Cargo test
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          UV_HTTP_RETRIES: 5
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE: "false"
          UV_INTERNAL__TEST_ALT_FS: \\localhost\uv-alt-fs
          UV_INTERNAL__TEST_SMB_FS: \\localhost\uv-alt-fs
          UV_INTERNAL__TEST_LOWLINKS_FS: C:\uv
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          cargo nextest run \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native \
            --workspace \
            --profile ci-windows \
            --partition hash:${{ matrix.partition }}/3
      - name: Upload pending snapshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pending-snapshots-windows-${{ matrix.partition }}-${{ matrix.variant }}-${{ matrix.replica }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: junit-results-windows-${{ matrix.partition }}-${{ matrix.variant }}-${{ matrix.replica }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
    defaults:
      run:
        shell: pwsh
    needs: seed
