# Analyze newly opened issues and attach their triage context.
name: "issue-triage"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "An issue URL or number"
        required: true
        type: string

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  triage:
    if: github.repository == 'astral-sh/uv'
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      issue-context: ${{ steps.issue.outputs.context }}
      context-revision: ${{ steps.issue-context.outputs.revision }}
      result: ${{ steps.triage.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Collect issue context"
        id: issue
        run: |
          gh issue view "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,url \
            > .issue-triage-event.json

          if ! jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            '.url | startswith("https://github.com/\($repository)/issues/")' \
            .issue-triage-event.json > /dev/null; then
            echo "The issue must belong to $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          jq --raw-output '"context=\(tojson)"' \
            .issue-triage-event.json >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}

      - name: "Load issue context"
        id: issue-context
        uses: $/.github/actions/load-issue-context
        with:
          issue-number: ${{ fromJSON(steps.issue.outputs.context).number }}
          path: ${{ runner.temp }}/issue-context
          template: ${{ github.workspace }}/agents/templates/issue-context-template.md
          issue-file: ${{ github.workspace }}/.issue-triage-event.json

      - name: "Prepare issue triage"
        run: |
          {
            printf 'Issue triage for #%s: %s\n\n' \
              "$(jq -r '.number' .issue-triage-event.json)" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' .issue-triage-event.json)"
            cat agents/prompts/triage-issue.md
          } > "$RUNNER_TEMP/triage-issue-prompt.md"

      - name: "Triage issue"
        id: triage
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.157.1"
          codex-home: "agents/codex"
          effort: high
          permission-profile: "issue-triage"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/triage-issue-prompt.md"
          output-schema-file: "agents/schemas/issue-triage.json"

      - name: "Upload issue context"
        if: steps.triage.outputs.final-message != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-triage-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context/README.md
          if-no-files-found: error
          retention-days: 1

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-issue-${{ fromJSON(steps.issue.outputs.context).number }}
          path: agents/codex/sessions
          if-no-files-found: warn
          overwrite: true

  context:
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ fromJSON(needs.triage.outputs.issue-context).number }}
      cancel-in-progress: false
    permissions:
      issues: write
    outputs:
      current: ${{ steps.publish.outputs.current }}
    steps:
      - name: "Download issue context"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-triage-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context-update

      - name: "Prepare issue context"
        run: |
          printf '%s\n' "$ISSUE_CONTEXT" > "$RUNNER_TEMP/issue.json"
          printf '%s\n' "$TRIAGE_RESULT" | jq '.' > "$RUNNER_TEMP/triage.json"
          printf '%s\n%s\n%s\n' '```json' "$TRIAGE_RESULT" '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_CONTEXT: ${{ needs.triage.outputs.issue-context }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}

      - name: "Publish issue context"
        id: publish
        uses: $/.github/actions/save-issue-context
        with:
          issue-number: ${{ fromJSON(needs.triage.outputs.issue-context).number }}
          expected-revision: ${{ needs.triage.outputs.context-revision }}
          readme: ${{ runner.temp }}/issue-context-update/README.md
          issue-file: ${{ runner.temp }}/issue.json
          result-name: triage
          result-file: ${{ runner.temp }}/triage.json

  reproduce-bug:
    needs: [triage, context]
    if: >-
      needs.context.outputs.current == 'true' &&
      needs.triage.outputs.result != '' &&
      (
        fromJSON(needs.triage.outputs.result).type == 'bug' ||
        fromJSON(needs.triage.outputs.result).type == 'question'
      )
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: $/.github/workflows/reproduce-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      issue-type: ${{ fromJSON(needs.triage.outputs.result).type }}
      runner: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    secrets: inherit

  fix-bug:
    needs:
      - triage
      - reproduce-bug
    if: >-
      needs.triage.outputs.result != '' &&
      fromJSON(needs.triage.outputs.result).type == 'bug' &&
      needs.reproduce-bug.outputs.result != '' &&
      fromJSON(needs.reproduce-bug.outputs.result).reproduction == 'reproducible' &&
      needs.reproduce-bug.outputs.pull-request != ''
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
    uses: $/.github/workflows/fix-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      issue-number: ${{ needs.reproduce-bug.outputs.issue-number }}
      reproduction-result: ${{ needs.reproduce-bug.outputs.result }}
      reproduction-thread-artifact-id: ${{ needs.reproduce-bug.outputs.thread-artifact-id }}
      parent-pull-request: ${{ needs.reproduce-bug.outputs.pull-request }}
      parent-head-ref: ${{ needs.reproduce-bug.outputs.head-ref }}
      parent-head-sha: ${{ needs.reproduce-bug.outputs.head-sha }}
      runner: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    secrets: inherit
