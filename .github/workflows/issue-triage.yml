# Analyze newly opened issues and persist their triage context.
name: "issue-triage"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "An issue URL or number"
        required: true
        type: string

permissions: {}

jobs:
  triage:
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      issue-context: ${{ steps.issue.outputs.issue-json }}
      result: ${{ steps.triage.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Collect issue context"
        id: issue
        uses: ./.github/actions/fetch-issue
        with:
          issue: ${{ inputs.issue || github.event.issue.number }}

      - name: "Prepare issue triage prompt"
        run: |
          {
            printf 'Issue triage for #%s: %s\n\n' \
              "$(jq -r '.number' .issue-triage-event.json)" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' .issue-triage-event.json)"
            cat agents/prompts/triage-issue.md
          } > "$RUNNER_TEMP/triage-issue-prompt.md"

      - name: "Triage issue"
        id: triage
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: "agents/codex"
          effort: high
          permission-profile: "issue-triage"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/triage-issue-prompt.md"
          output-schema-file: "agents/schemas/issue-triage.json"

      - name: "Upload Codex thread"
        if: always()
        uses: ./.github/actions/upload-codex-thread
        with:
          name: issue-triage

  context:
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ fromJSON(needs.triage.outputs.issue-context).number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # for the cross-repository issue-context credential broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Prepare issue context"
        run: |
          printf '%s\n' "$ISSUE_CONTEXT" > "$RUNNER_TEMP/issue.json"
          printf '%s\n' "$TRIAGE_RESULT" | jq '.' > "$RUNNER_TEMP/triage.json"
          jq --null-input --raw-output \
            --arg repository "$GITHUB_REPOSITORY" \
            --slurpfile issue "$RUNNER_TEMP/issue.json" \
            --slurpfile triage "$RUNNER_TEMP/triage.json" '
              $issue[0] as $issue |
              $triage[0] as $triage |
              [
                "# \($issue.title)",
                "",
                "Issue: \($repository)#\($issue.number)",
                "Classification: \($triage.type)",
                "",
                "## Summary",
                "",
                $triage.summary,
                "",
                "## Classification",
                "",
                $triage.type_reason,
                "",
                "## Related",
                "",
                (
                  if $triage.related.items | length > 0 then
                    $triage.related.items[] |
                    "- \(.url) (\(.state) \(.kind | gsub("_"; " "))): \(.title)\n  \(.reason)"
                  else
                    "No related issues or pull requests found."
                  end
                )
              ] | join("\n")
            ' > "$RUNNER_TEMP/README.md"
          printf '%s\n%s\n%s\n' '```json' "$TRIAGE_RESULT" '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_CONTEXT: ${{ needs.triage.outputs.issue-context }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}

      - name: "Get issue context token"
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            astral-sh/uv-dev
          # Linking an upstream issue to a fork branch requires both permissions on one token.
          permissions: |
            contents: write
            issues: write

      - name: "Initialize issue context"
        run: |
          issue_number="$(jq --raw-output '.number' "$RUNNER_TEMP/issue.json")"
          branch="issue/$issue_number"

          git -c core.hooksPath=/dev/null init --quiet "$RUNNER_TEMP/issue-context"
          cd "$RUNNER_TEMP/issue-context"
          git -c core.hooksPath=/dev/null remote add origin https://github.com/astral-sh/uv-dev.git

          gh issue develop "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --branch-repo astral-sh/uv-dev \
            --base issue/base \
            --name "$branch" \
            --checkout

          cp "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/triage.json" "$RUNNER_TEMP/README.md" .
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"

      - name: "Persist issue context"
        id: persist-context
        uses: ./.github/actions/commit-and-push
        with:
          working-directory: ${{ runner.temp }}/issue-context
          paths: |
            issue.json
            triage.json
            README.md
          commit-message: ${{ format('Update issue context for {0}#{1}', github.repository, fromJSON(needs.triage.outputs.issue-context).number) }}
          ref: ${{ format('issue/{0}', fromJSON(needs.triage.outputs.issue-context).number) }}
          repository: astral-sh/uv-dev
          github-token: ${{ steps.token.outputs.token }}

      - name: "Summarize issue context"
        if: steps.persist-context.outputs.changed == 'true'
        run: |
          printf 'Issue context: https://github.com/astral-sh/uv-dev/tree/issue/%s\n' \
            "$ISSUE_NUMBER" >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_NUMBER: ${{ fromJSON(needs.triage.outputs.issue-context).number }}

  reproduce-bug:
    needs: [triage, context]
    if: >-
      needs.triage.outputs.result != '' &&
      (
        fromJSON(needs.triage.outputs.result).type == 'bug' ||
        fromJSON(needs.triage.outputs.result).type == 'question'
      )
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
    uses: ./.github/workflows/reproduce-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      issue-type: ${{ fromJSON(needs.triage.outputs.result).type }}
      runner: ubuntu-latest
    secrets: inherit # zizmor: ignore[secrets-inherit] -- protected environment secrets are needed for reproduction
