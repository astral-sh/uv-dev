# Analyze newly opened issues and persist their triage context.
name: "issue-triage"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: "An issue URL or number"
        required: true
        type: string
      recovery-run:
        description: "A previous issue-triage run to resume from the fix stage"
        required: false
        type: string
      recovery-head-sha:
        description: "The current verified regression-test commit"
        required: false
        type: string

permissions: {}

jobs:
  initialize-context:
    if: >-
      github.repository == 'astral-sh/uv' &&
      inputs.recovery-run == '' &&
      inputs.recovery-head-sha == ''
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # for the cross-repository issue-context credential broker
      issues: read
    outputs:
      issue-context: ${{ steps.issue.outputs.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Collect issue context"
        id: issue
        run: |
          gh issue view "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,url \
            > "$RUNNER_TEMP/issue.json"

          if ! jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            '.url | startswith("https://github.com/\($repository)/issues/")' \
            "$RUNNER_TEMP/issue.json" > /dev/null; then
            echo "The issue must belong to $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          jq --raw-output '"context=\(tojson)"' \
            "$RUNNER_TEMP/issue.json" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}

      - name: "Get issue context token"
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            astral-sh/uv-dev
          # Linking an upstream issue to a fork branch requires both permissions on one token.
          permissions: |
            contents: write
            issues: write

      - name: "Initialize issue context"
        run: |
          issue_number="$(jq --raw-output '.number' "$RUNNER_TEMP/issue.json")"
          branch="issue/$issue_number"

          git init --quiet "$RUNNER_TEMP/issue-context"
          cd "$RUNNER_TEMP/issue-context"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/astral-sh/uv-dev.git"

          gh issue develop "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --branch-repo astral-sh/uv-dev \
            --base issue/base \
            --name "$branch" \
            --checkout

          if [ -f README.md ]; then
            echo "The existing issue context has already been initialized."
            exit 0
          fi

          cp "$GITHUB_WORKSPACE/agents/templates/issue-context-template.md" README.md
          cp "$RUNNER_TEMP/issue.json" issue.json
          git add issue.json README.md

          git \
            -c user.name="astral-automations-bot[bot]" \
            -c user.email="305554984+astral-automations-bot[bot]@users.noreply.github.com" \
            commit --message "Initialize issue context"
          git push origin "HEAD:refs/heads/$branch"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

  triage:
    needs: initialize-context
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      issue-context: ${{ needs.initialize-context.outputs.issue-context }}
      result: ${{ steps.triage.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Prepare issue triage"
        run: |
          printf '%s\n' "$ISSUE_CONTEXT" > .issue-triage-event.json
          issue_number="$(jq --raw-output '.number' .issue-triage-event.json)"

          git init --quiet "$RUNNER_TEMP/issue-context"
          git -C "$RUNNER_TEMP/issue-context" fetch --quiet --depth 1 \
            https://github.com/astral-sh/uv-dev.git \
            "refs/heads/issue/$issue_number"
          git -C "$RUNNER_TEMP/issue-context" checkout --quiet FETCH_HEAD

          {
            printf 'Issue triage for #%s: %s\n\n' \
              "$issue_number" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' .issue-triage-event.json)"
            cat agents/prompts/triage-issue.md
          } > "$RUNNER_TEMP/triage-issue-prompt.md"
        env:
          ISSUE_CONTEXT: ${{ needs.initialize-context.outputs.issue-context }}

      - name: "Triage issue"
        id: triage
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.146.0"
          codex-home: "agents/codex"
          effort: high
          permission-profile: "issue-triage"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/triage-issue-prompt.md"
          output-schema-file: "agents/schemas/issue-triage.json"

      - name: "Upload issue context"
        if: steps.triage.outputs.final-message != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-triage-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context/README.md
          if-no-files-found: error
          retention-days: 1

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-issue-${{ fromJSON(needs.initialize-context.outputs.issue-context).number }}
          path: agents/codex/sessions
          if-no-files-found: warn
          overwrite: true

  context:
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ fromJSON(needs.triage.outputs.issue-context).number }}
      cancel-in-progress: false
    permissions:
      id-token: write # for the uv-dev issue-context credential broker
    steps:
      - name: "Download issue context"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-triage-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context-update

      - name: "Prepare issue context"
        run: |
          printf '%s\n' "$ISSUE_CONTEXT" > "$RUNNER_TEMP/issue.json"
          printf '%s\n' "$TRIAGE_RESULT" | jq '.' > "$RUNNER_TEMP/triage.json"
          printf '%s\n%s\n%s\n' '```json' "$TRIAGE_RESULT" '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          ISSUE_CONTEXT: ${{ needs.triage.outputs.issue-context }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}

      - name: "Get issue context token"
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv-dev
          permissions: |
            contents: write

      - name: "Persist issue context"
        run: |
          issue_number="$(jq --raw-output '.number' "$RUNNER_TEMP/issue.json")"
          branch="issue/$issue_number"

          git init --quiet "$RUNNER_TEMP/issue-context"
          cd "$RUNNER_TEMP/issue-context"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/astral-sh/uv-dev.git"
          git fetch --quiet origin "refs/heads/$branch"
          git checkout --quiet FETCH_HEAD

          cp "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/triage.json" .
          cp "$RUNNER_TEMP/issue-context-update/README.md" README.md
          git add issue.json triage.json README.md

          if git diff --cached --quiet; then
            echo "The existing issue context is unchanged."
            exit 0
          fi

          git \
            -c user.name="astral-automations-bot[bot]" \
            -c user.email="305554984+astral-automations-bot[bot]@users.noreply.github.com" \
            commit --message "Update issue context"
          git push origin "HEAD:refs/heads/$branch"

          printf 'Issue context: https://github.com/astral-sh/uv-dev/tree/%s\n' "$branch" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

  reproduce-bug:
    needs: [triage, context]
    if: >-
      needs.triage.outputs.result != '' &&
      (
        fromJSON(needs.triage.outputs.result).type == 'bug' ||
        fromJSON(needs.triage.outputs.result).type == 'question'
      )
    permissions:
      contents: read
      id-token: write
      issues: read
    uses: $/.github/workflows/reproduce-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      issue-type: ${{ fromJSON(needs.triage.outputs.result).type }}
      runner: ubuntu-latest
    secrets: inherit

  fix-bug:
    needs:
      - triage
      - reproduce-bug
    if: >-
      needs.triage.outputs.result != '' &&
      fromJSON(needs.triage.outputs.result).type == 'bug' &&
      needs.reproduce-bug.outputs.result != '' &&
      fromJSON(needs.reproduce-bug.outputs.result).reproduction == 'reproducible' &&
      needs.reproduce-bug.outputs.pull-request != ''
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
    uses: $/.github/workflows/fix-bug.yml
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
      issue-number: ${{ needs.reproduce-bug.outputs.issue-number }}
      reproduction-result: ${{ needs.reproduce-bug.outputs.result }}
      reproduction-thread-artifact-id: ${{ needs.reproduce-bug.outputs.thread-artifact-id }}
      parent-pull-request: ${{ needs.reproduce-bug.outputs.pull-request }}
      parent-head-ref: ${{ needs.reproduce-bug.outputs.head-ref }}
      parent-head-sha: ${{ needs.reproduce-bug.outputs.head-sha }}
      runner: ubuntu-latest
    secrets: inherit

  prepare-fix-recovery:
    if: >-
      github.repository == 'astral-sh/uv' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.recovery-run != '' || inputs.recovery-head-sha != '')
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      issue-number: ${{ steps.prepare.outputs.issue-number }}
      reproduction-result: ${{ steps.prepare.outputs.reproduction-result }}
      reproduction-thread-artifact-id: ${{ steps.prepare.outputs.reproduction-thread-artifact-id }}
      parent-pull-request: ${{ steps.prepare.outputs.parent-pull-request }}
      trusted-base-sha: ${{ steps.prepare.outputs.trusted-base-sha }}
    steps:
      - name: "Prepare verified fix recovery"
        id: prepare
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.recovery-head-sha }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ inputs.recovery-run }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
            ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
            ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Fix recovery requires a trusted run and pinned regression-test revision." >&2
            exit 1
          fi

          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,url \
            > "$RUNNER_TEMP/recovery-issue.json"
          if ! jq --exit-status --arg repository "$GITHUB_REPOSITORY" '
            .number > 0
            and .url == ("https://github.com/" + $repository + "/issues/" + (.number | tostring))
          ' "$RUNNER_TEMP/recovery-issue.json" > /dev/null; then
            echo "The recovery issue does not belong to the trusted repository." >&2
            exit 1
          fi
          issue_number="$(jq --raw-output '.number' "$RUNNER_TEMP/recovery-issue.json")"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            > "$RUNNER_TEMP/recovery-run.json"
          if ! jq --exit-status --arg repository "$GITHUB_REPOSITORY" --argjson id "$RUN_ID" '
            .id == $id
            and .repository.full_name == $repository
            and .head_repository.full_name == $repository
            and .head_branch == "main"
            and .path == ".github/workflows/issue-triage.yml"
            and (.event | IN("issues", "workflow_dispatch"))
            and .status == "completed"
            and (.head_sha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/recovery-run.json" > /dev/null; then
            echo "The reproduction did not come from a trusted issue-triage run." >&2
            exit 1
          fi
          attempt="$(jq --raw-output '.run_attempt' "$RUNNER_TEMP/recovery-run.json")"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/recovery-artifacts.json"
          thread="codex-thread-reproduce-bug-$RUN_ID-$attempt"
          if ! jq --exit-status \
            --arg thread "$thread" \
            --arg issue "issue-context-$issue_number-$RUN_ID-$attempt" '
              ([.artifacts[] | select(.name == $thread and .expired == false)] | length) == 1
              and any(.artifacts[]; .name == $issue)
            ' "$RUNNER_TEMP/recovery-artifacts.json" > /dev/null; then
            echo "The trusted run does not contain this issue and its reproduction thread." >&2
            exit 1
          fi

          parent_head_ref="zb/reproduce-bug/$issue_number"
          gh pr list --repo astral-sh/uv-dev --state all --head "$parent_head_ref" --limit 2 \
            --json baseRefName,headRefName,headRefOid,headRepository,url \
            > "$RUNNER_TEMP/recovery-pull-requests.json"
          if ! jq --exit-status --arg ref "$parent_head_ref" --arg sha "$EXPECTED_HEAD_SHA" '
            length == 1
            and .[0].baseRefName == "main"
            and .[0].headRepository.nameWithOwner == "astral-sh/uv-dev"
            and .[0].headRefName == $ref
            and .[0].headRefOid == $sha
          ' "$RUNNER_TEMP/recovery-pull-requests.json" > /dev/null; then
            echo "The regression-test pull request does not match its pinned revision." >&2
            exit 1
          fi

          gh api repos/astral-sh/uv-dev/contents/reproduction.json \
            --method GET --raw-field ref="issue/$issue_number" --jq .content |
            base64 --decode > "$RUNNER_TEMP/recovery-reproduction.json"
          if ! jq --exit-status '
            .reproduction == "reproducible" and (.reason | type == "string" and length > 0)
          ' "$RUNNER_TEMP/recovery-reproduction.json" > /dev/null; then
            echo "The issue context does not contain a confirmed reproduction." >&2
            exit 1
          fi

          {
            echo "issue-number=$issue_number"
            jq --raw-output '"reproduction-result=\(tojson)"' \
              "$RUNNER_TEMP/recovery-reproduction.json"
            jq --raw-output --arg thread "$thread" \
              '.artifacts[] | select(.name == $thread and .expired == false)
               | "reproduction-thread-artifact-id=\(.id)"' \
              "$RUNNER_TEMP/recovery-artifacts.json"
            jq --raw-output '"parent-pull-request=\(.[0].url)"' \
              "$RUNNER_TEMP/recovery-pull-requests.json"
            jq --raw-output '"trusted-base-sha=\(.head_sha)"' \
              "$RUNNER_TEMP/recovery-run.json"
          } >> "$GITHUB_OUTPUT"

  recover-fix:
    needs: prepare-fix-recovery
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
    uses: $/.github/workflows/fix-bug.yml
    with:
      issue: ${{ inputs.issue }}
      issue-number: ${{ needs.prepare-fix-recovery.outputs.issue-number }}
      reproduction-result: ${{ needs.prepare-fix-recovery.outputs.reproduction-result }}
      reproduction-thread-artifact-id: ${{ needs.prepare-fix-recovery.outputs.reproduction-thread-artifact-id }}
      reproduction-run-id: ${{ inputs.recovery-run }}
      parent-pull-request: ${{ needs.prepare-fix-recovery.outputs.parent-pull-request }}
      parent-head-ref: ${{ format('zb/reproduce-bug/{0}', needs.prepare-fix-recovery.outputs.issue-number) }}
      parent-head-sha: ${{ inputs.recovery-head-sha }}
      trusted-base-sha: ${{ needs.prepare-fix-recovery.outputs.trusted-base-sha }}
      runner: ubuntu-latest
    secrets: inherit
