name: Windows Python archive preload trial

on:
  push:
    branches: [ee/windows-archive-preload-trial]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified archives
        id: prepare
        run: python3 scripts/prepare-windows-python-trial.py
      - name: Upload archives for shard 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-shard-1
          path: ${{ runner.temp }}/windows-python/1/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload archives for shard 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-shard-2
          path: ${{ runner.temp }}/windows-python/2/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload archives for shard 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-shard-3
          path: ${{ runner.temp }}/windows-python/3/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  cargo-test-windows:
    needs: prepare
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: "trial ${{ matrix.trial }} / shard ${{ matrix.partition }} / ${{ matrix.arm }}"
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6b7f0a4e94ca32e2bb6d015dd58cef8edb68b76c
          persist-credentials: false

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: $/.github/actions/setup-uv-toolchain
        with:
          enable-cache: auto

      - name: Restore shard Python archives
        if: matrix.arm == 'preload'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-shard-${{ matrix.partition }}
          path: ${{ env.UV_PYTHON_CACHE_DIR }}

      - name: Check shard Python archives
        if: matrix.arm == 'preload'
        shell: bash
        working-directory: ${{ env.UV_PYTHON_CACHE_DIR }}
        run: sha256sum --check checksums.sha256

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspace: ${{ env.UV_WORKSPACE }}
          profile: fast-build-nightly
          # Use the same cache entry across the partitions
          add-job-id-key: false
          save-if: "false"

      - name: "Create NTFS test directory (low hardlink limit)"
        run: New-Item -Path "C:\uv" -ItemType Directory -Force

      - name: "Create SMB test share (alternative filesystem)"
        run: |
          New-Item -Path "C:\uv-smb" -ItemType Directory -Force
          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

      - name: "Cargo test"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          # Avoid permission errors during concurrent tests
          # See https://github.com/astral-sh/uv/issues/6940
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          UV_INTERNAL__TEST_ALT_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_SMB_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "C:\\uv"
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          uv run --only-group test cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native \
            --workspace \
            --profile ci-windows \
            --partition hash:${{ matrix.partition }}/3

      - name: "Upload pending snapshots"
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-snapshots-${{ matrix.trial }}-${{ matrix.partition }}-${{ matrix.arm }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: "Upload JUnit results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-${{ matrix.trial }}-${{ matrix.partition }}-${{ matrix.arm }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
