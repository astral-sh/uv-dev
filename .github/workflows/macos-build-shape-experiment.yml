name: macOS build runner shape experiment
"on":
  push:
    branches:
      - zb/ci-macos-build-shape-20260909
permissions:
  contents: read
jobs:
  dev-seed:
    name: dev seed / ${{ matrix.replica }}
    timeout-minutes: 35
    runs-on: namespace-profile-macos-15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: c4be691531385fd7563e2a29d9bfa2e19b4c2025
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: uv-ci-macos-build-shape-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          cache-workspace-crates: "true"
          save-if: "true"
          cache-bin: false
          add-job-id-key: false
        id: rust-cache
      - name: Build
        run: cargo build --profile no-debug-nightly -Z checksum-freshness --bin uv --bin uvx
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        replica:
          - 1
          - 2
          - 3
          - 4
          - 5
  dev-compare:
    name: dev / ${{ matrix.cache }} / ${{ matrix.shape.id }} / ${{ matrix.replica }}
    timeout-minutes: 35
    runs-on: ${{ matrix.shape.runner }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: c4be691531385fd7563e2a29d9bfa2e19b4c2025
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: uv-ci-macos-build-shape-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replica }}
          cache-workspace-crates: "true"
          save-if: "false"
          cache-bin: false
          add-job-id-key: false
        id: rust-cache
        if: ${{ matrix.cache == 'warm' }}
      - name: Require the expected Rust cache
        if: ${{ matrix.cache == 'warm' }}
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        shell: bash
        run: test "$CACHE_HIT" = true
      - name: Build
        run: cargo build --profile no-debug-nightly -Z checksum-freshness --bin uv --bin uvx
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-macos-aarch64-${{ github.sha }}-${{ matrix.cache }}-${{ matrix.shape.id }}-${{ matrix.replica }}
          path: |
            ./target/no-debug-nightly/uv
            ./target/no-debug-nightly/uvx
          retention-days: 1
    needs: dev-seed
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        replica:
          - 1
          - 2
          - 3
          - 4
          - 5
        cache:
          - cold
          - warm
        shape:
          - id: 12x28
            runner: namespace-profile-macos-15
          - id: 6x14
            runner: namespace-profile-uv-ci-macos-15-6x14
  release-compare:
    name: release / ${{ matrix.shape.id }} / ${{ matrix.replica }}
    runs-on: ${{ matrix.shape.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: c4be691531385fd7563e2a29d9bfa2e19b4c2025
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Prep README.md
        run: python scripts/transform_readme.py --target pypi
      - name: Install cargo extensions
        shell: bash
        run: scripts/install-cargo-extensions.sh
      - name: Build wheels - x86_64
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.14.1
          target: x86_64
          args: --release --locked --out dist --features self-update --compatibility pypi
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld64.lld -C link-arg=--icf=safe
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels_uv-x86_64-apple-darwin-${{ matrix.shape.id }}-${{ matrix.replica }}
          path: dist
      - name: Archive binary
        run: |
          TARGET=x86_64-apple-darwin
          ARCHIVE_NAME=uv-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp target/$TARGET/release/uv $ARCHIVE_NAME/uv
          cp target/$TARGET/release/uvx $ARCHIVE_NAME/uvx
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-x86_64-apple-darwin-${{ matrix.shape.id }}-${{ matrix.replica }}
          path: |
            *.tar.gz
            *.sha256
      - name: Build wheels uv-build - x86_64
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          sccache: false
          maturin-version: v1.14.1
          target: x86_64
          args: --profile minimal-size --locked --out crates/uv-build/dist -m crates/uv-build/Cargo.toml --compatibility pypi
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld64.lld -C link-arg=--icf=safe
      - name: Upload wheels uv-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels_uv_build-x86_64-apple-darwin-${{ matrix.shape.id }}-${{ matrix.replica }}
          path: crates/uv-build/dist
    env:
      ACTIONS_CACHE_MODE: none
      AWS_LC_SYS_USE_SYSTEM: "0"
      PACKAGE_NAME: uv
      MODULE_NAME: uv
      PYTHON_VERSION: "3.11"
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        replica:
          - 1
          - 2
          - 3
          - 4
          - 5
        shape:
          - id: 12x28
            runner: namespace-profile-macos-15
          - id: 6x14
            runner: namespace-profile-uv-ci-macos-15-6x14
