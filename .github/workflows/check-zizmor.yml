on:
  workflow_call:
    inputs:
      runners:
        description: "Resolved runner roles from select-runners"
        required: true
        type: string

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  zizmor:
    runs-on: ${{ fromJSON(inputs.runners).ubuntu-x86_64-4-github }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: ${{ github.repository == 'astral-sh/uv' }}
