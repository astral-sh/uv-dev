name: Export Rust caches

on:
  workflow_call:

permissions:
  contents: read
  actions: read

cache-mode: read

jobs:
  plan:
    if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-entries: ${{ steps.plan.outputs.has-entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-cache-artifacts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: plan-export
          directory: ${{ runner.temp }}/rust-cache-index
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-cache-index
          path: ${{ runner.temp }}/rust-cache-index/index.json
          if-no-files-found: error
          retention-days: 2

  export:
    needs: plan
    if: ${{ needs.plan.outputs.has-entries == 'true' }}
    runs-on: github-ubuntu-24.04-x86_64-2
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-cache-artifacts
        with:
          mode: export
          entry: ${{ toJSON(matrix) }}
          directory: ${{ runner.temp }}/rust-cache-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/rust-cache-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
