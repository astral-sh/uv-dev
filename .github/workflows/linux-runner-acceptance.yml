            --features test-python-patch,test-universal,native-auth,secret-service \
            --workspace \
            --profile ci-linux \
            --test-threads 20
          } 2>&1 | tee "$GITHUB_WORKSPACE/results/cargo.log"
      - name: Preserve test report
        if: ${{ always() }}
        run: |
          if test -f target/nextest/ci-linux/junit.xml; then
            cp target/nextest/ci-linux/junit.xml "$GITHUB_WORKSPACE/results/junit.xml"
          fi
      - name: Upload measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-acceptance-${{ github.job }}-${{ matrix.provider }}
          path: results/
          if-no-files-found: error
          retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Namespace
            runner: namespace-profile-ubuntu-24-04-16;container.privileged=true
          - provider: Depot
            runner: depot-ubuntu-24.04-16
    needs: sample-2
    defaults:
      run:
        working-directory: source
        shell: bash
