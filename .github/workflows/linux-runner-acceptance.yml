name: Linux runner migration acceptance
"on":
  push:
    branches:
      - zb/linux-runner-acceptance-20260909
permissions:
  contents: read
concurrency:
  group: linux-runner-acceptance-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
jobs:
  warmup:
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.provider }} / warmup
    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: experiment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e9837f6e09e481bf5d1c2c2f13b641c14a366518
          repository: astral-sh/uv
          path: source
      - name: Prepare matched test source and scratch
        run: |
          git apply --check ../experiment/.github/runner-experiments/native-auth-isolation.patch
          git apply ../experiment/.github/runner-experiments/native-auth-isolation.patch
          mkdir -p "$HOME/code/tmp/uv-runner-acceptance" "$GITHUB_WORKSPACE/results"
          echo "TMPDIR=$HOME/code/tmp/uv-runner-acceptance" >> "$GITHUB_ENV"
      - name: Record runner characteristics
        env:
          EXPECTED_REVISION: e9837f6e09e481bf5d1c2c2f13b641c14a366518
        run: |
          {
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git rev-parse HEAD
          uname -sr
          lscpu
          free -b
          findmnt -n -o FSTYPE,TARGET -T "$GITHUB_WORKSPACE"
          findmnt -n -o FSTYPE,TARGET -T /tmp
          git diff
          } | tee "$GITHUB_WORKSPACE/results/machine.txt"
      - name: Install mold
        run: ./scripts/install-mold.sh
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        id: rust-cache
        with:
          prefix-key: uv-linux-acceptance-20260909
          key: ${{ hashFiles('source/Cargo.toml') }}
          cache-workspace-crates: "true"
          save-if: "true"
          shared-key: linux-${{ matrix.provider }}
          workspaces: source -> target
      - name: Record Cargo cache freshness
        if: ${{ true && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: touch "$RUNNER_TEMP/uv-cargo-cache-marker"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.7
      - name: Install required Python versions
        run: uv python install
      - name: Install secret service
        run: |
          # Bound package download attempts without depending on Depot's mirror configuration.
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt install -y --no-install-recommends dbus-daemon gnome-keyring
      - name: Start gnome-keyring
        run: |
          DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address=1)"
          export DBUS_SESSION_BUS_ADDRESS
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
      - name: Create btrfs filesystem
        run: |
          sudo apt install -y btrfs-progs
          truncate -s 1G "$TMPDIR/btrfs.img"
          mkfs.btrfs "$TMPDIR/btrfs.img"
          sudo mkdir /btrfs
          sudo mount -o loop "$TMPDIR/btrfs.img" /btrfs
          sudo chown "$(id -u):$(id -g)" /btrfs
      - name: Create tmpfs filesystem
        run: |
          sudo mkdir /tmpfs
          sudo mount -t tmpfs -o size=256m tmpfs /tmpfs
          sudo chown "$(id -u):$(id -g)" /tmpfs
      - name: Create ext4 filesystem (low hardlink limit)
        run: |
          sudo apt install -y e2fsprogs
          truncate -s 128M "$TMPDIR/ext4.img"
          mkfs.ext4 -F "$TMPDIR/ext4.img"
          sudo mkdir /ext4
          sudo mount -o loop "$TMPDIR/ext4.img" /ext4
          sudo chown "$(id -u):$(id -g)" /ext4
      - name: Install cargo nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-nextest@0.9.143
      - name: Warm Rust cache
        env:
          UV_HTTP_RETRIES: 5
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
          UV_INTERNAL__TEST_COW_FS: /btrfs
          UV_INTERNAL__TEST_NOCOW_FS: /tmpfs
          UV_INTERNAL__TEST_ALT_FS: /tmpfs
          UV_INTERNAL__TEST_LOWLINKS_FS: /ext4
          INSTA_UPDATE: "no"
          INSTA_PENDING_DIR: ${{ github.workspace }}/results/pending-snapshots
        run: |
          {
          cargo nextest run --no-run \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --features test-python-patch,test-universal,native-auth,secret-service \
            --workspace \
            --profile ci-linux
          } 2>&1 | tee "$GITHUB_WORKSPACE/results/cargo.log"
      - name: Prune superseded workspace artifacts
        if: ${{ true && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/prune_cargo_workspace_cache.py target/fast-build-nightly "$RUNNER_TEMP/uv-cargo-cache-marker"
      - name: Preserve test report
        if: ${{ always() }}
        run: |
          if test -f target/nextest/ci-linux/junit.xml; then
            cp target/nextest/ci-linux/junit.xml "$GITHUB_WORKSPACE/results/junit.xml"
          fi
      - name: Upload measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-acceptance-${{ github.job }}-${{ matrix.provider }}
          path: results/
          if-no-files-found: error
          retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Namespace
            runner: namespace-profile-ubuntu-24-04-16;container.privileged=true
          - provider: Depot
            runner: depot-ubuntu-24.04-16
    defaults:
      run:
        working-directory: source
        shell: bash
