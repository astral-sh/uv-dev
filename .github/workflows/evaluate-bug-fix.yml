# Independently evaluate the quality of a published automated bug fix.
name: "evaluate-bug-fix"

on:
  workflow_call:
    inputs:
      issue-number:
        description: "The verified upstream issue number"
        required: true
        type: string
      fix-result:
        description: "The verified automated bug-fix result"
        required: true
        type: string
      parent-pull-request:
        description: "The draft regression-test pull request URL"
        required: true
        type: string
      parent-head-ref:
        description: "The regression-test branch"
        required: true
        type: string
      parent-head-sha:
        description: "The verified regression-test commit"
        required: true
        type: string
      fix-pull-request:
        description: "The draft stacked bug-fix pull request URL"
        required: true
        type: string
      fix-head-ref:
        description: "The published bug-fix branch"
        required: true
        type: string
      fix-head-sha:
        description: "The verified published bug-fix commit"
        required: true
        type: string
      runner:
        description: "The runner to use for bug-fix evaluation"
        default: ubuntu-latest
        required: false
        type: string
    outputs:
      result:
        description: "The structured bug-fix quality evaluation"
        value: ${{ jobs.evaluate.outputs.result }}

permissions: {}

jobs:
  evaluate:
    if: github.repository == 'astral-sh/uv'
    runs-on: ${{ inputs.runner }}
    environment: automations
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    outputs:
      context-artifact-id: ${{ steps.upload-context.outputs.artifact-id }}
      context-sha: ${{ steps.issue-context.outputs.head-sha }}
      result: ${{ steps.validate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Load issue context"
        id: issue-context
        uses: ./.github/actions/load-issue-context
        with:
          issue-number: ${{ inputs.issue-number }}
          path: ${{ runner.temp }}/issue-context

      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/uv-evaluate-target
        with:
          save-if: false

      - name: "Install required Python versions"
        run: uv python install

      - name: "Prepare trusted evaluation context"
        env:
          FIX_HEAD_REF: ${{ inputs.fix-head-ref }}
          FIX_HEAD_SHA: ${{ inputs.fix-head-sha }}
          FIX_PULL_REQUEST: ${{ inputs.fix-pull-request }}
          FIX_RESULT: ${{ inputs.fix-result }}
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          PARENT_HEAD_REF: ${{ inputs.parent-head-ref }}
          PARENT_HEAD_SHA: ${{ inputs.parent-head-sha }}
          PARENT_PULL_REQUEST: ${{ inputs.parent-pull-request }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp agents/codex/config.toml "$RUNNER_TEMP/codex-home/config.toml"
          cp agents/prompts/evaluate-bug-fix.md "$RUNNER_TEMP/evaluate-bug-fix.md"
          cp agents/schemas/evaluate-bug-fix.json "$RUNNER_TEMP/evaluate-bug-fix.json"

          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
            [ "$PARENT_HEAD_REF" != "zb/reproduce-bug/$ISSUE_NUMBER" ] ||
            [ "$FIX_HEAD_REF" != "automations/fix-bug/$ISSUE_NUMBER" ] ||
            ! [[ "$PARENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            ! [[ "$FIX_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            ! [[ "$PARENT_PULL_REQUEST" =~ ^https://github\.com/astral-sh/uv-dev/pull/[1-9][0-9]*$ ]] ||
            ! [[ "$FIX_PULL_REQUEST" =~ ^https://github\.com/astral-sh/uv-dev/pull/[1-9][0-9]*$ ]]; then
            echo "The bug-fix evaluation context is invalid." >&2
            exit 1
          fi

          printf '%s\n' "$FIX_RESULT" > "$RUNNER_TEMP/bug-fix-result.json"
          if ! jq --exit-status \
            --arg pull_request "$FIX_PULL_REQUEST" \
            --slurpfile expected "$RUNNER_TEMP/bug-fix-result.json" '
              .outcome == "fixed"
              and .pull_request == $pull_request
              and .summary == $expected[0].summary
              and .validation == $expected[0].validation
            ' "$RUNNER_TEMP/issue-context/fix.json" > /dev/null ||
            ! jq --exit-status '.reproduction == "reproducible"' \
              "$RUNNER_TEMP/issue-context/reproduction.json" > /dev/null; then
            echo "The persisted issue context does not match the verified bug fix." >&2
            exit 1
          fi

          parent_pull_request_number="${PARENT_PULL_REQUEST##*/}"
          gh api "repos/astral-sh/uv-dev/pulls/$parent_pull_request_number" \
            > "$RUNNER_TEMP/bug-regression-pull-request.json"
          if ! jq --exit-status \
            --arg head_ref "$PARENT_HEAD_REF" \
            --arg head_sha "$PARENT_HEAD_SHA" '
              .state == "open"
              and .base.ref == "main"
              and .base.repo.full_name == "astral-sh/uv-dev"
              and .head.repo.full_name == "astral-sh/uv-dev"
              and .head.ref == $head_ref
              and .head.sha == $head_sha
            ' "$RUNNER_TEMP/bug-regression-pull-request.json" > /dev/null; then
            echo "The regression-test pull request changed before evaluation." >&2
            exit 1
          fi

          fix_pull_request_number="${FIX_PULL_REQUEST##*/}"
          gh api "repos/astral-sh/uv-dev/pulls/$fix_pull_request_number" \
            > "$RUNNER_TEMP/bug-fix-pull-request.json"
          if ! jq --exit-status \
            --arg head_ref "$FIX_HEAD_REF" \
            --arg head_sha "$FIX_HEAD_SHA" \
            --arg parent_ref "$PARENT_HEAD_REF" '
              .state == "open"
              and .user.login == "astral-automations-bot[bot]"
              and .base.repo.full_name == "astral-sh/uv-dev"
              and .base.ref == $parent_ref
              and .head.repo.full_name == "astral-sh/uv-dev"
              and .head.ref == $head_ref
              and .head.sha == $head_sha
            ' "$RUNNER_TEMP/bug-fix-pull-request.json" > /dev/null; then
            echo "The bug-fix pull request changed before evaluation." >&2
            exit 1
          fi

          git -c core.hooksPath=/dev/null fetch --no-tags \
            https://github.com/astral-sh/uv-dev.git "refs/heads/$PARENT_HEAD_REF"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$PARENT_HEAD_SHA" ] ||
            [ "$(git rev-parse "$PARENT_HEAD_SHA^")" != "$GITHUB_SHA" ]; then
            echo "The regression-test branch is not based on the trusted revision." >&2
            exit 1
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              crates/uv/tests/*|crates/uv-client/tests/it/*) ;;
              *)
                echo "The regression-test commit changes a non-test file: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only -z "$GITHUB_SHA" "$PARENT_HEAD_SHA")

          git -c core.hooksPath=/dev/null fetch --no-tags \
            https://github.com/astral-sh/uv-dev.git "refs/heads/$FIX_HEAD_REF"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$FIX_HEAD_SHA" ] ||
            [ "$(git rev-parse "$FIX_HEAD_SHA^")" != "$PARENT_HEAD_SHA" ] ||
            [ "$(git show --no-patch --format=%s "$FIX_HEAD_SHA")" != "Fix reproduced bug" ] ||
            [ "$(git show --no-patch --format=%ae "$FIX_HEAD_SHA")" != \
              "305554984+astral-automations-bot[bot]@users.noreply.github.com" ]; then
            echo "The bug-fix branch is not the verified automated fix." >&2
            exit 1
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              crates/*/src/*|crates/uv/tests/*|crates/uv-client/tests/it/*) ;;
              *)
                echo "The bug fix changes a protected or unrelated file: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only -z "$PARENT_HEAD_SHA" "$FIX_HEAD_SHA")

          git diff --no-ext-diff "$GITHUB_SHA" "$PARENT_HEAD_SHA" \
            > "$RUNNER_TEMP/bug-regression.diff"
          git diff --no-ext-diff "$PARENT_HEAD_SHA" "$FIX_HEAD_SHA" \
            > "$RUNNER_TEMP/bug-fix.diff"
          git diff --no-ext-diff "$GITHUB_SHA" "$FIX_HEAD_SHA" \
            > "$RUNNER_TEMP/bug-fix-combined.diff"
          git -c core.hooksPath=/dev/null checkout --detach "$FIX_HEAD_SHA"

          {
            printf 'Bug-fix quality evaluation for #%s: %s\n\n' \
              "$ISSUE_NUMBER" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' "$RUNNER_TEMP/issue-context/issue.json")"
            cat "$RUNNER_TEMP/evaluate-bug-fix.md"
          } > "$RUNNER_TEMP/evaluate-bug-fix-prompt.md"

      - name: "Evaluate bug-fix quality"
        id: evaluate
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/uv-evaluate-target
          GH_TOKEN: ${{ github.token }}
          INSTA_UPDATE: "no"
          TMPDIR: ${{ runner.temp }}
          UV_CACHE_DIR: ${{ runner.temp }}/uv-evaluate-cache
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.146.0"
          codex-home: "${{ runner.temp }}/codex-home"
          effort: high
          permission-profile: "evaluate-bug-fix"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/evaluate-bug-fix-prompt.md"
          output-schema-file: "${{ runner.temp }}/evaluate-bug-fix.json"

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-evaluate-bug-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-home/sessions
          if-no-files-found: warn

      - name: "Validate quality evaluation"
        id: validate
        env:
          EVALUATION_RESULT: ${{ steps.evaluate.outputs.final-message }}
          FIX_HEAD_SHA: ${{ inputs.fix-head-sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$FIX_HEAD_SHA" ] ||
            [ -n "$(git status --porcelain)" ]; then
            echo "The quality evaluation modified the bug-fix checkout." >&2
            exit 1
          fi

          printf '%s\n' "$EVALUATION_RESULT" > "$RUNNER_TEMP/bug-fix-evaluation.json"
          if ! jq --exit-status '
            ([.rubric[].criterion] | sort) ==
              (["correctness", "issue_understanding", "maintainability", "regression_coverage", "scope"] | sort)
            and ([.rubric[].score] | add) == .score
            and (
              if .score <= 4
                or any(.findings[]; .severity == "high")
                or any(.rubric[];
                  (.criterion == "correctness" or .criterion == "regression_coverage")
                  and .score == 0
                )
              then .verdict == "fail"
              elif .score >= 8
                and all(.rubric[];
                  if .criterion == "correctness" or .criterion == "regression_coverage"
                  then .score == 2
                  else true
                  end
                )
                and all(.findings[]; .severity == "low")
                and (.validation | length > 0)
              then .verdict == "pass"
              else .verdict == "needs_attention"
              end
            )
          ' "$RUNNER_TEMP/bug-fix-evaluation.json" > /dev/null; then
            echo "The quality evaluation does not match its rubric or verdict." >&2
            exit 1
          fi

          if [ "$(grep -c '^## Quality evaluation$' \
            "$RUNNER_TEMP/issue-context/README.md" || true)" != "1" ]; then
            echo "The issue context must contain exactly one quality evaluation section." >&2
            exit 1
          fi

          jq --raw-output '"result=\(tojson)"' \
            "$RUNNER_TEMP/bug-fix-evaluation.json" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n\n' '### Bug-fix quality evaluation'
            printf '%s\n' '```json'
            jq '.' "$RUNNER_TEMP/bug-fix-evaluation.json"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload evaluated issue context"
        id: upload-context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-evaluation-context-${{ inputs.issue-number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context/README.md
          if-no-files-found: error
          retention-days: 1

  context:
    needs: evaluate
    if: needs.evaluate.outputs.result != ''
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ inputs.issue-number }}
      cancel-in-progress: false
    permissions:
      id-token: write # for the uv-dev issue-context credential broker
    steps:
      - name: "Download evaluated issue context"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.evaluate.outputs.context-artifact-id }}
          path: ${{ runner.temp }}/issue-context-update

      - name: "Prepare evaluation context"
        id: prepare-context
        env:
          CONTEXT_SHA: ${{ needs.evaluate.outputs.context-sha }}
          EVALUATION_RESULT: ${{ needs.evaluate.outputs.result }}
          FIX_HEAD_SHA: ${{ inputs.fix-head-sha }}
          FIX_PULL_REQUEST: ${{ inputs.fix-pull-request }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
            ! [[ "$CONTEXT_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            ! [[ "$FIX_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            ! [[ "$FIX_PULL_REQUEST" =~ ^https://github\.com/astral-sh/uv-dev/pull/[1-9][0-9]*$ ]]; then
            echo "The evaluation context is invalid." >&2
            exit 1
          fi

          branch="issue/$ISSUE_NUMBER"
          git -c core.hooksPath=/dev/null init --quiet "$RUNNER_TEMP/issue-context"
          cd "$RUNNER_TEMP/issue-context"
          git -c core.hooksPath=/dev/null remote add origin \
            https://github.com/astral-sh/uv-dev.git
          git -c core.hooksPath=/dev/null fetch --quiet origin "refs/heads/$branch"
          git -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD

          if [ "$(git rev-parse HEAD)" != "$CONTEXT_SHA" ]; then
            echo "The issue context changed during the quality evaluation."
            echo "Skipping the stale update to preserve the newer issue context."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq --exit-status --arg pull_request "$FIX_PULL_REQUEST" '
            .outcome == "fixed" and .pull_request == $pull_request
          ' fix.json > /dev/null; then
            echo "The issue context no longer contains the evaluated bug fix." >&2
            exit 1
          fi

          printf '%s\n' "$EVALUATION_RESULT" |
            jq --arg pull_request "$FIX_PULL_REQUEST" --arg head_sha "$FIX_HEAD_SHA" '
              . + {pull_request: $pull_request, head_sha: $head_sha}
            ' > evaluation.json
          cp "$RUNNER_TEMP/issue-context-update/README.md" README.md
          git -c core.hooksPath=/dev/null add evaluation.json README.md

          if git diff --cached --quiet; then
            echo "The existing quality evaluation is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git \
            -c core.hooksPath=/dev/null \
            -c user.name="astral-automations-bot[bot]" \
            -c user.email="305554984+astral-automations-bot[bot]@users.noreply.github.com" \
            commit --message "Update bug-fix quality evaluation"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "Get issue context token"
        if: steps.prepare-context.outputs.changed == 'true'
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv-dev
          permissions: |
            contents: write

      - name: "Persist quality evaluation"
        if: steps.prepare-context.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          ISSUE_NUMBER: ${{ inputs.issue-number }}
        run: |
          branch="issue/$ISSUE_NUMBER"
          cd "$RUNNER_TEMP/issue-context"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/astral-sh/uv-dev.git" \
            "HEAD:refs/heads/$branch"
          printf 'Issue context: https://github.com/astral-sh/uv-dev/tree/%s\n' "$branch" \
            >> "$GITHUB_STEP_SUMMARY"
