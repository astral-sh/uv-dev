on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-transport-capture:
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: "Python transport capture on Windows ${{ matrix.runner }} of 2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 1
          - runner: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      - name: Copy Git Repo to Dev Drive
        run: Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare the pinned checkout
        working-directory: ${{ env.UV_WORKSPACE }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path("transport-diagnostics")
          output.mkdir()
          path = output / "checkout.json"
          expected = os.environ["GITHUB_SHA"]

          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).rstrip("\r\n")

          def state():
              return {
                  "revision": git("rev-parse", "HEAD"),
                  "tracked_status": git("status", "--porcelain", "--untracked-files=no"),
              }

          record = {"expected_revision": expected, "before_reset": state()}
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          if record["before_reset"]["revision"] != expected:
              raise RuntimeError("Copied checkout has the wrong revision")
          git("reset", "--hard", expected)
          record["after_reset"] = state()
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          if record["after_reset"]["revision"] != expected or record["after_reset"]["tracked_status"]:
              raise RuntimeError("Copied checkout is not clean after restoring the pinned revision")
          PY

      - name: Verify the pinned curl distribution
        working-directory: ${{ env.UV_WORKSPACE }}
        run: >-
          python scripts/python-transport-capture.py prepare-curl
          --directory transport-tooling
          --evidence transport-diagnostics/curl-provenance.json

      - name: Run two paired protocol trials
        working-directory: ${{ env.UV_WORKSPACE }}
        run: >-
          python scripts/python-transport-capture.py capture
          --curl transport-tooling/curl.exe
          --output transport-diagnostics
          --workspace transport-work
          --runner-index ${{ matrix.runner }}
          --expected-revision "$env:GITHUB_SHA"

      - name: Upload transport evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transport-capture-windows-${{ matrix.runner }}
          path: ${{ env.UV_WORKSPACE }}/transport-diagnostics/
          if-no-files-found: warn
          retention-days: 7
