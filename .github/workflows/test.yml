on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10

jobs:
  python-route-capture:
    timeout-minutes: 25
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: "Python route capture on Windows ${{ matrix.runner }} of 2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 1
            sequence: ABBABAAB
          - runner: 2
            sequence: BAABABBA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      - name: Copy Git Repo to Dev Drive
        run: Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspaces: ${{ env.UV_WORKSPACE }}
          cache-workspace-crates: "true"
          add-job-id-key: false
          save-if: "false"

      - name: Build diagnostic uv once
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          UV_INTERNAL__BUILD_GIT_INFO: 1
        run: >-
          cargo build --locked --profile fast-build-nightly
          --no-default-features
          --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native
          --workspace --bin uv -Z checksum-freshness

      - name: Run eight sequential route trials
        working-directory: ${{ env.UV_WORKSPACE }}
        run: >-
          python scripts/python-route-capture.py
          --uv target/fast-build-nightly/uv.exe
          --output route-diagnostics
          --workspace route-work
          --runner-index ${{ matrix.runner }}
          --sequence ${{ matrix.sequence }}
          --expected-revision "$env:GITHUB_SHA"

      - name: Upload route evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-capture-windows-${{ matrix.runner }}
          path: ${{ env.UV_WORKSPACE }}/route-diagnostics/
          if-no-files-found: warn
          retention-days: 7
