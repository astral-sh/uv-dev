name: Check native installers

on:
  workflow_call:
    inputs:
      archives-artifact:
        description: Artifact ID containing assembled release archives
        required: false
        type: string
      installers-artifact:
        description: Artifact ID containing generated release installers
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate release installers
    if: ${{ inputs.installers-artifact == '' }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    outputs:
      artifacts: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
      - name: Download built archives
        if: ${{ inputs.archives-artifact == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-github-archives-*
          merge-multiple: true
          path: target/distrib
      - name: Download assembled archives
        if: ${{ inputs.archives-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.archives-artifact }}
          path: target/distrib
      - name: Generate and verify the release manifest
        run: |
          python scripts/plan-release.py > plan-dist-manifest.json
          uv run --locked --script scripts/generate-native-installers.py --plan plan-dist-manifest.json --artifacts-dir target/distrib > global-dist-manifest.json
          python scripts/plan-release.py --finalize global-dist-manifest.json --artifacts-dir target/distrib > target/distrib/dist-manifest.json
      - name: Upload generated installers
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-installer-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/distrib/uv-installer.sh
            target/distrib/uv-installer.ps1
            target/distrib/dist-manifest.json

  install:
    name: ${{ matrix.target }}
    needs: generate
    if: ${{ always() && (needs.generate.result == 'success' || (needs.generate.result == 'skipped' && inputs.installers-artifact != '')) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              target: x86_64-unknown-linux-gnu,
              runner: github-ubuntu-24.04-x86_64-4,
              extension: tar.gz,
              installer: uv-installer.sh,
            }
          - {
              target: aarch64-unknown-linux-gnu,
              runner: github-ubuntu-24.04-aarch64-4,
              extension: tar.gz,
              installer: uv-installer.sh,
            }
          - {
              target: aarch64-apple-darwin,
              runner: namespace-profile-macos-15,
              extension: tar.gz,
              installer: uv-installer.sh,
            }
          - {
              target: x86_64-apple-darwin,
              runner: macos-15-intel,
              extension: tar.gz,
              installer: uv-installer.sh,
            }
          - {
              target: x86_64-pc-windows-msvc,
              runner: namespace-profile-windows-2022-x86-64-16x32,
              extension: zip,
              installer: uv-installer.ps1,
            }
          - {
              target: aarch64-pc-windows-msvc,
              runner: github-windows-11-aarch64-8,
              extension: zip,
              installer: uv-installer.ps1,
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
      - name: Download built archive
        if: ${{ inputs.archives-artifact == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-github-archives-${{ matrix.target }}
          path: artifacts
      - name: Download assembled archives
        if: ${{ inputs.archives-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.archives-artifact }}
          path: artifacts
      - name: Download generated installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.installers-artifact || needs.generate.outputs.artifacts }}
          path: artifacts
      - name: Check installer generation
        run: uv run --locked --script scripts/test-native-installers.py
      - name: Install and uninstall uv
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          INSTALLER: ${{ matrix.installer }}
          INSTALLERS_ARTIFACT: ${{ inputs.installers-artifact || needs.generate.outputs.artifacts }}
        run: |
          installer_args=()
          if [[ -n "$INSTALLERS_ARTIFACT" ]]; then
            installer_args=(--installer "artifacts/$INSTALLER")
          fi
          uv run --locked --script scripts/check-native-installer.py --archive "artifacts/uv-$TARGET.$EXTENSION" "${installer_args[@]}"
