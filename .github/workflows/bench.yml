on:
  workflow_call:
    inputs:
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  benchmarks-walltime-build:
    name: "walltime build"
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    # codspeed-macro doesn't support Ubuntu 24.04 yet
    runs-on: depot-ubuntu-22.04-arm-4
    # uv-dev benchmarks pull requests but imports its main-branch measurements from uv.
    if: ${{ github.repository == 'astral-sh/uv' || (github.repository == 'astral-sh/uv-dev' && github.ref != 'refs/heads/main') }}
    timeout-minutes: 30
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Measure the submitted commit independently of changes to the PR base.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install codspeed"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-codspeed

      - name: "Install requirements and prime cache"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Prepare immutable benchmark fixtures"
        run: python3 scripts/benchmark/prepare-fixtures.py

      - name: "Prepare immutable Git fixtures"
        run: python3 scripts/benchmark/prepare-git.py

      - name: "Build optimized benchmark command"
        run: cargo build --locked --profile profiling --bin uv

      - name: "Prime installed-environment fixtures"
        run: python3 scripts/benchmark/prepare-environments.py --discovery --project-caches

      - name: "Prime tool-environment fixtures"
        run: python3 scripts/benchmark/prepare-tools.py --individual-caches

      - name: "Build benchmarks"
        run: cargo codspeed build -m walltime --profile profiling -p uv-bench --bench uv --bench workspace_discovery --bench lockfile --bench wheel_extract --bench wheel_install --bench sdist_extract --bench package_build --bench project_inspection --bench installed_environment --bench project_noop --bench environment_reinstall --bench installed_bytecode --bench publish_preparation --bench python_discovery --bench cache_management --bench virtualenv_creation --bench concurrent_downloads --bench local_wheel_concurrency --bench local_wheel_cache --bench multi_index --bench outdated_tree --bench s3_signing --bench osv_audit --bench tls_handshake --bench entrypoint_startup --bench tool_list --bench cached_tool_run --bench git_fetch --bench github_metadata --bench github_revisions

      - name: "Plan bounded walltime runs"
        id: shards
        run: python3 scripts/benchmark/walltime-shards.py plan

      - name: "Create artifact archive"
        run: tar -cvf benchmarks-walltime.tar target/codspeed target/debug/uv target/profiling/uv .cache

      - name: "Upload benchmark artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-walltime
          path: benchmarks-walltime.tar
          retention-days: 1

  benchmarks-walltime-run:
    name: "walltime on aarch64 linux (${{ matrix.index }}/${{ matrix.total }})"
    runs-on: codspeed-macro
    needs: benchmarks-walltime-build
    if: ${{ needs.benchmarks-walltime-build.result == 'success' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmarks-walltime-build.outputs.matrix) }}
    env:
      BENCHMARK_SHARD: ${{ matrix.index }}
    permissions:
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: "Install codspeed"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-codspeed

      - name: "Download benchmark artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarks-walltime

      - name: "Extract artifact archive"
        run: tar -xvf benchmarks-walltime.tar

      - name: "Create venv"
        run: ./target/debug/uv venv --cache-dir .cache

      - name: "Retain benchmark profiles"
        id: profiles
        # Only public main pushes produce reusable baseline profiles.
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-walltime" "walltime-$BENCHMARK_SHARD" >> "$GITHUB_OUTPUT"

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: python3 scripts/benchmark/walltime-shards.py run "$BENCHMARK_SHARD"
          mode: walltime
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      - name: "Finish profile capture"
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-walltime"

      - name: "Upload benchmark profiles"
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-profiles-walltime-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/codspeed-walltime/metadata.json
            ${{ runner.temp }}/codspeed-walltime/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  benchmarks-simulated:
    name: "simulated"
    runs-on: depot-ubuntu-24.04-4
    # Only uv measures main; uv-dev reuses the resulting profiles.
    if: ${{ github.repository == 'astral-sh/uv' || (github.repository == 'astral-sh/uv-dev' && github.ref != 'refs/heads/main') }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install codspeed"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-codspeed

      - name: "Install requirements and prime cache"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Prepare immutable benchmark fixtures"
        run: python3 scripts/benchmark/prepare-fixtures.py

      - name: "Build benchmarks"
        run: cargo codspeed build --profile profiling -p uv-bench

      - name: "Retain benchmark profiles"
        id: profiles
        # Only public main pushes produce reusable baseline profiles.
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-simulation" simulation >> "$GITHUB_OUTPUT"

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          run: cargo codspeed run
          mode: simulation
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      - name: "Finish profile capture"
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-simulation"

      - name: "Upload benchmark profiles"
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-profiles-simulation
          path: |
            ${{ runner.temp }}/codspeed-simulation/metadata.json
            ${{ runner.temp }}/codspeed-simulation/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
