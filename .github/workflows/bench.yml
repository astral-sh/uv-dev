on:
  workflow_call:
    inputs:
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  benchmarks-walltime-build:
    name: "walltime build"
    runs-on: depot-ubuntu-24.04-4
    # uv-dev benchmarks pull requests but imports its main-branch measurements from uv.
    if: ${{ github.repository == 'astral-sh/uv' || (github.repository == 'astral-sh/uv-dev' && github.ref != 'refs/heads/main') }}
    timeout-minutes: 60
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"

      - name: "Install requirements and prime cache"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Install benchmark Python"
        run: uv --no-config python install --install-dir .cache/bench-python 3.12.11

      - name: "Build benchmark command"
        run: cargo build --locked --profile profiling --bin uv

      - name: "Build benchmarks"
        run: uv run --only-dev cargo codspeed build -m walltime --profile profiling -p uv-bench --bench uv --bench workspace_discovery --bench git_fetch

      - name: "Create artifact archive"
        run: |
          mkdir -p target/codspeed-bin
          cp "$(uv run --only-dev which cargo-codspeed)" target/codspeed-bin/
          tar -cvf benchmarks-walltime.tar target/codspeed target/codspeed-bin target/debug/uv target/profiling/uv .cache

      - name: "Upload benchmark artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-walltime
          path: benchmarks-walltime.tar
          retention-days: 1

  benchmarks-walltime-run:
    name: "walltime on x86_64 linux (${{ matrix.index }}/8)"
    runs-on: codspeed-macro-x64-ryzen-9950x-ubuntu-24-04
    needs: benchmarks-walltime-build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            suites: "uv workspace_discovery"
            filter: ""
          - index: 2
            suites: git_fetch
            filter: "git_fetch/"
          - index: 3
            suites: git_fetch
            filter: "requests/"
          - index: 4
            suites: git_fetch
            filter: "transformers/"
          - index: 5
            suites: git_fetch
            filter: "airflow/full_clone/"
          - index: 6
            suites: git_fetch
            filter: "airflow/partial_clone/"
          - index: 7
            suites: git_fetch
            filter: "airflow/full_worktree/"
          - index: 8
            suites: git_fetch
            filter: "airflow/partial_worktree/"
    env:
      BENCHMARK_SHARD: ${{ matrix.index }}
      BENCHMARK_SUITES: ${{ matrix.suites }}
      BENCHMARK_FILTER: ${{ matrix.filter }}
    permissions:
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"

      - name: "Download benchmark artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarks-walltime

      - name: "Extract artifact archive"
        run: tar -xvf benchmarks-walltime.tar

      - name: "Add codspeed to PATH"
        run: echo "$GITHUB_WORKSPACE/target/codspeed-bin" >> "$GITHUB_PATH"

      - name: "Create venv"
        if: ${{ matrix.index == 1 }}
        run: ./target/debug/uv venv --cache-dir .cache

      - name: "Retain benchmark profiles"
        id: profiles
        # Only public main pushes produce reusable baseline profiles.
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-walltime" "walltime-$BENCHMARK_SHARD" >> "$GITHUB_OUTPUT"

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: |
            read -r -a suites <<< "$BENCHMARK_SUITES"
            arguments=()
            for suite in "${suites[@]}"; do
              arguments+=(--bench "$suite")
            done
            if [ -n "$BENCHMARK_FILTER" ]; then
              arguments+=("$BENCHMARK_FILTER")
            fi
            uv run --only-dev cargo codspeed run -m walltime -p uv-bench "${arguments[@]}"
          mode: walltime
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      - name: "Finish profile capture"
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-walltime"

      - name: "Upload benchmark profiles"
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-profiles-walltime-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/codspeed-walltime/metadata.json
            ${{ runner.temp }}/codspeed-walltime/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  benchmarks-simulated:
    name: "simulated"
    runs-on: depot-ubuntu-24.04-4
    # Only uv measures main; uv-dev reuses the resulting profiles.
    if: ${{ github.repository == 'astral-sh/uv' || (github.repository == 'astral-sh/uv-dev' && github.ref != 'refs/heads/main') }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"

      - name: "Install requirements and prime cache"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Build benchmarks"
        run: uv run --only-dev cargo codspeed build --profile profiling -p uv-bench

      - name: "Retain benchmark profiles"
        id: profiles
        # Only public main pushes produce reusable baseline profiles.
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-simulation" simulation >> "$GITHUB_OUTPUT"

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: uv run --only-dev cargo codspeed run
          mode: simulation
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      - name: "Finish profile capture"
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-simulation"

      - name: "Upload benchmark profiles"
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-profiles-simulation
          path: |
            ${{ runner.temp }}/codspeed-simulation/metadata.json
            ${{ runner.temp }}/codspeed-simulation/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
