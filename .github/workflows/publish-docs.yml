# Publish the uv documentation.
#
# Assumed to run as a subworkflow of .github/workflows/release.yml; specifically, as a post-announce
# job within `cargo-dist`.
name: mkdocs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit SHA, tag, or branch to publish. Uses the default branch if not specified."
        default: ""
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

env:
  ACTIONS_CACHE_MODE: none
  CARGO_INCREMENTAL: 0
  UV_LOCKED: 1

jobs:
  build-docs:
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      source-commit: ${{ steps.metadata.outputs.source-commit }}
      version: ${{ steps.metadata.outputs.version }}
      display-name: ${{ steps.metadata.outputs.display-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14
          cache: ""

      - name: "Generate reference documentation"
        run: |
          cargo dev generate-options-reference
          cargo dev generate-cli-reference
          cargo dev generate-env-vars-reference
          cargo dev generate-preview-features-reference

      - name: "Set docs version"
        id: metadata
        env:
          version: ${{ (inputs.plan != '' && fromJson(inputs.plan).announcement_tag) || inputs.ref }}
        run: |
          # if version is missing, use 'latest'
          if [ -z "$version" ]; then
            echo "Using 'latest' as version"
            version="latest"
          fi

          # Use version as display name for now
          display_name="$version"

          echo "version=$version" >> "$GITHUB_ENV"
          echo "display_name=$display_name" >> "$GITHUB_ENV"
          source_commit="$(git rev-parse HEAD)"
          echo "source_commit=$source_commit" >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "display-name=$display_name"
            echo "source-commit=$source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          enable-cache: false

      - name: "Build docs"
        run: uv run --only-group docs mkdocs build --strict -f mkdocs.yml

      # Packaging comes from the workflow revision even when generating older docs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .docs-workflow
          sparse-checkout: scripts
          persist-credentials: false

      - name: "Package generated docs"
        run: |
          python3 .docs-workflow/scripts/docs-artifact.py pack site/uv docs-publication.tar \
            --source-commit "$source_commit" --version "$version"

      - name: "Upload generated docs"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs-publication.tar
          if-no-files-found: error

  mkdocs:
    needs: build-docs
    environment:
      name: release
    permissions:
      contents: read
      id-token: write # for the credential broker
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    env:
      version: ${{ needs.build-docs.outputs.version }}
      display_name: ${{ needs.build-docs.outputs.display-name }}
      source_commit: ${{ needs.build-docs.outputs.source-commit }}
    steps:
      - name: "Load publication tools"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .docs-workflow
          sparse-checkout: scripts
          persist-credentials: false

      - name: "Download generated docs"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-docs.outputs.artifact }}
          path: docs-artifact
          merge-multiple: true

      - name: "Verify generated docs"
        run: |
          python3 .docs-workflow/scripts/docs-artifact.py unpack docs-artifact/docs-publication.tar docs-site \
            --source-commit "$source_commit" --version "$version"

      - name: "Set branch name"
        run: |
          timestamp="$(date +%s)"

          # create branch_display_name from display_name by replacing all
          # characters disallowed in git branch names with hyphens
          branch_display_name="$(echo "${display_name}" | tr -c '[:alnum:]._' '-' | tr -s '-')"

          echo "branch_name=update-docs-$branch_display_name-$timestamp" >> "$GITHUB_ENV"
          echo "timestamp=$timestamp" >> "$GITHUB_ENV"

      - name: "Get docs token"
        id: token
        uses: open-security-tools/ost-simple-sts@88f85462c7e9c9e2fb2745bd5ce4ee163aec0420 # v0.0.5
        with:
          exchange-url: ${{ secrets.RELEASES_STS_API_URL }}/exchange
          audience: ${{ secrets.RELEASES_STS_API_URL }}
          repository: astral-sh/docs
          permissions: |
            contents: write
            pull_requests: write

      - name: "Checkout docs repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/docs
          ref: main
          path: astral-docs
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: "Copy docs"
        run: rm -rf astral-docs/site/uv && mkdir -p astral-docs/site && cp -r docs-site astral-docs/site/uv

      - name: "Commit docs"
        id: commit
        working-directory: astral-docs
        run: |
          git config user.name "astral-releases-bot[bot]"
          git config user.email "328004183+astral-releases-bot[bot]@users.noreply.github.com"

          git checkout -b "${branch_name}"
          git add site/uv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update uv documentation for $version"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "Create Pull Request"
        if: ${{ steps.commit.outputs.changed == 'true' }}
        working-directory: astral-docs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: python3 ../.docs-workflow/scripts/publish-docs-pr.py "$branch_name" "$display_name" "$source_commit"

      - name: "Merge Pull Request"
        if: ${{ steps.commit.outputs.changed == 'true' && inputs.plan != '' && !fromJson(inputs.plan).announcement_tag_is_implicit }}
        working-directory: astral-docs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # auto-merge the PR if the build was triggered by a release. Manual builds should be reviewed by a human.
          # give the PR a few seconds to be created before trying to auto-merge it
          sleep 10
          # Use admin to bypass required review
          gh pr merge --squash --admin "${branch_name}"
