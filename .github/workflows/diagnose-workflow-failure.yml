# Isolated probe, excluded from uv-dev's failure-report automation.
name: Runner URL policy metadata diagnostic

on:
  push:
    branches: [zb/runner-url-policy-probe-20260902]

permissions:
  contents: read

env:
  ACTIONS_CACHE_MODE: none

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact policy compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bccf23f6ab482091b787b5327ed57c852c65d2ee
          persist-credentials: false
          sparse-checkout: .github/actions/runner-network-policy

      - name: Report sanitized runner metadata constraints
        uses: astral-sh/uv-dev/.github/actions/runner-url-probe@2f4479e25139954db942ab87fc926ef317b8a3d5
        with:
          operation: metadata
