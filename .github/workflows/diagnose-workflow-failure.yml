# Isolated probe; this path is excluded from the failure-report dispatcher.
name: Runner network policy probe
on:
  push:
    branches: [zb/runner-network-policy-probe]
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: github-retain, runner: ubuntu-24.04, privileges: retain }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Capture trusted pre-install baseline
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy-probe@9389bb135ee94ca5084a79002385127ed71fd4a7
        with:
          operation: baseline
      - name: Install policy before later action hooks
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy@35ff9f713ca1b0fae604247daa1c6379ad841d55
        with:
          profile: github
          privileges: ${{ matrix.privileges }}
          disposable: true
      - name: Check early hooks and bypass attempts
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy-probe@9389bb135ee94ca5084a79002385127ed71fd4a7
        with:
          operation: probe
      - name: Upload evidence through the policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-policy-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/network-policy-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Inspect setup
        if: always()
        shell: bash
        run: |
          if sudo -n true 2>/dev/null; then
            sudo journalctl -u uv-network-policy.service --no-pager -n 30
            sudo cat /run/uv-network-policy-diagnostics.txt || true
            cat /etc/resolv.conf
          fi
          if test -r /run/uv-network-policy/audit/events.json; then
            cat /run/uv-network-policy/audit/events.json
          fi
