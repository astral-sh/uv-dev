# Isolated probe; this path is excluded from the failure-report dispatcher.
name: Runner network policy probe
on:
  push:
    branches: [zb/runner-network-policy-probe]
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: github-drop, runner: ubuntu-24.04, privileges: drop }
          - { label: github-retain, runner: ubuntu-24.04, privileges: retain }
          - {
              label: depot-retain,
              runner: depot-ubuntu-24.04-4,
              privileges: retain,
            }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Capture trusted pre-install baseline
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy-probe@a944e65636289865d3def3d5ad888fe612bb45d4
        with:
          operation: baseline
      - name: Install policy before later action hooks
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy@a944e65636289865d3def3d5ad888fe612bb45d4
        with:
          profile: github
          privileges: ${{ matrix.privileges }}
          disposable: true
      - name: Check early hooks and bypass attempts
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy-probe@a944e65636289865d3def3d5ad888fe612bb45d4
        with:
          operation: probe
      - name: Upload evidence through the policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-policy-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/network-policy-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Inspect failed setup
        if: failure()
        shell: bash
        run: |
          if sudo -n true 2>/dev/null; then
            sudo journalctl -u uv-network-policy.service --no-pager -n 30
          fi
          if test -r /run/uv-network-policy/audit/events.json; then
            cat /run/uv-network-policy/audit/events.json
          fi
