# Isolated runner inventory; excluded from failure-report automation.
name: Cache proxy runner inventory
on:
  push:
    branches: [zb/cache-proxy-probe-20260817-45a4]
permissions: {}
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - namespace-profile-macos-15
          - depot-ubuntu-24.04-4
          - github-windows-2025-x86_64-8
          - github-windows-11-aarch64-8
          - ubuntu-slim
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const endpoints = {};
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_URL']) {
              if (process.env[name]) {
                const url = new URL(process.env[name]);
                endpoints[name] = {protocol: url.protocol, hostname: url.hostname, port: url.port};
              }
            }
            const command = (name, args) => {
              const result = spawnSync(name, args, {encoding: 'utf8', timeout: 10000});
              return {status: result.status, available: !result.error};
            };
            const result = {
              platform: process.platform, arch: process.arch, endpoints,
              cacheV2: process.env.ACTIONS_CACHE_SERVICE_V2 || null,
              sudo: process.platform === 'win32' ? null : command('sudo', ['-n', 'true']),
              python: command(process.platform === 'win32' ? 'python' : 'python3', ['--version']),
              openssl: command('openssl', ['version']),
              systemd: process.platform === 'linux' ? command('systemctl', ['is-system-running']) : null,
              packetFilter: process.platform === 'darwin' ? command('sudo', ['-n', 'pfctl', '-s', 'info']) : null,
            };
            console.log('CACHE_RUNNER_INVENTORY=' + JSON.stringify(result));
