# Isolated probe, excluded from uv-dev's failure-report automation.
name: Release cache proxy matrix
on:
  push:
    branches: [zb/cache-proxy-probe-20260817-45a4]
permissions:
  contents: read
env:
  ACTIONS_CACHE_MODE: write
defaults:
  run:
    shell: bash
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      seed-key: ${{ steps.raw.outputs.seed-key }}
      version: ${{ steps.raw.outputs.version }}
    steps:
      - id: raw
        uses: astral-sh/uv-dev/.github/actions/cache-proxy-probe@2c5a954f8f2d440c9d80ec93744fdd8f38b96f39
        with:
          operation: seed
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: cache-proxy-marker
          key: cache-proxy-probe-${{ github.run_id }}-${{ github.run_attempt }}-old-client
          enableCrossOsArchive: true
      - run: python3 -c 'import shutil; shutil.rmtree("cache-proxy-marker")'
      - id: control
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: cache-proxy-marker
          key: cache-proxy-probe-${{ github.run_id }}-${{ github.run_attempt }}-old-client
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - env:
          CACHE_HIT: ${{ steps.control.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-proxy-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache-proxy-marker/marker.txt
          retention-days: 1

  protected:
    name: protected-${{ matrix.label }}
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: github-linux, runner: ubuntu-24.04 }
          - { label: namespace-macos, runner: namespace-profile-macos-15 }
          - { label: depot-linux, runner: depot-ubuntu-24.04-4 }
          - { label: windows-x64, runner: github-windows-2025-x86_64-8 }
          - { label: windows-arm64, runner: github-windows-11-aarch64-8 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install exact release action before other hooks
        uses: astral-sh/uv-dev/.github/actions/disable-github-caches@a0ca53c7508f5625011f581f30c5934f881a33be
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cache-proxy-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seed-artifact
      - name: Attempt old-client restore
        id: denied
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: cache-proxy-marker
          key: cache-proxy-probe-${{ github.run_id }}-${{ github.run_attempt }}-old-client
          enableCrossOsArchive: true
      - name: Verify no cache was restored
        env:
          CACHE_HIT: ${{ steps.denied.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" != true
          test ! -e cache-proxy-marker/marker.txt
          mkdir cache-proxy-write
          cp "$RUNNER_TEMP/seed-artifact/marker.txt" cache-proxy-write/marker.txt
      - name: Attempt old-client save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: cache-proxy-write
          key: cache-proxy-probe-${{ github.run_id }}-${{ github.run_attempt }}-old-blocked
      - name: Check raw APIs, direct IPs, artifacts, and OIDC
        uses: astral-sh/uv-dev/.github/actions/cache-proxy-probe@2c5a954f8f2d440c9d80ec93744fdd8f38b96f39
        with:
          operation: probe
      - name: Upload evidence through proxy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-proxy-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          path: ${{ runner.temp }}/cache-proxy-evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Check Docker bridge cannot reach cache services
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          image = "ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea"
          def connects(host, port):
              command = ["docker", "run", "--rm", "--network", "bridge", image, "timeout", "5", "bash", "-c", 'exec 3<>"/dev/tcp/$1/$2"', "probe", host, str(port)]
              return subprocess.run(command, check=False).returncode == 0
          assert connects("github.com", 443), "container baseline failed"
          origins = json.loads(Path(os.environ["UV_CACHE_PROXY_CONFIG"]).read_text())
          endpoints = [(address, 443) for address in origins["results-receiver.actions.githubusercontent.com"]["addresses"] if ":" not in address]
          endpoints += [(origin["addresses"][0], origin["port"]) for origin in origins.values() if origin.get("scheme") == "http"]
          assert endpoints
          for host, port in endpoints:
              assert not connects(host, port), "container could reach a cache service"
          print("Container cache-service connections were blocked.")
          PY

  disabled:
    needs: seed
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: astral-sh/uv-dev/.github/actions/disable-github-caches@a0ca53c7508f5625011f581f30c5934f881a33be
        with:
          enabled: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SEED_KEY: ${{ needs.seed.outputs.seed-key }}
          SEED_VERSION: ${{ needs.seed.outputs.version }}
        with:
          script: |
            if (process.env.UV_CACHE_PROXY_ACTIVE === '1') throw new Error('Disabled action installed a proxy');
            const url = new URL('/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL', process.env.ACTIONS_RESULTS_URL);
            const response = await fetch(url, {method: 'POST', headers: {Authorization: `Bearer ${process.env.ACTIONS_RUNTIME_TOKEN}`, 'Content-Type': 'application/json'}, body: JSON.stringify({key: process.env.SEED_KEY, version: process.env.SEED_VERSION, restore_keys: []})});
            if (!response.ok || !(await response.json()).ok) throw new Error('Ordinary CI cache access changed');
            console.log('Disabled release action preserves CI cache access.');

  verify:
    needs: [protected, disabled]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cache-proxy-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: evidence
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("evidence").glob("*/cache-proxy-evidence.json"))
          assert len(files) == 5, len(files)
          for path in files:
              result = json.loads(path.read_text())
              assert result["rawReadDenied"] and result["rawWrite"]["denied"]
              assert result["legacyReadDenied"]
              assert result["direct"]
              assert not result["directIsolation"] or all(item["blocked"] for item in result["direct"])
              assert result["oidcWorks"] and result["artifactMatches"]
              assert result["audit"]["artifact_forwarded"] > 0
          print("All five release runner platforms passed.")
          PY
