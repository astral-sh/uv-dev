name: CI speed samples
run-name:
  CI speed samples / ${{ inputs.workload }} / ${{ inputs.variant }} / ${{ inputs.round }} / ${{ inputs.change-source
  && 'changed-source' || 'unchanged' }}
"on":
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        options:
          - all
          - bench
          - arm
          - schedule
        default: all
        required: true
      variant:
        type: choice
        options:
          - both
          - baseline
          - candidate
        default: both
        required: true
      bench-kind:
        type: choice
        options:
          - both
          - walltime
          - simulated
        default: both
        required: true
      round:
        type: string
        default: warmup
        required: true
      seed:
        type: boolean
        default: false
        required: true
      change-source:
        description: Change the resolver checksum to measure partial rebuilds (bench only)
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: ci-speed-${{ github.ref }}-${{ inputs.workload }}-${{ inputs.variant }}-${{ inputs.round }}
  cancel-in-progress: false
jobs:
  bench-benchmarks-walltime-build-baseline:
    name: walltime build / baseline / ${{ inputs.round }}
    runs-on: depot-ubuntu-22.04-arm-4
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'bench') && (inputs.variant == 'both' || inputs.variant == 'baseline')
      && (inputs.bench-kind == 'both' || inputs.bench-kind == 'walltime') }}
    timeout-minutes: 45
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "bf041f9245952ba7c9e3c29aebe0a8acc2bc983d"'
      - name: Change resolver source checksum
        if: ${{ inputs.change-source }}
        run:
          'printf "\n// CI cache measurement: rebuild the resolver and its dependents.\n" >> crates/uv-resolver/src/lib.rs

          git diff --stat

          sha256sum crates/uv-resolver/src/lib.rs'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ inputs.seed }}
        id: rust-cache
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Install Rust toolchain
        run: rustup show
      - name: Install codspeed
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-codspeed@5.0.1
      - name: Install requirements and prime cache
        run: "sudo apt-get update

          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev

          cargo run --bin uv -- venv --cache-dir .cache

          # Resolve benchmark fixtures without the repository's tooling build policy.

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          "
      - name: Build benchmarks
        run: cargo codspeed build -m walltime --profile profiling -p uv-bench --bench uv --bench workspace_discovery
      - name: Create artifact archive
        run: tar -cvf benchmarks-walltime.tar target/codspeed target/debug/uv .cache
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench-walltime-build-baseline-${{ inputs.round }}
          path: benchmarks-walltime.tar
          retention-days: 1
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
  bench-benchmarks-simulated-baseline:
    name: simulated build / baseline / ${{ inputs.round }}
    runs-on: depot-ubuntu-24.04-4
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'bench') && (inputs.variant == 'both' || inputs.variant == 'baseline')
      && (inputs.bench-kind == 'both' || inputs.bench-kind == 'simulated') }}
    timeout-minutes: 45
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "bf041f9245952ba7c9e3c29aebe0a8acc2bc983d"'
      - name: Change resolver source checksum
        if: ${{ inputs.change-source }}
        run:
          'printf "\n// CI cache measurement: rebuild the resolver and its dependents.\n" >> crates/uv-resolver/src/lib.rs

          git diff --stat

          sha256sum crates/uv-resolver/src/lib.rs'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ inputs.seed }}
        id: rust-cache
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Install Rust toolchain
        run: rustup show
      - name: Install codspeed
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-codspeed@5.0.1
      - name: Install requirements and prime cache
        run: "sudo apt-get update

          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev

          cargo run --bin uv -- venv --cache-dir .cache

          # Resolve benchmark fixtures without the repository's tooling build policy.

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          "
      - name: Build benchmarks
        run: cargo codspeed build --profile profiling -p uv-bench
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
  arm-build-binary-windows-aarch64-baseline:
    name: arm build / baseline / ${{ inputs.round }}
    timeout-minutes: 30
    runs-on: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "bf041f9245952ba7c9e3c29aebe0a8acc2bc983d"'
      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
      - name: Copy Git Repo to Dev Drive
        run:
          'Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

          '
      - name: Install Rust toolchain
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          prefix-key: v2-ci-speed-arm-controlled
          workspaces: ${{ env.UV_WORKSPACE }}
          cache-workspace-crates: "true"
          save-if: ${{ inputs.seed }}
          shared-key: build-binary-windows-aarch64
        id: rust-cache
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Build
        working-directory: ${{ env.UV_WORKSPACE }}
        run: cargo build --profile no-debug-nightly -Z checksum-freshness --bin uv --bin uvx
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arm-arm-build-baseline-${{ inputs.round }}
          path: "${{ env.UV_WORKSPACE }}/target/no-debug-nightly/uv.exe

            ${{ env.UV_WORKSPACE }}/target/no-debug-nightly/uvx.exe

            "
          retention-days: 1
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'arm') && (inputs.variant == 'both' || inputs.variant == 'baseline')
      }}
  arm-smoke-baseline:
    name: native ARM64 smoke / baseline / ${{ inputs.round }}
    timeout-minutes: 10
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: arm-arm-build-baseline-${{ inputs.round }}
      - name: Smoke test
        run: "./uv run --no-project scripts/smoke-test

          "
      - name: Test uv shell completions
        run:
          "(& ./uv generate-shell-completion powershell) | Out-String | Invoke-Expression

          "
      - name: Test uvx shell completions
        run:
          "(& ./uvx --generate-shell-completion powershell) | Out-String | Invoke-Expression

          "
    needs: arm-build-binary-windows-aarch64-baseline
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'arm') && (inputs.variant == 'both' || inputs.variant == 'baseline')
      }}
  schedule-cargo-test-windows-baseline:
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: windows tests / baseline / ${{ inputs.round }} / ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "bf041f9245952ba7c9e3c29aebe0a8acc2bc983d"'
      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
      - name: Copy Git Repo to Dev Drive
        run:
          'Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

          '
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.7
      - name: Install required Python versions
        run: uv python install
      - name: Install Rust toolchain
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspaces: ${{ env.UV_WORKSPACE }}
          cache-workspace-crates: "true"
          add-job-id-key: false
          save-if: "false"
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Create NTFS test directory (low hardlink limit)
        run: New-Item -Path "C:\uv" -ItemType Directory -Force
      - name: Create SMB test share (alternative filesystem)
        run: 'New-Item -Path "C:\uv-smb" -ItemType Directory -Force

          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

          '
      - name: Install cargo nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-nextest
      - name: Cargo test
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          UV_HTTP_RETRIES: 5
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE: false
          UV_INTERNAL__TEST_ALT_FS: \\localhost\uv-alt-fs
          UV_INTERNAL__TEST_SMB_FS: \\localhost\uv-alt-fs
          UV_INTERNAL__TEST_LOWLINKS_FS: C:\uv
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run:
          "cargo nextest run \\\n  --cargo-profile fast-build-nightly \\\n  -Z panic-abort-tests \\\n  -Z checksum-freshness\
          \ \\\n  --no-default-features \\\n  --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native\
          \ \\\n  --workspace \\\n  --profile ci-windows \\\n  --partition hash:${{ matrix.partition }}/3\n"
      - name: Upload pending snapshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: schedule-windows-tests-baseline-${{ matrix.partition }}-${{ inputs.round }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: schedule-windows-tests-baseline-${{ matrix.partition }}-${{ inputs.round }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'schedule') && (inputs.variant == 'both' || inputs.variant ==
      'baseline') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      PYTHON_VERSION: "3.12"
      RUSTC_BOOTSTRAP: 1
      RUSTUP_MAX_RETRIES: 10
  bench-benchmarks-walltime-build-candidate:
    name: walltime build / candidate / ${{ inputs.round }}
    runs-on: depot-ubuntu-22.04-arm-4
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'bench') && (inputs.variant == 'both' || inputs.variant == 'candidate')
      && (inputs.bench-kind == 'both' || inputs.bench-kind == 'walltime') }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: true
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: bea4e50e27a46b83e7c8c39fded3035e0d3045a7
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "bea4e50e27a46b83e7c8c39fded3035e0d3045a7"'
      - name: Change resolver source checksum
        if: ${{ inputs.change-source }}
        run:
          'printf "\n// CI cache measurement: rebuild the resolver and its dependents.\n" >> crates/uv-resolver/src/lib.rs

          git diff --stat

          sha256sum crates/uv-resolver/src/lib.rs'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace-bench
          key: ${{ hashFiles('Cargo.toml') }}
          cache-workspace-crates: "true"
          save-if: ${{ inputs.seed }}
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Record Cargo cache freshness
        if: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: touch "$RUNNER_TEMP/uv-cargo-cache-marker"
      - name: Install Rust toolchain
        run: rustup show
      - name: Install codspeed
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-codspeed@5.0.1
      - name: Install requirements and prime cache
        env:
          CARGO_UNSTABLE_MTIME_ON_USE: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: "sudo apt-get update

          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev

          cargo run --bin uv -- venv --cache-dir .cache

          # Resolve benchmark fixtures without the repository's tooling build policy.

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          "
      - name: Build benchmarks
        env:
          CARGO_UNSTABLE_MTIME_ON_USE: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: cargo codspeed build -m walltime --profile profiling -p uv-bench --bench uv --bench workspace_discovery
      - name: Prune superseded workspace artifacts
        if: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run:
          'python3 scripts/prune_cargo_workspace_cache.py target/debug "$RUNNER_TEMP/uv-cargo-cache-marker"

          python3 scripts/prune_cargo_workspace_cache.py target/profiling "$RUNNER_TEMP/uv-cargo-cache-marker"

          '
      - name: Create artifact archive
        run: tar -cvf benchmarks-walltime.tar target/codspeed target/debug/uv .cache
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench-walltime-build-candidate-${{ inputs.round }}
          path: benchmarks-walltime.tar
          retention-days: 1
  bench-benchmarks-simulated-candidate:
    name: simulated build / candidate / ${{ inputs.round }}
    runs-on: depot-ubuntu-24.04-4
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'bench') && (inputs.variant == 'both' || inputs.variant == 'candidate')
      && (inputs.bench-kind == 'both' || inputs.bench-kind == 'simulated') }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: true
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: bea4e50e27a46b83e7c8c39fded3035e0d3045a7
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "bea4e50e27a46b83e7c8c39fded3035e0d3045a7"'
      - name: Change resolver source checksum
        if: ${{ inputs.change-source }}
        run:
          'printf "\n// CI cache measurement: rebuild the resolver and its dependents.\n" >> crates/uv-resolver/src/lib.rs

          git diff --stat

          sha256sum crates/uv-resolver/src/lib.rs'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace-bench
          key: ${{ hashFiles('Cargo.toml') }}
          cache-workspace-crates: "true"
          save-if: ${{ inputs.seed }}
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Record Cargo cache freshness
        if: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: touch "$RUNNER_TEMP/uv-cargo-cache-marker"
      - name: Install Rust toolchain
        run: rustup show
      - name: Install codspeed
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-codspeed@5.0.1
      - name: Install requirements and prime cache
        env:
          CARGO_UNSTABLE_MTIME_ON_USE: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: "sudo apt-get update

          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev

          cargo run --bin uv -- venv --cache-dir .cache

          # Resolve benchmark fixtures without the repository's tooling build policy.

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          cargo run --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer
          2024-08-08 --cache-dir .cache

          "
      - name: Build benchmarks
        env:
          CARGO_UNSTABLE_MTIME_ON_USE: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: cargo codspeed build --profile profiling -p uv-bench
      - name: Prune superseded workspace artifacts
        if: ${{ inputs.seed && steps.rust-cache.outputs.cache-hit != 'true' }}
        run:
          'python3 scripts/prune_cargo_workspace_cache.py target/debug "$RUNNER_TEMP/uv-cargo-cache-marker"

          python3 scripts/prune_cargo_workspace_cache.py target/profiling "$RUNNER_TEMP/uv-cargo-cache-marker"

          '
  arm-build-binary-windows-aarch64-candidate:
    name: arm build / candidate / ${{ inputs.round }}
    timeout-minutes: 30
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 261271a78cf33c4ce6491346f840e8e122f33cbc
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "261271a78cf33c4ce6491346f840e8e122f33cbc"'
      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
      - name: Copy Git Repo to Dev Drive
        run:
          'Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

          '
      - name: Install Rust toolchain
        working-directory: ${{ env.UV_WORKSPACE }}
        run: "rustup toolchain install --profile minimal

          rustup target add aarch64-pc-windows-msvc

          "
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          prefix-key: v2-ci-speed-arm-controlled
          workspaces: ${{ env.UV_WORKSPACE }}
          cache-workspace-crates: "true"
          save-if: ${{ inputs.seed }}
          shared-key: build-binary-windows-aarch64
        id: rust-cache
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Build
        working-directory: ${{ env.UV_WORKSPACE }}
        run: cargo build --profile no-debug-nightly -Z checksum-freshness --target aarch64-pc-windows-msvc --bin uv --bin uvx
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arm-arm-build-candidate-${{ inputs.round }}
          path:
            "${{ env.UV_WORKSPACE }}/target/aarch64-pc-windows-msvc/no-debug-nightly/uv.exe

            ${{ env.UV_WORKSPACE }}/target/aarch64-pc-windows-msvc/no-debug-nightly/uvx.exe

            "
          retention-days: 1
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'arm') && (inputs.variant == 'both' || inputs.variant == 'candidate')
      }}
  arm-smoke-candidate:
    name: native ARM64 smoke / candidate / ${{ inputs.round }}
    timeout-minutes: 10
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 261271a78cf33c4ce6491346f840e8e122f33cbc
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: arm-arm-build-candidate-${{ inputs.round }}
      - name: Smoke test
        run: "./uv run --no-project scripts/smoke-test

          "
      - name: Test uv shell completions
        run:
          "(& ./uv generate-shell-completion powershell) | Out-String | Invoke-Expression

          "
      - name: Test uvx shell completions
        run:
          "(& ./uvx --generate-shell-completion powershell) | Out-String | Invoke-Expression

          "
    needs: arm-build-binary-windows-aarch64-candidate
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'arm') && (inputs.variant == 'both' || inputs.variant == 'candidate')
      }}
  schedule-cargo-test-windows-candidate:
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: windows tests / candidate / ${{ inputs.round }} / ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        partition:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 99d65b6e30fef3affe3c68d402310217749af39e
      - name: Record source revision
        shell: bash
        run: 'git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "99d65b6e30fef3affe3c68d402310217749af39e"'
      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
      - name: Copy Git Repo to Dev Drive
        run:
          'Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

          '
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.7
      - name: Install required Python versions
        run: uv python install
      - name: Install Rust toolchain
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspaces: ${{ env.UV_WORKSPACE }}
          cache-workspace-crates: "true"
          add-job-id-key: false
          save-if: "false"
      - name: Record cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: printf "cache-hit=%s\n" "$CACHE_HIT"
      - name: Create NTFS test directory (low hardlink limit)
        run: New-Item -Path "C:\uv" -ItemType Directory -Force
      - name: Create SMB test share (alternative filesystem)
        run: 'New-Item -Path "C:\uv-smb" -ItemType Directory -Force

          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

          '
      - name: Install cargo nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-nextest
      - name: Cargo test
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          UV_HTTP_RETRIES: 5
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE: false
          UV_INTERNAL__TEST_ALT_FS: \\localhost\uv-alt-fs
          UV_INTERNAL__TEST_SMB_FS: \\localhost\uv-alt-fs
          UV_INTERNAL__TEST_LOWLINKS_FS: C:\uv
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run:
          "cargo nextest run \\\n  --cargo-profile fast-build-nightly \\\n  -Z panic-abort-tests \\\n  -Z checksum-freshness\
          \ \\\n  --no-default-features \\\n  --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native\
          \ \\\n  --workspace \\\n  --profile ci-windows \\\n  --partition hash:${{ matrix.partition }}/3\n"
      - name: Upload pending snapshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: schedule-windows-tests-candidate-${{ matrix.partition }}-${{ inputs.round }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: schedule-windows-tests-candidate-${{ matrix.partition }}-${{ inputs.round }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
    if:
      ${{ (inputs.workload == 'all' || inputs.workload == 'schedule') && (inputs.variant == 'both' || inputs.variant ==
      'candidate') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      PYTHON_VERSION: "3.12"
      RUSTC_BOOTSTRAP: 1
      RUSTUP_MAX_RETRIES: 10
