name: Insta workspace-root benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insta-workspace-root-benchmark-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: never
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  measure:
    name: Linux replicate ${{ matrix.replicate }}
    timeout-minutes: 60
    runs-on: depot-ubuntu-24.04-16
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Install mold"
        run: ./scripts/install-mold.sh

      - name: "Install Rust toolchain"
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          cache-workspace-crates: "true"
          save-if: "false"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"

      - name: "Install required Python versions"
        run: uv python install

      - name: "Install secret service"
        run: |
          # Try the next configured mirror after the first failed download.
          cat /etc/apt/apt-mirrors.txt
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt install -y --no-install-recommends gnome-keyring

      - name: "Start gnome-keyring"
        # run gnome-keyring with 'foobar' as password for the login keyring
        # this will create a new login keyring and unlock it
        # the login password doesn't matter, but the keyring must be unlocked for the tests to work
        run: gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'

      - name: "Create btrfs filesystem"
        run: |
          sudo apt install -y btrfs-progs
          truncate -s 1G /tmp/btrfs.img
          mkfs.btrfs /tmp/btrfs.img
          sudo mkdir /btrfs
          sudo mount -o loop /tmp/btrfs.img /btrfs
          sudo chown "$(id -u):$(id -g)" /btrfs

      - name: "Create tmpfs filesystem"
        run: |
          sudo mkdir /tmpfs
          sudo mount -t tmpfs -o size=256m tmpfs /tmpfs
          sudo chown "$(id -u):$(id -g)" /tmpfs

      - name: "Create minix filesystem (low hardlink limit)"
        run: |
          truncate -s 16M /tmp/minix.img
          mkfs.minix /tmp/minix.img
          sudo mkdir /minix
          sudo mount -o loop /tmp/minix.img /minix
          sudo chown "$(id -u):$(id -g)" /minix

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest

      - name: Build the pinned baseline once
        run: |
          mkdir -p benchmark-results
          cargo metadata --format-version 1 --locked \
            --features test-python-patch,test-universal,native-auth,secret-service \
            > benchmark-results/cargo-metadata.json
          cargo nextest list \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --features test-python-patch,test-universal,native-auth,secret-service \
            --workspace --locked --list-type binaries-only --message-format json \
            > benchmark-results/binaries.json

      - name: Measure paired test execution
        env:
          UV_HTTP_RETRIES: 5
          RUST_BACKTRACE: 1
          UV_INTERNAL__TEST_COW_FS: /btrfs
          UV_INTERNAL__TEST_NOCOW_FS: /btrfs
          UV_INTERNAL__TEST_ALT_FS: /tmpfs
          UV_INTERNAL__TEST_LOWLINKS_FS: /minix
          INSTA_UPDATE: "no"
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
          BENCHMARK_REPLICATE: ${{ matrix.replicate }}
        run: |
          python3 scripts/benchmark_insta_workspace_root.py \
            --cargo-metadata benchmark-results/cargo-metadata.json \
            --binaries-metadata benchmark-results/binaries.json \
            --output benchmark-results/samples \
            --replicate "$BENCHMARK_REPLICATE" \
            --profile ci-linux --threads 20 --pairs 3 --warmups 1 \
            --seed "$BENCHMARK_REPLICATE"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-workspace-root-${{ matrix.replicate }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
