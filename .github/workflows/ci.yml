name: Namespace workspace startup benchmark

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BASE_SHA: fbb0a829a377f1f8fd26bdaf6e4e07364ad0621b
  HEAD_SHA: 6a5162990712cd583152f93e5b4f4d655219de67
  BASE_RUN_ID: "31106933122"
  HEAD_RUN_ID: "31107450883"
  PREFECT_SHA: baa13ab830c96045672f4588f2d9da992c9a0afd

jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux 4 cores
            runner: namespace-profile-ubuntu-24-04-4
            artifact: uv-linux-libc
            core-counts: "1 2 4"
          - name: Linux 8 cores
            runner: namespace-profile-ubuntu-24-04-8
            artifact: uv-linux-libc
            core-counts: "8"
          - name: Linux 16 cores
            runner: namespace-profile-ubuntu-24-04-16
            artifact: uv-linux-libc
            core-counts: "16"
          - name: macOS Apple Silicon
            runner: namespace-profile-macos-15
            artifact: uv-macos-aarch64
            core-counts: ""

    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download baseline binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}-${{ env.BASE_SHA }}
          path: ${{ runner.temp }}/baseline
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download fixed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/fixed
          run-id: ${{ env.HEAD_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Prepare pinned Prefect script fixtures
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/baseline/uv" "$RUNNER_TEMP/fixed/uv"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/PrefectHQ/prefect/$PREFECT_SHA/scripts/all_links_should_be_ok.py" \
            --output "$RUNNER_TEMP/all_links_should_be_ok.py"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/PrefectHQ/prefect/$PREFECT_SHA/scripts/wait-for-server.py" \
            --output "$RUNNER_TEMP/wait-for-server.py"

      - name: Warm script environments
        shell: bash
        run: |
          for script in all_links_should_be_ok.py wait-for-server.py; do
            "$RUNNER_TEMP/baseline/uv" workspace metadata --sync \
              --script "$RUNNER_TEMP/$script" \
              --python "$(command -v python3)" \
              --cache-dir "$RUNNER_TEMP/uv-cache" \
              --no-config > /dev/null
          done

      - name: Compare startup performance
        shell: bash
        env:
          CORE_COUNTS: ${{ matrix.core-counts }}
        run: |
          python3 -c 'import os, platform; print({"platform": platform.platform(), "cpu_count": os.cpu_count(), "affinity": sorted(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else None})'
          if [[ -f /sys/devices/system/cpu/online ]]; then
            cat /sys/devices/system/cpu/online
          fi

          arguments=(
            --baseline "$RUNNER_TEMP/baseline/uv"
            --fixed "$RUNNER_TEMP/fixed/uv"
            --python "$(command -v python3)"
            --cache-dir "$RUNNER_TEMP/uv-cache"
            --script "all_links=$RUNNER_TEMP/all_links_should_be_ok.py"
            --script "prefect=$RUNNER_TEMP/wait-for-server.py"
            --samples 15
          )
          if [[ -n "$CORE_COUNTS" ]]; then
            read -r -a core_counts <<< "$CORE_COUNTS"
            arguments+=(--cores "${core_counts[@]}")
          fi
          python3 .github/scripts/benchmark-workspace-membarrier.py "${arguments[@]}"
