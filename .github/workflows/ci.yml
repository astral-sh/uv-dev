name: Windows interpreter-cache capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interpreter-cache-capture:
    timeout-minutes: 45
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_BOOTSTRAP: 1
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 32

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      - name: Copy checkout to Dev Drive
        run: Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          checksum: "088962f9e7b7bd9ea740c04c650b2a21c8928c345bd99ac24350dc924dba656c"
          enable-cache: false

      - name: Install pinned build tools
        working-directory: ${{ env.UV_WORKSPACE }}
        run: |
          rustup toolchain install --profile minimal --component rustfmt
          uv sync --only-dev --locked --python (Get-Command python).Source

      - name: Build the two pinned sources
        working-directory: ${{ env.UV_WORKSPACE }}
        run: >-
          python scripts/interpreter-cache-capture/build.py
          --sources capture-sources
          --output capture-evidence/build
          --nextest .venv/Scripts/cargo-nextest.exe

      - name: Record volume information
        if: ${{ always() }}
        working-directory: ${{ env.UV_WORKSPACE }}
        run: |
          New-Item -ItemType Directory -Force capture-evidence | Out-Null
          Get-Volume | Select-Object DriveLetter, FileSystem, FileSystemLabel, DriveType | ConvertTo-Json | Set-Content capture-evidence/filesystems.json

      - name: Capture fourteen fixed cases
        working-directory: ${{ env.UV_WORKSPACE }}
        run: >-
          python scripts/interpreter-cache-capture/capture.py
          --sources capture-sources
          --output capture-evidence
          --workspace capture-work
          --setup-uv (Get-Command uv).Source
          --nextest .venv/Scripts/cargo-nextest.exe

      - name: Upload interpreter-cache evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interpreter-cache-windows
          path: ${{ env.UV_WORKSPACE }}/capture-evidence/
          if-no-files-found: error
          retention-days: 7
