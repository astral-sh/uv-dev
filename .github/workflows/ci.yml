      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: junit-results-macos-macos-tests-before
        path: target/nextest/ci*/junit.xml
        if-no-files-found: ignore
        retention-days: 1
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      PYTHON_VERSION: '3.12'
      RUSTC_BOOTSTRAP: 1
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    permissions:
      contents: read
