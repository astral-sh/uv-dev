      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
  baseline-cargo-test-linux:
    timeout-minutes: 30
    runs-on: depot-ubuntu-24.04-16
    name: baseline / cargo test on linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Install mold
        run: "./scripts/install-mold.sh"
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        id: rust-cache
        with:
          prefix-key: v1-pr19648-20260901
          key: "${{ hashFiles('Cargo.toml') }}"
          cache-workspace-crates: "true"
          save-if: "${{ inputs.save-rust-cache == 'true' }}"
          shared-key: baseline-cargo-test-linux
      - name: Record Cargo cache freshness
        if:
          "${{ inputs.save-rust-cache == 'true' && steps.rust-cache.outputs.cache-hit
          != 'true' }}"
        run: touch "$RUNNER_TEMP/uv-cargo-cache-marker"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.7
      - name: Install required Python versions
        run: uv python install
      - name: Install secret service
        run: |
          # Try the next configured mirror after the first failed download.
          cat /etc/apt/apt-mirrors.txt
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt install -y --no-install-recommends gnome-keyring
      - name: Start gnome-keyring
        run: gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
      - name: Create btrfs filesystem
        run: |
          sudo apt install -y btrfs-progs
          truncate -s 1G /tmp/btrfs.img
          mkfs.btrfs /tmp/btrfs.img
          sudo mkdir /btrfs
          sudo mount -o loop /tmp/btrfs.img /btrfs
          sudo chown "$(id -u):$(id -g)" /btrfs
      - name: Create tmpfs filesystem
        run: |
          sudo mkdir /tmpfs
          sudo mount -t tmpfs -o size=256m tmpfs /tmpfs
          sudo chown "$(id -u):$(id -g)" /tmpfs
      - name: Create minix filesystem (low hardlink limit)
        run: |
          truncate -s 16M /tmp/minix.img
          mkfs.minix /tmp/minix.img
          sudo mkdir /minix
          sudo mount -o loop /tmp/minix.img /minix
          sudo chown "$(id -u):$(id -g)" /minix
      - name: Install cargo nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-nextest
      - name: Cargo test
        env:
          UV_HTTP_RETRIES: 5
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE:
            "${{ inputs.save-rust-cache == 'true' && steps.rust-cache.outputs.cache-hit
            != 'true' }}"
          UV_INTERNAL__TEST_COW_FS: "/btrfs"
          UV_INTERNAL__TEST_NOCOW_FS: "/tmpfs"
          UV_INTERNAL__TEST_ALT_FS: "/tmpfs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "/minix"
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: "${{ github.workspace }}/pending-snapshots"
        run: |
          cargo nextest run \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --features test-python-patch,test-universal,native-auth,secret-service \
            --workspace \
            --profile ci-linux
      - name: Prune superseded workspace artifacts
        if:
          "${{ inputs.save-rust-cache == 'true' && steps.rust-cache.outputs.cache-hit
          != 'true' }}"
        run:
          python3 scripts/prune_cargo_workspace_cache.py target/fast-build-nightly
          "$RUNNER_TEMP/uv-cargo-cache-marker"
      - name: Upload pending snapshots
        if: "${{ failure() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-pending-snapshots-linux
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-junit-results-linux
          path: target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Record benchmark evidence
        if: "${{ always() }}"
        env:
          BENCH_CACHE_HIT: "${{ steps.rust-cache.outputs.cache-hit }}"
          BENCH_SAMPLE: "${{ inputs.sample }}"
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def capture(args):
              return subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout.strip()
          metadata = {'variant': 'baseline', 'job': 'cargo-test-linux', 'expected_source': 'bf041f9245952ba7c9e3c29aebe0a8acc2bc983d', 'runner_label': 'depot-ubuntu-24.04-16'}
          metadata.update(sample=os.environ['BENCH_SAMPLE'], source=capture(['git', 'rev-parse', 'HEAD']), cache_hit=os.environ['BENCH_CACHE_HIT'], rustflags=os.environ.get('RUSTFLAGS', ''), rustc_bootstrap=os.environ.get('RUSTC_BOOTSTRAP', ''), rustc=capture(['rustc', '+1.98.0', '-vV']), runner_name=os.environ.get('RUNNER_NAME', ''), cpu=capture(['lscpu']), uname=capture(['uname', '-a']), files=[])
          assert metadata['source'] == metadata['expected_source'], metadata
          for name in []:
              path = pathlib.Path(name)
              if path.exists():
                  metadata['files'].append(dict(path=name, bytes=path.stat().st_size, sha256=hashlib.sha256(path.read_bytes()).hexdigest(), elf_comment=capture(['readelf', '-p', '.comment', name])))
          output = pathlib.Path('benchmark-evidence')
          output.mkdir(exist_ok=True)
          (output / 'environment.json').write_text(json.dumps(metadata, indent=2))
          print(json.dumps(metadata, indent=2))
          PY
      - name: Upload benchmark evidence
        if: "${{ always() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-baseline-cargo-test-linux
          path: benchmark-evidence/
          if-no-files-found: error
          retention-days: 14
    env:
