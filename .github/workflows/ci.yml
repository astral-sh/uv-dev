name: CI
run-name: Diagnose Windows archive extraction and bootstrap placement
on: workflow_dispatch
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        python_drive: [C, D]
        sample: [1,2,3,4]
    name: Windows ${{ matrix.python_drive }} sample ${{ matrix.sample }}
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"

      - name: Use original image Python directory
        if: matrix.python_drive == 'C'
        run: |
          "UV_PYTHON_INSTALL_DIR=$env:APPDATA/uv/python" >> $env:GITHUB_ENV

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspace: ${{ env.UV_WORKSPACE }}
          profile: fast-build-nightly
          # Use the same cache entry across the partitions
          add-job-id-key: false
          save-if: 'false'

      - name: Record disk and image configuration
        run: |
          Get-Volume -DriveLetter C,D | Select-Object DriveLetter,FileSystem,Size,SizeRemaining | Format-Table
          Get-Partition -DriveLetter C,D | Get-Disk | Select-Object Number,FriendlyName,BusType,PartitionStyle | Format-Table
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object AntivirusEnabled,RealTimeProtectionEnabled | Format-List
          & "$env:SystemRoot/System32/tar.exe" --version

      - name: Replay the same compressed workspace to fresh directories
        shell: bash
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          set -euo pipefail
          gnutar="/c/Program Files/Git/usr/bin/tar.exe"
          bsdtar="/c/Windows/System32/tar.exe"
          scratch=$(cygpath -u "$RUNNER_TEMP")
          archive="$scratch/windows-restore-probe.tar.zst"
          cd /d
          paths=(uv/target)
          for name in .cargo/registry .cargo/git; do
            if test -d "$name"; then paths+=("$name"); fi
          done
          "$gnutar" --posix -cf - "${paths[@]}" | zstd -q -3 -T0 -o "$archive"
          echo "PROBE_ARCHIVE_BYTES $(stat -c %s "$archive")"
          start=$(date +%s%3N)
          zstd -dc "$archive" >/dev/null
          end=$(date +%s%3N)
          echo "PROBE_DECODE_MS $((end-start))"
          # Rotate order so each reader/drive combination runs first on two machines.
          cases=(gnuD nativeC nativeD gnuC)
          for ((i=0; i<4; i++)); do
            mode=${cases[$(((i+SAMPLE-1)%4))]}
            drive=${mode: -1}
            dest="/${drive,}/uv-restore-bench-$mode"
            mkdir "$dest"
            start=$(date +%s%3N)
            result=0
            if [[ "$mode" == gnu* ]]; then
              zstd -dc "$archive" | "$gnutar" -xf - -C "$dest" || result=$?
            else
              zstd -dc "$archive" | "$bsdtar" -xf - -C "$(cygpath -w "$dest")" || result=$?
            fi
            end=$(date +%s%3N)
            echo "PROBE_UNPACK $mode $((end-start)) $result"
            find "$dest" -type f | wc -l
            rm -rf -- "$dest"
          done
