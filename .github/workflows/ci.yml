name: Namespace proposal single-suite samples

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Sample indices as a JSON array"
        required: true
        type: string
        default: "[0]"
      save-rust-cache:
        description: "Save the normal Rust cache"
        required: true
        type: string
        default: "true"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  cargo-test-linux:
    timeout-minutes: 10
    runs-on:
      - nscloud-ubuntu-24.04-amd64-32x64-with-features
      - namespace-features:container.privileged=true
      - namespace-features:compute.configuration=d0
    name: "Namespace proposal / sample ${{ matrix.sample }}"
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sample: ${{ fromJSON(inputs.samples) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install mold"
        run: ./scripts/install-mold.sh

      - name: "Install Rust toolchain"
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          cache-workspace-crates: "true"
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Record Cargo cache freshness"
        if: ${{ inputs.save-rust-cache == 'true' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: touch "$RUNNER_TEMP/uv-cargo-cache-marker"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"

      - name: "Install required Python versions"
        run: uv python install

      - name: "Install secret service"
        run: |
          # Try the next configured mirror after the first failed download, rather
          # than exhausting the job's time limit retrying a failing mirror.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            cat /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          # Refresh the image's package lists to avoid requesting obsolete versions.
          sudo apt update
          sudo apt install -y --no-install-recommends dbus-daemon gnome-keyring

      - name: "Start gnome-keyring"
        # run gnome-keyring with 'foobar' as password for the login keyring
        # this will create a new login keyring and unlock it
        # the login password doesn't matter, but the keyring must be unlocked for the tests to work
        run: |
          # Namespace's containerized runners have no login session bus. Start one
          # for gnome-keyring and share its address with the secret-service tests.
          DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address=1)"
          export DBUS_SESSION_BUS_ADDRESS
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'

      - name: "Create btrfs filesystem"
        run: |
          sudo apt install -y btrfs-progs
          truncate -s 1G /tmp/btrfs.img
          mkfs.btrfs /tmp/btrfs.img
          sudo mkdir /btrfs
          sudo mount -o loop /tmp/btrfs.img /btrfs
          sudo chown "$(id -u):$(id -g)" /btrfs

      - name: "Create tmpfs filesystem"
        run: |
          sudo mkdir /tmpfs
          sudo mount -t tmpfs -o size=256m tmpfs /tmpfs
          sudo chown "$(id -u):$(id -g)" /tmpfs

      - name: "Create filesystem with a low hardlink limit"
        run: |
          # Prefer minix for its lower hardlink limit. Namespace kernels may lack
          # minix support, so fall back to ext4 when it cannot be loaded.
          if grep -qw minix /proc/filesystems || sudo modprobe minix; then
            filesystem=minix
            truncate -s 16M /tmp/minix.img
            mkfs.minix /tmp/minix.img
          else
            filesystem=ext4
            truncate -s 128M /tmp/ext4.img
            mkfs.ext4 -F /tmp/ext4.img
          fi
          sudo mkdir "/$filesystem"
          sudo mount -o loop "/tmp/$filesystem.img" "/$filesystem"
          sudo chown "$(id -u):$(id -g)" "/$filesystem"
          echo "UV_INTERNAL__TEST_LOWLINKS_FS=/$filesystem" >> "$GITHUB_ENV"

      - name: "Create temporary test directory"
        run: |
          # Keep test scratch I/O in memory with a bounded tmpfs. TMPDIR uses this
          # mount independently of the filesystems used by specific tests.
          mkdir -p /tmp/uv-tests
          sudo mount -t tmpfs -o size=16G,mode=1777 tmpfs /tmp/uv-tests

      - name: "Record runner inventory"
        env:
          TMPDIR: /tmp/uv-tests
        run: uv run --no-project --python 3.12 python .github/runner-experiments/inventory.py benchmark-evidence/before.json

      - name: "Cargo test"
        env:
          TMPDIR: /tmp/uv-tests
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE: ${{ inputs.save-rust-cache == 'true' && steps.rust-cache.outputs.cache-hit != 'true' }}
          UV_INTERNAL__TEST_COW_FS: /btrfs
          UV_INTERNAL__TEST_NOCOW_FS: /tmpfs
          UV_INTERNAL__TEST_ALT_FS: /tmpfs
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        run: |
          set -o pipefail
          /usr/bin/time -v -o benchmark-evidence/cargo.time.txt uv run --only-dev cargo nextest run \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --features test-python-patch,test-universal,native-auth,secret-service \
            --workspace \
            --profile ci-linux 2>&1 | tee benchmark-evidence/cargo.log

      - name: "Record final runner counters"
        if: always()
        env:
          TMPDIR: /tmp/uv-tests
        run: uv run --no-project --python 3.12 python .github/runner-experiments/inventory.py benchmark-evidence/after.json

      - name: "Upload proposal benchmark"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proposal-sample-${{ matrix.sample }}
          path: |
            benchmark-evidence/
            target/nextest/ci-linux/junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: "Prune superseded workspace artifacts"
        if: ${{ inputs.save-rust-cache == 'true' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/prune_cargo_workspace_cache.py target/fast-build-nightly "$RUNNER_TEMP/uv-cargo-cache-marker"

      - name: "Upload pending snapshots"
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-snapshots-linux-${{ matrix.sample }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: "Upload JUnit results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-linux-${{ matrix.sample }}
          path: target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
