          --profile ci-windows \
          --partition hash:3/3
    - name: Upload pending snapshots
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pending-snapshots-windows-3-after
        path: pending-snapshots/
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 14
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: junit-results-windows-3-after
        path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
        if-no-files-found: ignore
        retention-days: 14
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'windows-3') && inputs.phase != 'seed' }}
