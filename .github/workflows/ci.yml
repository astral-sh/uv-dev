name: Measure workspace cache input timestamps
"on":
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
          - seed
          - warm
        default: warm
        required: true
      suite:
        type: choice
        options:
          - all
          - dev-linux-arm64
          - dev-linux-armv7
          - dev-linux-musl
          - dev-macos-arm64
          - dev-macos-x64
          - dev-windows-x64
          - dev-windows-arm64
          - dev-android
          - macos-tests
          - clippy-linux
          - clippy-windows
          - docs
          - generated
          - bench-walltime
          - bench-simulated
        default: all
        required: true
      schema-changed:
        type: string
        default: "false"
        required: false
permissions:
  contents: read
jobs:
  dev-linux-arm64-before:
    name: dev-linux-arm64 / before
    timeout-minutes: 10
    runs-on: github-ubuntu-24.04-aarch64-4
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
      RUSTC_BOOTSTRAP: 1
      RUSTFLAGS: -Z unstable-options -C linker-features=+lld -C link-self-contained=+linker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: uv-build-inputs-20261024-v1-dev-linux-arm64-before
          profile: no-debug-nightly
          save-if: ${{ inputs.phase == 'seed' }}
        name: Restore Rust cache
        id: rust-cache
      - name: Require exact warm Rust cache
        if: ${{ inputs.phase == 'warm' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Build
        run: cargo build --locked --profile no-debug-nightly -Z checksum-freshness
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-linux-aarch64-${{ github.sha }}-before
          path: |
            ./target/no-debug-nightly/uv
            ./target/no-debug-nightly/uvx
          retention-days: 1
    if: ${{ inputs.suite == 'all' || inputs.suite == 'dev-linux-arm64' }}
    permissions:
      contents: read
  dev-linux-arm64-after:
    name: dev-linux-arm64 / after
    timeout-minutes: 10
    runs-on: github-ubuntu-24.04-aarch64-4
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
      RUSTC_BOOTSTRAP: 1
      RUSTFLAGS: -Z unstable-options -C linker-features=+lld -C link-self-contained=+linker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
        with:
          prefix-key: uv-build-inputs-20261024-v1-dev-linux-arm64-after
          profile: no-debug-nightly
          save-if: ${{ inputs.phase == 'seed' }}
        name: Restore Rust cache
        id: rust-cache
      - name: Require exact warm Rust cache
        if: ${{ inputs.phase == 'warm' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Build
        run: cargo build --locked --profile no-debug-nightly -Z checksum-freshness
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
