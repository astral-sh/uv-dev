name: CI
run-name: Trace Python downloads (${{ inputs.mode }})
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: full
        options: [full, network]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  cargo-test-windows:
    if: inputs.mode != 'network'
    timeout-minutes: 25
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: "cargo test on windows ${{ matrix.partition }} of 3"
    strategy:
      fail-fast: false
      matrix:
        partition: [1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.0"
          checksum: "088962f9e7b7bd9ea740c04c650b2a21c8928c345bd99ac24350dc924dba656c"

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspaces: ${{ env.UV_WORKSPACE }}
          cache-workspace-crates: "true"
          # Use the same cache entry across the partitions
          add-job-id-key: false
          save-if: "false"

      - name: "Record Cargo cache freshness"
        if: false
        run: New-Item -ItemType File -Path "$env:RUNNER_TEMP/uv-cargo-cache-marker"

      - name: "Create NTFS test directory (low hardlink limit)"
        run: New-Item -Path "C:\uv" -ItemType Directory -Force

      - name: "Create SMB test share (alternative filesystem)"
        run: |
          New-Item -Path "C:\uv-smb" -ItemType Directory -Force
          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

      - name: "Build diagnostic tests"
        working-directory: ${{ env.UV_WORKSPACE }}
        shell: bash
        run: |
          uv run --only-dev cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth \
            -p uv --test python --no-run

      - name: "Capture mirror TCP headers"
        continue-on-error: true
        working-directory: ${{ env.UV_WORKSPACE }}
        run: |
          New-Item -ItemType Directory -Force python-download-traces
          $addresses = Resolve-DnsName releases.astral.sh -Type A | Where-Object IPAddress
          $addresses | Format-List | Out-File python-download-traces/dns.txt
          pktmon filter remove
          foreach ($address in $addresses) {
            pktmon filter add "mirror-$($address.IPAddress)" -i $address.IPAddress -t TCP -p 443
          }
          Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, LinkSpeed | Format-List | Out-File python-download-traces/adapters.txt
          netsh interface tcp show global | Out-File python-download-traces/tcp-settings.txt
          netstat -s -p tcp | Out-File python-download-traces/tcp-before.txt
          pktmon start --capture --comp nics --pkt-size 128 --file-name python-download-traces/mirror.etl --file-size 128 --log-mode circular

      - name: "Trace unseeded Python find setup"
        continue-on-error: true
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          # Avoid permission errors during concurrent tests
          # See https://github.com/astral-sh/uv/issues/6940
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE: "false"
          UV_INTERNAL__TEST_ALT_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_SMB_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "C:\\uv"
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          uv run --only-dev cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth \
            -p uv --test python \
            --profile ci-windows \
            -E 'test(=python_find::python_find_freethreaded_313) + test(=python_find::python_find_prerelease_version_specifiers)' \
            --test-threads 1 --success-output final

      - name: "Compare HTTP protocols with fresh archive caches"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: python scripts/trace-python-download-protocols.py

      - name: "Save mirror TCP headers"
        if: always()
        continue-on-error: true
        working-directory: ${{ env.UV_WORKSPACE }}
        run: |
          pktmon counters | Out-File python-download-traces/pktmon-counters.txt
          pktmon stop
          netstat -s -p tcp | Out-File python-download-traces/tcp-after.txt
          pktmon etl2pcap python-download-traces/mirror.etl --out python-download-traces/mirror.pcapng

      - name: "Upload download traces"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-download-traces
          path: |
            ${{ env.UV_WORKSPACE }}/python-download-traces/*.txt
            ${{ env.UV_WORKSPACE }}/python-download-traces/*.json
            ${{ env.UV_WORKSPACE }}/python-download-traces/*.pcapng
            ${{ env.UV_WORKSPACE }}/python-download-traces/*/*.log
          retention-days: 7

      - name: "Seed the Python find archives"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
          RUST_LOG: uv_python_managed=trace,uv_client=debug,uv_fs=debug
        run: uv python install 3.13t 3.14.0rc2 3.14.0rc3 3.14.0

      - name: "Trace seeded Python find setup"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          # Avoid permission errors during concurrent tests
          # See https://github.com/astral-sh/uv/issues/6940
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          CARGO_UNSTABLE_MTIME_ON_USE: "false"
          UV_INTERNAL__TEST_ALT_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_SMB_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "C:\\uv"
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          uv run --only-dev cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth \
            -p uv --test python \
            --profile ci-windows \
            -E 'test(=python_find::python_find_freethreaded_313) + test(=python_find::python_find_prerelease_version_specifiers)' \
            --test-threads 1 --success-output final

      - name: "Prune superseded workspace artifacts"
        if: false
        working-directory: ${{ env.UV_WORKSPACE }}
        run: python scripts/prune_cargo_workspace_cache.py target/fast-build-nightly "$env:RUNNER_TEMP/uv-cargo-cache-marker"

      - name: "Upload pending snapshots"
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-snapshots-windows-${{ matrix.partition }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: "Upload JUnit results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-windows-${{ matrix.partition }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  compare-network-providers:
    if: inputs.mode == 'network'
    name: "Archive downloads on ${{ matrix.provider }} Windows"
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: namespace
            runner: namespace-profile-windows-2022-x86-64-16x32
          - provider: github
            runner: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture mirror TCP headers
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force python-network-traces
          $addresses = Resolve-DnsName releases.astral.sh -Type A | Where-Object IPAddress
          $addresses | Format-List | Out-File python-network-traces/dns.txt
          pktmon filter remove
          foreach ($address in $addresses) {
            pktmon filter add "mirror-$($address.IPAddress)" -i $address.IPAddress -t TCP -p 443
          }
          Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, LinkSpeed | Format-List | Out-File python-network-traces/adapters.txt
          netsh interface tcp show global | Out-File python-network-traces/tcp-settings.txt
          pktmon start --capture --comp nics --pkt-size 128 --file-name python-network-traces/mirror.etl --file-size 128 --log-mode circular
      - name: Compare mirror and GitHub downloads
        env:
          DIAGNOSTIC_PROVIDER: ${{ matrix.provider }}
        run: ./scripts/trace-python-download-network.ps1
      - name: Save mirror TCP headers
        if: always()
        continue-on-error: true
        run: |
          pktmon counters | Out-File python-network-traces/pktmon-counters.txt
          pktmon stop
          pktmon etl2pcap python-network-traces/mirror.etl --out python-network-traces/mirror.pcapng
      - name: Upload network traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-network-traces-${{ matrix.provider }}
          path: |
            python-network-traces/*.txt
            python-network-traces/*.json
            python-network-traces/*.pcapng
            python-network-traces/*/*.log
          retention-days: 7
