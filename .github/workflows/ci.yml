name: CI
run-name: Windows pinned Rust toolchain comparison
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: Benchmark matrix
        type: choice
        options:
          - prime
          - measure
        default: measure
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  toolchain:
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.matrix == 'prime' && '["prime"]' || '["install","restore"]') }}
        sample: ${{ fromJSON(inputs.matrix == 'prime' && '[1]' || '[1,2,3,4]') }}
    name: Rust ${{ matrix.variant }} sample ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Inspect runner toolchains
        run: |
          Get-NetTCPSetting -SettingName Internet | Select-Object AutoTuningLevelLocal,ScalingHeuristics,InitialCongestionWindowMss | Format-List
          $rustupHome = rustup show home
          Write-Output "Image rustup home is $rustupHome"
          foreach ($compiler in Get-ChildItem "$rustupHome/toolchains/*/bin/rustc.exe" -ErrorAction SilentlyContinue) {
              Write-Output $compiler.FullName
              & $compiler.FullName --version --verbose
          }

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - name: Restore pinned Rust toolchain
        id: rust
        if: matrix.variant != 'install'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUSTUP_HOME }}/toolchains
          key: windows-msvc-minimal-rustup-v1-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install Rust toolchain
        if: steps.rust.outputs.cache-hit != 'true'
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal
      - name: Verify installed compiler
        working-directory: ${{ env.UV_WORKSPACE }}
        run: |
          rustc --version --verbose
          cargo --version --verbose
      - name: Save pinned Rust toolchain
        if: matrix.variant == 'prime' && steps.rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUSTUP_HOME }}/toolchains
          key: ${{ steps.rust.outputs.cache-primary-key }}
