name: Linux core capture prerequisites

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Exact diagnostic commit to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect-core-prerequisites:
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Inspect core capture prerequisites
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          python3 -I -B scripts/inspect_linux_core_capture.py \
            --context depot \
            --expected-revision "$EXPECTED_SHA" \
            --shell-version "$BASH_VERSION" \
            --shell-core-soft "$(ulimit -Sc)" \
            --shell-core-hard "$(ulimit -Hc)" \
            --shell-fsize-soft "$(ulimit -Sf)" \
            --shell-fsize-hard "$(ulimit -Hf)" \
            --output "$RUNNER_TEMP/linux-core-prerequisites/inspection.json"

      - name: Upload prerequisite observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-core-prerequisites
          path: ${{ runner.temp }}/linux-core-prerequisites/inspection.json
          if-no-files-found: error
          retention-days: 14
