          metadata = {'variant': 'baseline', 'job': 'build-binary-linux-armv7-gnueabihf', 'expected_source': 'bf041f9245952ba7c9e3c29aebe0a8acc2bc983d', 'runner_label': 'github-ubuntu-24.04-x86_64-8'}
          metadata.update(sample=os.environ['BENCH_SAMPLE'], source=capture(['git', 'rev-parse', 'HEAD']), cache_hit=os.environ['BENCH_CACHE_HIT'], rustflags=os.environ.get('RUSTFLAGS', ''), rustc_bootstrap=os.environ.get('RUSTC_BOOTSTRAP', ''), rustc=capture(['rustc', '+1.98.0', '-vV']), runner_name=os.environ.get('RUNNER_NAME', ''), cpu=capture(['lscpu']), uname=capture(['uname', '-a']), files=[])
          assert metadata['source'] == metadata['expected_source'], metadata
          for name in ['./target/armv7-unknown-linux-gnueabihf/no-debug-nightly/uv', './target/armv7-unknown-linux-gnueabihf/no-debug-nightly/uvx']:
              path = pathlib.Path(name)
              if path.exists():
                  metadata['files'].append(dict(path=name, bytes=path.stat().st_size, sha256=hashlib.sha256(path.read_bytes()).hexdigest(), elf_comment=capture(['readelf', '-p', '.comment', name])))
          output = pathlib.Path('benchmark-evidence')
          output.mkdir(exist_ok=True)
          (output / 'environment.json').write_text(json.dumps(metadata, indent=2))
          print(json.dumps(metadata, indent=2))
          PY
      - name: Upload benchmark evidence
