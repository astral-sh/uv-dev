name: CI
run-name: Windows Rust cache volume ${{ inputs.phase }}
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [seed, warm, edit, probe]
        default: seed
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  seed:
    name: Windows seed shard ${{ matrix.partition }}
    if: inputs.phase == 'seed'
    strategy:
      fail-fast: false
      matrix:
        partition: [1,2,3]
    timeout-minutes: 25
    runs-on:
      - nscloud-windows-2022-amd64-16x32-with-cache
      - nscloud-cache-tag-uv-dev-windows-rust-benchmark-20261023
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.UV_WORKSPACE }}/target/fast-build-nightly/.fingerprint
            ${{ env.UV_WORKSPACE }}/target/fast-build-nightly/build
            ${{ env.UV_WORKSPACE }}/target/fast-build-nightly/deps

      - uses: astral-sh/github-actions/rust-workspace-cache/prune@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          workspace: ${{ env.UV_WORKSPACE }}
          target-directory: target
          profile: fast-build-nightly
          enabled: 'true'

      - name: "Create NTFS test directory (low hardlink limit)"
        run: New-Item -Path "C:\uv" -ItemType Directory -Force

      - name: "Create SMB test share (alternative filesystem)"
        run: |
          New-Item -Path "C:\uv-smb" -ItemType Directory -Force
          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

      - name: "Cargo test"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          # Avoid permission errors during concurrent tests
          # See https://github.com/astral-sh/uv/issues/6940
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          UV_INTERNAL__TEST_ALT_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_SMB_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "C:\\uv"
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          uv run --only-group test cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native \
            --workspace \
            --profile ci-windows \
            --partition hash:${{ matrix.partition }}/3

      - name: Mark successfully built cache generation
        run: |
          $profile = "$env:UV_WORKSPACE/target/fast-build-nightly"
          Set-Content "$profile/deps/.namespace-benchmark-seed" "uv-windows-20261023-v2"
          Set-Content (Join-Path $env:NSC_CACHE_PATH '.uv-benchmark-v2') "uv-windows-20261023-v2"
          $vol = Get-Volume -DriveLetter K
          Write-Output "VOLUME_USED_BYTES $($vol.Size - $vol.SizeRemaining) OUT_OF $($vol.Size)"
          Get-Item "$profile/deps" | Select-Object FullName,LinkType,Target | Format-List
      - name: "Upload pending snapshots"
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-snapshots-seed-${{ matrix.partition }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: "Upload JUnit results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-seed-${{ matrix.partition }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
  volume:
    name: Windows volume shard ${{ matrix.partition }}
    if: inputs.phase == 'warm' || inputs.phase == 'edit'
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    timeout-minutes: 15
    runs-on:
      - nscloud-windows-2022-amd64-16x32-with-cache
      - nscloud-cache-tag-uv-dev-windows-rust-benchmark-20261023
      - nscloud-cache-allow-commit-from-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.UV_WORKSPACE }}/target/fast-build-nightly/.fingerprint
            ${{ env.UV_WORKSPACE }}/target/fast-build-nightly/build
            ${{ env.UV_WORKSPACE }}/target/fast-build-nightly/deps

      - uses: astral-sh/github-actions/rust-workspace-cache/prune@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          workspace: ${{ env.UV_WORKSPACE }}
          target-directory: target
          profile: fast-build-nightly
          enabled: 'false'

      - name: Observe cached build files
        run: |
          $profile = "$env:UV_WORKSPACE/target/fast-build-nightly"
          $marker = "$profile/deps/.namespace-benchmark-seed"
          $rootMarker = Join-Path $env:NSC_CACHE_PATH '.uv-benchmark-v2'
          $rlibs = @(Get-ChildItem "$profile/deps" -Filter "*.rlib").Count
          $state = if (Test-Path $marker) { (Get-Content $marker -Raw).Trim() } else { "cold" }
          $rootState = if (Test-Path $rootMarker) { (Get-Content $rootMarker -Raw).Trim() } else { "cold" }
          if ($state -ne 'cold' -and ($state -ne 'uv-windows-20261023-v2' -or $rlibs -eq 0)) { throw "Incomplete cached build" }
          Write-Output "VOLUME_MARKER $state RLIBS $rlibs ROOT $rootState"
          foreach ($path in "$profile/.fingerprint", "$profile/build", "$profile/deps") {
            $item = Get-Item -LiteralPath $path -Force
            Write-Output "VOLUME_LINK $path $($item.LinkType) $($item.Target)"
          }
      - name: Modify one Rust source input
        if: inputs.phase == 'edit'
        run: |
          Add-Content "$env:UV_WORKSPACE/crates/uv-resolver/src/lib.rs" '    // Benchmark a resolver crate source edit.'
      - name: "Create NTFS test directory (low hardlink limit)"
        run: New-Item -Path "C:\uv" -ItemType Directory -Force

      - name: "Create SMB test share (alternative filesystem)"
        run: |
          New-Item -Path "C:\uv-smb" -ItemType Directory -Force
          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

      - name: "Cargo test"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          # Avoid permission errors during concurrent tests
          # See https://github.com/astral-sh/uv/issues/6940
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          UV_INTERNAL__TEST_ALT_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_SMB_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "C:\\uv"
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          uv run --only-group test cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native \
            --workspace \
            --profile ci-windows \
            --partition hash:${{ matrix.partition }}/3

      - name: "Upload pending snapshots"
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-snapshots-volume-${{ matrix.partition }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: "Upload JUnit results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-volume-${{ matrix.partition }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
  github:
    name: Windows github shard ${{ matrix.partition }}
    if: inputs.phase == 'warm' || inputs.phase == 'edit'
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspace: ${{ env.UV_WORKSPACE }}
          profile: fast-build-nightly
          # Use the same cache entry across the partitions
          add-job-id-key: false
          save-if: 'false'

      - name: Modify one Rust source input
        if: inputs.phase == 'edit'
        run: |
          Add-Content "$env:UV_WORKSPACE/crates/uv-resolver/src/lib.rs" '    // Benchmark a resolver crate source edit.'
      - name: "Create NTFS test directory (low hardlink limit)"
        run: New-Item -Path "C:\uv" -ItemType Directory -Force

      - name: "Create SMB test share (alternative filesystem)"
        run: |
          New-Item -Path "C:\uv-smb" -ItemType Directory -Force
          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

      - name: "Cargo test"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          # Avoid permission errors during concurrent tests
          # See https://github.com/astral-sh/uv/issues/6940
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          UV_INTERNAL__TEST_ALT_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_SMB_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "C:\\uv"
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          uv run --only-group test cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native \
            --workspace \
            --profile ci-windows \
            --partition hash:${{ matrix.partition }}/3

      - name: "Upload pending snapshots"
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-snapshots-github-${{ matrix.partition }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: "Upload JUnit results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-github-${{ matrix.partition }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  probe:
    name: Inspect volume visibility ${{ matrix.policy }}
    if: inputs.phase == 'probe'
    strategy:
      fail-fast: false
      matrix:
        policy: [main-only, no-commit]
    timeout-minutes: 5
    runs-on:
      - nscloud-windows-2022-amd64-16x32-with-cache
      - nscloud-cache-tag-uv-dev-windows-rust-benchmark-20261023
      - ${{ matrix.policy == 'main-only' && 'nscloud-cache-allow-commit-from-main' || 'nscloud-cache-exp-do-not-commit' }}
    steps:
      - name: Inspect diagnostic markers and original path through the cache
        run: |
          if (!$env:NSC_CACHE_PATH) { throw 'No Namespace volume' }
          $v = Get-Volume -DriveLetter K
          Write-Output "PROBE_VOLUME $env:NSC_CACHE_PATH USED_BYTES $($v.Size - $v.SizeRemaining) CAPACITY $($v.Size)"
          foreach ($n in '.uv-benchmark-v2','.namespace-benchmark-seed') {
            $m = @(Get-ChildItem $env:NSC_CACHE_PATH -Filter $n -Recurse -Force -File -ErrorAction SilentlyContinue)
            foreach ($hit in $m) { Write-Output "PROBE_MARKER $($hit.FullName) $((Get-Content $hit.FullName -Raw).Trim())" }
          }
