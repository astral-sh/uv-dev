          sudo apt-get install gcc-arm-linux-gnueabihf
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          prefix-key: v1-pr19648-20260901
          cache-workspace-crates: "true"
          save-if: "${{ inputs.save-rust-cache == 'true' }}"
          shared-key: baseline-build-binary-linux-armv7-gnueabihf
        id: rust-cache
      - name: Build
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run:
          cargo build --profile no-debug-nightly -Z checksum-freshness --target armv7-unknown-linux-gnueabihf
