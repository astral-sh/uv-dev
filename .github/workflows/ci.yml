name: Measure native Rust cache
run-name: ${{ inputs.phase }} / ${{ inputs.suite }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
      schema-changed:
        type: string
        default: 'false'
        required: false
permissions:
  contents: read
jobs:
  linux-tests-before:
    timeout-minutes: 10
    runs-on: depot-ubuntu-24.04-16
    name: linux-tests / before
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - name: Install Rust toolchain
      run: rustup toolchain install --profile minimal
    - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
      with:
        prefix-key: uv-native-20261024-v1-linux-tests-before
        key: ${{ hashFiles('Cargo.toml') }}
        profile: fast-build-nightly
        save-if: ${{ inputs.phase == 'seed' }}
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Configure Python archive cache
      run: echo "UV_PYTHON_CACHE_DIR=$RUNNER_TEMP/uv-python-cache" >> "$GITHUB_ENV"
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    - name: Install required Python versions
      env:
        UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
      run: |
        uv python install
        # Warm the cache for Unix-only tests
        uv python install 3.12d 3.13d 3.13t 3.13td
    - name: Install Linux test dependencies
      run: |
        # Try the next configured mirror after the first failed download.
        cat /etc/apt/apt-mirrors.txt
        printf '%s\n' \
          'Acquire::Retries "0";' \
          'Acquire::http::Timeout "10";' \
          'Acquire::https::Timeout "10";' \
          | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
        # Use Ubuntu's Git and matching libcurl to avoid credential failures in private-repository tests.
        sudo apt install -y --no-install-recommends --allow-downgrades \
          git/noble-updates git-man/noble-updates libcurl3t64-gnutls/noble-updates gnome-keyring
    - name: Start gnome-keyring
      run: gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
    - name: Create btrfs filesystem
      run: |
        sudo apt install -y btrfs-progs
        truncate -s 1G /tmp/btrfs.img
        mkfs.btrfs /tmp/btrfs.img
        sudo mkdir /btrfs
        sudo mount -o loop /tmp/btrfs.img /btrfs
        sudo chown "$(id -u):$(id -g)" /btrfs
    - name: Create tmpfs filesystem
      run: |
        sudo mkdir /tmpfs
        sudo mount -t tmpfs -o size=256m tmpfs /tmpfs
        sudo chown "$(id -u):$(id -g)" /tmpfs
    - name: Create minix filesystem (low hardlink limit)
      run: |
        truncate -s 16M /tmp/minix.img
        mkfs.minix /tmp/minix.img
        sudo mkdir /minix
        sudo mount -o loop /tmp/minix.img /minix
        sudo chown "$(id -u):$(id -g)" /minix
    - name: Cargo test
      env:
        UV_HTTP_RETRIES: 5
        RUST_BACKTRACE: 1
        UV_INTERNAL__TEST_COW_FS: /btrfs
        UV_INTERNAL__TEST_NOCOW_FS: /tmpfs
        UV_INTERNAL__TEST_ALT_FS: /tmpfs
        UV_INTERNAL__TEST_LOWLINKS_FS: /minix
        INSTA_UPDATE: new
        INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
      run: |
        uv run --only-group test cargo nextest run --locked \
          --cargo-profile fast-build-nightly \
          -Z panic-abort-tests \
          -Z checksum-freshness \
          --features test-python-patch,test-universal,native-auth,secret-service \
          --workspace \
          --profile ci-linux
    - name: Upload pending snapshots
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pending-snapshots-linux-linux-tests-before
        path: pending-snapshots/
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 1
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: junit-results-linux-linux-tests-before
        path: target/nextest/ci*/junit.xml
        if-no-files-found: ignore
        retention-days: 1
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'linux-tests') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      PYTHON_VERSION: '3.12'
      RUSTC_BOOTSTRAP: 1
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    permissions:
      contents: read
