    if: ${{ inputs.suite == 'all' || inputs.suite == 'dev-linux-arm64' }}
    permissions:
      contents: read
  dev-linux-armv7-before:
    name: dev-linux-armv7 / before
    timeout-minutes: 15
    runs-on: github-ubuntu-24.04-x86_64-8
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
      - name: Setup armv7
        run: |
          # Slow downloads from the Azure mirror can exhaust the job timeout.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          # Try the next configured mirror after the first failed download.
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            | sudo tee /etc/apt/apt.conf.d/zz-uv-retries > /dev/null
          sudo apt-get update
          sudo apt-get install gcc-arm-linux-gnueabihf
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add armv7-unknown-linux-gnueabihf
      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: uv-build-inputs-20261024-v1-dev-linux-armv7-before
          profile: armv7-unknown-linux-gnueabihf/no-debug-nightly
          save-if: ${{ inputs.phase == 'seed' }}
        name: Restore Rust cache
        id: rust-cache
      - name: Require exact warm Rust cache
        if: ${{ inputs.phase == 'warm' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Build
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run:
          cargo build --locked --profile no-debug-nightly -Z checksum-freshness --target armv7-unknown-linux-gnueabihf --bin
          uv --bin uvx
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-linux-armv7-gnueabihf-${{ github.sha }}-before
          path: |
            ./target/armv7-unknown-linux-gnueabihf/no-debug-nightly/uv
            ./target/armv7-unknown-linux-gnueabihf/no-debug-nightly/uvx
          retention-days: 1
    if: ${{ inputs.suite == 'all' || inputs.suite == 'dev-linux-armv7' }}
    permissions:
      contents: read
  dev-linux-armv7-after:
    name: dev-linux-armv7 / after
    timeout-minutes: 15
    runs-on: github-ubuntu-24.04-x86_64-8
