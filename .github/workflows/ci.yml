name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1
  CODSPEED_SKIP_UPLOAD: "true"
  CAPTURE_WORKFLOW_SHA: ${{ github.sha }}

jobs:
  paired-simulation:
    name: "paired simulation capture"
    runs-on: depot-ubuntu-24.04-4
    if: ${{ github.repository == 'astral-sh/uv-dev' && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    timeout-minutes: 45
    steps:
      - name: "Checkout capture helper"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Save capture helper"
        run: |
          mkdir -p "$RUNNER_TEMP/uv-paired-profile-capture"
          cp scripts/codspeed-paired-capture.py "$RUNNER_TEMP/uv-paired-profile-capture/"

      - name: "Checkout parent benchmark source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9c4df678e4e0dd7be20fa1fab315b385cd751247
          fetch-depth: 2
          clean: false
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: "false"

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"

      - name: "Install system requirements"
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev

      - name: "Reset and prime parent fixtures"
        run: |
          git clean -ffdx -e target/
          cargo run --locked --bin uv -- venv --cache-dir .cache
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Build parent benchmarks"
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          uv run --only-dev cargo codspeed build --locked --profile profiling -p uv-bench

      - name: "Prepare parent capture"
        id: parent-capture
        run: python3 "$RUNNER_TEMP/uv-paired-profile-capture/codspeed-paired-capture.py" prepare "$RUNNER_TEMP/uv-paired-profile-capture" parent

      - name: "Measure parent benchmarks"
        id: parent-run
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          CODSPEED_SKIP_UPLOAD: "true"
        with:
          run: uv run --only-dev cargo codspeed run
          mode: simulation
          runner-version: "5.2.1"

      - name: "Retain parent profiles"
        if: ${{ always() && steps.parent-capture.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/uv-paired-profile-capture/codspeed-paired-capture.py" finish "$RUNNER_TEMP/uv-paired-profile-capture" parent

      - name: "Checkout child benchmark source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 97e0bd1a7accb029e1c1af04e373c7734305690d
          fetch-depth: 2
          clean: false
          persist-credentials: false

      - name: "Reset and prime child fixtures"
        run: |
          git clean -ffdx -e target/
          cargo run --locked --bin uv -- venv --cache-dir .cache
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache

      - name: "Build child benchmarks"
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          uv run --only-dev cargo codspeed build --locked --profile profiling -p uv-bench

      - name: "Prepare child capture"
        id: child-capture
        run: python3 "$RUNNER_TEMP/uv-paired-profile-capture/codspeed-paired-capture.py" prepare "$RUNNER_TEMP/uv-paired-profile-capture" child

      - name: "Measure child benchmarks"
        id: child-run
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          CODSPEED_SKIP_UPLOAD: "true"
        with:
          run: uv run --only-dev cargo codspeed run
          mode: simulation
          runner-version: "5.2.1"

      - name: "Retain child profiles"
        if: ${{ always() && steps.child-capture.outcome == 'success' }}
        run: python3 "$RUNNER_TEMP/uv-paired-profile-capture/codspeed-paired-capture.py" finish "$RUNNER_TEMP/uv-paired-profile-capture" child

      - name: "Verify paired environment"
        run: python3 "$RUNNER_TEMP/uv-paired-profile-capture/codspeed-paired-capture.py" compare "$RUNNER_TEMP/uv-paired-profile-capture"

      - name: "Upload paired profiles"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-paired-simulation
          path: |
            ${{ runner.temp }}/uv-paired-profile-capture/parent/
            ${{ runner.temp }}/uv-paired-profile-capture/child/
            ${{ runner.temp }}/uv-paired-profile-capture/pair.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
