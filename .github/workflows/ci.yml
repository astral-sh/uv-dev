{
  "jobs": {
    "capability-census": {
      "name": "PR244 read-only capability census",
      "runs-on": "github-ubuntu-24.04-x86_64-8",
      "steps": [
        {
          "env": {
            "CENSUS_ADMISSION_NONCE": "${{ inputs.admission_nonce }}",
            "CENSUS_EVENT": "${{ github.event_name }}",
            "CENSUS_EXPECTED_COMMIT": "${{ inputs.expected_commit }}",
            "CENSUS_EXPECTED_REF": "${{ inputs.expected_ref }}",
            "CENSUS_EXPECTED_REPOSITORY": "${{ inputs.expected_repository }}",
            "CENSUS_EXPECTED_WORKFLOW_COMMIT": "${{ inputs.expected_workflow_commit }}",
            "CENSUS_JOB_KEY": "${{ github.job }}",
            "CENSUS_REF": "${{ github.ref }}",
            "CENSUS_REPOSITORY": "${{ github.repository }}",
            "CENSUS_RUNNER_ARCH": "${{ runner.arch }}",
            "CENSUS_RUNNER_ENVIRONMENT": "${{ runner.environment }}",
            "CENSUS_RUNNER_NAME": "${{ runner.name }}",
            "CENSUS_RUNNER_OS": "${{ runner.os }}",
            "CENSUS_RUN_ATTEMPT": "${{ github.run_attempt }}",
            "CENSUS_RUN_ID": "${{ github.run_id }}",
            "CENSUS_SHA": "${{ github.sha }}",
            "CENSUS_SOURCE_BASE64": "",
            "CENSUS_TEMP": "${{ runner.temp }}",
            "CENSUS_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "CENSUS_WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "CENSUS_WORKSPACE": "${{ github.workspace }}"
          },
          "name": "Collect bounded read-only capability facts",
          "run": "exec /usr/bin/env -i LANG=C LC_ALL=C TZ=UTC CENSUS_SOURCE_BASE64=\"$CENSUS_SOURCE_BASE64\" CENSUS_EXPECTED_REPOSITORY=\"$CENSUS_EXPECTED_REPOSITORY\" CENSUS_EXPECTED_REF=\"$CENSUS_EXPECTED_REF\" CENSUS_EXPECTED_COMMIT=\"$CENSUS_EXPECTED_COMMIT\" CENSUS_EXPECTED_WORKFLOW_COMMIT=\"$CENSUS_EXPECTED_WORKFLOW_COMMIT\" CENSUS_ADMISSION_NONCE=\"$CENSUS_ADMISSION_NONCE\" CENSUS_REPOSITORY=\"$CENSUS_REPOSITORY\" CENSUS_EVENT=\"$CENSUS_EVENT\" CENSUS_REF=\"$CENSUS_REF\" CENSUS_SHA=\"$CENSUS_SHA\" CENSUS_WORKFLOW_REF=\"$CENSUS_WORKFLOW_REF\" CENSUS_WORKFLOW_SHA=\"$CENSUS_WORKFLOW_SHA\" CENSUS_RUN_ID=\"$CENSUS_RUN_ID\" CENSUS_RUN_ATTEMPT=\"$CENSUS_RUN_ATTEMPT\" CENSUS_JOB_KEY=\"$CENSUS_JOB_KEY\" CENSUS_RUNNER_NAME=\"$CENSUS_RUNNER_NAME\" CENSUS_RUNNER_OS=\"$CENSUS_RUNNER_OS\" CENSUS_RUNNER_ARCH=\"$CENSUS_RUNNER_ARCH\" CENSUS_RUNNER_ENVIRONMENT=\"$CENSUS_RUNNER_ENVIRONMENT\" CENSUS_WORKSPACE=\"$CENSUS_WORKSPACE\" CENSUS_TEMP=\"$CENSUS_TEMP\" CENSUS_IMAGE_OS=\"${ImageOS-}\" CENSUS_IMAGE_VERSION=\"${ImageVersion-}\" /usr/bin/timeout --signal=KILL 120s /usr/bin/python3 -I -B -S -c 'import base64, hashlib, os, sys\ns = os.environ.pop('\"'\"'CENSUS_SOURCE_BASE64'\"'\"')\nif len(s) != 44548: raise SystemExit(1)\nd = base64.b64decode(s, validate=True)\nif len(d) != 33410 or hashlib.sha256(d).hexdigest() != '\"'\"'2e6fbcc95a85a6d828e556ce7591f37dc9a42cc0427b1d0426c6bf86a3f2f41f'\"'\"': raise SystemExit(1)\nsys.argv = ['\"'\"'<uv-dev/.github/workflows/ci.yml:pr244-capability-census-v1>'\"'\"']\nexec(compile(d, '\"'\"'<uv-dev/.github/workflows/ci.yml:pr244-capability-census-v1>'\"'\"', '\"'\"'exec'\"'\"'), {'\"'\"'__name__'\"'\"': '\"'\"'__main__'\"'\"', '\"'\"'__file__'\"'\"': '\"'\"'<uv-dev/.github/workflows/ci.yml:pr244-capability-census-v1>'\"'\"', '\"'\"'__source_bytes__'\"'\"': d, '\"'\"'__source_sha256__'\"'\"': '\"'\"'2e6fbcc95a85a6d828e556ce7591f37dc9a42cc0427b1d0426c6bf86a3f2f41f'\"'\"'})'\n",
          "shell": "/bin/bash --noprofile --norc -p -e -o pipefail {0}",
          "working-directory": "/"
        }
      ],
      "timeout-minutes": 5
    }
  },
  "name": "CI",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "admission_nonce": {
          "description": "Unique 64-hex non-secret one-shot admission nonce",
          "required": true,
          "type": "string"
        },
        "expected_commit": {
          "description": "Expected run Git commit from publication readback",
          "required": true,
          "type": "string"
        },
        "expected_ref": {
          "description": "Full isolated branch ref fixed by the external one-shot admission",
          "required": true,
          "type": "string"
        },
        "expected_repository": {
          "description": "Repository fixed by the external one-shot admission",
          "required": true,
          "type": "string"
        },
        "expected_workflow_commit": {
          "description": "Expected workflow Git commit from publication readback",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  }
}
