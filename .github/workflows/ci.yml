name: Inspect Windows runner clock offsets
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows-4:
    runs-on: namespace-profile-windows-2022-x86-64-4
    timeout-minutes: 5
    steps:
    - name: Compare runner and server clocks
      shell: powershell
      run: |
        $timer = [System.Diagnostics.Stopwatch]::StartNew()
        for ($i = 0; $i -lt 9; $i++) {
          $before = [DateTimeOffset]::UtcNow
          $monotonicBefore = $timer.Elapsed.TotalSeconds
          $uri = "https://api.github.com/rate_limit?clock_probe=$([Guid]::NewGuid().ToString())"
          $response = Invoke-WebRequest -Method Head -Uri $uri -Headers @{"Cache-Control"="no-cache"} -UseBasicParsing
          $after = [DateTimeOffset]::UtcNow
          $monotonicAfter = $timer.Elapsed.TotalSeconds
          [ordered]@{
            probe = $i
            before_utc = $before.ToString("o")
            after_utc = $after.ToString("o")
            monotonic_before = $monotonicBefore
            monotonic_after = $monotonicAfter
            server_date = [string]$response.Headers.Date
          } | ConvertTo-Json -Compress
          if ($i -lt 8) { Start-Sleep -Seconds 10 }
        }
  windows-16:
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    timeout-minutes: 5
    steps:
    - name: Compare runner and server clocks
      shell: powershell
      run: |
        $timer = [System.Diagnostics.Stopwatch]::StartNew()
        for ($i = 0; $i -lt 9; $i++) {
          $before = [DateTimeOffset]::UtcNow
          $monotonicBefore = $timer.Elapsed.TotalSeconds
          $uri = "https://api.github.com/rate_limit?clock_probe=$([Guid]::NewGuid().ToString())"
          $response = Invoke-WebRequest -Method Head -Uri $uri -Headers @{"Cache-Control"="no-cache"} -UseBasicParsing
          $after = [DateTimeOffset]::UtcNow
          $monotonicAfter = $timer.Elapsed.TotalSeconds
          [ordered]@{
            probe = $i
            before_utc = $before.ToString("o")
            after_utc = $after.ToString("o")
            monotonic_before = $monotonicBefore
            monotonic_after = $monotonicAfter
            server_date = [string]$response.Headers.Date
          } | ConvertTo-Json -Compress
          if ($i -lt 8) { Start-Sleep -Seconds 10 }
        }
