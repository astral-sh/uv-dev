name: Measure pruned dependency caches
run-name: ${{ inputs.phase }} / ${{ inputs.suite }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
      schema-changed:
        type: string
        default: 'false'
        required: false
permissions:
  contents: read
jobs:
  dev-msrv-before:
    name: dev-msrv / before
    runs-on: github-ubuntu-24.04-x86_64-8
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - name: Read MSRV from Cargo.toml
      id: msrv
      run: |
        MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/')
        echo "value=$MSRV" >> "$GITHUB_OUTPUT"
    - name: Install Rust toolchain
      run: rustup default ${MSRV}
      env:
        MSRV: ${{ steps.msrv.outputs.value }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-dev-msrv-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - run: cargo +${MSRV} build --locked --profile no-debug
      env:
        MSRV: ${{ steps.msrv.outputs.value }}
    - run: ./target/no-debug/uv --version
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'dev-msrv') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
    permissions:
      contents: read
  dev-msrv-after:
    name: dev-msrv / after
    runs-on: github-ubuntu-24.04-x86_64-8
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - name: Read MSRV from Cargo.toml
      id: msrv
      run: |
        MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/')
        echo "value=$MSRV" >> "$GITHUB_OUTPUT"
    - name: Install Rust toolchain
      run: |
        rustup toolchain install "${MSRV}" --profile minimal
        echo "RUSTUP_TOOLCHAIN=${MSRV}" >> "$GITHUB_ENV"
      env:
        MSRV: ${{ steps.msrv.outputs.value }}
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-dev-msrv-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - run: cargo +${MSRV} build --locked --profile no-debug
      env:
        MSRV: ${{ steps.msrv.outputs.value }}
    - run: ./target/no-debug/uv --version
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'dev-msrv') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
    permissions:
      contents: read
  dev-freebsd-before:
    name: dev-freebsd / before
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-dev-freebsd-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Cross build
      env:
        CROSS_BUILD_ENV_PASSTHROUGH: UV_INTERNAL__BUILD_GIT_INFO
      run: |
        # Install cross from `freebsd-firecracker`
        wget -q -O cross https://github.com/acj/freebsd-firecracker/releases/download/v0.0.10/cross
        chmod +x cross
        mv cross /usr/local/bin/cross

        cross build --target x86_64-unknown-freebsd --profile no-debug
    - name: Test in Firecracker VM
      uses: acj/freebsd-firecracker-action@ba4f70408ef1d979acdd7bd36fc4b27e06fe5abe
      with:
        verbose: false
        checkout: false
        pre-run: |
          # The exclude `*` prevents examination of directories so we need to
          # include each parent directory of the binary
          include_path="$(mktemp)"
          cat <<EOF > $include_path
          target
          target/x86_64-unknown-freebsd
          target/x86_64-unknown-freebsd/no-debug
          target/x86_64-unknown-freebsd/no-debug/uv
          EOF

          rsync -r -e "ssh" \
            --relative \
            --copy-links \
            --include-from "$include_path" \
            --exclude "*" \
            . firecracker:
        run-in-vm: |
          mv target/x86_64-unknown-freebsd/no-debug/uv uv
          chmod +x uv
          ./uv --version
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'dev-freebsd') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
    permissions:
      contents: read
  dev-freebsd-after:
    name: dev-freebsd / after
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-dev-freebsd-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Cross build
      env:
        CROSS_BUILD_ENV_PASSTHROUGH: UV_INTERNAL__BUILD_GIT_INFO
      run: |
        # Install cross from `freebsd-firecracker`
        wget -q -O cross https://github.com/acj/freebsd-firecracker/releases/download/v0.0.10/cross
        chmod +x cross
        mv cross /usr/local/bin/cross

        cross build --target x86_64-unknown-freebsd --profile no-debug
    - name: Test in Firecracker VM
      uses: acj/freebsd-firecracker-action@ba4f70408ef1d979acdd7bd36fc4b27e06fe5abe
      with:
        verbose: false
        checkout: false
        pre-run: |
          # The exclude `*` prevents examination of directories so we need to
          # include each parent directory of the binary
          include_path="$(mktemp)"
          cat <<EOF > $include_path
          target
          target/x86_64-unknown-freebsd
          target/x86_64-unknown-freebsd/no-debug
          target/x86_64-unknown-freebsd/no-debug/uv
          EOF

          rsync -r -e "ssh" \
            --relative \
            --copy-links \
            --include-from "$include_path" \
            --exclude "*" \
            . firecracker:
        run-in-vm: |
          mv target/x86_64-unknown-freebsd/no-debug/uv uv
          chmod +x uv
          ./uv --version
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'dev-freebsd') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
    permissions:
      contents: read
  hawk-before:
    timeout-minutes: 15
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'hawk') }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: . -> target/hawk
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-hawk-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Rust toolchain
      run: rustup toolchain install 1.99.0
    - name: Install Hawk
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
    - name: Hawk
      run: cargo +1.99.0 hawk check --target-dir target/hawk -D warnings
    name: hawk / before
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
      UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json
    permissions:
      contents: read
  hawk-after:
    timeout-minutes: 15
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'hawk') }}
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
      UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - name: Install Rust toolchain
      run: rustup toolchain install 1.99.0
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        target-directory: target/hawk
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-hawk-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: Install Hawk
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
    - name: Hawk
      run: cargo +1.99.0 hawk check --target-dir target/hawk -D warnings
    name: hawk / after
    permissions:
      contents: read
  publish-before:
    timeout-minutes: 20
    runs-on: depot-ubuntu-24.04-8
    name: publish / before
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-publish-before
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: cargo publish dry-run
      run: cargo publish --locked --workspace --dry-run
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'publish') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    permissions:
      contents: read
  publish-after:
    timeout-minutes: 20
    runs-on: depot-ubuntu-24.04-8
    name: publish / after
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        cache-workspace-crates: 'false'
        save-if: ${{ inputs.phase == 'seed' }}
        prefix-key: uv-prune-20261024-v1-publish-after
      name: Restore Rust cache
      id: rust-cache
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        EXPECTED_HIT: 'true'
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "${CACHE_HIT:-false}" = "$EXPECTED_HIT"
    - name: cargo publish dry-run
      run: cargo publish --locked --workspace --dry-run
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'publish') }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    permissions:
      contents: read
