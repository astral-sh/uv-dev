name: Workspace cache measurements
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: workspace-cache-measurements-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clippy-ubuntu:
    name: clippy on linux
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Seed isolated cache entry
        shell: bash
        working-directory: .
        run: |
          printf '\n# workspace-cache-expansion-20261021\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: "true"
      - name: Install Rust toolchain
        run: rustup component add clippy
      - name: Clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --workspace --all-targets --all-features --locked
  clippy-windows:
    name: clippy on windows
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-4
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      HAWK_VERSION: 0.1.15
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse
      - name: Seed isolated cache entry
        shell: bash
        working-directory: ${{ env.UV_WORKSPACE }}
        run: |
          printf '\n# workspace-cache-expansion-20261021\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ${{ env.UV_WORKSPACE }}
          save-if: "true"
      - name: Install Rust toolchain
        run: rustup component add clippy
      - name: Clippy
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --workspace --all-targets --all-features --locked
  docs:
    timeout-minutes: 10
    name: mkdocs
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.0
          checksum: 1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Seed isolated cache entry
        shell: bash
        working-directory: .
        run: |
          printf '\n# workspace-cache-expansion-20261021\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: "true"
      - name: Generate reference documentation
        run: |
          cargo --locked dev generate-options-reference
          cargo --locked dev generate-cli-reference
          cargo --locked dev generate-env-vars-reference
          cargo --locked dev generate-preview-features-reference
      - name: Build docs
        run: uv run --only-group docs mkdocs build --strict -f mkdocs.yml
  cargo-dev-generate-all:
    timeout-minutes: 10
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    name: cargo dev generate-all
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.0
          checksum: 1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154
      - name: Seed isolated cache entry
        shell: bash
        working-directory: .
        run: |
          printf '\n# workspace-cache-expansion-20261021\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: "true"
      - name: Generate all
        run: cargo --locked dev generate-all --mode dry-run
      - name: Check sysconfig mappings
        run: cargo --locked dev generate-sysconfig-metadata --mode check
      - name: Install Rustfmt
        run: rustup component add rustfmt
      - name: Check Packse scenario tests
        run: cargo --locked dev generate-scenario-tests --mode check
      - name: Check JSON schema
        run: cargo --locked dev generate-json-schema --mode check
      - name: Check uv-extract dirhash test vectors
        run: cargo --locked dev generate-dirhash-test-vectors --mode check
  benchmarks-walltime-build:
    name: walltime build
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Seed isolated cache entry
        shell: bash
        working-directory: .
        run: |
          printf '\n# workspace-cache-expansion-20261021\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: "true"
      - name: Install Rust toolchain
        run: rustup show
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.0
          checksum: 1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154
      - name: Install requirements and prime cache
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --locked --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
      - name: Build benchmarks
        run: |
          # cargo-codspeed resolves metadata before passing --locked to Cargo.
          cargo metadata --locked --format-version 1 > /dev/null
          uv run --only-dev cargo codspeed build --locked -m walltime --profile profiling -p uv-bench --bench uv --bench workspace_discovery --bench git_fetch
      - name: Create artifact archive
        run: |
          mkdir -p target/codspeed-bin
          cp "$(uv run --only-dev which cargo-codspeed)" target/codspeed-bin/
          tar -cvf benchmarks-walltime.tar target/codspeed target/codspeed-bin target/debug/uv .cache
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmarks-walltime
          path: benchmarks-walltime.tar
          retention-days: 1
  benchmarks-simulated:
    name: simulated
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Seed isolated cache entry
        shell: bash
        working-directory: .
        run: |
          printf '\n# workspace-cache-expansion-20261021\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: "true"
      - name: Install Rust toolchain
        run: rustup show
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.0
          checksum: 1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154
      - name: Install requirements and prime cache
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev libkrb5-dev
          cargo run --locked --bin uv -- venv --cache-dir .cache
          # Resolve benchmark fixtures without the repository's tooling build policy.
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/jupyter.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
          cargo run --locked --bin uv -- --config-file test/uv.toml pip compile test/requirements/airflow.in --universal --exclude-newer 2024-08-08 --cache-dir .cache
      - name: Build benchmarks
        run: |
          # cargo-codspeed resolves metadata before passing --locked to Cargo.
          cargo metadata --locked --format-version 1 > /dev/null
          uv run --only-dev cargo codspeed build --locked --profile profiling -p uv-bench
      - name: Retain benchmark profiles
        id: profiles
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run:
          ./target/debug/uv run --script scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-simulation" simulation
          >> "$GITHUB_OUTPUT"
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea
        with:
          run: uv run --only-dev cargo codspeed run
          mode: simulation
          upload-url: ${{ steps.profiles.outputs.upload-url }}
      - name: Finish profile capture
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-simulation"
      - name: Upload benchmark profiles
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codspeed-profiles-simulation
          path: |
            ${{ runner.temp }}/codspeed-simulation/metadata.json
            ${{ runner.temp }}/codspeed-simulation/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
