name: Inspect cache restoration and APT disk IO
run-name: IO / ${{ inputs.phase }} / round ${{ inputs.round }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        required: true
      round:
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  deps-restore-first:
    timeout-minutes: 10
    runs-on: depot-ubuntu-24.04-16
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      PYTHON_VERSION: '3.12'
      RUSTC_BOOTSTRAP: 1
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
    permissions:
      contents: read
    name: deps / restore-first
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - name: Record source revision
      shell: bash
      run: |-
        [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
        echo "Measured source revision: $(git rev-parse HEAD)"
      env:
        EXPECTED_SOURCE: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - name: Install Rust toolchain
      run: rustup toolchain install --profile minimal
    - name: Probe IO before cache
      shell: bash
      env:
        PROBE_POINT: before cache
      run: |
        python3 - <<'PYTHON'
        import json, os, re, time
        from pathlib import Path
        memory = {line.split(':')[0]: line.split(':')[1].strip() for line in Path('/proc/meminfo').read_text().splitlines() if line.split(':')[0] in {'MemAvailable', 'Dirty', 'Writeback', 'Cached'}}
        vm = {key: int(value) for key, value in (line.split() for line in Path('/proc/vmstat').read_text().splitlines()) if key in {'nr_dirty', 'nr_writeback', 'pgpgin', 'pgpgout'}}
        disks = [line.split() for line in Path('/proc/diskstats').read_text().splitlines() if re.fullmatch(r'(nvme[0-9]+n[0-9]+|[sv]d[a-z]+)', line.split()[2])]
        print('IO probe: ' + json.dumps({'point': os.environ['PROBE_POINT'], 'monotonic': time.monotonic(), 'memory': memory, 'vm': vm, 'disks': disks, 'pressure': Path('/proc/pressure/io').read_text(), 'workspace_device': os.stat(os.environ['GITHUB_WORKSPACE']).st_dev, 'cargo_device': os.stat(Path.home() / '.cargo').st_dev}))
        PYTHON
    - uses: astral-sh/github-actions/rust-workspace-cache@8139eb474ac22fe39bb1e33b50afa426dcdaf455
      with:
        prefix-key: uv-cache-apt-io-20261025-v1-deps
        key: ${{ hashFiles('Cargo.toml') }}
        profile: fast-build-nightly
        save-if: ${{ inputs.phase == 'seed' }}
        cache-workspace-crates: 'false'
        add-job-id-key: 'false'
      name: Restore Rust cache
      id: rust-cache
    - name: Probe IO after cache
      shell: bash
      env:
        PROBE_POINT: after cache
      run: |
        python3 - <<'PYTHON'
        import json, os, re, time
        from pathlib import Path
        memory = {line.split(':')[0]: line.split(':')[1].strip() for line in Path('/proc/meminfo').read_text().splitlines() if line.split(':')[0] in {'MemAvailable', 'Dirty', 'Writeback', 'Cached'}}
        vm = {key: int(value) for key, value in (line.split() for line in Path('/proc/vmstat').read_text().splitlines()) if key in {'nr_dirty', 'nr_writeback', 'pgpgin', 'pgpgout'}}
        disks = [line.split() for line in Path('/proc/diskstats').read_text().splitlines() if re.fullmatch(r'(nvme[0-9]+n[0-9]+|[sv]d[a-z]+)', line.split()[2])]
        print('IO probe: ' + json.dumps({'point': os.environ['PROBE_POINT'], 'monotonic': time.monotonic(), 'memory': memory, 'vm': vm, 'disks': disks, 'pressure': Path('/proc/pressure/io').read_text(), 'workspace_device': os.stat(os.environ['GITHUB_WORKSPACE']).st_dev, 'cargo_device': os.stat(Path.home() / '.cargo').st_dev}))
        PYTHON
    - name: Record Rust cache availability
      if: ${{ inputs.phase == 'warm' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      run: |-
        echo "Rust cache exact hit: ${CACHE_HIT:-false}"
        test "$CACHE_HIT" = true
    - name: Configure Python archive cache
      run: echo "UV_PYTHON_CACHE_DIR=$RUNNER_TEMP/uv-python-cache" >> "$GITHUB_ENV"
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    - name: Install required Python versions
      env:
        UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
      run: |
        uv python install
        # Warm the cache for Unix-only tests
        uv python install 3.12d 3.13d 3.13t 3.13td
    - name: Probe IO before APT
      shell: bash
      env:
        PROBE_POINT: before APT
      run: |
        python3 - <<'PYTHON'
        import json, os, re, time
        from pathlib import Path
        memory = {line.split(':')[0]: line.split(':')[1].strip() for line in Path('/proc/meminfo').read_text().splitlines() if line.split(':')[0] in {'MemAvailable', 'Dirty', 'Writeback', 'Cached'}}
        vm = {key: int(value) for key, value in (line.split() for line in Path('/proc/vmstat').read_text().splitlines()) if key in {'nr_dirty', 'nr_writeback', 'pgpgin', 'pgpgout'}}
        disks = [line.split() for line in Path('/proc/diskstats').read_text().splitlines() if re.fullmatch(r'(nvme[0-9]+n[0-9]+|[sv]d[a-z]+)', line.split()[2])]
        print('IO probe: ' + json.dumps({'point': os.environ['PROBE_POINT'], 'monotonic': time.monotonic(), 'memory': memory, 'vm': vm, 'disks': disks, 'pressure': Path('/proc/pressure/io').read_text(), 'workspace_device': os.stat(os.environ['GITHUB_WORKSPACE']).st_dev, 'cargo_device': os.stat(Path.home() / '.cargo').st_dev}))
        PYTHON
    - name: Install Linux test dependencies
      run: |
        # Try the next configured mirror after the first failed download.
        cat /etc/apt/apt-mirrors.txt
        printf '%s\n' \
          'Acquire::Retries "0";' \
          'Acquire::http::Timeout "10";' \
          'Acquire::https::Timeout "10";' \
          | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
        # Use Ubuntu's Git and matching libcurl to avoid credential failures in private-repository tests.
        sudo apt install -y --no-install-recommends --allow-downgrades \
          git/noble-updates git-man/noble-updates libcurl3t64-gnutls/noble-updates gnome-keyring
    - name: Probe IO after APT
      shell: bash
      env:
        PROBE_POINT: after APT
      run: |
        python3 - <<'PYTHON'
        import json, os, re, time
        from pathlib import Path
        memory = {line.split(':')[0]: line.split(':')[1].strip() for line in Path('/proc/meminfo').read_text().splitlines() if line.split(':')[0] in {'MemAvailable', 'Dirty', 'Writeback', 'Cached'}}
        vm = {key: int(value) for key, value in (line.split() for line in Path('/proc/vmstat').read_text().splitlines()) if key in {'nr_dirty', 'nr_writeback', 'pgpgin', 'pgpgout'}}
        disks = [line.split() for line in Path('/proc/diskstats').read_text().splitlines() if re.fullmatch(r'(nvme[0-9]+n[0-9]+|[sv]d[a-z]+)', line.split()[2])]
        print('IO probe: ' + json.dumps({'point': os.environ['PROBE_POINT'], 'monotonic': time.monotonic(), 'memory': memory, 'vm': vm, 'disks': disks, 'pressure': Path('/proc/pressure/io').read_text(), 'workspace_device': os.stat(os.environ['GITHUB_WORKSPACE']).st_dev, 'cargo_device': os.stat(Path.home() / '.cargo').st_dev}))
        PYTHON
    - name: Populate test artifacts
      env:
        UV_HTTP_RETRIES: 5
        RUST_BACKTRACE: 1
        UV_INTERNAL__TEST_COW_FS: /btrfs
        UV_INTERNAL__TEST_NOCOW_FS: /tmpfs
        UV_INTERNAL__TEST_ALT_FS: /tmpfs
        UV_INTERNAL__TEST_LOWLINKS_FS: /minix
        INSTA_UPDATE: new
        INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
      run: |
        uv run --only-group test cargo nextest run --locked \
          --cargo-profile fast-build-nightly \
          -Z panic-abort-tests \
          -Z checksum-freshness \
          --features test-python-patch,test-universal,native-auth,secret-service \
          --workspace \
          --profile ci-linux --no-run
      if: ${{ inputs.phase == 'seed' }}
  deps-apt-first:
    timeout-minutes: 10
