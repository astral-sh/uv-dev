name: CI
run-name: Trace disk IO during early and delayed Windows cache restores
on: workflow_dispatch
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        restore_timing: [early, delayed]
        sample: [1,2,3]
    name: Windows ${{ matrix.restore_timing }} sample ${{ matrix.sample }}
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    timeout-minutes: 18
    steps:
      - name: Start Windows disk performance counters
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'trace-cache-disk.ps1'
          @'
          $out = Join-Path $env:RUNNER_TEMP 'cache-disk.jsonl'
          $counters = @(
            '\LogicalDisk(D:)\Avg. Disk sec/Write', '\LogicalDisk(D:)\Avg. Disk sec/Read',
            '\LogicalDisk(D:)\Current Disk Queue Length', '\LogicalDisk(D:)\Disk Write Bytes/sec',
            '\LogicalDisk(D:)\Disk Read Bytes/sec', '\Processor(_Total)\% Processor Time',
            '\Process(*)\IO Data Bytes/sec'
          )
          Get-Counter -Counter $counters -SampleInterval 1 -Continuous -ErrorAction SilentlyContinue | ForEach-Object {
            $r = [ordered]@{utc = [datetime]::UtcNow.ToString('o')}
            $top = $_.CounterSamples | Where-Object { $_.Path -like '*\process(*)*' -and $_.InstanceName -notin @('_total','idle') } |
              Sort-Object CookedValue -Descending | Select-Object -First 4
            foreach ($c in $_.CounterSamples) {
              if ($c.Path -notlike '*\process(*)*') { $r[$c.Path.Split('\')[-1]] = [math]::Round($c.CookedValue,5) }
            }
            $r.top = @($top | ForEach-Object { "$($_.InstanceName)=$([math]::Round($_.CookedValue/1MB,1))" })
            ($r | ConvertTo-Json -Compress) | Add-Content -Path $out
          }
          '@ | Set-Content $script
          $proc = Start-Process pwsh -ArgumentList '-NoProfile','-File',$script -WindowStyle Hidden -PassThru
          "UV_TRACE_PID=$($proc.Id)" >> $env:GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - name: Match the elapsed time of a system-drive Python install
        if: matrix.restore_timing == 'delayed'
        run: Start-Sleep -Seconds 53

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspace: ${{ env.UV_WORKSPACE }}
          profile: fast-build-nightly
          # Use the same cache entry across the partitions
          add-job-id-key: false
          save-if: 'false'


      - name: Record observations
        if: always()
        shell: pwsh
        run: |
          if ($env:UV_TRACE_PID) { Stop-Process -Id $env:UV_TRACE_PID -ErrorAction SilentlyContinue }
          $out = Join-Path $env:RUNNER_TEMP 'cache-disk.jsonl'
          if (!(Test-Path $out)) { throw 'No disk counter samples' }
          Get-Content $out | ForEach-Object { Write-Output "DISK_TRACE $_" }
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object RealTimeProtectionEnabled | Format-List
