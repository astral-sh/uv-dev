  dev-android-before:
    name: dev-android / before
    timeout-minutes: 10
    runs-on: github-ubuntu-24.04-x86_64-8
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
      - name: Setup Android NDK
        run: |
          # Use ANDROID_NDK_ROOT if set, otherwise find the latest installed NDK
          if [ -z "${ANDROID_NDK_ROOT}" ]; then
            NDK_ROOT=$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | sort -V | tail -n1)
          else
            NDK_ROOT="${ANDROID_NDK_ROOT}"
          fi
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"

          echo "CC_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB=${TOOLCHAIN}/bin/llvm-ranlib" >> "$GITHUB_ENV"

          # NDK 23+ removed libgcc, provide a stub that redirects to libunwind
          LIBDIR=$(echo "${TOOLCHAIN}"/lib/clang/*/lib/linux/aarch64)
          if [ ! -f "${LIBDIR}/libgcc.a" ]; then
            echo 'INPUT(-lunwind)' | sudo tee "${LIBDIR}/libgcc.a" > /dev/null
          fi
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add aarch64-linux-android
      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: uv-build-inputs-20261024-v1-dev-android-before
          profile: aarch64-linux-android/no-debug-nightly
          save-if: ${{ inputs.phase == 'seed' }}
        name: Restore Rust cache
        id: rust-cache
      - name: Require exact warm Rust cache
        if: ${{ inputs.phase == 'warm' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Build
        run:
          cargo build --locked --profile no-debug-nightly -Z checksum-freshness --target aarch64-linux-android --bin uv --bin
          uvx
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-android-aarch64-${{ github.sha }}-before
          path: |
            ./target/aarch64-linux-android/no-debug-nightly/uv
            ./target/aarch64-linux-android/no-debug-nightly/uvx
          retention-days: 1
    if: ${{ inputs.suite == 'all' || inputs.suite == 'dev-android' }}
    permissions:
      contents: read
