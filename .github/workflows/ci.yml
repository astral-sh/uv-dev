name: CI
run-name: Windows shard runner comparison
on: workflow_dispatch
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  windows:
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    name: "Windows ${{ matrix.runner }} shard ${{ matrix.partition }}"
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
        runner: [namespace-profile-windows-2022-x86-64-16x32, github-windows-2022-x86_64-16]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Inspect runner toolchains
        run: |
          $rustupHome = rustup show home
          Write-Output "Image rustup home is $rustupHome"
          foreach ($compiler in Get-ChildItem "$rustupHome/toolchains/*/bin/rustc.exe" -ErrorAction SilentlyContinue) {
              Write-Output $compiler.FullName
              & $compiler.FullName --version --verbose
          }

      - name: Provision Windows Server 2022 data volume
        if: matrix.runner == 'github-windows-2022-x86_64-16'
        run: |
          if (!(Test-Path 'D:\')) {
              New-VHD -Path "$env:RUNNER_TEMP/uv-benchmark.vhdx" -SizeBytes 25GB -Dynamic |
                  Mount-VHD -Passthru | Initialize-Disk -Passthru |
                  New-Partition -DriveLetter D -UseMaximumSize |
                  Format-Volume -FileSystem ReFS -Confirm:$false -Force
          }

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a"

      - name: "Install required Python versions"
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspace: ${{ env.UV_WORKSPACE }}
          profile: fast-build-nightly
          # Use the same cache entry across the partitions
          add-job-id-key: false
          save-if: 'false'

      - name: "Create NTFS test directory (low hardlink limit)"
        run: New-Item -Path "C:\uv" -ItemType Directory -Force

      - name: "Create SMB test share (alternative filesystem)"
        run: |
          New-Item -Path "C:\uv-smb" -ItemType Directory -Force
          New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"

      - name: "Cargo test"
        working-directory: ${{ env.UV_WORKSPACE }}
        env:
          # Retry more than default to reduce flakes in CI
          UV_HTTP_RETRIES: 5
          # Avoid permission errors during concurrent tests
          # See https://github.com/astral-sh/uv/issues/6940
          UV_LINK_MODE: copy
          RUST_BACKTRACE: 1
          UV_INTERNAL__TEST_ALT_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_SMB_FS: "\\\\localhost\\uv-alt-fs"
          UV_INTERNAL__TEST_LOWLINKS_FS: "C:\\uv"
          # Write pending snapshots to a separate directory for artifact upload
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        shell: bash
        run: |
          uv run --only-group test cargo nextest run --locked \
            --cargo-profile fast-build-nightly \
            -Z panic-abort-tests \
            -Z checksum-freshness \
            --no-default-features \
            --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native \
            --workspace \
            --profile ci-windows \
            --partition hash:${{ matrix.partition }}/3

      - name: Inventory build outputs
        run: |
          Get-ChildItem "$env:UV_WORKSPACE/target" -Recurse -File | Group-Object Extension | ForEach-Object {
              [pscustomobject]@{ Extension = $_.Name; MiB = [math]::Round(($_.Group | Measure-Object Length -Sum).Sum / 1MB); Files = $_.Count }
          } | Sort-Object MiB -Descending | Select-Object -First 10 | Format-Table
          Get-ChildItem "$env:CARGO_HOME" -Directory | ForEach-Object {
              Write-Output "$($_.Name) $([math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)) MiB"
          }
      - name: "Upload pending snapshots"
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-snapshots-${{ matrix.runner }}-${{ matrix.partition }}
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: "Upload JUnit results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-${{ matrix.runner }}-${{ matrix.partition }}
          path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
