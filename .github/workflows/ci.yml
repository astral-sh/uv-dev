---
name: Bundled LLD comparison
run-name: Bundled LLD comparison / ${{ inputs.sample }}
"on":
  workflow_dispatch:
    inputs:
      sample:
        description: warmup or numbered measured sample
        required: true
        type: string
        default: warmup
      save-rust-cache:
        description: Save isolated benchmark caches
        type: string
        default: "true"
permissions:
  contents: read
jobs:
  baseline-build-binary-linux-libc:
    name: baseline / linux libc
    timeout-minutes: 30
    runs-on: github-ubuntu-24.04-x86_64-8
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Install mold
        run: "./scripts/install-mold.sh"
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          prefix-key: v1-pr19648-20260901
          cache-workspace-crates: "true"
          save-if: "${{ inputs.save-rust-cache == 'true' }}"
          shared-key: baseline-build-binary-linux-libc
        id: rust-cache
      - name: Build
        run: cargo build --profile no-debug-nightly -Z checksum-freshness
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-uv-linux-libc-${{ github.sha }}
          path: |
            ./target/no-debug-nightly/uv
            ./target/no-debug-nightly/uvx
          retention-days: 1
      - name: Record benchmark evidence
        if: "${{ always() }}"
        env:
          BENCH_CACHE_HIT: "${{ steps.rust-cache.outputs.cache-hit }}"
          BENCH_SAMPLE: "${{ inputs.sample }}"
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def capture(args):
              return subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout.strip()
          metadata = {'variant': 'baseline', 'job': 'build-binary-linux-libc', 'expected_source': 'bf041f9245952ba7c9e3c29aebe0a8acc2bc983d', 'runner_label': 'github-ubuntu-24.04-x86_64-8'}
          metadata.update(sample=os.environ['BENCH_SAMPLE'], source=capture(['git', 'rev-parse', 'HEAD']), cache_hit=os.environ['BENCH_CACHE_HIT'], rustflags=os.environ.get('RUSTFLAGS', ''), rustc_bootstrap=os.environ.get('RUSTC_BOOTSTRAP', ''), rustc=capture(['rustc', '+1.98.0', '-vV']), runner_name=os.environ.get('RUNNER_NAME', ''), cpu=capture(['lscpu']), uname=capture(['uname', '-a']), files=[])
          assert metadata['source'] == metadata['expected_source'], metadata
          for name in ['./target/no-debug-nightly/uv', './target/no-debug-nightly/uvx']:
              path = pathlib.Path(name)
              if path.exists():
                  metadata['files'].append(dict(path=name, bytes=path.stat().st_size, sha256=hashlib.sha256(path.read_bytes()).hexdigest(), elf_comment=capture(['readelf', '-p', '.comment', name])))
          output = pathlib.Path('benchmark-evidence')
          output.mkdir(exist_ok=True)
          (output / 'environment.json').write_text(json.dumps(metadata, indent=2))
          print(json.dumps(metadata, indent=2))
          PY
      - name: Upload benchmark evidence
        if: "${{ always() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-baseline-build-binary-linux-libc
          path: benchmark-evidence/
          if-no-files-found: error
          retention-days: 14
  baseline-build-binary-linux-aarch64:
    name: baseline / linux aarch64
    timeout-minutes: 30
    runs-on: github-ubuntu-24.04-aarch64-4
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Install mold
        run: "./scripts/install-mold.sh"
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          prefix-key: v1-pr19648-20260901
          cache-workspace-crates: "true"
          save-if: "${{ inputs.save-rust-cache == 'true' }}"
          shared-key: baseline-build-binary-linux-aarch64
        id: rust-cache
      - name: Build
        run: cargo build --profile no-debug-nightly -Z checksum-freshness
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-uv-linux-aarch64-${{ github.sha }}
          path: |
            ./target/no-debug-nightly/uv
            ./target/no-debug-nightly/uvx
          retention-days: 1
      - name: Measure three warm uv rebuilds
        if: "${{ inputs.sample == 'warmup' }}"
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, time
          output = pathlib.Path('benchmark-evidence')
          output.mkdir(exist_ok=True)
          samples = []
          for iteration in range(1, 4):
              subprocess.run(['cargo', 'clean', '--package', 'uv', '--profile', 'no-debug-nightly'], check=True)
              started = time.perf_counter()
              subprocess.run(['cargo', 'build', '--profile', 'no-debug-nightly', '-Z', 'checksum-freshness'], check=True)
              seconds = time.perf_counter() - started
              samples.append(dict(iteration=iteration, seconds=seconds))
              print('BENCH_REBUILD_SECONDS', iteration, seconds, flush=True)
          (output / 'warm-rebuilds.json').write_text(json.dumps(samples, indent=2))
          PY
      - name: Record benchmark evidence
        if: "${{ always() }}"
        env:
          BENCH_CACHE_HIT: "${{ steps.rust-cache.outputs.cache-hit }}"
          BENCH_SAMPLE: "${{ inputs.sample }}"
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def capture(args):
              return subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout.strip()
          metadata = {'variant': 'baseline', 'job': 'build-binary-linux-aarch64', 'expected_source': 'bf041f9245952ba7c9e3c29aebe0a8acc2bc983d', 'runner_label': 'github-ubuntu-24.04-aarch64-4'}
          metadata.update(sample=os.environ['BENCH_SAMPLE'], source=capture(['git', 'rev-parse', 'HEAD']), cache_hit=os.environ['BENCH_CACHE_HIT'], rustflags=os.environ.get('RUSTFLAGS', ''), rustc_bootstrap=os.environ.get('RUSTC_BOOTSTRAP', ''), rustc=capture(['rustc', '+1.98.0', '-vV']), runner_name=os.environ.get('RUNNER_NAME', ''), cpu=capture(['lscpu']), uname=capture(['uname', '-a']), files=[])
          assert metadata['source'] == metadata['expected_source'], metadata
          for name in ['./target/no-debug-nightly/uv', './target/no-debug-nightly/uvx']:
              path = pathlib.Path(name)
              if path.exists():
                  metadata['files'].append(dict(path=name, bytes=path.stat().st_size, sha256=hashlib.sha256(path.read_bytes()).hexdigest(), elf_comment=capture(['readelf', '-p', '.comment', name])))
          output = pathlib.Path('benchmark-evidence')
          output.mkdir(exist_ok=True)
          (output / 'environment.json').write_text(json.dumps(metadata, indent=2))
          print(json.dumps(metadata, indent=2))
          PY
      - name: Upload benchmark evidence
        if: "${{ always() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-baseline-build-binary-linux-aarch64
          path: benchmark-evidence/
          if-no-files-found: error
          retention-days: 14
