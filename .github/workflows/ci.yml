name: CI
run-name: Windows workspace cache compression comparison
on: workflow_dispatch
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  measure:
    timeout-minutes: 20
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596

      - name: Setup Dev Drive
        run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1

      # actions/checkout does not let us clone into anywhere outside ${{ github.workspace }}, so we have to copy the clone...
      - name: Copy Git Repo to Dev Drive
        run: |
          Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse

      - name: "Install Rust toolchain"
        working-directory: ${{ env.UV_WORKSPACE }}
        run: rustup toolchain install --profile minimal

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
          prefix-key: v1-rust-workspace
          key: ${{ hashFiles('Cargo.toml') }}
          workspace: ${{ env.UV_WORKSPACE }}
          profile: fast-build-nightly
          # Use the same cache entry across the partitions
          add-job-id-key: false
          save-if: 'false'

      - name: Compare compressed workspaces
        shell: bash
        run: |
          set -euo pipefail
          tarbin="/c/Program Files/Git/usr/bin/tar.exe"
          cd /d
          paths=(uv/target)
          for subdir in .cargo/registry .cargo/git; do
            if test -d "$subdir"; then paths+=("$subdir"); fi
          done
          echo 'PDB files present immediately after the restore'
          find uv/target -iname '*.pdb' -printf '%s %p\n' | sort -nr > "$RUNNER_TEMP/pdb-list.txt"
          head -15 "$RUNNER_TEMP/pdb-list.txt"
          awk '{total += $1; if ($0 ~ /\/build\//) build += $1} END {print "PDB_BYTES",total,"BUILD_PDB_BYTES",build,"COUNT",NR}' "$RUNNER_TEMP/pdb-list.txt"
          for mode in default level6 level10 long no_pdb build_pdb; do
            args=()
            flags=(-3 -T0)
            case "$mode" in
              level6) flags=(-6 -T0);;
              level10) flags=(-10 -T0);;
              long) flags=(-3 -T0 --long=27);;
              no_pdb) args+=("--exclude=*.pdb");;
              build_pdb) args+=("--exclude=*/build/*/*.pdb");;
            esac
            archive="$RUNNER_TEMP/cache-$mode.zst"
            start=$(date +%s%3N)
            "$tarbin" --posix -cf - "${args[@]}" "${paths[@]}" | zstd -q "${flags[@]}" -o "$archive"
            saved=$(date +%s%3N)
            zstd -dc "$archive" > /dev/null
            readback=$(date +%s%3N)
            echo "ARCHIVE_METRIC $mode $(stat -c '%s' "$archive") $((saved-start)) $((readback-saved))"
            rm -- "$archive"
          done
