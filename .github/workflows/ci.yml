name: Inspect Linux core capture with an owned probe

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Exact diagnostic commit to execute
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture-owned-core:
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Capture one owned native fault
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          python3 -B scripts/run_owned_native_crash.py \
            --workspace "$GITHUB_WORKSPACE" \
            --state "$RUNNER_TEMP/owned-native-capture" \
            --expected-revision "$EXPECTED_SHA"

      - name: Upload owned probe observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-native-capture
          path: ${{ runner.temp }}/owned-native-capture/export/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload the build-ID-matched probe executable
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-native-capture-executable
          path: ${{ runner.temp }}/owned-native-capture/collector/executable/uv
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
