          n' \\\n  'Acquire::Retries \"0\";' \\\n  'Acquire::http::Timeout \"10\";' \\\n  'Acquire::https::Timeout \"10\";'\
          \ \\\n  | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null\n# Use Ubuntu's Git and matching libcurl to avoid credential\
          \ failures in private-repository tests.\nsudo apt install -y --no-install-recommends --allow-downgrades \\\n  git/noble-updates\
          \ git-man/noble-updates libcurl3t64-gnutls/noble-updates gnome-keyring\n"
      - name: Start gnome-keyring
        run: gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
      - name: Create btrfs filesystem
        run: 'sudo apt install -y btrfs-progs

          truncate -s 1G /tmp/btrfs.img

          mkfs.btrfs /tmp/btrfs.img

          sudo mkdir /btrfs

          sudo mount -o loop /tmp/btrfs.img /btrfs

          sudo chown "$(id -u):$(id -g)" /btrfs

          '
      - name: Create tmpfs filesystem
        run: 'sudo mkdir /tmpfs

          sudo mount -t tmpfs -o size=256m tmpfs /tmpfs

          sudo chown "$(id -u):$(id -g)" /tmpfs

          '
      - name: Create minix filesystem (low hardlink limit)
        run: 'truncate -s 16M /tmp/minix.img

          mkfs.minix /tmp/minix.img

          sudo mkdir /minix

          sudo mount -o loop /tmp/minix.img /minix

          sudo chown "$(id -u):$(id -g)" /minix

          '
      - name: Cargo test
        env:
          UV_HTTP_RETRIES: 5
          RUST_BACKTRACE: 1
          UV_INTERNAL__TEST_COW_FS: /btrfs
          UV_INTERNAL__TEST_NOCOW_FS: /tmpfs
          UV_INTERNAL__TEST_ALT_FS: /tmpfs
          UV_INTERNAL__TEST_LOWLINKS_FS: /minix
          INSTA_UPDATE: new
          INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        run:
          "uv run --only-group test cargo nextest run --locked \\\n  --cargo-profile fast-build-nightly \\\n  -Z panic-abort-tests\
          \ \\\n  -Z checksum-freshness \\\n  --features test-python-patch,test-universal,native-auth,secret-service \\\n  --workspace\
          \ \\\n  --profile ci-linux\n"
      - name: Upload pending snapshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pending-snapshots-linux-mtimes
          path: pending-snapshots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: junit-results-linux-mtimes
          path: target/nextest/ci*/junit.xml
          if-no-files-found: ignore
          retention-days: 14
    if: ${{ inputs.suite == 'all' || inputs.suite == 'linux' }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      PYTHON_VERSION: "3.12"
      RUSTC_BOOTSTRAP: 1
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1
  dev-workspace:
    name: Development binary / workspace
    timeout-minutes: 10
    runs-on: github-ubuntu-24.04-x86_64-8
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_INTERNAL__BUILD_GIT_INFO: 1
      UV_LOCKED: 1
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install mold
        run: ./scripts/install-mold.sh
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        with:
