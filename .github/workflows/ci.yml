---
name: Paired bundled LLD comparison
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64:
    name: paired / aarch64
    runs-on: github-ubuntu-24.04-aarch64-4
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
      BENCH_PLATFORM: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Install mold
        run: "./scripts/install-mold.sh"
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Run paired warm rebuilds
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          PLATFORM = os.environ['BENCH_PLATFORM']
          TARGET = 'x86_64-unknown-linux-musl' if PLATFORM == 'musl' else None
          SOURCE = 'bf041f9245952ba7c9e3c29aebe0a8acc2bc983d'
          OUT = Path('benchmark-evidence')
          OUT.mkdir(exist_ok=True)
          FLAGS = '-Z unstable-options -C linker-features=+lld -C link-self-contained=+linker'


          def capture(args):
              return subprocess.check_output(args, text=True).strip()


          def environment(variant):
              env = os.environ.copy()
              env['CARGO_TARGET_DIR'] = str(Path('target-paired', variant).resolve())
              env['CARGO_TERM_COLOR'] = 'never'
              env.pop('RUSTFLAGS', None)
              if variant == 'lld':
                  env['RUSTFLAGS'] = FLAGS
              return env


          def build(variant, label):
              command = ['cargo', 'build', '--profile', 'no-debug-nightly', '-Z', 'checksum-freshness']
              if TARGET:
                  command += ['--target', TARGET, '--bin', 'uv', '--bin', 'uvx']
              print('Starting', label, variant, flush=True)
              with (OUT / f'{label}-{variant}.log').open('w') as output:
                  start = time.perf_counter()
                  result = subprocess.run(command, env=environment(variant), stdout=output, stderr=subprocess.STDOUT)
                  duration = time.perf_counter() - start
              if result.returncode:
                  print((OUT / f'{label}-{variant}.log').read_text()[-12000:], flush=True)
                  result.check_returncode()
              print('BENCH_SECONDS', label, variant, duration, flush=True)
              return duration


          def binaries(variant):
              target = Path('target-paired', variant)
              if TARGET:
                  target /= TARGET
              records = []
              for name in ('uv', 'uvx'):
                  path = target / 'no-debug-nightly' / name
                  marker = capture(['readelf', '-p', '.comment', str(path)])
                  if variant == 'baseline':
                      assert 'mold' in marker, marker
                  else:
                      assert 'Linker: LLD' in marker and 'mold' not in marker, marker
                  records.append({'name': name, 'bytes': path.stat().st_size,
                                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                                  'elf_comment': marker})
              return records


          assert capture(['git', 'rev-parse', 'HEAD']) == SOURCE
          results = {'source': SOURCE, 'platform': PLATFORM, 'cpu': capture(['lscpu']),
                     'rustc': capture(['rustc', '-vV']), 'runner_name': os.environ['RUNNER_NAME'],
                     'command_target': TARGET, 'warmups': {}, 'samples': [], 'binaries': {}}
          for variant in ('baseline', 'lld'):
              results['warmups'][variant] = build(variant, 'warmup')
              binaries(variant)

          # Balance both variants across early and late positions on the same machine.
          order = ['baseline', 'lld', 'lld', 'baseline', 'lld', 'baseline', 'baseline', 'lld']
          for index, variant in enumerate(order, 1):
              command = ['cargo', 'clean', '--package', 'uv', '--profile', 'no-debug-nightly']
              if TARGET:
                  command += ['--target', TARGET]
              subprocess.run(command, env=environment(variant), check=True)
              duration = build(variant, f'measured-{index}')
              results['samples'].append({'index': index, 'variant': variant, 'seconds': duration})
              (OUT / 'paired-results.json').write_text(json.dumps(results, indent=2))
          for variant in ('baseline', 'lld'):
              results['binaries'][variant] = binaries(variant)
          (OUT / 'paired-results.json').write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2), flush=True)
          PY
      - name: Upload paired benchmark evidence
        if: "${{ always() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paired-aarch64
          path: benchmark-evidence/
          retention-days: 14
          if-no-files-found: error
  musl:
    name: paired / musl
    runs-on: github-ubuntu-24.04-x86_64-8
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      RUSTC_BOOTSTRAP: 1
      BENCH_PLATFORM: musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: astral-sh/uv
          ref: bf041f9245952ba7c9e3c29aebe0a8acc2bc983d
      - name: Install mold
        run: "./scripts/install-mold.sh"
      - name: Setup musl
        run: sudo apt-get install musl-tools
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add x86_64-unknown-linux-musl
      - name: Run paired warm rebuilds
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          PLATFORM = os.environ['BENCH_PLATFORM']
          TARGET = 'x86_64-unknown-linux-musl' if PLATFORM == 'musl' else None
          SOURCE = 'bf041f9245952ba7c9e3c29aebe0a8acc2bc983d'
          OUT = Path('benchmark-evidence')
          OUT.mkdir(exist_ok=True)
          FLAGS = '-Z unstable-options -C linker-features=+lld -C link-self-contained=+linker'


          def capture(args):
              return subprocess.check_output(args, text=True).strip()


          def environment(variant):
              env = os.environ.copy()
              env['CARGO_TARGET_DIR'] = str(Path('target-paired', variant).resolve())
              env['CARGO_TERM_COLOR'] = 'never'
              env.pop('RUSTFLAGS', None)
              if variant == 'lld':
                  env['RUSTFLAGS'] = FLAGS
              return env


          def build(variant, label):
              command = ['cargo', 'build', '--profile', 'no-debug-nightly', '-Z', 'checksum-freshness']
              if TARGET:
                  command += ['--target', TARGET, '--bin', 'uv', '--bin', 'uvx']
              print('Starting', label, variant, flush=True)
              with (OUT / f'{label}-{variant}.log').open('w') as output:
                  start = time.perf_counter()
                  result = subprocess.run(command, env=environment(variant), stdout=output, stderr=subprocess.STDOUT)
                  duration = time.perf_counter() - start
              if result.returncode:
                  print((OUT / f'{label}-{variant}.log').read_text()[-12000:], flush=True)
                  result.check_returncode()
              print('BENCH_SECONDS', label, variant, duration, flush=True)
              return duration


          def binaries(variant):
              target = Path('target-paired', variant)
              if TARGET:
                  target /= TARGET
              records = []
              for name in ('uv', 'uvx'):
                  path = target / 'no-debug-nightly' / name
                  marker = capture(['readelf', '-p', '.comment', str(path)])
                  if variant == 'baseline':
                      assert 'mold' in marker, marker
                  else:
                      assert 'Linker: LLD' in marker and 'mold' not in marker, marker
                  records.append({'name': name, 'bytes': path.stat().st_size,
                                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                                  'elf_comment': marker})
              return records


          assert capture(['git', 'rev-parse', 'HEAD']) == SOURCE
          results = {'source': SOURCE, 'platform': PLATFORM, 'cpu': capture(['lscpu']),
                     'rustc': capture(['rustc', '-vV']), 'runner_name': os.environ['RUNNER_NAME'],
                     'command_target': TARGET, 'warmups': {}, 'samples': [], 'binaries': {}}
          for variant in ('baseline', 'lld'):
              results['warmups'][variant] = build(variant, 'warmup')
              binaries(variant)

          # Balance both variants across early and late positions on the same machine.
          order = ['baseline', 'lld', 'lld', 'baseline', 'lld', 'baseline', 'baseline', 'lld']
          for index, variant in enumerate(order, 1):
              command = ['cargo', 'clean', '--package', 'uv', '--profile', 'no-debug-nightly']
              if TARGET:
                  command += ['--target', TARGET]
              subprocess.run(command, env=environment(variant), check=True)
              duration = build(variant, f'measured-{index}')
              results['samples'].append({'index': index, 'variant': variant, 'seconds': duration})
              (OUT / 'paired-results.json').write_text(json.dumps(results, indent=2))
          for variant in ('baseline', 'lld'):
              results['binaries'][variant] = binaries(variant)
          (OUT / 'paired-results.json').write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2), flush=True)
          PY
      - name: Upload paired benchmark evidence
        if: "${{ always() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paired-musl
          path: benchmark-evidence/
          retention-days: 14
          if-no-files-found: error
