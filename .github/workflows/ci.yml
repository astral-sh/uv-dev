name: Compare Windows Rust cache actions
run-name: ${{ inputs.phase }} / ${{ inputs.suite }}
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - seed
        - warm
        - diagnostic
        default: warm
        required: true
      suite:
        type: string
        default: all
        required: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: '3.12'
  RUSTC_BOOTSTRAP: 1
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1
jobs:
  windows-1-before:
    timeout-minutes: 15
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    name: windows-1 / before
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
    - name: Setup Dev Drive
      run: ${{ github.workspace }}/.github/workflows/setup-dev-drive.ps1
    - name: Copy Git Repo to Dev Drive
      run: |
        Copy-Item -Path "${{ github.workspace }}" -Destination "$Env:UV_WORKSPACE" -Recurse
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.5
        checksum: a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a
    - name: Install required Python versions
      env:
        UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
      run: uv python install
    - name: Install Rust toolchain
      working-directory: ${{ env.UV_WORKSPACE }}
      run: rustup toolchain install --profile minimal
    - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
      with:
        prefix-key: uv-windows-native-20261024-v1-before
        key: ${{ hashFiles('Cargo.toml') }}
        workspace: ${{ env.UV_WORKSPACE }}
        profile: fast-build-nightly
        add-job-id-key: false
        save-if: ${{ inputs.phase == 'seed' }}
      id: rust-cache
      name: Restore Rust cache
    - name: Require an exact Rust cache hit
      if: ${{ inputs.phase != 'seed' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      run: test "${CACHE_HIT:-false}" = "true"
    - name: Create NTFS test directory (low hardlink limit)
      run: New-Item -Path "C:\uv" -ItemType Directory -Force
    - name: Create SMB test share (alternative filesystem)
      run: |
        New-Item -Path "C:\uv-smb" -ItemType Directory -Force
        New-SmbShare -Name "uv-alt-fs" -Path "C:\uv-smb" -FullAccess "Everyone"
    - name: Cargo test
      working-directory: ${{ env.UV_WORKSPACE }}
      env:
        UV_HTTP_RETRIES: 5
        UV_LINK_MODE: copy
        RUST_BACKTRACE: 1
        UV_INTERNAL__TEST_ALT_FS: \\localhost\uv-alt-fs
        UV_INTERNAL__TEST_SMB_FS: \\localhost\uv-alt-fs
        UV_INTERNAL__TEST_LOWLINKS_FS: C:\uv
        INSTA_UPDATE: new
        INSTA_PENDING_DIR: ${{ github.workspace }}/pending-snapshots
        CARGO_LOG: ${{ inputs.phase == 'diagnostic' && 'cargo::core::compiler::fingerprint=trace,cargo::compiler::fingerprint=trace'
          || '' }}
      shell: bash
      run: |
        uv run --only-group test cargo nextest run --locked \
          --cargo-profile fast-build-nightly \
          -Z panic-abort-tests \
          -Z checksum-freshness \
          --no-default-features \
          --features test-python,test-pypi,test-python-managed,test-windows-registry,native-auth,windows-native \
          --workspace \
          --profile ci-windows \
          --partition hash:1/3
    - name: Upload pending snapshots
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pending-snapshots-windows-1-before
        path: pending-snapshots/
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 14
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: junit-results-windows-1-before
        path: ${{ env.UV_WORKSPACE }}/target/nextest/ci*/junit.xml
        if-no-files-found: ignore
        retention-days: 14
    if: ${{ (inputs.suite == 'all' || inputs.suite == 'windows-1') && inputs.phase != 'seed' }}
  windows-1-after:
