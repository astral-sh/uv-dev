  macos-tests-before:
    timeout-minutes: 20
    if: ${{ inputs.suite == 'all' || inputs.suite == 'macos-tests' }}
    runs-on: namespace-profile-macos-15
    name: macos-tests / before
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 6fe4f0f5cfa8322e97af4479cbfb3d53a3ce9596
