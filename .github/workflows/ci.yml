        run: cargo build --locked --profile no-debug-nightly -Z checksum-freshness
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-linux-libc-${{ github.sha }}-workspace
          path: "./target/no-debug-nightly/uv

            ./target/no-debug-nightly/uvx

            "
          retention-days: 1
    if: ${{ inputs.suite == 'all' || inputs.suite == 'dev' }}
