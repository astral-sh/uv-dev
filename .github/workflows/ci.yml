        disks = [line.split() for line in Path('/proc/diskstats').read_text().splitlines() if re.fullmatch(r'(nvme[0-9]+n[0-9]+|[sv]d[a-z]+)', line.split()[2])]
        print('IO probe: ' + json.dumps({'point': os.environ['PROBE_POINT'], 'monotonic': time.monotonic(), 'memory': memory, 'vm': vm, 'disks': disks, 'pressure': Path('/proc/pressure/io').read_text(), 'workspace_device': os.stat(os.environ['GITHUB_WORKSPACE']).st_dev, 'cargo_device': os.stat(Path.home() / '.cargo').st_dev}))
