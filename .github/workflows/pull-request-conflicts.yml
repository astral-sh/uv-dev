name: Rebase conflicted pull requests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The pull request number to rebase"
        required: false
        type: string
      head_sha:
        description: "The expected pull request head SHA"
        required: false
        type: string
      base_previous_ref:
        description: "The previous base branch of a retargeted pull request"
        required: false
        type: string
      base_previous_sha:
        description: "The previous base SHA from the signed base-change event"
        required: false
        type: string

permissions: {}

concurrency:
  group: pull-request-conflicts-${{ inputs.pull_request || 'main' }}
  # Let an in-progress rebase finish; newer pushes replace the single pending run.
  cancel-in-progress: false

env:
  UV_LOCKED: 1

jobs:
  identify:
    name: Identify conflicted pull requests
    if: github.repository == 'astral-sh/uv-dev' || github.repository == 'astral-sh/uv'
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.identify.outputs.matrix }}
      rebasable: ${{ steps.identify.outputs.rebasable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.14"
          enable-cache: false

      - name: Identify conflicted pull requests
        id: identify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          BASE_PREVIOUS_REF: ${{ inputs.base_previous_ref }}
          BASE_PREVIOUS_SHA: ${{ inputs.base_previous_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: |
          uv run --project scripts/automations --locked --no-dev \
            uv-automations pull-requests identify \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --previous-base-ref "$BASE_PREVIOUS_REF" \
            --previous-base-sha "$BASE_PREVIOUS_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  rebase-and-push:
    name: "Rebase pull request #${{ matrix.number }}"
    needs: identify
    if: needs.identify.outputs.rebasable != '0'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.identify.outputs.matrix) }}
    uses: $/.github/workflows/rebase-conflicted-pull-request.yml
    secrets: inherit
    with:
      number: ${{ matrix.number }}
      base-ref: ${{ matrix.base_ref }}
      base-previous-sha: ${{ matrix.base_previous_sha }}
      head-ref: ${{ matrix.head_ref }}
      head-sha: ${{ matrix.head_sha }}
      head-repository: ${{ matrix.head_repository }}

  remove-rebase-label:
    name: "Remove rebase label from pull request #${{ inputs.pull_request }}"
    needs: rebase-and-push
    if: inputs.pull_request != ''
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.14"
          enable-cache: false

      - name: Remove rebase label
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: |
          uv run --project scripts/automations --locked --no-dev \
            uv-automations pull-requests remove-rebase-label \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "$PULL_REQUEST_NUMBER"
