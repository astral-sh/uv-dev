name: Rebase conflicted pull requests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The pull request number to rebase"
        required: false
        type: string
      head_sha:
        description: "The expected pull request head SHA"
        required: false
        type: string
      base_ref:
        description: "The updated uv-dev base ref whose stacked pull requests should be rebased"
        required: false
        type: string
      base_sha:
        description: "The expected updated uv-dev base SHA"
        required: false
        type: string
      base_previous_ref:
        description: "The previous base branch of a retargeted pull request"
        required: false
        type: string
      base_previous_sha:
        description: "The previous uv-dev base SHA from the dispatch event"
        required: false
        type: string

permissions: {}

concurrency:
  group: pull-request-conflicts-${{ inputs.pull_request || inputs.base_ref || 'main' }}
  # Let an in-progress rebase finish; newer pushes replace the single pending run.
  cancel-in-progress: false

jobs:
  identify:
    name: Identify pull requests to rebase
    if: github.repository == 'astral-sh/uv-dev' || github.repository == 'astral-sh/uv'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.identify.outputs.matrix }}
      rebasable: ${{ steps.identify.outputs.rebasable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify pull requests to rebase
        id: identify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
          BASE_PREVIOUS_REF: ${{ inputs.base_previous_ref }}
          BASE_PREVIOUS_SHA: ${{ inputs.base_previous_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: |
          if [ -n "$PULL_REQUEST_NUMBER" ]; then
            if [ -n "$BASE_REF" ] || [ -n "$EXPECTED_BASE_SHA" ] || ! [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]] || ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The dispatched pull request context is invalid." >&2
              exit 1
            fi

            pull_request=$(gh api "repos/$GH_REPO/pulls/$PULL_REQUEST_NUMBER")
            if ! jq --exit-status \
              --arg repository "$GH_REPO" \
              --argjson repository_id "$GITHUB_REPOSITORY_ID" \
              --arg head_sha "$EXPECTED_HEAD_SHA" \
              '.state == "open" and .base.repo.full_name == $repository and .base.repo.id == $repository_id and .head.repo.full_name == $repository and .head.repo.id == $repository_id and .head.sha == $head_sha' \
              <<< "$pull_request" > /dev/null; then
              echo "The pull request is no longer open at the expected head; refusing to rebase it." >&2
              exit 1
            fi

            base_previous_sha=''
            if [ -n "$BASE_PREVIOUS_REF" ] || [ -n "$BASE_PREVIOUS_SHA" ]; then
              if [[ "$GH_REPO" != "astral-sh/uv-dev" ]] || ! git check-ref-format "refs/heads/$BASE_PREVIOUS_REF" || ! [[ "$BASE_PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "The previous pull request base is invalid." >&2
                exit 1
              fi
              if [ "$BASE_PREVIOUS_REF" != main ]; then
                base_previous_sha="$BASE_PREVIOUS_SHA"
              fi
            fi

            pull_requests=$(
              jq --compact-output \
                --arg base_previous_sha "$base_previous_sha" \
                '[{number, url: .html_url, base_ref: .base.ref, base_previous_sha: $base_previous_sha, head_ref: .head.ref, head_sha: .head.sha, head_repository: .head.repo.full_name}]' \
                <<< "$pull_request"
            )
          elif [ -n "$BASE_REF" ]; then
            if [[ "$GH_REPO" != "astral-sh/uv-dev" ]] || [ -n "$EXPECTED_HEAD_SHA" ] || [ -n "$BASE_PREVIOUS_REF" ] || [[ "$BASE_REF" != refs/heads/* ]] || ! git check-ref-format "$BASE_REF" || ! [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$BASE_PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The dispatched base context is invalid." >&2
              exit 1
            fi

            current_base=$(git ls-remote --exit-code --refs https://github.com/astral-sh/uv-dev.git "$BASE_REF" | cut -f1)
            if [ "$current_base" != "$EXPECTED_BASE_SHA" ]; then
              echo "The uv-dev base changed after the push; skipping the stale stack rebase." >&2
              pull_requests='[]'
            else
              base_branch=${BASE_REF#refs/heads/}
              stacked_pull_requests=$(gh pr list --base "$base_branch" --state open --limit 1000 --json number,url,baseRefName,headRefName,headRefOid,headRepository)
              pull_requests=$(jq --compact-output --arg base_ref "$base_branch" --arg base_previous_sha "$BASE_PREVIOUS_SHA" '[.[] | select(.baseRefName == $base_ref) | {number, url, base_ref: .baseRefName, base_previous_sha: $base_previous_sha, head_ref: .headRefName, head_sha: .headRefOid, head_repository: (.headRepository.nameWithOwner // "")}]' <<< "$stacked_pull_requests")
            fi
          elif [ -n "$EXPECTED_HEAD_SHA" ] || [ -n "$EXPECTED_BASE_SHA" ] || [ -n "$BASE_PREVIOUS_REF" ] || [ -n "$BASE_PREVIOUS_SHA" ]; then
            echo "The dispatched rebase context is incomplete." >&2
            exit 1
          elif [[ "$GH_REPO" == "astral-sh/uv" ]]; then
            pull_requests=$(./scripts/find-conflicted-pull-requests.sh --author app/astral-automations-bot)
          else
            pull_requests=$(./scripts/find-conflicted-pull-requests.sh)
          fi

          pull_request_count=$(jq 'length' <<< "$pull_requests")
          rebasable_pull_requests=$(
            jq --compact-output \
              --arg repository "$GH_REPO" \
              '[.[] | select(.head_repository == $repository or .head_repository == "astral-sh/uv-dev")]' \
              <<< "$pull_requests"
          )
          rebasable=$(jq 'length' <<< "$rebasable_pull_requests")
          unavailable=$(( pull_request_count - rebasable ))

          if (( rebasable > 256 )); then
            echo "Found $rebasable rebasable pull requests, which exceeds the GitHub Actions matrix limit of 256." >&2
            exit 1
          fi

          matrix=$(jq --compact-output '{include: [.[] | {number, base_ref, base_previous_sha: (.base_previous_sha // ""), head_ref, head_sha, head_repository}]}' <<< "$rebasable_pull_requests")
          {
            echo "matrix=$matrix"
            echo "rebasable=$rebasable"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Pull requests to rebase"
            echo
            echo "Found $pull_request_count pull requests to rebase."

            if (( unavailable > 0 )); then
              echo
              echo "Skipping $unavailable pull requests whose heads cannot be updated by the rebase app token."
            fi

            if (( pull_request_count > 0 )); then
              echo
              jq --raw-output '.[] | "- \(.url)"' <<< "$pull_requests"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  retarget-promoted-stacks:
    name: Retarget merged promoted pull request stacks
    needs: identify
    if: github.repository == 'astral-sh/uv-dev' && github.event_name == 'push'
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Get upstream pull request token
        id: upstream-token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv
          permissions: |
            pull_requests: read

      - name: Retarget merged promoted pull request stacks
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TOKEN: ${{ steps.upstream-token.outputs.token }}
        run: |
          open_pull_requests=$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1000 \
              --json number,baseRefName,baseRefOid,headRefName,headRefOid,headRepository
          )
          orphaned_stacks=$(
            jq --compact-output '
              . as $pull_requests
              | [
                  .[]
                  | select(.baseRefName != "main")
                  | select(.headRepository.nameWithOwner == "astral-sh/uv-dev")
                  | select(.baseRefName as $base_ref | all($pull_requests[]; .headRefName != $base_ref))
                ]
              | group_by([.baseRefName, .baseRefOid])[]
            ' <<< "$open_pull_requests"
          )

          while IFS= read -r stack; do
            [ -n "$stack" ] || continue
            base_ref=$(jq --raw-output '.[0].baseRefName' <<< "$stack")
            base_sha=$(jq --raw-output '.[0].baseRefOid' <<< "$stack")
            parent_pull_requests=$(
              GH_TOKEN="$UPSTREAM_TOKEN" gh pr list \
                --repo astral-sh/uv \
                --state merged \
                --head "$base_ref" \
                --limit 2 \
                --json baseRefName,headRefName,headRefOid,headRepository
            )
            if ! jq --exit-status \
              --arg base_ref "$base_ref" \
              --arg base_sha "$base_sha" \
              'length == 1 and .[0].headRefName == $base_ref and .[0].headRefOid == $base_sha and .[0].headRepository.nameWithOwner == "astral-sh/uv"' \
              <<< "$parent_pull_requests" > /dev/null; then
              continue
            fi

            parent_base_ref=$(jq --raw-output '.[0].baseRefName' <<< "$parent_pull_requests")
            git check-ref-format "refs/heads/$parent_base_ref"

            while IFS= read -r pull_request; do
              number=$(jq --raw-output '.number' <<< "$pull_request")
              current_pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
              if ! jq --exit-status \
                --arg base_ref "$base_ref" \
                --arg base_sha "$base_sha" \
                --arg head_ref "$(jq --raw-output '.headRefName' <<< "$pull_request")" \
                --arg head_sha "$(jq --raw-output '.headRefOid' <<< "$pull_request")" \
                --argjson repository_id "$GITHUB_REPOSITORY_ID" \
                '.state == "open" and .base.ref == $base_ref and .base.sha == $base_sha and .head.ref == $head_ref and .head.sha == $head_sha and .base.repo.id == $repository_id and .head.repo.id == $repository_id' \
                <<< "$current_pull_request" > /dev/null; then
                echo "Pull request #$number changed before its merged parent could be retargeted; skipping it." >&2
                continue
              fi

              gh api \
                --method PATCH \
                "repos/$GITHUB_REPOSITORY/pulls/$number" \
                --raw-field base="$parent_base_ref" \
                --silent
              echo "Retargeted pull request #$number from its merged parent to $parent_base_ref." >> "$GITHUB_STEP_SUMMARY"
            done < <(jq --compact-output '.[]' <<< "$stack")
          done <<< "$orphaned_stacks"

  rebase-and-push:
    name: "Rebase pull request #${{ matrix.number }}"
    needs: identify
    if: needs.identify.outputs.rebasable != '0'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.identify.outputs.matrix) }}
    uses: $/.github/workflows/rebase-conflicted-pull-request.yml
    secrets: inherit
    with:
      number: ${{ matrix.number }}
      base-ref: ${{ matrix.base_ref }}
      base-previous-sha: ${{ matrix.base_previous_sha }}
      head-ref: ${{ matrix.head_ref }}
      head-sha: ${{ matrix.head_sha }}
      head-repository: ${{ matrix.head_repository }}

  remove-rebase-label:
    name: "Remove rebase label from pull request #${{ inputs.pull_request }}"
    needs: rebase-and-push
    if: inputs.pull_request != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove rebase label
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: |
          rebase_requested=$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER" \
              --jq '.labels | any(.name == "bot:rebase")'
          )
          if [[ "$rebase_requested" == "true" ]]; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels/bot%3Arebase" \
              --silent
          fi
