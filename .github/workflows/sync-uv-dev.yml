name: Sync uv-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-uv-dev-main
  cancel-in-progress: false

env:
  UV_LOCKED: 1

jobs:
  sync:
    name: Sync uv-dev
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-slim
    environment: automations
    permissions:
      id-token: write # for the credential broker
    outputs:
      main_sha: ${{ steps.sync.outputs.main_sha }}
    steps:
      - name: Get uv-dev token
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv-dev
          # Workflow permission is required to sync changes to `.github/workflows`.
          permissions: |
            contents: write
            workflows: write

      - name: Sync main
        id: sync
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api \
            --method POST \
            repos/astral-sh/uv-dev/merge-upstream \
            --field branch=main

          main_sha=$(gh api repos/astral-sh/uv-dev/git/ref/heads/main --jq .object.sha)
          if ! [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The synced uv-dev main ref is invalid." >&2
            exit 1
          fi
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

  retarget-promoted-pull-request-children:
    name: Retarget children of promoted pull requests
    needs: sync
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/retarget-promoted-pull-request-children.yml
    with:
      repository: astral-sh/uv-dev
      repository-id: "1302176231"
      main-sha: ${{ needs.sync.outputs.main_sha }}
    secrets: inherit
