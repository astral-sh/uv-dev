# Bump the uv version and create a pull request.
name: "Prepare release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to set (overrides detection)"
        required: false
        type: string

permissions: {}

jobs:
  prepare-release:
    if: github.repository == 'astral-sh/uv'
    runs-on: ubuntu-latest
    environment: automations
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: false

      - name: "Configure Git"
        run: |
          git config user.name "astral-automations-bot[bot]"
          git config user.email "305554984+astral-automations-bot[bot]@users.noreply.github.com"

      - name: "Bump version"
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ./scripts/release.sh --version "$INPUT_VERSION"
          else
            ./scripts/release.sh
          fi
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: "Prepare Codex prompt"
        run: |
          {
            printf 'Release preparation for %s: Rewrite changelog\n\n' "$(uv version --short)"
            cat agents/prompts/editorialize-changelog.md
          } > "$RUNNER_TEMP/editorialize-changelog-prompt.md"

      - name: "Rewrite changelog"
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.146.0"
          model: gpt-5.6-sol
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: "${{ runner.temp }}/editorialize-changelog-prompt.md"
          output-file: "${{ runner.temp }}/changelog-section.md"

      - name: "Upload Codex thread"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-release-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.codex/sessions
          if-no-files-found: warn

      - name: "Apply changelog rewrite"
        run: |
          uv run scripts/update-latest-changelog-section.py \
            CHANGELOG.md \
            "$RUNNER_TEMP/changelog-section.md"

      - name: "Commit changelog rewrite"
        run: |
          git diff --check -- CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md && git diff --cached --quiet -- CHANGELOG.md; then
            echo "Codex left the generated changelog unchanged."
          else
            git -c core.hooksPath=/dev/null commit --only --message "Rewrite changelog" -- CHANGELOG.md
          fi

      - name: "Bundle prepared release"
        run: |
          branch="$(git branch --show-current)"
          git bundle create \
            "$RUNNER_TEMP/release.bundle" \
            "refs/remotes/origin/main..refs/heads/$branch"

      - name: "Upload prepared release"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  create-pull-request:
    needs: prepare-release
    runs-on: ubuntu-slim
    environment: automations
    permissions:
      contents: read
      id-token: write # for the credential broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Download prepared release"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared-release

      - name: "Import prepared release"
        id: import
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          bundle="$RUNNER_TEMP/prepared-release/release.bundle"
          git bundle verify "$bundle"

          heads="$(git bundle list-heads "$bundle")"
          if [ -z "$heads" ] || [ "$(printf '%s\n' "$heads" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one release ref in the bundle; refusing to push." >&2
            exit 1
          fi
          read -r prepared_head prepared_ref <<< "$heads"
          case "$prepared_ref" in
            refs/heads/release/*) ;;
            *)
              echo "Expected a release ref in the bundle; refusing to push $prepared_ref." >&2
              exit 1
              ;;
          esac
          git check-ref-format "$prepared_ref"

          git -c core.hooksPath=/dev/null fetch --no-tags "$bundle" "$prepared_ref"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$prepared_head"
          git merge-base --is-ancestor refs/remotes/origin/main "$prepared_head"
          git update-ref "$prepared_ref" "$prepared_head"

          echo "head_sha=$prepared_head" >> "$GITHUB_OUTPUT"
          echo "branch=${prepared_ref#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: "Get uv token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv
          permissions: |
            contents: write
            pull_requests: write

      - name: "Create or update pull request"
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PREPARED_HEAD: ${{ steps.import.outputs.head_sha }}
          RELEASE_BRANCH: ${{ steps.import.outputs.branch }}
        run: |
          git -c core.hooksPath=/dev/null push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${PREPARED_HEAD}:refs/heads/$RELEASE_BRANCH"

          pull_request="$(
            gh pr list \
              --base main \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [ -n "$pull_request" ]; then
            printf '%s\n' "$pull_request"
          else
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --fill-first
          fi
