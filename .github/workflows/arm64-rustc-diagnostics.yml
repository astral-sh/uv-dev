name: ARM64 rustc diagnostics

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Diagnostic workload
        type: choice
        default: baseline
        options:
          - baseline
          - gnu-repeat
          - docker-repeat
          - docker-overlap
          - docker-memory
          - docker-memory-proof
          - gnu-fix
          - gnu-memory-proof
      depot-project-id:
        description: Dedicated Depot project for the Docker overlap test
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: arm64-rustc-diagnostics-${{ github.ref }}-${{ startsWith(inputs.suite, 'docker-') && 'docker' || inputs.suite }}
  cancel-in-progress: false

env:
  ACTIONS_CACHE_MODE: none
  AWS_LC_SYS_USE_SYSTEM: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"
  PYTHON_VERSION: "3.11"

jobs:
  gnu-pgo:
    if: ${{ inputs.suite == 'baseline' || inputs.suite == 'gnu-repeat' }}
    # Compiler failures are diagnostic results and must not trigger automatic CI retries.
    continue-on-error: true
    name: GNU PGO / ${{ matrix.source.name }} / ${{ matrix.machine.name }} / ${{ matrix.sample }}
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.suite == 'gnu-repeat' && '[{"name":"serc","sha":"b32d002194218e5dbd6a855790f0e7b825318384"}]' || '[{"name":"parent","sha":"06fdf0cdb591adae479feb5b769b0213eabb229c"},{"name":"serc","sha":"b32d002194218e5dbd6a855790f0e7b825318384"}]') }}
        sample: ${{ fromJSON(inputs.suite == 'gnu-repeat' && '[1,2,3,4,5]' || '[1]') }}
        machine:
          - name: 32gb
            runner: depot-ubuntu-24.04-arm-8
          - name: 64gb
            runner: depot-ubuntu-24.04-arm-16
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO: ${{ github.workspace }}/source/scripts/cargo.sh
    steps:
      - name: Check out diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostics
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/arm64-rustc-diagnostics.py
            /scripts/ci/arm64-rustc-wrapper.sh

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/uv
          ref: ${{ matrix.source.sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Record runner resources
        env:
          EXPECTED_SOURCE: ${{ matrix.source.sha }}
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p diagnostics/bin results "$HOME/code/tmp/uv-ci-2124"
          cp "$UV_PATH" diagnostics/bin/uv
          chmod +x diagnostics/scripts/ci/arm64-rustc-wrapper.sh
          echo "TMPDIR=$HOME/code/tmp/uv-ci-2124" >> "$GITHUB_ENV"
          { git -C source rev-parse HEAD; git -C source rev-parse 'HEAD^{tree}'; uname -sr; lscpu; free -b; swapon --show; } > results/machine.txt
          sudo -n dmesg -T | tee results/kernel-before.log > /dev/null || true
          uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py snapshot > results/host-before.json
          uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py monitor "$PWD/results/host-memory.jsonl" "$PWD/results/stop" < /dev/null > results/monitor.log 2>&1 &
          echo "$!" > results/monitor.pid

      - name: Prepare README
        working-directory: source
        run: uv run --no-config --no-project --python "$PYTHON_VERSION" scripts/transform_readme.py --target pypi

      - name: Build PGO wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: source
          sccache: false
          maturin-version: v1.15.0
          target: aarch64-unknown-linux-gnu
          manylinux: "2_28"
          container: quay.io/pypa/manylinux_2_28_aarch64@sha256:acc4e63610fef1da3d687322793665205415c2b22c0d2e403f1a44eb834d63fc
          # Restrict both runner sizes to the same CPUs and Cargo concurrency.
          docker-options: --cpuset-cpus=0-7 -e CARGO -e CARGO_BUILD_JOBS -e CARGO_INCREMENTAL -e AWS_LC_SYS_USE_SYSTEM -e JEMALLOC_SYS_WITH_LG_PAGE=16
          args: --release --locked --out dist --features self-update --compatibility pypi
          before-script-linux: |
            mkdir -p "$HOME/code/tmp/uv-ci-2124"
            export TMPDIR="$HOME/code/tmp/uv-ci-2124"
            scripts/install-cargo-extensions.sh

            bundled_lld_dir="$(rustc --print sysroot)/lib/rustlib/aarch64-unknown-linux-gnu/bin/gcc-ld"
            test -x "${bundled_lld_dir}/ld.lld"
            export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-C link-arg=-B${bundled_lld_dir} -C link-arg=-fuse-ld=lld"
            rustup component add llvm-tools-preview

            export UV_DIAGNOSTIC_UV="${{ github.workspace }}/diagnostics/bin/uv"
            export UV_DIAGNOSTIC_PYTHON="$(command -v python3.11)"
            export UV_DIAGNOSTIC_SCRIPT="${{ github.workspace }}/diagnostics/scripts/ci/arm64-rustc-diagnostics.py"
            export UV_DIAGNOSTIC_RESULTS="${{ github.workspace }}/results/container"
            export UV_DIAGNOSTIC_REAL_RUSTC="$(rustup which rustc)"
            export RUSTC="${{ github.workspace }}/diagnostics/scripts/ci/arm64-rustc-wrapper.sh"

            "$UV_DIAGNOSTIC_UV" run --no-config --no-project --no-python-downloads \
              --python "$UV_DIAGNOSTIC_PYTHON" "$UV_DIAGNOSTIC_SCRIPT" build --label pgo-training -- \
              "$UV_DIAGNOSTIC_UV" run --no-config --no-project --no-python-downloads \
              --python "$UV_DIAGNOSTIC_PYTHON" scripts/build_uv_pgo.py \
              --target aarch64-unknown-linux-gnu --target-dir "$PWD/target/uv-pgo" --train-only

            export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-Cprofile-use=$PWD/target/uv-pgo/uv.profdata"

      - name: Collect memory diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p results
          touch results/stop
          sudo -n dmesg -T | tee results/kernel-after.log > /dev/null || true
          if test -f diagnostics/scripts/ci/arm64-rustc-diagnostics.py && command -v uv > /dev/null; then
            uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py snapshot > results/host-after.json
            uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py report results/container > results/compiler-report.json
          fi
          grep -Ei 'out of memory|oom-kill|killed process' results/kernel-after.log || true

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-2124-gnu-${{ matrix.source.name }}-${{ matrix.machine.name }}-${{ matrix.sample }}
          path: results/
          retention-days: 30
          if-no-files-found: error

  docker:
    if: ${{ inputs.suite == 'baseline' || inputs.suite == 'docker-repeat' || inputs.suite == 'docker-overlap' }}
    continue-on-error: true
    name: Docker / ${{ matrix.source.name }} / ${{ matrix.sample }}
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.suite == 'docker-overlap' && 4 || 1 }}
      matrix:
        source: ${{ fromJSON(inputs.suite == 'baseline' && '[{"name":"original","repository":"astral-sh/uv","sha":"7f29beb52565079609f44e82facf9b351252fed1","uv-digest":"04d046b13e60d6bcec73cbc5e1cad25d680dea90c8573340950a0ac2d1aef424"},{"name":"marker","repository":"astral-sh/uv-dev","sha":"021c6c422b48ec4b7c49a5dd8d4299a244e0229d","uv-digest":"a7aed3216253ee804de3e2d8afa5073baa1a177335345d43845cd4165e43b711"}]' || '[{"name":"original","repository":"astral-sh/uv","sha":"7f29beb52565079609f44e82facf9b351252fed1","uv-digest":"04d046b13e60d6bcec73cbc5e1cad25d680dea90c8573340950a0ac2d1aef424"}]') }}
        sample: ${{ fromJSON(inputs.suite == 'docker-overlap' && '[1,2,3,4]' || inputs.suite == 'docker-repeat' && '[1,2,3]' || '[1]') }}
    steps:
      - name: Require an isolated project for overlapping builds
        if: ${{ inputs.suite == 'docker-overlap' }}
        env:
          PROJECT_ID: ${{ inputs.depot-project-id }}
        run: |
          case "$PROJECT_ID" in
            ""|c3ht4lmvqh|v094vdzkdt|7hd4vdzmw5)
              echo "The overlap test requires a dedicated Depot project" >&2
              exit 1
              ;;
          esac

      - name: Check out diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostics
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/arm64-rustc-diagnostics.py
            /scripts/ci/arm64-rustc-wrapper.sh

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.source.repository }}
          ref: ${{ matrix.source.sha }}
          path: source
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Add compiler diagnostics
        env:
          EXPECTED_SOURCE: ${{ matrix.source.sha }}
          BOOTSTRAP_DIGEST: ${{ matrix.source.uv-digest }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.source.name }}-${{ matrix.sample }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p results
          { git -C source rev-parse HEAD; git -C source rev-parse 'HEAD^{tree}'; } > results/source.txt
          uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py dockerfile source diagnostics/scripts/ci --uv-digest "$BOOTSTRAP_DIGEST" --build-id "$BUILD_ID"
          cp source/Dockerfile results/Dockerfile
          cp source/.ci-2124/build-id results/build-id

      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      - name: Build ARM64 image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ inputs.depot-project-id || 'c3ht4lmvqh' }}
          context: source
          file: source/Dockerfile
          platforms: linux/arm64
          push: false
          save: false
          provenance: mode=max
          sbom: true

      - name: Upload Docker build inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-2124-docker-${{ matrix.source.name }}-${{ matrix.sample }}
          path: results/
          retention-days: 30
          if-no-files-found: error

  docker-memory:
    if: ${{ inputs.suite == 'docker-memory' }}
    continue-on-error: true
    name: Docker memory / ${{ matrix.memory }}gb
    runs-on: depot-ubuntu-24.04-arm-32
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        memory: [32, 64]
    steps:
      - name: Check out diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostics
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/arm64-rustc-diagnostics.py
            /scripts/ci/arm64-rustc-wrapper.sh
            /scripts/ci/arm64-docker-memory-stress.sh

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/uv
          ref: 7f29beb52565079609f44e82facf9b351252fed1
          path: source
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Prepare the Docker toolchain image
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.memory }}
        run: |
          test "$(git -C source rev-parse HEAD)" = 7f29beb52565079609f44e82facf9b351252fed1
          mkdir -p results "$HOME/code/tmp/uv-ci-2124"
          echo "TMPDIR=$HOME/code/tmp/uv-ci-2124" >> "$GITHUB_ENV"
          uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py dockerfile source diagnostics/scripts/ci \
            --uv-digest 04d046b13e60d6bcec73cbc5e1cad25d680dea90c8573340950a0ac2d1aef424 \
            --build-id "$BUILD_ID" --prepare-only
          cp source/Dockerfile results/Dockerfile
          cp source/.ci-2124/build.sh results/build.sh
          docker build --platform linux/arm64 --progress plain --tag uv-ci-2124:toolchain source
          docker run --rm uv-ci-2124:toolchain sh -c 'test ! -f /root/target/aarch64-unknown-linux-musl/release/uv'

      - name: Run three compilations under a shared memory limit
        env:
          MEMORY_GIB: ${{ matrix.memory }}
        run: bash diagnostics/scripts/ci/arm64-docker-memory-stress.sh "$MEMORY_GIB" "$PWD/results" "$PWD/diagnostics/scripts/ci/arm64-rustc-diagnostics.py"

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-2124-docker-memory-${{ matrix.memory }}gb
          path: results/
          retention-days: 30
          if-no-files-found: error

  gnu-release-fix:
    if: ${{ inputs.suite == 'gnu-fix' }}
    continue-on-error: true
    env:
      ACTIONS_CACHE_MODE: none
      # Build the AWS-LC version pinned in Cargo.lock, not a system installation.
      AWS_LC_SYS_USE_SYSTEM: "0"
      PACKAGE_NAME: uv
      MODULE_NAME: uv
      PYTHON_VERSION: "3.11"
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
      UV_LOCKED: 1

    name: GNU release fix / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: ${{ matrix.platform.pgo && 60 || 30 }}
    strategy:
      matrix:
        platform:
          # PGO requires a native runner; the 32-bit ARM targets are cross-compiled.
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            test_image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
            test_platform: linux/arm64
            # The instrumented PGO build can exceed 32 GB even with eight CPUs.
            runner: depot-ubuntu-24.04-arm-16
            pgo: true
            # see https://github.com/astral-sh/ruff/issues/3791
            # and https://github.com/gnzlbg/jemallocator/issues/170#issuecomment-1503228963
            maturin_docker_options: --cpuset-cpus=0-7 -e CARGO_BUILD_JOBS=8 -e JEMALLOC_SYS_WITH_LG_PAGE=16
            # Build fails with 2_17 container: https://github.com/astral-sh/uv/actions/runs/20850906093/job/59905482208?pr=17358
            manylinux: 2_28

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f6aad0944971859795f675d147d84bc322b036a8
          persist-credentials: false
      - name: Verify fix source
        run: |
          test "$(git rev-parse HEAD)" = f6aad0944971859795f675d147d84bc322b036a8
          git rev-parse 'HEAD^{tree}'
          nproc
          free -b

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Prep README.md"
        run: python scripts/transform_readme.py --target pypi

      # uv
      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM ${{ matrix.platform.maturin_docker_options }}
          args: --release --locked --out dist --features self-update --compatibility pypi
          before-script-linux: |
            scripts/install-cargo-extensions.sh

            if [[ "${{ matrix.platform.pgo }}" == "true" ]]; then
                # GNU ld cannot resolve long-range calls in the instrumented ARM64 binary.
                bundled_lld_dir="$(rustc --print sysroot)/lib/rustlib/${{ matrix.platform.target }}/bin/gcc-ld"
                test -x "${bundled_lld_dir}/ld.lld"
                export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-C link-arg=-B${bundled_lld_dir} -C link-arg=-fuse-ld=lld"

                rustup component add llvm-tools-preview
                python${{ env.PYTHON_VERSION }} scripts/build_uv_pgo.py \
                    --target "${{ matrix.platform.target }}" \
                    --target-dir "$PWD/target/uv-pgo" \
                    --train-only

                export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-Cprofile-use=$PWD/target/uv-pgo/uv.profdata"
            fi
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
      - name: "Test wheel"
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME} --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME} --help
            uvx --help
      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-wheels-uv-${{ matrix.platform.target }}
          path: dist
      - name: "Archive binary"
        shell: bash
        run: |
          ARCHIVE_NAME=uv-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp target/$TARGET/release/uv $ARCHIVE_NAME/uv
          cp target/$TARGET/release/uvx $ARCHIVE_NAME/uvx
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
        env:
          TARGET: ${{ matrix.platform.target }}
      - name: "Upload binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-github-archives-${{ matrix.platform.target }}
          path: |
            *.tar.gz
            *.sha256

      # uv-build
      - name: "Build wheels uv-build"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM ${{ matrix.platform.maturin_docker_options }}
          args: --profile minimal-size --locked --out crates/uv-build/dist -m crates/uv-build/Cargo.toml --compatibility pypi
          before-script-linux: |
            scripts/install-cargo-extensions.sh
        env:
          CARGO: ${{ github.workspace }}/scripts/cargo.sh
      - name: "Test wheel uv-build"
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: crates/uv-build/dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME}_build --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME}_build --help
      - name: "Upload wheels uv-build"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-wheels-uv_build-${{ matrix.platform.target }}
          path: crates/uv-build/dist

  docker-memory-proof:
    if: ${{ inputs.suite == 'docker-memory-proof' }}
    continue-on-error: true
    name: Docker memory proof / ${{ matrix.scenario.name }} / ${{ matrix.sample }}
    runs-on: depot-ubuntu-24.04-arm-32
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario:
          - name: 32gb-3-builds
            memory: 32
            builds: 3
            cpus: 16
          - name: 64gb-2-builds
            memory: 64
            builds: 2
            cpus: 32
        sample: [1, 2, 3]
    steps:
      - name: Check out diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostics
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/arm64-rustc-diagnostics.py
            /scripts/ci/arm64-rustc-wrapper.sh
            /scripts/ci/arm64-docker-memory-stress.sh

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/uv
          ref: 7f29beb52565079609f44e82facf9b351252fed1
          path: source
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Prepare the Docker toolchain image
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario.name }}-${{ matrix.sample }}
        run: |
          test "$(git -C source rev-parse HEAD)" = 7f29beb52565079609f44e82facf9b351252fed1
          mkdir -p results "$HOME/code/tmp/uv-ci-2124"
          echo "TMPDIR=$HOME/code/tmp/uv-ci-2124" >> "$GITHUB_ENV"
          uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py dockerfile source diagnostics/scripts/ci \
            --uv-digest 04d046b13e60d6bcec73cbc5e1cad25d680dea90c8573340950a0ac2d1aef424 \
            --build-id "$BUILD_ID" --prepare-only
          cp source/Dockerfile results/Dockerfile
          cp source/.ci-2124/build.sh results/build.sh
          docker build --platform linux/arm64 --progress plain --tag uv-ci-2124:toolchain source
          docker run --rm uv-ci-2124:toolchain sh -c 'test ! -f /root/target/aarch64-unknown-linux-musl/release/uv'

      - name: Run compilations under the proposed resource limits
        env:
          MEMORY_GIB: ${{ matrix.scenario.memory }}
          BUILD_COUNT: ${{ matrix.scenario.builds }}
          CPU_COUNT: ${{ matrix.scenario.cpus }}
        run: bash diagnostics/scripts/ci/arm64-docker-memory-stress.sh "$MEMORY_GIB" "$PWD/results" "$PWD/diagnostics/scripts/ci/arm64-rustc-diagnostics.py" "$BUILD_COUNT" "$CPU_COUNT"

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-2124-docker-memory-proof-${{ matrix.scenario.name }}-${{ matrix.sample }}
          path: results/
          retention-days: 30
          if-no-files-found: error

  gnu-memory-proof:
    if: ${{ inputs.suite == 'gnu-memory-proof' }}
    # Compiler failures are diagnostic results and must not trigger automatic CI retries.
    continue-on-error: true
    name: GNU memory proof / ${{ matrix.machine.name }}
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        source:
          - name: fix
            sha: f6aad0944971859795f675d147d84bc322b036a8
        sample: [1]
        machine:
          - name: 32gb
            runner: depot-ubuntu-24.04-arm-32
            memory: 32
          - name: 64gb
            runner: depot-ubuntu-24.04-arm-32
            memory: 64
    env:
      CARGO_BUILD_JOBS: "8"
      CARGO: ${{ github.workspace }}/source/scripts/cargo.sh
    steps:
      - name: Check out diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostics
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/arm64-rustc-diagnostics.py
            /scripts/ci/arm64-rustc-wrapper.sh

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/uv-dev
          ref: ${{ matrix.source.sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Record runner resources
        env:
          EXPECTED_SOURCE: ${{ matrix.source.sha }}
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p diagnostics/bin results "$HOME/code/tmp/uv-ci-2124"
          cp "$UV_PATH" diagnostics/bin/uv
          chmod +x diagnostics/scripts/ci/arm64-rustc-wrapper.sh
          echo "TMPDIR=$HOME/code/tmp/uv-ci-2124" >> "$GITHUB_ENV"
          { git -C source rev-parse HEAD; git -C source rev-parse 'HEAD^{tree}'; uname -sr; lscpu; free -b; swapon --show; } > results/machine.txt
          sudo -n dmesg -T | tee results/kernel-before.log > /dev/null || true
          uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py snapshot > results/host-before.json
          uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py monitor "$PWD/results/host-memory.jsonl" "$PWD/results/stop" < /dev/null > results/monitor.log 2>&1 &
          echo "$!" > results/monitor.pid

      - name: Prepare README
        working-directory: source
        run: uv run --no-config --no-project --python "$PYTHON_VERSION" scripts/transform_readme.py --target pypi

      - name: Build PGO wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: source
          sccache: false
          maturin-version: v1.15.0
          target: aarch64-unknown-linux-gnu
          manylinux: "2_28"
          container: quay.io/pypa/manylinux_2_28_aarch64@sha256:acc4e63610fef1da3d687322793665205415c2b22c0d2e403f1a44eb834d63fc
          # Keep CPU concurrency fixed while varying only the container's memory limit.
          docker-options: --memory=${{ matrix.machine.memory }}g --memory-swap=${{ matrix.machine.memory }}g --cpuset-cpus=0-7 -e CARGO -e CARGO_BUILD_JOBS -e CARGO_INCREMENTAL -e AWS_LC_SYS_USE_SYSTEM -e JEMALLOC_SYS_WITH_LG_PAGE=16
          args: --release --locked --out dist --features self-update --compatibility pypi
          before-script-linux: |
            test "$(cat /sys/fs/cgroup/memory.max)" = "$(( ${{ matrix.machine.memory }} * 1024 * 1024 * 1024 ))"
            test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
            test "$(cat /sys/fs/cgroup/cpuset.cpus.effective)" = 0-7
            mkdir -p "$HOME/code/tmp/uv-ci-2124"
            export TMPDIR="$HOME/code/tmp/uv-ci-2124"
            scripts/install-cargo-extensions.sh

            bundled_lld_dir="$(rustc --print sysroot)/lib/rustlib/aarch64-unknown-linux-gnu/bin/gcc-ld"
            test -x "${bundled_lld_dir}/ld.lld"
            export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-C link-arg=-B${bundled_lld_dir} -C link-arg=-fuse-ld=lld"
            rustup component add llvm-tools-preview

            export UV_DIAGNOSTIC_UV="${{ github.workspace }}/diagnostics/bin/uv"
            export UV_DIAGNOSTIC_PYTHON="$(command -v python3.11)"
            export UV_DIAGNOSTIC_SCRIPT="${{ github.workspace }}/diagnostics/scripts/ci/arm64-rustc-diagnostics.py"
            export UV_DIAGNOSTIC_RESULTS="${{ github.workspace }}/results/container"
            export UV_DIAGNOSTIC_REAL_RUSTC="$(rustup which rustc)"
            export RUSTC="${{ github.workspace }}/diagnostics/scripts/ci/arm64-rustc-wrapper.sh"

            "$UV_DIAGNOSTIC_UV" run --no-config --no-project --no-python-downloads \
              --python "$UV_DIAGNOSTIC_PYTHON" "$UV_DIAGNOSTIC_SCRIPT" build --label pgo-training -- \
              "$UV_DIAGNOSTIC_UV" run --no-config --no-project --no-python-downloads \
              --python "$UV_DIAGNOSTIC_PYTHON" scripts/build_uv_pgo.py \
              --target aarch64-unknown-linux-gnu --target-dir "$PWD/target/uv-pgo" --train-only

            export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-Cprofile-use=$PWD/target/uv-pgo/uv.profdata"

      - name: Collect memory diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p results
          touch results/stop
          sudo -n dmesg -T | tee results/kernel-after.log > /dev/null || true
          if test -f diagnostics/scripts/ci/arm64-rustc-diagnostics.py && command -v uv > /dev/null; then
            uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py snapshot > results/host-after.json
            uv run --no-config --no-project --python "$PYTHON_VERSION" diagnostics/scripts/ci/arm64-rustc-diagnostics.py report results/container > results/compiler-report.json
          fi
          grep -Ei 'out of memory|oom-kill|killed process' results/kernel-after.log || true

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-2124-gnu-memory-proof-${{ matrix.machine.name }}
          path: results/
          retention-days: 30
          if-no-files-found: error
