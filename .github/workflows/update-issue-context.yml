# Incorporate useful issue comments into their existing maintainer context.
name: "update-issue-context"
run-name: Issue context for ${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  update:
    if: github.repository == 'astral-sh/uv' && !github.event.issue.pull_request
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      context-artifact-id: ${{ steps.upload-context.outputs.artifact-id }}
      context-revision: ${{ steps.issue-context.outputs.revision }}
      issue-number: ${{ steps.issue.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-uv-toolchain
        with:
          group: jaq

      - name: "Collect issue and comment context"
        id: issue
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,url,comments \
            > "$RUNNER_TEMP/issue.json"

          if ! jaq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            '.url | startswith("https://github.com/\($repository)/issues/")' \
            "$RUNNER_TEMP/issue.json" > /dev/null; then
            echo "The issue must belong to $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          jaq '.comment | {
            id,
            body,
            author: .user.login,
            url: .html_url,
            created_at
          }' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue-comment.json"

          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          {
            printf 'Issue context update for #%s: %s\n\n' \
              "$ISSUE_NUMBER" \
              "$(jaq -r '.title | gsub("[\r\n]+"; " ")' "$RUNNER_TEMP/issue.json")"
            cat agents/prompts/update-issue-context.md
          } > "$RUNNER_TEMP/update-issue-context-prompt.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: "Find previous Codex thread"
        id: find-thread
        run: |
          artifact_name="codex-thread-issue-$ISSUE_NUMBER"
          artifacts="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=20")"
          thread_run_id=
          while IFS=$'\t' read -r run_id; do
            [ -n "$run_id" ] || continue
            workflow_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            if ! jaq --exit-status '
              .head_branch == "main"
              and .status == "completed"
              and (
                (
                  .path == ".github/workflows/issue-triage.yml"
                  and (.event == "issues" or .event == "workflow_dispatch")
                )
                or (
                  .path == ".github/workflows/update-issue-context.yml"
                  and .event == "issue_comment"
                )
              )
            ' <<< "$workflow_run" > /dev/null; then
              continue
            fi

            title="$(jaq --raw-output '.display_title' <<< "$workflow_run")"
            if [ "$title" != "Issue context for $ISSUE_NUMBER" ]; then
              # A manual triage run can identify the issue by URL as well as by number.
              if [ "$(jaq --raw-output '.event' <<< "$workflow_run")" != "workflow_dispatch" ] ||
                [[ "$title" != "Issue context for "* ]]; then
                continue
              fi
              issue_url="$(gh issue view --repo "$GITHUB_REPOSITORY" --json url --jq '.url' \
                -- "${title#Issue context for }")" || continue
              [ "$issue_url" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" ] || continue
            fi

            # Without an explicit run-name, GitHub can use the issue author's title.
            # Check the declaration at the revision that produced the artifact, including on reruns.
            workflow_path="$(jaq --raw-output '.path' <<< "$workflow_run")"
            head_sha="$(jaq --raw-output '.head_sha' <<< "$workflow_run")"
            producer_workflow="$(gh api --header 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$workflow_path?ref=$head_sha")"
            run_name="$(jaq --from yaml --exit-status --raw-output '.["run-name"]' "$workflow_path")"
            if jaq --from yaml --exit-status --arg run_name "$run_name" \
              '.["run-name"] == $run_name' <<< "$producer_workflow" > /dev/null; then
              thread_run_id="$run_id"
              break
            fi
          done < <(
            jaq --raw-output '
              [.artifacts[] | select(.expired == false)]
              | sort_by(.created_at)
              | reverse
              | .[]
              | .workflow_run.id
            ' <<< "$artifacts"
          )

          if [ -z "$thread_run_id" ]; then
            echo "No trusted Codex thread exists for $GITHUB_REPOSITORY#$ISSUE_NUMBER."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "found=true"
            echo "run-id=$thread_run_id"
            echo "artifact=$artifact_name"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: "Restore Codex thread"
        if: steps.find-thread.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-thread.outputs.run-id }}
          name: ${{ steps.find-thread.outputs.artifact }}
          path: agents/codex/sessions

      - name: "Validate Codex thread"
        id: thread
        if: steps.find-thread.outputs.found == 'true'
        run: |
          while IFS= read -r -d '' compressed_rollout; do
            zstd --decompress --stdout "$compressed_rollout" > "${compressed_rollout%.zst}"
          done < <(find agents/codex/sessions -type f -name '*.jsonl.zst' -print0)

          root_sessions=0
          root_session_id=
          while IFS= read -r -d '' rollout; do
            metadata="$(head -n 1 "$rollout")"
            if ! jaq --exit-status '
              .type == "session_meta"
              and (.payload | type == "object")
              and (.payload.id | type == "string")
            ' <<< "$metadata" > /dev/null; then
              echo "The artifact contains an invalid Codex session." >&2
              exit 1
            fi

            if jaq --exit-status '.payload.source == "exec"' <<< "$metadata" > /dev/null; then
              root_sessions=$((root_sessions + 1))
              root_session_id="$(jaq --raw-output '.payload.id' <<< "$metadata")"
              session_workspace="$(jaq --raw-output '.payload.cwd' <<< "$metadata")"
              if ! [[ "$root_session_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] ||
                [ "$session_workspace" != "$GITHUB_WORKSPACE" ]; then
                echo "The Codex session does not match the trusted workspace." >&2
                exit 1
              fi
            fi
          done < <(find agents/codex/sessions -type f -name '*.jsonl' -print0)

          if [ "$root_sessions" -ne 1 ]; then
            echo "The artifact must contain exactly one root Codex session." >&2
            exit 1
          fi

          echo "session-id=$root_session_id" >> "$GITHUB_OUTPUT"

      - name: "Load issue context"
        id: issue-context
        if: steps.find-thread.outputs.found == 'true'
        uses: $/.github/actions/load-issue-context
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          path: ${{ runner.temp }}/issue-context
          # A retained thread can outlive a failed first publication.
          template: ${{ github.workspace }}/agents/templates/issue-context-template.md
          issue-file: ${{ runner.temp }}/issue.json

      - name: "Prepare the issue context for editing"
        if: steps.find-thread.outputs.found == 'true'
        working-directory: ${{ steps.issue-context.outputs.path }}
        run: |
          mkdir "$RUNNER_TEMP/codex-scratch"
          cp README.md "$RUNNER_TEMP/codex-scratch/README.md"

      - name: "Update issue context"
        if: steps.find-thread.outputs.found == 'true'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the original report and runner command files outside the sandbox's writable directory.
          TMPDIR: ${{ runner.temp }}/codex-scratch
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.169.0"
          codex-home: "agents/codex"
          model: gpt-6.2-sol
          effort: high
          permission-profile: "issue-triage"
          safety-strategy: drop-sudo
          allow-users: "*"
          prompt-file: "${{ runner.temp }}/update-issue-context-prompt.md"
          codex-args: >-
            ["resume", "${{ steps.thread.outputs.session-id }}", "-"]

      - name: "Check issue context changes"
        id: changes
        if: steps.find-thread.outputs.found == 'true'
        working-directory: ${{ steps.issue-context.outputs.path }}
        run: |
          # Move the file out of the sandbox so it can't be replaced after the check.
          mkdir "$RUNNER_TEMP/issue-context-update"
          readme="$RUNNER_TEMP/issue-context-update/README.md"
          mv -T "$RUNNER_TEMP/codex-scratch/README.md" "$readme"
          if [ -L "$readme" ] || [ ! -f "$readme" ]; then
            echo "The updated README must be a regular file." >&2
            exit 1
          fi

          if cmp -s README.md "$readme"; then
            echo "The comment does not require an issue-context update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # With --no-index, a clean diff can exit 1. Whitespace errors exit 3.
          git diff --no-index --check -- README.md "$readme" || [ "$?" -eq 1 ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "Upload issue context"
        id: upload-context
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-comment-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-context-update/README.md
          if-no-files-found: error
          retention-days: 1

      - name: "Upload Codex thread"
        if: always() && steps.find-thread.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-thread-issue-${{ steps.issue.outputs.number }}
          path: agents/codex/sessions
          if-no-files-found: warn
          overwrite: true

  persist:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment:
      name: automations
      deployment: false
    timeout-minutes: 10
    concurrency:
      group: issue-context-${{ needs.update.outputs.issue-number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: "Download issue context"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.update.outputs.context-artifact-id }}
          path: ${{ runner.temp }}/issue-context-update

      - name: "Publish issue context"
        uses: $/.github/actions/save-issue-context
        with:
          issue-number: ${{ needs.update.outputs.issue-number }}
          expected-revision: ${{ needs.update.outputs.context-revision }}
          readme: ${{ runner.temp }}/issue-context-update/README.md
