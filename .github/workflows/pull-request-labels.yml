# Recommend and apply labels for new pull requests.
name: "Pull request labels"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "A pull request number"
        required: true
        type: number
      head_sha:
        description: "The pull request head SHA at dispatch time"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pull_request }}
  cancel-in-progress: true

env:
  UV_LOCKED: 1

jobs:
  labels:
    if: github.repository == 'astral-sh/uv' || github.repository == 'astral-sh/uv-dev'
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    environment: automations
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.labels.outputs.final-message }}
      head-sha: ${{ steps.prepare.outputs.head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: "Checkout automation implementation"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          sparse-checkout: scripts/automations
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.14"
          enable-cache: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha || format('refs/pull/{0}/head', inputs.pull_request) }}
          path: pull-request
          persist-credentials: false

      - name: "Collect pull request context"
        id: prepare
        run: |
          uv run --project automation/scripts/automations --locked --no-dev \
            uv-automations labels prepare \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --checkout "$GITHUB_WORKSPACE/pull-request" \
            --allowed .github/allowed-pull-request-labels.json \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}

      - name: "Determine pull request labels"
        id: labels
        if: steps.prepare.outputs.ready == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.147.0"
          working-directory: "${{ github.workspace }}/pull-request"
          codex-home: "${{ github.workspace }}/agents/codex"
          permission-profile: "pull-request-labels"
          safety-strategy: drop-sudo
          allow-bot-users: "astral-automations-bot[bot]"
          prompt-file: "${{ github.workspace }}/agents/prompts/pull-request-labels.md"
          output-schema-file: "${{ github.workspace }}/agents/schemas/pull-request-labels.json"

      - name: "Write label recommendations"
        if: steps.labels.outputs.final-message != ''
        run: |
          uv run --project automation/scripts/automations --locked --no-dev \
            uv-automations labels report \
            --summary "$GITHUB_STEP_SUMMARY" <<< "$LABEL_RESULT"
        env:
          LABEL_RESULT: ${{ steps.labels.outputs.final-message }}

  validate:
    needs: labels
    if: >-
      github.repository == 'astral-sh/uv-dev' &&
      needs.labels.outputs.result != ''
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.validate.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: "Checkout label policy"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: label-policy
          sparse-checkout: .github/allowed-pull-request-labels.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.14"
          enable-cache: false

      - name: "Validate recommended labels"
        id: validate
        run: |
          uv run --project scripts/automations --locked --no-dev \
            uv-automations labels validate \
            --allowed label-policy/.github/allowed-pull-request-labels.json \
            --github-output "$GITHUB_OUTPUT" <<< "$LABEL_RESULT"
        env:
          LABEL_RESULT: ${{ needs.labels.outputs.result }}

  apply:
    needs: [labels, validate]
    if: >-
      needs.validate.outputs.labels != '' &&
      fromJSON(needs.validate.outputs.labels)[0] != null
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    environment: automations
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # for the repository label credential broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: "Checkout label policy"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: label-policy
          sparse-checkout: .github/allowed-pull-request-labels.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.14"
          enable-cache: false

      - name: "Get repository label token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            pull_requests: write

      - name: "Apply recommended labels"
        run: |
          uv run --project scripts/automations --locked --no-dev \
            uv-automations labels apply \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --allowed label-policy/.github/allowed-pull-request-labels.json \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" <<< "$LABELS"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LABELS: ${{ needs.validate.outputs.labels }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          EXPECTED_HEAD_SHA: ${{ needs.labels.outputs.head-sha }}
