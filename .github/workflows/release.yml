#
# Build, sign, verify, and publish the standalone release and Python distributions.

name: Release
permissions: {}

# The tag must match the package version, optionally prefixed with `v`.
# `dry-run` builds and verifies artifacts without publishing them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        default: dry-run
        type: string

env:
  # Release actions must not consume shared GitHub Actions caches.
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  release-gate:
    # N.B. This name should not change, it is used for downstream checks.
    name: release-gate
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    # This environment requires a 2-factor approval, i.e., the workflow must be approved by another
    # team member. GitHub fires approval events on every job that deploys to an environment, so we
    # have a dedicated environment for this purpose instead of using the `release` environment.
    # We use a GitHub App with a deployment protection rule webhook to ensure that the `release`
    # environment is only approved when the `release-gate` job succeeds. Dry-runs also require
    # approval because they use the real signing keys.
    environment:
      name: release-gate
      deployment: true
    steps:
      - run: echo "Release approved"

  # Pin the release metadata and complete artifact inventory before building.
  plan:
    runs-on: "depot-ubuntu-latest-4"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      tag: ${{ (inputs.tag != 'dry-run' && inputs.tag) || '' }}
      publishing: ${{ inputs.tag && inputs.tag != 'dry-run' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.12"
      - id: plan
        shell: bash
        run: |
          tag_args=()
          if [[ "$RELEASE_TAG" != dry-run ]]; then
            tag_args=(--tag "$RELEASE_TAG")
          fi
          python scripts/plan-release.py "${tag_args[@]}" > plan-dist-manifest.json
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: "Upload dist-manifest.json"
        id: upload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-manifest-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan-dist-manifest.json

  build-release-artifacts:
    needs:
      - plan
    uses: $/.github/workflows/build-release-binaries.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    permissions:
      "contents": "read"

  build-docker:
    needs:
      - plan
    uses: $/.github/workflows/build-docker.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    permissions:
      "contents": "read"
      "id-token": "write"

  assemble-release-artifacts:
    needs:
      - plan
      - build-release-artifacts
      - release-gate
    if: ${{ github.repository == 'astral-sh/uv' && github.ref == 'refs/heads/main' }}
    uses: $/.github/workflows/sign-release-binaries.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # Build installers and global assets from the final signed archives.
  build-global-dist-artifacts:
    needs:
      - plan
      - build-release-artifacts
      - assemble-release-artifacts
    runs-on: "depot-ubuntu-latest-4"
    outputs:
      artifacts: ${{ steps.artifacts.outputs.artifact-id }}
      manifest: ${{ steps.manifest.outputs.artifact-id }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
      - name: Fetch release archives and manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }},${{ needs.assemble-release-artifacts.outputs.github-archives }}
          path: target/distrib/
          merge-multiple: true
      - id: global-artifacts
        shell: bash
        run: |
          uv run --locked --script scripts/generate-native-installers.py --plan target/distrib/plan-dist-manifest.json --artifacts-dir target/distrib > dist-manifest.json

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Check planned GitHub release files"
        run: python scripts/plan-release.py --finalize dist-manifest.json --artifacts-dir target/distrib > /dev/null
      - name: "Upload artifacts"
        id: artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-github-global-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.global-artifacts.outputs.paths }}
      - name: "Upload global dist manifest"
        id: manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-manifest-global-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_MANIFEST_NAME }}
  verify-native-installers:
    needs:
      - assemble-release-artifacts
      - build-global-dist-artifacts
    uses: $/.github/workflows/check-native-installers.yml
    permissions:
      contents: read
    with:
      archives-artifact: ${{ needs.assemble-release-artifacts.outputs.github-archives }}
      installers-artifact: ${{ needs.build-global-dist-artifacts.outputs.artifacts }}

  # Verify the publication inputs and finalize their manifest.
  finalize-dist-manifest:
    needs:
      - plan
      - build-release-artifacts
      - build-docker
      - build-global-dist-artifacts
      - assemble-release-artifacts
      - verify-native-installers
    # Publication requires all builds, signing, and native installation checks to succeed.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.assemble-release-artifacts.result == 'success' && needs.verify-native-installers.result == 'success' && needs.build-global-dist-artifacts.result == 'success' && needs.build-release-artifacts.result == 'success' && needs.build-docker.result == 'success' }}
    permissions:
      contents: read
    runs-on: "depot-ubuntu-latest-4"
    outputs:
      val: ${{ steps.finalize.outputs.manifest }}
      github-artifacts: ${{ needs.assemble-release-artifacts.outputs.github-archives }},${{ needs.build-global-dist-artifacts.outputs.artifacts }},${{ steps.manifest.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.12"
      - name: Fetch release artifacts and manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-global-dist-artifacts.outputs.manifest }},${{ needs.assemble-release-artifacts.outputs.github-archives }},${{ needs.build-global-dist-artifacts.outputs.artifacts }}
          path: target/distrib/
          merge-multiple: true
      - id: finalize
        shell: bash
        run: |
          python scripts/plan-release.py --finalize target/distrib/global-dist-manifest.json --artifacts-dir target/distrib > dist-manifest.json
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        id: manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-github-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-manifest.json

  publish-docker:
    needs:
      - plan
      - finalize-dist-manifest
      - release-gate
      - build-docker
    uses: ./.github/workflows/publish-docker.yml
    with:
      manifest: ${{ needs.build-docker.outputs.manifest }}
    secrets: inherit
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
      "packages": "write"

  publish-pypi:
    needs:
      - plan
      - finalize-dist-manifest
      - release-gate
      - assemble-release-artifacts
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: $/.github/workflows/publish-pypi.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
      uv-wheels: ${{ needs.assemble-release-artifacts.outputs.uv-wheels }}
      uv-build-wheels: ${{ needs.assemble-release-artifacts.outputs.uv-build-wheels }}
      uv-sdist: ${{ needs.assemble-release-artifacts.outputs.uv-sdist }}
      uv-build-sdist: ${{ needs.assemble-release-artifacts.outputs.uv-build-sdist }}
    secrets: inherit
    # publish jobs get escalated permissions
    permissions:
      "id-token": "write"
      "packages": "write"

  publish-crates:
    needs:
      - plan
      - finalize-dist-manifest
      - release-gate
      - publish-pypi # DIRTY: see #16989
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: $/.github/workflows/publish-crates.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    # publish jobs get escalated permissions
    permissions:
      "contents": "read"
      "id-token": "write"

  # Create a GitHub Release while uploading all files to it
  publish-github:
    needs:
      - plan
      - finalize-dist-manifest
      - release-gate
      - publish-docker
      - publish-pypi
      - assemble-release-artifacts
    # Use `always()` so `publish-pypi` can skip prereleases while the required
    # builds and Docker publication must still succeed.
    # `publish-crates` is intentionally not a dependency: it's not
    # critical to the release and isn't idempotent on retry.
    if: ${{ always() && needs.finalize-dist-manifest.result == 'success' && needs.release-gate.result == 'success' && needs.assemble-release-artifacts.result == 'success' && needs.publish-docker.result == 'success' && (needs.publish-pypi.result == 'skipped' || needs.publish-pypi.result == 'success') }}
    runs-on: "${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}"
    environment:
      name: release
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.finalize-dist-manifest.outputs.github-artifacts }}
          path: artifacts
          merge-multiple: true
      - name: Attest
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
        with:
          subject-path: |
            artifacts/*.json
            artifacts/*.sh
            artifacts/*.ps1
            artifacts/*.zip
            artifacts/*.tar.gz
      - name: Get release token
        id: release-token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv
          # Workflow permission is required to create a release tag after `main` advances across workflow changes.
          permissions: |
            contents: write
            workflows: write
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PRERELEASE_FLAG: "${{ fromJson(needs.finalize-dist-manifest.outputs.val).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(needs.finalize-dist-manifest.outputs.val).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(needs.finalize-dist-manifest.outputs.val).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          NEEDS_PLAN_OUTPUTS_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          scripts/dist-manifest-to-files.sh artifacts/dist-manifest.json > "$RUNNER_TEMP/release-assets.txt"
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          release_flags=()
          if [[ -n "$PRERELEASE_FLAG" ]]; then
            release_flags=("$PRERELEASE_FLAG")
          fi
          gh release create "${NEEDS_PLAN_OUTPUTS_TAG}" --target "$RELEASE_COMMIT" "${release_flags[@]}" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${assets[@]}"

  publish-docs:
    needs:
      - plan
      - publish-github
    # Use `always() && ...` so this job gates only on whether `publish-github`
    # completed successfully.
    if: ${{ always() && needs.publish-github.result == 'success' }}
    uses: $/.github/workflows/publish-docs.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit

  publish-versions:
    needs:
      - plan
      - publish-github
    if: ${{ always() && needs.publish-github.result == 'success' }}
    uses: $/.github/workflows/publish-versions.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit

  publish-mirror:
    needs:
      - plan
      - finalize-dist-manifest
      - publish-github
      - assemble-release-artifacts
    if: ${{ always() && needs.publish-github.result == 'success' && needs.assemble-release-artifacts.result == 'success' }}
    uses: $/.github/workflows/publish-mirror.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
      github-artifacts: ${{ needs.finalize-dist-manifest.outputs.github-artifacts }}
    secrets: inherit
    permissions:
      "contents": "read"
