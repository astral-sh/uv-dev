# Test built distributions independently of compilation and release signing.
name: Test release artifacts

on:
  workflow_call:
    inputs:
      test-native-wheels:
        description: Test unsigned macOS and Windows wheels; releases test their signed wheels separately
        type: boolean
        default: true
        required: false

permissions:
  contents: read

env:
  ACTIONS_CACHE_MODE: none
  PACKAGE_NAME: uv
  MODULE_NAME: uv
  PYTHON_VERSION: "3.11"
  UV_LOCKED: 1

jobs:
  sdist:
    name: test source distributions
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-sdist-uv
          path: dist

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-sdist-uv_build
          path: crates/uv-build/dist

      - name: Test sdist
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: python:3.11-bookworm@sha256:35d3a4a3d5e42e02ab916d44513a050689f12c0533d45598d229672503fe77ca
          artifacts: dist
          rust-toolchain: rust-toolchain.toml
          run: |
            apt-get update
            apt-get install -y --no-install-recommends cmake
            # We can't use `--find-links` here, since we need maturin, which means no `--no-index`, and without that option
            # we run the risk that pip pull uv from PyPI instead.
            pip install /dist/${PACKAGE_NAME}-*.tar.gz --force-reinstall
            ${MODULE_NAME} --help
            python -m ${MODULE_NAME} --help
            uvx --help

      - name: Test sdist uv-build
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: python:3.11-bookworm@sha256:35d3a4a3d5e42e02ab916d44513a050689f12c0533d45598d229672503fe77ca
          artifacts: crates/uv-build/dist
          rust-toolchain: crates/uv-build/rust-toolchain.toml
          run: |
            apt-get update
            apt-get install -y --no-install-recommends cmake
            pip install /dist/${PACKAGE_NAME}_build-*.tar.gz --force-reinstall
            ${MODULE_NAME}-build --help
            python -m ${MODULE_NAME}_build --help

  macos:
    name: test aarch64-apple-darwin wheels
    if: ${{ inputs.test-native-wheels }}
    runs-on: namespace-profile-macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*-aarch64-apple-darwin
          path: dist
          merge-multiple: true

      - name: Install and run the wheels
        run: ./scripts/test-release-wheels-macos.sh ./dist

  windows:
    name: test ${{ matrix.platform.target }} wheels
    if: ${{ inputs.test-native-wheels }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            arch: x64
            runner: namespace-profile-windows-2022-x86-64-16x32
          - target: i686-pc-windows-msvc
            arch: x86
            runner: namespace-profile-windows-2022-x86-64-16x32
          - target: aarch64-pc-windows-msvc
            arch: arm64
            runner: github-windows-11-aarch64-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.platform.arch }}

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*-${{ matrix.platform.target }}
          path: dist
          merge-multiple: true

      - name: Install and run the wheels
        shell: pwsh
        run: ./scripts/test-release-wheels-windows.ps1 ./dist

  windows-runtime:
    name: check static Windows runtime
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM inspection tools
        run: rustup component add llvm-tools-preview

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-github-archives-x86_64-pc-windows-msvc
          path: archives

      - name: Extract binaries
        shell: bash
        run: 7z x archives/uv-x86_64-pc-windows-msvc.zip -obinaries

      - name: Verify static Windows runtime
        shell: bash
        run: |
          LLVM_READOBJ="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-readobj.exe"

          for binary in uv uvx uvw; do
            IMPORTS_FILE="$RUNNER_TEMP/${binary}-coff-imports.txt"
            "$LLVM_READOBJ" --coff-imports "binaries/${binary}.exe" > "$IMPORTS_FILE"

            if grep -Eiq 'vcruntime[[:digit:]_]*\.dll|ucrtbase\.dll|api-ms-win-crt-' "$IMPORTS_FILE"; then
              echo "$binary must not dynamically link the Visual C++ runtime" >&2
              exit 1
            fi
          done

  linux:
    name: test x86_64-unknown-linux-gnu wheels
    runs-on: depot-ubuntu-latest-4
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*-x86_64-unknown-linux-gnu
          path: dist
          merge-multiple: true

      - name: Test wheel
        run: |
          pip install "${PACKAGE_NAME}" --no-index --find-links dist/ --force-reinstall
          "${MODULE_NAME}" --help
          python -m "${MODULE_NAME}" --help
          uvx --help

      - name: Test wheel uv-build
        run: |
          pip install "${PACKAGE_NAME}_build" --no-index --find-links dist --force-reinstall
          "${MODULE_NAME}-build" --help
          python -m "${MODULE_NAME}_build" --help

  # TODO(charlie): Re-enable testing for PPC wheels.
  linux-cross:
    name: test ${{ matrix.platform.target }} wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-unknown-linux-gnu
            test_image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
            test_platform: linux/arm64
            runner: depot-ubuntu-24.04-arm-16
          - target: armv7-unknown-linux-gnueabihf
            test_image: arm32v7/ubuntu:20.04@sha256:d9a6ab6baaf86907ea1d46f0cbc87547920077c9c6017721faed6eeb51e9aa7e
            test_platform: linux/arm/v7
            runner: depot-ubuntu-24.04-8
          - target: arm-unknown-linux-musleabihf
            test_image: balenalib/rpi-raspbian:bullseye@sha256:851cfc48b26f6413a72a7f6873a7624ba2a427048976f6ab4483f72fe165d4f1
            test_platform: linux/arm/v6
            runner: depot-ubuntu-24.04-8
          - target: s390x-unknown-linux-gnu
            test_image: s390x/ubuntu:20.04@sha256:221f5f8e28d896556d0e55605cd6936450e6231544e9d83d687beae2d0e71afd
            test_platform: linux/s390x
            runner: depot-ubuntu-latest-4
          - target: riscv64gc-unknown-linux-gnu
            test_image: riscv64/ubuntu:20.04@sha256:610bedb0c5d9aeae4b45e9064e820c4e0b0f6c1d2843116b0a1ae754890951ac
            test_platform: linux/riscv64
            runner: depot-ubuntu-latest-4
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*-${{ matrix.platform.target }}
          path: dist
          merge-multiple: true

      - name: Test wheel
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME} --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME} --help
            uvx --help

      - name: Test wheel uv-build
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME}_build --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME}_build --help

  musllinux:
    name: test x86_64-unknown-linux-musl wheels
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*-x86_64-unknown-linux-musl
          path: dist
          merge-multiple: true

      - name: Test wheel
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: alpine:3.12@sha256:c75ac27b49326926b803b9ed43bf088bc220d22556de1bc5f72d742c91398f69
          artifacts: dist
          run: |
            apk add python3 py3-pip
            python3 -m venv .venv
            .venv/bin/pip install --upgrade --require-hashes -r /pip-requirements.txt
            .venv/bin/pip install ${PACKAGE_NAME} --no-index --find-links /dist/ --force-reinstall
            .venv/bin/${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME} --help
            .venv/bin/uvx --help

      - name: Test wheel uv-build
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: alpine:3.12@sha256:c75ac27b49326926b803b9ed43bf088bc220d22556de1bc5f72d742c91398f69
          artifacts: dist
          run: |
            apk add python3 py3-pip
            python3 -m venv .venv
            .venv/bin/pip install --upgrade --require-hashes -r /pip-requirements.txt
            .venv/bin/pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall
            .venv/bin/${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME}_build --help

  musllinux-cross:
    name: test ${{ matrix.platform.target }} wheels
    runs-on: depot-ubuntu-24.04-8
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            test_image: arm64v8/alpine:latest@sha256:65b6d5e8cc3010146b8b28cad29473b67883635fbedc9851f05ac83fb713ebdb
            test_platform: linux/arm64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            test_image: arm32v7/alpine:latest@sha256:8cc6ea3910f429645e27a90f51b73fb499e9136d12f11973ef233db7f4223967
            test_platform: linux/arm/v7
          - target: riscv64gc-unknown-linux-musl
            arch: riscv64
            test_image: riscv64/alpine:latest@sha256:e7eb5d29759ca6c5622f8940faa8142a9316799aec31291c075a1847a20f28e6
            test_platform: linux/riscv64
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*-${{ matrix.platform.target }}
          path: dist
          merge-multiple: true

      - name: Test wheel
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: dist
          run: |
            apk add python3
            python -m venv .venv
            .venv/bin/pip install ${PACKAGE_NAME} --no-index --find-links /dist --force-reinstall
            .venv/bin/${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME} --help
            .venv/bin/uvx --help

      - name: Test wheel (manylinux)
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        if: matrix.platform.arch == 'aarch64'
        with:
          image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
          platform: linux/arm64
          artifacts: dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME} --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME} --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME} --help
            uvx --help

      - name: Test wheel
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: ${{ matrix.platform.test_image }}
          platform: ${{ matrix.platform.test_platform }}
          artifacts: dist
          run: |
            apk add python3
            python -m venv .venv
            .venv/bin/pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall
            .venv/bin/${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # .venv/bin/python -m ${MODULE_NAME}_build --help

      - name: Test wheel (manylinux)
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        if: matrix.platform.arch == 'aarch64'
        with:
          image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
          platform: linux/arm64
          artifacts: dist
          run: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python-is-python3
            pip3 install --upgrade --require-hashes -r /pip-requirements.txt
            pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall
            ${MODULE_NAME}-build --help
            # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.
            # python -m ${MODULE_NAME}_build --help

  check-wheels:
    name: check wheel contents
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: 0.12.13
          checksum: 745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd
          enable-cache: false

      - name: Download built wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-wheels-*-*
          path: wheels
          merge-multiple: true

      - name: check wheel contents
        run: uv run scripts/check_uv_wheel_contents.py wheels/*
