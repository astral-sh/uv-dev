on:
  workflow_call:
    inputs:
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  AWS_LC_SYS_USE_SYSTEM: "0"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  TARGET: x86_64-unknown-linux-gnu

jobs:
  plan:
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      recipe: ${{ steps.plan.outputs.recipe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "Plan measurements"
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECIPE: ${{ hashFiles('.github/workflows/binary-size.yml', 'scripts/binary_size.py') }}
        run: |
          current="$(git rev-parse HEAD)"
          matrix="$(jq -cn --arg sha "$current" '{include: [{name: "current", sha: $sha}]}')"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Compare GitHub's merge commit with the target commit used in that merge.
            base="$(git rev-parse HEAD^1)"
            matrix="$(jq -c --arg sha "$base" '.include += [{name: "base", sha: $sha}]' <<< "$matrix")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "recipe=$RECIPE" >> "$GITHUB_OUTPUT"

  measure:
    name: "Measure ${{ matrix.name }}"
    needs: plan
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-8' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: 1
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false

      - name: "Restore baseline measurement"
        if: ${{ matrix.name == 'base' }}
        id: baseline
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: measurement.json
          key: binary-size-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ matrix.sha }}

      - name: "Check out measured revision"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: "Install Rust toolchains"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        working-directory: source
        run: |
          rustup show
          rustup target add "$TARGET"
          cd crates/uv-build
          rustup show
          rustup target add "$TARGET"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: false
          python-version: "3.11"

      - uses: astral-sh/github-actions/rust-workspace-cache@3c9fe5db47e144ea224b57565e3ab1ab769ef41d
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        with:
          prefix-key: v1-rust-workspace
          key: binary-size-release-${{ matrix.name }}-${{ hashFiles('source/Cargo.toml') }}
          workspace: source
          profile: |
            x86_64-unknown-linux-gnu/release
            x86_64-unknown-linux-gnu/minimal-size
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Build binaries"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        run: uv run --no-project tooling/scripts/binary_size.py build --source source --output build-times.json

      - name: "Measure binaries"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        run: uv run --no-project tooling/scripts/binary_size.py measure --source source --output measurement.json --build-times build-times.json

      - name: "Save main baseline"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: measurement.json
          key: binary-size-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ matrix.sha }}

      - name: "Upload measurement"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-size-${{ matrix.name }}
          path: measurement.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  report:
    needs: measure
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-latest' }}
    outputs:
      comment: ${{ steps.report.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-size-*
          path: measurements
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: false
          python-version: "3.11"
      - name: "Summarize binary sizes"
        id: report
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--base measurements/binary-size-base/measurement.json)
          fi
          uv run --no-project scripts/binary_size.py report measurements/binary-size-current/measurement.json "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"
          comment="$(uv run --no-project scripts/binary_size.py report measurements/binary-size-current/measurement.json "${args[@]}" --sizes-only | jq -Rs .)"
          echo "comment=$comment" >> "$GITHUB_OUTPUT"

  publish:
    needs: report
    uses: astral-sh/uv-dev/.github/workflows/publish-binary-size.yml@373da20ba8956b8b585d29d706ebb2f5d565432b
    with:
      report-json: ${{ needs.report.outputs.comment }}
    secrets: inherit
    permissions:
      id-token: write
