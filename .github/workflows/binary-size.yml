on:
  workflow_call:
    inputs:
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  AWS_LC_SYS_USE_SYSTEM: "0"
  CARGO_INCREMENTAL: 1
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  TARGET: x86_64-unknown-linux-gnu

jobs:
  plan:
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      recipe: ${{ steps.plan.outputs.recipe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "Plan measurements"
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECIPE: ${{ hashFiles('.github/workflows/binary-size.yml', 'scripts/binary_size.py', 'scripts/prune_cargo_workspace_cache.py') }}
        run: |
          current="$(git rev-parse HEAD)"
          matrix="$(jq -cn --arg sha "$current" '{include: [{name: "current", sha: $sha}]}')"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Compare GitHub's merge commit with the target commit used in that merge.
            base="$(git rev-parse HEAD^1)"
            matrix="$(jq -c --arg sha "$base" '.include += [{name: "base", sha: $sha}]' <<< "$matrix")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "recipe=$RECIPE" >> "$GITHUB_OUTPUT"

  measure:
    name: "Measure ${{ matrix.name }}"
    needs: plan
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-8' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: 1
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Restore baseline measurement"
        if: ${{ matrix.name == 'base' }}
        id: baseline
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: measurement.json
          key: binary-size-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ matrix.sha }}

      - name: "Check out measured revision"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: "Install Rust toolchains"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        working-directory: source
        run: |
          rustup show
          rustup target add "$TARGET"
          cd crates/uv-build
          rustup show
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        id: rust-cache
        with:
          prefix-key: v1-rust-workspace
          key: binary-size-${{ matrix.name }}-${{ hashFiles('source/Cargo.toml') }}
          workspaces: source -> target
          cache-workspace-crates: "true"
          save-if: ${{ inputs.save-rust-cache == 'true' }}

      - name: "Record Cargo cache freshness"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: touch "$RUNNER_TEMP/uv-cargo-cache-marker"

      # The Rust cache action removes incremental artifacts when it prunes target directories.
      - name: "Restore incremental artifacts"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        id: incremental-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/target/**/incremental
          key: binary-size-incremental-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ hashFiles('source/Cargo.toml', 'source/Cargo.lock', 'source/**/rust-toolchain.toml') }}-${{ matrix.sha }}
          restore-keys: |
            binary-size-incremental-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ hashFiles('source/Cargo.toml', 'source/Cargo.lock', 'source/**/rust-toolchain.toml') }}-

      - name: "Build binaries"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        env:
          # Override the Rust cache action's default for these incremental builds.
          CARGO_INCREMENTAL: 1
          CARGO_UNSTABLE_MTIME_ON_USE: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/binary_size.py build --source source --output build-times.json

      - name: "Measure binaries"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          INCREMENTAL_CACHE: ${{ steps.incremental-cache.outputs.cache-hit == 'true' && 'hit' || steps.incremental-cache.outputs.cache-matched-key != '' && 'partial' || 'miss' }}
        run: python3 scripts/binary_size.py measure --source source --output measurement.json --build-times build-times.json --cache-hit "$RUST_CACHE_HIT" --incremental-cache "$INCREMENTAL_CACHE"

      - name: "Prune superseded workspace artifacts"
        if: ${{ steps.baseline.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-hit != 'true' }}
        working-directory: source
        run: |
          python3 ../scripts/prune_cargo_workspace_cache.py "target/$TARGET/release" "$RUNNER_TEMP/uv-cargo-cache-marker"
          python3 ../scripts/prune_cargo_workspace_cache.py "target/$TARGET/minimal-size" "$RUNNER_TEMP/uv-cargo-cache-marker"

      - name: "Save incremental artifacts"
        if: ${{ inputs.save-rust-cache == 'true' && steps.baseline.outputs.cache-hit != 'true' && steps.incremental-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: source/target/**/incremental
          key: ${{ steps.incremental-cache.outputs.cache-primary-key }}

      - name: "Save main baseline"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: measurement.json
          key: binary-size-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ matrix.sha }}

      - name: "Upload measurement"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-size-${{ matrix.name }}
          path: measurement.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  report:
    needs: measure
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-latest' }}
    outputs:
      comment: ${{ steps.report.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-size-*
          path: measurements
      - name: "Summarize binary sizes"
        id: report
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--base measurements/binary-size-base/measurement.json)
          fi
          python3 scripts/binary_size.py report measurements/binary-size-current/measurement.json "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"
          comment="$(python3 scripts/binary_size.py report measurements/binary-size-current/measurement.json "${args[@]}" --sizes-only | jq -Rs .)"
          echo "comment=$comment" >> "$GITHUB_OUTPUT"

  publish:
    needs: report
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.repository == 'astral-sh/uv' || github.repository == 'astral-sh/uv-dev')
    runs-on: github-ubuntu-24.04-x86_64-2
    environment: automations
    timeout-minutes: 5
    permissions:
      id-token: write # for the pull request comment credential broker
    steps:
      - name: "Get pull request comment token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            pull_requests: write

      - name: "Update binary-size report"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          REPORT_JSON: ${{ needs.report.outputs.comment }}
          AUTOMATIONS_BOT_ID: "305554984"
        run: |
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")"
          if ! jq --exit-status --arg head "$HEAD_SHA" --arg merge "$MERGE_SHA" \
            '.state == "open" and .head.sha == $head and .merge_commit_sha == $merge and any(.labels[]; .name == "build:binary-size")' \
            <<< "$pull_request" > /dev/null; then
            echo "The pull request changed or no longer requests a binary-size report."
            exit 0
          fi

          marker="<!-- uv-binary-size -->"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          jq --null-input --argjson report "$REPORT_JSON" --arg marker "$marker" --arg run_url "$run_url" \
            '{body: ($marker + "\n" + $report + "\n[CI run](" + $run_url + ").\n")}' \
            > "$RUNNER_TEMP/binary-size-comment.json"

          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" --paginate --slurp)"
          comment_id="$(jq --raw-output --arg marker "$marker" --argjson bot_id "$AUTOMATIONS_BOT_ID" \
            '[.[][] | select(.user.id == $bot_id and (.body | startswith($marker))) | .id] | last // empty' \
            <<< "$comments")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input "$RUNNER_TEMP/binary-size-comment.json" --silent
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" \
              --input "$RUNNER_TEMP/binary-size-comment.json" --silent
          fi
