name: Binary size

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-size-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'build:binary-size' && github.run_id || 'measurement' }}
  cancel-in-progress: true

env:
  AWS_LC_SYS_USE_SYSTEM: "0"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  TARGET: x86_64-unknown-linux-gnu

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'build:binary-size') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build:binary-size'))
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      recipe: ${{ steps.plan.outputs.recipe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Plan measurements
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECIPE: ${{ hashFiles('.github/workflows/binary-size.yml', 'scripts/binary_size.py') }}
        run: |
          current="$(git rev-parse HEAD)"
          matrix="$(jq -cn --arg sha "$current" '{include: [{name: "current", sha: $sha}]}')"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Compare GitHub's merge commit with the target commit used in that merge.
            base="$(git rev-parse HEAD^1)"
            matrix="$(jq -c --arg sha "$base" '.include += [{name: "base", sha: $sha}]' <<< "$matrix")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "recipe=$RECIPE" >> "$GITHUB_OUTPUT"

  measure:
    name: Measure ${{ matrix.name }}
    needs: plan
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-8' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore baseline measurement
        if: ${{ matrix.name == 'base' }}
        id: baseline
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: measurement.json
          key: binary-size-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ matrix.sha }}

      - name: Check out measured revision
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: Install Rust toolchains
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        working-directory: source
        run: |
          rustup show
          rustup target add "$TARGET"
          cd crates/uv-build
          rustup show
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        with:
          prefix-key: v1-binary-size
          shared-key: linux-x86_64
          workspaces: source -> target
          cache-workspace-crates: "true"
          save-if: ${{ matrix.name == 'current' }}

      - name: Build binaries
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        working-directory: source
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cargo build --locked --release --target "$TARGET" -p uv --bin uv --bin uvx --features self-update -Z checksum-freshness
          cd crates/uv-build
          cargo build --locked --profile minimal-size --target "$TARGET" -p uv-build --bin uv-build -Z checksum-freshness

      - name: Measure binaries
        if: ${{ steps.baseline.outputs.cache-hit != 'true' }}
        run: python3 scripts/binary_size.py measure --source source --output measurement.json

      - name: Save main baseline
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: measurement.json
          key: binary-size-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.recipe }}-${{ matrix.sha }}

      - name: Upload measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-size-${{ matrix.name }}
          path: measurement.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  report:
    needs: measure
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-size-*
          path: measurements
      - name: Summarize binary sizes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--base measurements/binary-size-base/measurement.json)
          fi
          python3 scripts/binary_size.py report measurements/binary-size-current/measurement.json "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"
