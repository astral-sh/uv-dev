name: Rebase conflicted pull request

on:
  workflow_call:
    inputs:
      number:
        required: true
        type: number
      base-ref:
        required: true
        type: string
      base-previous-sha:
        required: false
        type: string
        default: ""
      head-ref:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      head-repository:
        required: true
        type: string

permissions: {}

env:
  UV_LOCKED: 1

jobs:
  rebase:
    name: "Rebase pull request #${{ inputs.number }}"
    runs-on: depot-ubuntu-24.04-4
    environment: automations
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      BASE_REF: ${{ inputs.base-ref }}
      BASE_PREVIOUS_SHA: ${{ inputs.base-previous-sha }}
      HEAD_REF: ${{ inputs.head-ref }}
      HEAD_SHA: ${{ inputs.head-sha }}
      HEAD_REPOSITORY: ${{ inputs.head-repository }}
      PULL_REQUEST_NUMBER: ${{ inputs.number }}
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      bundle_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      empty: ${{ steps.verify.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Install Rust toolchain
        run: rustup show

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-workspace
          cache-workspace-crates: "true"
          save-if: false

      - name: Prepare Rust dependencies
        run: cargo fetch --locked

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest

      - name: Prepare pull request branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-tmp"
          cp agents/codex/config.toml "$RUNNER_TEMP/codex-home/config.toml"
          cp agents/prompts/rebase-pull-request.md "$RUNNER_TEMP/rebase-pull-request.md"

          "$AUTOMATIONS_PYTHON" -I -m uv_automations rebase prepare \
            --checkout "$GITHUB_WORKSPACE" \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --base-ref "$BASE_REF" \
            --previous-base-sha "$BASE_PREVIOUS_SHA" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Enable Linux user namespaces for bubblewrap
        run: |
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Rebase pull request
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          BASE_REF: ${{ inputs.base-ref }}
          BASE_PREVIOUS_SHA: ${{ inputs.base-previous-sha }}
          TMPDIR: ${{ runner.temp }}/codex-tmp
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.147.0"
          model: gpt-5.6-sol
          effort: high
          codex-home: "${{ runner.temp }}/codex-home"
          permission-profile: "pull-request-rebase"
          safety-strategy: drop-sudo
          allow-bot-users: "astral-automations-bot[bot]"
          prompt-file: "${{ runner.temp }}/rebase-pull-request.md"

      - name: Verify rebased pull request
        id: verify
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations rebase persist \
            --checkout "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --bundle "$RUNNER_TEMP/rebased.bundle" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload rebased pull request
        id: upload
        if: steps.verify.outputs.empty == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebased-pull-request-${{ inputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebased.bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  push:
    name: "Push rebased pull request #${{ inputs.number }}"
    needs: rebase
    if: needs.rebase.outputs.empty == 'false'
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      BASE_REF: ${{ inputs.base-ref }}
      BASE_SHA: ${{ needs.rebase.outputs.base_sha }}
      BASE_PREVIOUS_SHA: ${{ inputs.base-previous-sha }}
      HEAD_REF: ${{ inputs.head-ref }}
      HEAD_SHA: ${{ inputs.head-sha }}
      HEAD_REPOSITORY: ${{ inputs.head-repository }}
      PULL_REQUEST_NUMBER: ${{ inputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Download rebased pull request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.rebase.outputs.bundle_artifact_id }}
          path: ${{ runner.temp }}/rebased-pull-request
          merge-multiple: true

      - name: Import rebased pull request
        id: import
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          REBASED_HEAD: ${{ needs.rebase.outputs.head_sha }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations rebase load \
            --checkout "$GITHUB_WORKSPACE" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$REBASED_HEAD" \
            --bundle "$RUNNER_TEMP/rebased-pull-request/rebased.bundle" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Revalidate pull request before publication
        id: source
        if: steps.import.outputs.head_sha != ''
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations rebase verify-source \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --previous-base-sha "$BASE_PREVIOUS_SHA" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Get pull request head token
        id: token
        if: steps.source.outputs.ready == 'true'
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ inputs.head-repository }}
          # `workflows: write` is required when a rebased pull request modifies workflow files.
          permissions: |
            contents: write
            workflows: write

      - name: Push rebased pull request
        if: steps.source.outputs.ready == 'true'
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          GH_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_REPOSITORY_ID: ${{ steps.source.outputs.head_repository_id }}
          REBASED_HEAD: ${{ steps.import.outputs.head_sha }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations rebase push \
            --checkout "$GITHUB_WORKSPACE" \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --previous-base-sha "$BASE_PREVIOUS_SHA" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-repository-id "$HEAD_REPOSITORY_ID" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --rebased-head "$REBASED_HEAD" \
            --summary "$GITHUB_STEP_SUMMARY"

  close:
    name: "Close empty pull request #${{ inputs.number }}"
    needs: rebase
    if: needs.rebase.outputs.empty == 'true'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: $/.github/workflows/close-empty-pull-request.yml
    secrets: inherit
    with:
      number: ${{ inputs.number }}
      base-ref: ${{ inputs.base-ref }}
      base-sha: ${{ needs.rebase.outputs.base_sha }}
      base-previous-sha: ${{ inputs.base-previous-sha }}
      head-ref: ${{ inputs.head-ref }}
      head-sha: ${{ inputs.head-sha }}
      head-repository: ${{ inputs.head-repository }}
