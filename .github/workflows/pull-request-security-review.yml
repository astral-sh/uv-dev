name: Pull request security review

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The pull request number"
        required: true
        type: string
      head_sha:
        description: "The expected pull request head SHA"
        required: true
        type: string

permissions: {}

env:
  UV_LOCKED: 1

concurrency:
  group: pull-request-security-review-${{ inputs.pull_request }}
  cancel-in-progress: true

jobs:
  review:
    name: "security review"
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.review.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: "Checkout Codex Security plugin"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/plugins
          ref: 11c74d6ba24d3a6d48f54a194cd00ef3beea18f9
          path: .codex-security-plugin
          sparse-checkout: |
            .agents/plugins
            plugins/codex-security
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"

      - name: "Install Codex Security plugin"
        run: ./agents/scripts/install-codex-security.sh

      - name: "Collect pull request context"
        id: context
        run: |
          set -o pipefail

          gh pr view "$PULL_REQUEST_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,baseRefName,baseRefOid,headRefName,headRefOid,isCrossRepository,isDraft,state,labels,files,additions,deletions,changedFiles \
            > .pull-request-review-event.json

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
            > "$RUNNER_TEMP/pull-request-live.json"

          if ! [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]] || ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatched pull request context is invalid." >&2
            exit 1
          fi
          if ! jq --exit-status \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            '.state == "OPEN" and (.isDraft | not) and (.isCrossRepository | not) and .baseRefName == "main" and .headRefOid == $head_sha' \
            .pull-request-review-event.json > /dev/null; then
            echo "The pull request is no longer ready at the expected head; skipping security review." >&2
            exit 1
          fi
          if ! jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            '.state == "open" and (.draft | not) and .base.ref == "main" and .base.repo.full_name == $repository and .base.repo.id == $repository_id and .head.repo.full_name == $repository and .head.repo.id == $repository_id and .head.sha == $head_sha' \
            "$RUNNER_TEMP/pull-request-live.json" > /dev/null; then
            echo "The pull request repository or head changed; skipping security review." >&2
            exit 1
          fi
          if ! jq --exit-status \
            '.files | any(.path | test("^(docs/|bin/|assets/|agents/|\\.claude/|\\.codex/)|^mkdocs.*\\.yml$|\\.md$"; "i") | not)' \
            .pull-request-review-event.json > /dev/null; then
            echo "The pull request contains no code or workflow changes to review."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr diff "$PULL_REQUEST_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            > .pull-request-review.diff

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER/comments?per_page=100" \
            | jq '[.[][] | {author: .user.login, body, path, line, original_line, side, start_line, original_start_line, start_side, commit_id, original_commit_id, in_reply_to_id, created_at, html_url}]' \
            > .pull-request-review-comments.json

          {
            printf 'Pull request security review for #%s: %s\n\n' \
              "$(jq -r '.number' .pull-request-review-event.json)" \
              "$(jq -r '.title | gsub("[\r\n]+"; " ")' .pull-request-review-event.json)"
            cat agents/prompts/pull-request-security-review.md
          } > "$RUNNER_TEMP/pull-request-security-review-prompt.md"

          mkdir -p "$RUNNER_TEMP/codex-home"
          cp -R agents/codex/. "$RUNNER_TEMP/codex-home/"
          cp agents/schemas/pull-request-security-review.json "$RUNNER_TEMP/pull-request-security-review-schema.json"
          cp agents/references/threat-model.md "$RUNNER_TEMP/pull-request-security-review-threat-model.md"

          head_ref=$(jq --raw-output '.headRefName' .pull-request-review-event.json)
          git check-ref-format "refs/heads/$head_ref"
          git fetch --no-tags origin "refs/heads/$head_ref"
          current_head=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "The pull request head changed; refusing to review a stale revision." >&2
            exit 1
          fi
          git checkout --detach "$EXPECTED_HEAD_SHA"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest

      - name: "Review pull request"
        id: review
        if: steps.context.outputs.eligible == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ runner.temp }}/codex-security
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.146.0"
          codex-home: "${{ runner.temp }}/codex-home"
          effort: high
          permission-profile: "pull-request-review"
          safety-strategy: drop-sudo
          allow-bot-users: "astral-automations-bot[bot],renovate[bot]"
          prompt-file: "${{ runner.temp }}/pull-request-security-review-prompt.md"
          output-schema-file: "${{ runner.temp }}/pull-request-security-review-schema.json"

      - name: "Upload Codex thread"
        if: always() && steps.context.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-thread-pull-request-security-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-home/sessions
          if-no-files-found: warn

  prepare:
    needs: review
    if: needs.review.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ steps.comments.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"

      - name: "Prepare review findings"
        id: comments
        run: |
          delimiter="review-$(openssl rand -hex 16)"
          {
            printf 'result<<%s\n' "$delimiter"
            printf '%s\n' "$REVIEW_RESULT" \
              | ./agents/scripts/agent-review-to-github-comments.py --commit-id "$HEAD_SHA"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_RESULT: ${{ needs.review.outputs.result }}

  report:
    needs: prepare
    if: needs.prepare.outputs.result != '' && fromJSON(needs.prepare.outputs.result).comments[0] != null
    runs-on: ubuntu-latest
    environment: automations
    timeout-minutes: 5
    permissions:
      id-token: write # for the credential broker
    steps:
      - name: "Get uv token"
        id: token
        uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: astral-sh/uv
          permissions: |
            pull_requests: write

      - name: "Publish review findings"
        run: |
          printf '%s\n' "$REVIEW_RESULT" > "$RUNNER_TEMP/review.json"

          if jq --exit-status '.comments | length == 0' "$RUNNER_TEMP/review.json" > /dev/null; then
            echo "No actionable findings to publish."
            exit 0
          fi

          current_head_sha="$(
            gh pr view "$PULL_REQUEST_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json headRefOid \
              --jq '.headRefOid'
          )"
          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "The pull request head changed; skipping stale review findings."
            exit 0
          fi

          jq --compact-output '.comments[]' "$RUNNER_TEMP/review.json" |
          while IFS= read -r comment; do
            printf '%s\n' "$comment" |
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER/comments" \
                --input - \
                --silent
          done
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          REVIEW_RESULT: ${{ needs.prepare.outputs.result }}
