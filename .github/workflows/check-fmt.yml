on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Apply the Rustfmt network policy
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy@23e8a32de60a3f156133c1ba66a6374df65424dc
        with:
          profile: rustfmt
          disposable: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rustfmt"
        run: rustup component add rustfmt
      - run: cargo fmt --all --check

  prettier:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Apply the Prettier network policy
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy@23e8a32de60a3f156133c1ba66a6374df65424dc
        with:
          profile: prettier
          disposable: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx prettier@3.9.0 --check .

  python:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Apply the Python-check network policy
        uses: astral-sh/uv-dev/.github/actions/runner-network-policy@23e8a32de60a3f156133c1ba66a6374df65424dc
        with:
          profile: python-checks
          disposable: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: uv run --only-group=check ruff format --diff .
