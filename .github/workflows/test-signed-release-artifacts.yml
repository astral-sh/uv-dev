# Verify the final signed artifacts before any release publication.
name: Test signed release artifacts

on:
  workflow_call:
    inputs:
      macos:
        description: JSON matrix of macOS targets and native verification runners
        type: string
        required: true
      windows:
        description: JSON matrix of Windows targets and native verification runners
        type: string
        required: true
      signed-macos:
        description: Artifact ID for the signed macOS executables
        type: string
        required: true
      signed-windows:
        description: Artifact ID for the signed Windows executables
        type: string
        required: true
      macos-wheels:
        description: Artifact ID for the signed macOS wheels grouped by target
        type: string
        required: true
      windows-wheels:
        description: Artifact ID for the signed Windows wheels grouped by target
        type: string
        required: true
      github-archives:
        description: Artifact ID for the assembled GitHub release archives
        type: string
        required: true
      uv-wheels:
        description: Artifact ID for all assembled uv release wheels
        type: string
        required: true
      uv-build-wheels:
        description: Artifact ID for all assembled uv_build release wheels
        type: string
        required: true

permissions:
  contents: read

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  verify-macos:
    name: verify signed ${{ matrix.platform.target }} artifacts
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.macos) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.13"
          architecture: ${{ matrix.platform.python-architecture }}

      - name: Download signed executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.signed-macos }}
          path: signed
          merge-multiple: true

      - name: Download signed wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.macos-wheels }}
          path: wheels
          merge-multiple: true

      - name: Download signed GitHub release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.github-archives }}
          path: github-archives
          merge-multiple: true

      - name: Verify signed release artifacts
        uses: astral-sh/github-actions/verify-release@b61c7106c7746375df8005eab240be92e4e450b2 # shared release signing actions
        with:
          target: ${{ toJSON(matrix.platform) }}
          signed-directory: signed/${{ matrix.platform.target }}
          wheels-directory: wheels/${{ matrix.platform.target }}
          github-archives-directory: github-archives

      - name: Install and run the signed wheels
        run: ./scripts/test-release-wheels-macos.sh "./wheels/$TARGET"

  verify-windows:
    name: verify signed ${{ matrix.platform.target }} artifacts
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.windows) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ""
          python-version: "3.13"
          architecture: ${{ matrix.platform.python-architecture }}

      - name: Download signed executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.signed-windows }}
          path: signed
          merge-multiple: true

      - name: Download signed wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.windows-wheels }}
          path: wheels
          merge-multiple: true

      - name: Download signed GitHub release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.github-archives }}
          path: github-archives
          merge-multiple: true

      - name: Verify signed release artifacts
        uses: astral-sh/github-actions/verify-release@b61c7106c7746375df8005eab240be92e4e450b2 # shared release signing actions
        with:
          target: ${{ toJSON(matrix.platform) }}
          signed-directory: signed/${{ matrix.platform.target }}
          wheels-directory: wheels/${{ matrix.platform.target }}
          github-archives-directory: github-archives

      - name: Install and run the signed wheels
        shell: pwsh
        run: ./scripts/test-release-wheels-windows.ps1 "./wheels/$env:TARGET"

  check-wheels:
    name: check wheel contents
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: 0.12.13
          checksum: 745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd
          enable-cache: false

      - name: Download assembled release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheels
          merge-multiple: true
          artifact-ids: ${{ inputs.uv-wheels }},${{ inputs.uv-build-wheels }}

      - name: check wheel contents
        run: uv run scripts/check_uv_wheel_contents.py wheels/*
