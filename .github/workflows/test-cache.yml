on:
  workflow_call:
    inputs:
      sha:
        description: "The commit SHA to use for artifact names"
        required: true
        type: string
      baseline-version:
        description: "Released uv version to compare, or latest"
        default: latest
        type: string

permissions:
  contents: read

jobs:
  baseline:
    name: "select cache baseline"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Select released binary identities"
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_VERSION: ${{ inputs.baseline-version }}
        run: python scripts/cache_baseline.py select --version "$BASELINE_VERSION" --manifest cache-baseline.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-baseline-${{ inputs.sha }}
          path: cache-baseline.json

  cache:
    needs: baseline
    name: "cache on ${{ matrix.name }}"
    timeout-minutes: 10
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux
            runner: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
            artifact: uv-linux-libc
            target: x86_64-unknown-linux-gnu
          - name: macos aarch64
            runner: macos-15
            artifact: uv-macos-aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"

      - name: "Download binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}-${{ inputs.sha }}

      - name: "Prepare binary"
        run: chmod +x ./uv

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cache-baseline-${{ inputs.sha }}

      - name: "Download selected baseline"
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/cache_baseline.py download --manifest cache-baseline.json --target "$TARGET" --output ./uv-previous

      - name: "Check cache compatibility"
        run: python scripts/check_cache_compat.py --uv-current ./uv --uv-previous ./uv-previous --fixture-cache ./fixture-cache --identity cache-workloads.json

      - name: "Record workload identities"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-workloads-${{ matrix.target }}-${{ inputs.sha }}
          path: |
            cache-baseline.json
            cache-workloads.json
