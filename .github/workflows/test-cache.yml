on:
  workflow_call:
    inputs:
      sha:
        description: "The commit SHA to use for artifact names"
        required: true
        type: string

permissions: {}

jobs:
  cache:
    name: "cache on ${{ matrix.name }}"
    timeout-minutes: 10
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            artifact: uv-linux-libc
            target: x86_64-unknown-linux-gnu
          - name: macos aarch64
            runner: macos-14
            artifact: uv-macos-aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: "Download binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}-${{ inputs.sha }}

      - name: "Prepare binary"
        run: chmod +x ./uv

      - name: "Download binary for last version"
        env:
          TARGET: ${{ matrix.target }}
        run: curl -LsSf "https://github.com/astral-sh/uv/releases/latest/download/uv-${TARGET}.tar.gz" | tar -xvz

      - name: "Check cache compatibility"
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/check_cache_compat.py --uv-current ./uv --uv-previous "./uv-${TARGET}/uv"
