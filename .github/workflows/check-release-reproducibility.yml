name: Check release reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/check-release-reproducibility.yml
      - scripts/reproducible-builds/**
      - scripts/install-cargo-extensions.sh
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml

permissions:
  contents: read

jobs:
  linux-musl:
    name: x86_64-unknown-linux-musl
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build twice and compare
        run: python3 scripts/reproducible-builds/build.py --check --out target/reproducible-release
      - name: Retain build evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-release-linux-musl
          path: target/reproducible-release
          if-no-files-found: ignore
