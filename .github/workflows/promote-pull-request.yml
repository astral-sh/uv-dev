name: Promote pull request

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The uv-dev pull request number, or all ready pull requests"
        required: false
        type: string
      head_sha:
        description: "The uv-dev pull request head SHA approved for promotion"
        required: false
        type: string

permissions: {}

concurrency:
  group: promote-pull-requests-${{ inputs.pull_request || 'main' }}
  cancel-in-progress: false

jobs:
  identify:
    name: Identify ready pull requests
    if: github.repository == 'astral-sh/uv-dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      promotions: ${{ steps.plan.outputs.promotions }}
      rebases: ${{ steps.plan.outputs.rebases }}
      promotion-count: ${{ steps.plan.outputs.promotion_count }}
      rebase-count: ${{ steps.plan.outputs.rebase_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan promotions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          arguments=()
          if [ -n "$PULL_REQUEST_NUMBER" ]; then
            if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "An approved pull request head SHA is required; refusing to promote it." >&2
              exit 1
            fi
            arguments+=(--number "$PULL_REQUEST_NUMBER" --head-sha "$HEAD_SHA")
          fi
          python3 scripts/pull_request_promotion.py plan "${arguments[@]}"

  rebase:
    name: "Prepare promotion of #${{ matrix.number }}"
    needs: identify
    if: needs.identify.outputs.rebase-count != '0'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.identify.outputs.rebases) }}
    uses: $/.github/workflows/rebase-conflicted-pull-request.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      number: ${{ matrix.number }}
      base-ref: ${{ matrix.base_ref }}
      base-sha: ${{ matrix.base_sha }}
      base-previous-sha: ${{ matrix.previous_sha }}
      parent-merge-sha: ${{ matrix.merge_sha }}
      head-ref: ${{ matrix.head_ref }}
      head-sha: ${{ matrix.head_sha }}
      head-repository: astral-sh/uv-dev
      publish: false

  promote:
    name: "Promote pull request #${{ matrix.number }}"
    needs: [identify, rebase]
    if: always() && needs.identify.result == 'success' && needs.identify.outputs.promotion-count != '0'
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 10
    concurrency:
      group: promote-pull-request-${{ matrix.number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.identify.outputs.promotions) }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download rebased pull request
        if: matrix.action == 'rebase'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebased-pull-request-${{ matrix.number }}-${{ matrix.head_sha }}
          path: ${{ runner.temp }}/rebased-pull-request

      - name: Verify promotion revision
        id: verify
        env:
          ACTION: ${{ matrix.action }}
          BASE_REF: ${{ matrix.base_ref }}
          BASE_SHA: ${{ matrix.base_sha }}
          HEAD_SHA: ${{ matrix.head_sha }}
          PARENT_MERGE_SHA: ${{ matrix.merge_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          promoted_head="$HEAD_SHA"
          if [ "$ACTION" = "rebase" ]; then
            current_base=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
            if [ "$current_base" != "$BASE_SHA" ]; then
              echo "The promotion base changed; refusing to publish a stale rebase." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$PARENT_MERGE_SHA" "$BASE_SHA"
            bundle="$RUNNER_TEMP/rebased-pull-request/rebased.bundle"
            git bundle verify "$bundle"
            git -c core.hooksPath=/dev/null fetch --no-tags "$bundle" HEAD
            promoted_head=$(git rev-parse 'FETCH_HEAD^{commit}')
            git merge-base --is-ancestor "$BASE_SHA" "$promoted_head"
          fi
          echo "head_sha=$promoted_head" >> "$GITHUB_OUTPUT"

      - name: Recheck promotion plan
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PLAN: ${{ toJSON(matrix) }}
        run: python3 scripts/pull_request_promotion.py verify-plan --plan "$PROMOTION_PLAN"

      - name: Get promotion token
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            astral-sh/uv-dev
          # The fresh uv-dev branch can include workflow changes.
          permissions: |
            contents: write
            pull_requests: write
            workflows: write

      - name: Promote pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PROMOTION_PLAN: ${{ toJSON(matrix) }}
          PROMOTED_HEAD: ${{ steps.verify.outputs.head_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          python3 scripts/pull_request_promotion.py publish \
            --plan "$PROMOTION_PLAN" \
            --promoted-head "$PROMOTED_HEAD"
