name: Promote pull request

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The source pull request number"
        required: true
        type: string
      head_sha:
        description: "The source pull request head SHA approved for promotion"
        required: true
        type: string
      approval_id:
        description: "The exact readiness event when replaying a queued promotion"
        required: false
        type: string

permissions: {}

env:
  UV_REPOSITORY_ID: "699532645"
  AUTOMATIONS_BOT_ID: "305554984"
  UV_SECURITY_PUBLISH_LABEL: "bot:promote"
  UV_LOCKED: 1

concurrency:
  group: promote-pull-request-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  prepare:
    name: "Prepare promotion of pull request #${{ inputs.pull_request }}"
    if: github.repository == 'astral-sh/uv-dev' || github.repository == 'astral-sh/uv-security'
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      source_base_ref: ${{ steps.plan.outputs.source_base_ref }}
      source_base_sha: ${{ steps.plan.outputs.source_base_sha }}
      head_ref: ${{ steps.plan.outputs.head_ref }}
      base_ref: ${{ steps.plan.outputs.base_ref }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      base_previous_sha: ${{ steps.plan.outputs.base_previous_sha }}
      parent_merge_sha: ${{ steps.plan.outputs.parent_merge_sha }}
      promoter: ${{ steps.plan.outputs.promoter }}
      approval_id: ${{ steps.plan.outputs.approval_id }}
      rejection_reason: ${{ steps.plan.outputs.rejection_reason }}
      changed_head: ${{ steps.plan.outputs.changed_head }}
      copy_base: ${{ steps.plan.outputs.copy_base }}
      queue: ${{ steps.plan.outputs.queue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up trusted Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Get promotion read token
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            ${{ github.repository }}
          permissions: |
            contents: read
            pull_requests: read

      - name: Plan promotion
        id: plan
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          EXPECTED_APPROVAL_ID: ${{ inputs.approval_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions prepare \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --approval-id "$EXPECTED_APPROVAL_ID" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  queue:
    name: "Queue promotion of pull request #${{ inputs.pull_request }}"
    needs: prepare
    if: needs.prepare.outputs.queue != ''
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      recorded: ${{ steps.record.outputs.recorded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up trusted Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Get queue-record token
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repository: ${{ github.repository }}
          permissions: |
            pull_requests: write

      - name: Record queued promotion
        id: record
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          GH_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          QUEUE_PLAN: ${{ needs.prepare.outputs.queue }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions record-queue \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" <<< "$QUEUE_PLAN"

  replay-queued-promotion:
    name: Check newly queued promotion
    needs: [prepare, queue]
    if: github.repository == 'astral-sh/uv-dev' && github.ref == 'refs/heads/main' && needs.queue.outputs.recorded == 'true'
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up trusted Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Get promotion read token
        id: read-token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            ${{ github.repository }}
          permissions: |
            contents: read
            pull_requests: read

      - name: Replay if the parent has already synchronized
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          GH_SOURCE_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_UPSTREAM_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          QUEUE_PLAN: ${{ needs.prepare.outputs.queue }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions replay-one \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --summary "$GITHUB_STEP_SUMMARY" <<< "$QUEUE_PLAN"

  update-pull-request-parent:
    name: Update pull request parent
    needs: prepare
    if: needs.prepare.outputs.action == 'update-parent'
    permissions:
      contents: read
    uses: $/.github/workflows/update-pull-request-parent.yml
    with:
      number: ${{ inputs.pull_request }}
      base-ref: ${{ needs.prepare.outputs.base_ref }}
      base-sha: ${{ needs.prepare.outputs.base_sha }}
      base-previous-sha: ${{ needs.prepare.outputs.base_previous_sha }}
      parent-merge-sha: ${{ needs.prepare.outputs.parent_merge_sha }}
      head-ref: ${{ needs.prepare.outputs.head_ref }}
      head-sha: ${{ inputs.head_sha }}

  promote:
    name: "Promote pull request #${{ inputs.pull_request }}"
    needs: [prepare, update-pull-request-parent]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.action == 'promote' || needs.update-pull-request-parent.outputs.outcome == 'clean')
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      number: ${{ steps.promote.outputs.number }}
      closed: ${{ steps.close.outputs.closed }}
      rejection_reason: ${{ steps.verify.outputs.rejection_reason || steps.base.outputs.rejection_reason || steps.promote.outputs.rejection_reason || steps.close.outputs.rejection_reason }}
      changed_head: ${{ steps.promote.outputs.changed_head || steps.close.outputs.changed_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up trusted Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Download updated parent candidate
        if: needs.prepare.outputs.action == 'update-parent'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updated-pull-request-parent-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/updated-parent

      - name: Verify promotion revision
        id: verify
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          UPDATED_HEAD: ${{ needs.update-pull-request-parent.outputs.head_sha }}
          PARENT_MERGE_SHA: ${{ needs.prepare.outputs.parent_merge_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          promoted_head="$EXPECTED_HEAD_SHA"
          if [ "$ACTION" = update-parent ]; then
            current_base=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
            if [ "$current_base" != "$BASE_SHA" ]; then
              echo "rejection_reason=The promotion base changed after the parent update." >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git merge-base --is-ancestor "$PARENT_MERGE_SHA" "$BASE_SHA"
            bundle="$RUNNER_TEMP/updated-parent/updated-parent.bundle"
            git bundle verify "$bundle"
            git -c core.hooksPath=/dev/null fetch --no-tags "$bundle" HEAD
            promoted_head=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [ "$promoted_head" != "$UPDATED_HEAD" ]; then
              echo "The candidate artifact does not match the clean parent update." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$BASE_SHA" "$promoted_head"
          fi
          echo "head_sha=$promoted_head" >> "$GITHUB_OUTPUT"

      - name: Get promotion read token
        id: read-token
        if: steps.verify.outputs.head_sha != '' && needs.prepare.outputs.copy_base != ''
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            ${{ github.repository }}
          permissions: |
            contents: read
            pull_requests: read

      - name: Get promotion token
        id: token
        if: steps.verify.outputs.head_sha != ''
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            ${{ github.repository }}
          # `workflows: write` is required when the promoted branch modifies workflow files.
          permissions: |
            contents: write
            pull_requests: write
            workflows: write

      - name: Ensure upstream base
        id: base
        if: steps.verify.outputs.head_sha != '' && needs.prepare.outputs.copy_base != ''
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          COPY_BASE: ${{ needs.prepare.outputs.copy_base }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions ensure-base \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" <<< "$COPY_BASE"

      - name: Promote pull request
        id: promote
        if: steps.verify.outputs.head_sha != '' && steps.base.outputs.ready != 'false'
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          APPROVAL_ID: ${{ needs.prepare.outputs.approval_id }}
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          PROMOTED_HEAD: ${{ steps.verify.outputs.head_sha }}
          PROMOTER: ${{ needs.prepare.outputs.promoter }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          REPLAY_APPROVAL_ID: ${{ inputs.approval_id }}
          SOURCE_BASE_REF: ${{ needs.prepare.outputs.source_base_ref }}
          SOURCE_BASE_SHA: ${{ needs.prepare.outputs.source_base_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          reject() {
            echo "rejection_reason=$1" >> "$GITHUB_OUTPUT"
            echo "$1" >&2
            exit 1
          }

          source_pull_request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
          current_approval=$(
            "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions current-approval \
              --repo "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
              --pull-request "$PULL_REQUEST_NUMBER" --expected-head "$EXPECTED_HEAD_SHA" \
              --approval-id "$REPLAY_APPROVAL_ID"
          )
          if [ "$current_approval" != "$APPROVAL_ID" ] || ! jq --exit-status \
            --arg action "$ACTION" \
            --arg source_base_ref "$SOURCE_BASE_REF" --arg source_base_sha "$SOURCE_BASE_SHA" \
            --arg head_ref "$HEAD_REF" --arg head_sha "$EXPECTED_HEAD_SHA" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            '.state == "open" and (.draft | not) and .base.ref == $source_base_ref and ($action != "update-parent" or .base.sha == $source_base_sha) and .head.ref == $head_ref and .head.sha == $head_sha and .base.repo.id == $repository_id and .head.repo.id == $repository_id' \
            <<< "$source_pull_request" > /dev/null; then
            reject "The source pull request or its approval changed before publication."
          fi

          if [ "$GITHUB_REPOSITORY" = "astral-sh/uv-security" ]; then
            if ! jq --exit-status --arg label "$UV_SECURITY_PUBLISH_LABEL" \
              '.labels | any(.name == $label)' <<< "$source_pull_request" > /dev/null; then
              reject "The private pull request requires the $UV_SECURITY_PUBLISH_LABEL label."
            fi
            promoter_permission=$(gh api --method GET "repos/$GITHUB_REPOSITORY/collaborators/$PROMOTER/permission")
            if ! jq --exit-status \
              '.permission == "admin" or .permission == "maintain" or .permission == "write"' \
              <<< "$promoter_permission" > /dev/null; then
              reject "The private pull request is no longer approved by a repository writer."
            fi
            if [ "$(jq --raw-output '.base.sha' <<< "$source_pull_request")" != "$SOURCE_BASE_SHA" ]; then
              reject "The private pull request base changed before publication."
            fi
          fi

          existing_pull_requests=$(
            gh api \
              --method GET \
              repos/astral-sh/uv/pulls \
              --raw-field state=all \
              --raw-field head="astral-sh:$HEAD_REF" |
              jq --compact-output \
                --argjson repository_id "$UV_REPOSITORY_ID" \
                '[.[] | select(.head.repo.id == $repository_id)]'
          )
          existing_count=$(jq 'length' <<< "$existing_pull_requests")
          if (( existing_count > 1 )); then
            reject "Found multiple upstream pull requests for $HEAD_REF."
          fi

          if (( existing_count == 1 )); then
            if ! jq --exit-status \
              --arg base_ref "$BASE_REF" \
              --arg head_ref "$HEAD_REF" \
              --arg head_sha "$PROMOTED_HEAD" \
              --argjson repository_id "$UV_REPOSITORY_ID" \
              '.[0].state == "open" and .[0].base.ref == $base_ref and .[0].head.ref == $head_ref and .[0].head.sha == $head_sha and .[0].base.repo.id == $repository_id and .[0].head.repo.id == $repository_id' \
              <<< "$existing_pull_requests" > /dev/null; then
              reject "An upstream pull request already exists with a different state, base, or head."
            fi

            upstream_pull_request=$(jq --compact-output '.[0]' <<< "$existing_pull_requests")
          else
            upstream_refs=$(gh api --method GET "repos/astral-sh/uv/git/matching-refs/heads/$HEAD_REF")
            upstream_head=$(
              jq --raw-output \
                --arg head_ref "refs/heads/$HEAD_REF" \
                '.[] | select(.ref == $head_ref) | .object.sha' \
                <<< "$upstream_refs"
            )

            if [ -n "$upstream_head" ] && [ "$upstream_head" != "$PROMOTED_HEAD" ]; then
              reject "The upstream branch $HEAD_REF already exists at $upstream_head instead of $PROMOTED_HEAD."
            fi

            if [ -z "$upstream_head" ]; then
              if [ "$GITHUB_REPOSITORY" = "astral-sh/uv-security" ]; then
                # The private repository is not in uv's public fork network. Transfer
                # only the approved revision, without checking out its contents here.
                candidate_repository=$(git rev-parse --show-toplevel)
                promotion_repository="$RUNNER_TEMP/promotion.git"
                git -c core.hooksPath=/dev/null init --bare "$promotion_repository"
                promotion_git() {
                  git -C "$promotion_repository" -c core.hooksPath=/dev/null \
                    -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"
                }
                promotion_git fetch --no-tags https://github.com/astral-sh/uv.git \
                  "refs/heads/$BASE_REF:refs/heads/upstream-base"

                public_base="$SOURCE_BASE_SHA"
                if [ "$ACTION" = update-parent ]; then
                  public_base="$BASE_SHA"
                fi
                # Do not disclose an unpublished private parent as part of another PR.
                if ! promotion_git merge-base --is-ancestor "$public_base" refs/heads/upstream-base; then
                  reject "The private pull request base is not on its upstream branch."
                fi

                if [ "$ACTION" = update-parent ]; then
                  # The preceding verification imported the clean parent-update bundle.
                  promotion_git fetch --no-tags "$candidate_repository" \
                    "$PROMOTED_HEAD:refs/heads/approved"
                  promotion_git merge-base --is-ancestor "$public_base" refs/heads/approved
                else
                  promotion_git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" \
                    "$EXPECTED_HEAD_SHA:refs/heads/approved"
                fi
                test "$(promotion_git rev-parse refs/heads/approved)" = "$PROMOTED_HEAD"
                promotion_git merge-base refs/heads/upstream-base refs/heads/approved > /dev/null

                current_pull_request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
                current_head=$(jq --raw-output '.head.sha' <<< "$current_pull_request")
                if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
                  echo "changed_head=$current_head" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                current_approval=$(
                  "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions current-approval \
                    --repo "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
                    --pull-request "$PULL_REQUEST_NUMBER" --expected-head "$EXPECTED_HEAD_SHA" \
                    --approval-id "$REPLAY_APPROVAL_ID"
                )
                if [ "$current_approval" != "$APPROVAL_ID" ] || ! jq --exit-status \
                  --arg base_ref "$SOURCE_BASE_REF" --arg base_head "$SOURCE_BASE_SHA" \
                  --arg head_ref "$HEAD_REF" --argjson repository_id "$GITHUB_REPOSITORY_ID" \
                  '.state == "open" and (.draft | not) and .base.ref == $base_ref and .base.sha == $base_head and .head.ref == $head_ref and .base.repo.id == $repository_id and .head.repo.id == $repository_id' \
                  <<< "$current_pull_request" > /dev/null; then
                  reject "The private pull request or its approval changed before publication."
                fi
                if ! jq --exit-status --arg label "$UV_SECURITY_PUBLISH_LABEL" \
                  '.labels | any(.name == $label)' <<< "$current_pull_request" > /dev/null; then
                  reject "The private pull request requires the $UV_SECURITY_PUBLISH_LABEL label."
                fi

                promotion_git push --force-with-lease="refs/heads/$HEAD_REF:" \
                  https://github.com/astral-sh/uv.git "$PROMOTED_HEAD:refs/heads/$HEAD_REF"
              elif [ "$PROMOTED_HEAD" != "$EXPECTED_HEAD_SHA" ]; then
                git -c core.hooksPath=/dev/null -c credential.helper= -c 'credential.helper=!gh auth git-credential' push \
                  --force-with-lease="refs/heads/$HEAD_REF:" \
                  https://github.com/astral-sh/uv.git "$PROMOTED_HEAD:refs/heads/$HEAD_REF"
              else
                gh api \
                  --method POST \
                  repos/astral-sh/uv/git/refs \
                  --raw-field ref="refs/heads/$HEAD_REF" \
                  --raw-field sha="$PROMOTED_HEAD" \
                  --silent
              fi
            fi

            upstream_pull_request=$(
              jq \
                --arg base_ref "$BASE_REF" \
                --arg head_ref "$HEAD_REF" \
                --arg source_repository "$GITHUB_REPOSITORY" \
                '{
                  title: .title,
                  body: (
                    (.body // "")
                    | gsub(
                      "(?<![[:alnum:]_/])#(?<number>[0-9]+)(?![[:alnum:]_])";
                      "\($source_repository)#\(.number)"
                    )
                  ),
                  base: $base_ref,
                  head: $head_ref
                }' \
                <<< "$source_pull_request" |
                gh api \
                  --method POST \
                  repos/astral-sh/uv/pulls \
                  --input -
            )
          fi

          upstream_number=$(jq --exit-status --raw-output '.number | select(type == "number")' <<< "$upstream_pull_request")

          if jq --exit-status '.labels | any(.name | startswith("bot:") | not)' <<< "$source_pull_request" > /dev/null; then
            jq '{labels: [.labels[].name | select(startswith("bot:") | not)]}' <<< "$source_pull_request" |
              gh api \
                --method POST \
                "repos/astral-sh/uv/issues/$upstream_number/labels" \
                --input - \
                --silent
          fi

          gh api \
            --method POST \
            "repos/astral-sh/uv/issues/$upstream_number/assignees" \
            --raw-field "assignees[]=$PROMOTER" \
            --silent

          echo "number=$upstream_number" >> "$GITHUB_OUTPUT"

      - name: Close source pull request
        id: close
        if: steps.promote.outputs.number != ''
        env:
          APPROVAL_ID: ${{ needs.prepare.outputs.approval_id }}
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PROMOTED_HEAD: ${{ steps.verify.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          REPLAY_APPROVAL_ID: ${{ inputs.approval_id }}
          UPSTREAM_NUMBER: ${{ steps.promote.outputs.number }}
        run: |
          current_approval=$(
            "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions current-approval \
              --repo "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
              --pull-request "$PULL_REQUEST_NUMBER" --expected-head "$EXPECTED_HEAD_SHA" \
              --approval-id "$REPLAY_APPROVAL_ID"
          )
          if [ "$current_approval" != "$APPROVAL_ID" ]; then
            echo "The promotion approval changed after publication; leaving the source unchanged."
            exit 0
          fi
          pull_request=$(gh pr view "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid)
          if ! jq --exit-status \
            '.state == "OPEN" and (.isDraft | not)' \
            <<< "$pull_request" > /dev/null; then
            echo "The source pull request is no longer ready; refusing to close it." >&2
            exit 1
          fi

          upstream_url="https://github.com/astral-sh/uv/pull/$UPSTREAM_NUMBER"
          source_head=$(jq --raw-output '.headRefOid' <<< "$pull_request")
          promoted_head=$(gh pr view "$UPSTREAM_NUMBER" --repo astral-sh/uv --json headRefOid --jq .headRefOid)
          if [ "$source_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "changed_head=$source_head" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$promoted_head" != "$PROMOTED_HEAD" ]; then
            echo "rejection_reason=The upstream promotion moved from $PROMOTED_HEAD to $promoted_head." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr close "$PULL_REQUEST_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Promoted to [#$UPSTREAM_NUMBER]($upstream_url)."

          echo "closed=true" >> "$GITHUB_OUTPUT"
          echo "Promoted $GITHUB_REPOSITORY#$PULL_REQUEST_NUMBER to [#$UPSTREAM_NUMBER]($upstream_url)." >> "$GITHUB_STEP_SUMMARY"

  replay-promoted-children:
    name: Check children of promoted pull request
    needs: promote
    if: github.repository == 'astral-sh/uv-dev' && github.ref == 'refs/heads/main' && needs.promote.outputs.closed == 'true'
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up trusted Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Get promotion read token
        id: read-token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            ${{ github.repository }}
          permissions: |
            contents: read
            pull_requests: read

      - name: Replay children whose parent is already synchronized
        env:
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          GH_SOURCE_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_UPSTREAM_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          PARENT_PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions replay-children \
            --repo "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --parent "$PARENT_PULL_REQUEST" \
            --summary "$GITHUB_STEP_SUMMARY"

  recover:
    name: "Recover rejected promotion #${{ inputs.pull_request }}"
    needs: [prepare, update-pull-request-parent, promote]
    if: always() && needs.prepare.outputs.approval_id != '' && (needs.prepare.outputs.rejection_reason != '' || needs.prepare.outputs.changed_head != '' || needs.promote.outputs.rejection_reason != '' || needs.promote.outputs.changed_head != '' || needs.update-pull-request-parent.outputs.rejection_reason != '' || needs.update-pull-request-parent.outputs.outcome == 'conflicts' || needs.update-pull-request-parent.outputs.outcome == 'empty')
    runs-on: ubuntu-slim
    environment: automations
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up trusted Python automations
        id: automations
        uses: ./.github/actions/setup-automations

      - name: Get promotion token
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            ${{ github.repository }}
          # `workflows: write` is required when the promoted branch modifies workflow files.
          permissions: |
            contents: write
            pull_requests: write
            workflows: write

      - name: Recover rejected promotion
        id: recover
        env:
          APPROVAL_ID: ${{ needs.prepare.outputs.approval_id }}
          AUTOMATIONS_PYTHON: ${{ steps.automations.outputs.python }}
          BASE_REF: ${{ needs.prepare.outputs.source_base_ref }}
          BASE_PREVIOUS_SHA: ${{ needs.prepare.outputs.base_previous_sha }}
          CHANGED_HEAD: ${{ needs.prepare.outputs.changed_head || needs.promote.outputs.changed_head }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          PROMOTER: ${{ needs.prepare.outputs.promoter }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          REPLAY_APPROVAL_ID: ${{ inputs.approval_id }}
          REBASE_REF: ${{ needs.update-pull-request-parent.outputs.outcome == 'conflicts' && needs.prepare.outputs.base_ref || '' }}
          REJECTION_REASON: ${{ needs.prepare.outputs.rejection_reason || needs.promote.outputs.rejection_reason || needs.update-pull-request-parent.outputs.rejection_reason || (needs.update-pull-request-parent.outputs.outcome == 'conflicts' && 'Updating the merged parent requires conflict resolution.') || (needs.update-pull-request-parent.outputs.outcome == 'empty' && 'No child commits remain after updating the merged parent.') || '' }}
          UPSTREAM_NUMBER: ${{ needs.promote.outputs.number }}
        run: |
          current_approval=$(
            "$AUTOMATIONS_PYTHON" -I -m uv_automations promotions current-approval \
              --repo "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
              --pull-request "$PULL_REQUEST_NUMBER" --expected-head "$EXPECTED_HEAD_SHA" \
              --approval-id "$REPLAY_APPROVAL_ID"
          )
          pull_request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
          if [ -z "$APPROVAL_ID" ] || [ "$current_approval" != "$APPROVAL_ID" ] || ! jq --exit-status \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            '.state == "open" and .base.repo.id == $repository_id and .head.repo.id == $repository_id' \
            <<< "$pull_request" > /dev/null; then
            echo "The rejected promotion was superseded; leaving the pull request unchanged."
            exit 0
          fi

          if [ -n "$REBASE_REF" ] && ! jq --exit-status \
            --arg base_ref "$BASE_REF" --arg base_sha "$BASE_PREVIOUS_SHA" \
            --arg head_ref "$HEAD_REF" --arg head_sha "$EXPECTED_HEAD_SHA" \
            '.base.ref == $base_ref and .base.sha == $base_sha and .head.ref == $head_ref and .head.sha == $head_sha' \
            <<< "$pull_request" > /dev/null; then
            echo "The stacked pull request changed before recovery; leaving it unchanged."
            exit 0
          fi

          if jq --exit-status '.draft | not' <<< "$pull_request" > /dev/null; then
            gh pr ready "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/assignees" \
            --raw-field "assignees[]=$PROMOTER" \
            --silent

          if [ -z "$REJECTION_REASON" ]; then
            REJECTION_REASON="Commit $CHANGED_HEAD does not match the approved commit $EXPECTED_HEAD_SHA."
          fi
          comment="Promotion stopped: $REJECTION_REASON Returned this pull request to draft and assigned @$PROMOTER."
          if [ -n "$REBASE_REF" ]; then
            pull_request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
            if ! jq --exit-status \
              --arg base_ref "$BASE_REF" --arg base_sha "$BASE_PREVIOUS_SHA" \
              --arg head_ref "$HEAD_REF" --arg head_sha "$EXPECTED_HEAD_SHA" \
              '.state == "open" and .draft and .base.ref == $base_ref and .base.sha == $base_sha and .head.ref == $head_ref and .head.sha == $head_sha' \
              <<< "$pull_request" > /dev/null; then
              echo "The stacked pull request changed before retargeting; refusing to update it." >&2
              exit 1
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
              --raw-field base="$REBASE_REF" --silent
            if [ "$GITHUB_REPOSITORY" = "astral-sh/uv-security" ]; then
              comment="$comment Retargeted it to $REBASE_REF. Rebase the commits after $BASE_PREVIOUS_SHA, review the result, and mark this pull request ready again."
            else
              comment="$comment Retargeted it to $REBASE_REF so the existing rebase automation can resolve conflicts in the commits after $BASE_PREVIOUS_SHA. Review the result and mark this pull request ready again."
            fi
          else
            comment="$comment Please review the updated changes and mark it ready for review again."
          fi
          if [ -n "$UPSTREAM_NUMBER" ]; then
            comment="$comment An upstream pull request was already created at [#$UPSTREAM_NUMBER](https://github.com/astral-sh/uv/pull/$UPSTREAM_NUMBER)."
          fi
          marker="<!-- uv-promotion-rejection:$APPROVAL_ID:$EXPECTED_HEAD_SHA -->"
          comment="$comment [Promotion run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). $marker"
          comments=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" --paginate --slurp)
          comment_id=$(jq --raw-output --arg marker "$marker" --argjson bot_id "$AUTOMATIONS_BOT_ID" \
            '[.[][] | select(.user.id == $bot_id and (.body | contains($marker))) | .id] | last // empty' <<< "$comments")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field body="$comment" --silent
          else
            gh pr comment "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$comment"
          fi

          echo "Returned $GITHUB_REPOSITORY#$PULL_REQUEST_NUMBER to draft: $REJECTION_REASON" >> "$GITHUB_STEP_SUMMARY"
