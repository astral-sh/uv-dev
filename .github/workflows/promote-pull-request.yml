name: Promote pull request

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The source pull request number, or all ready uv-dev pull requests"
        required: false
        type: string
      head_sha:
        description: "The source pull request head SHA approved for promotion"
        required: false
        type: string
      base_ref:
        description: "The source base branch approved for promotion"
        required: false
        type: string
      promotion_label:
        description: "The label approving promotion"
        required: false
        default: "bot:promote"
        type: choice
        options:
          - "bot:promote"
          - "bot:automerge"

permissions: {}

env:
  UV_REPOSITORY_ID: "699532645"
  UV_DEV_REPOSITORY_ID: "1302176231"
  PROMOTION_LABEL: ${{ inputs.promotion_label || 'bot:promote' }}
  UV_LOCKED: 1

concurrency:
  group: promote-pull-requests-${{ inputs.pull_request || 'main' }}
  cancel-in-progress: false

jobs:
  approval:
    name: Record promotion approval
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pull_request != '' && inputs.head_sha != '' && (github.repository == 'astral-sh/uv-dev' || github.repository == 'astral-sh/uv-security')
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      record: ${{ steps.capture.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture the explicitly approved revision
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          APPROVED_BASE_REF: ${{ inputs.base_ref }}
        run: |
          result=$(python3 agents/scripts/pull-request-promotion-approval.py capture \
            "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" \
            --head-sha "$HEAD_SHA" --base-ref "$APPROVED_BASE_REF" --promotion-label "$PROMOTION_LABEL")
          mkdir -p "$RUNNER_TEMP/promotion-approval"
          jq '.record' <<< "$result" > "$RUNNER_TEMP/promotion-approval/approval.json"
          {
            echo "record=$(jq --compact-output .record <<< "$result")"
            echo "artifact_name=$(jq --raw-output .artifact_name <<< "$result")"
            echo "upload=$(jq --raw-output .upload <<< "$result")"
          } >> "$GITHUB_OUTPUT"
      - name: Persist the promotion approval
        if: steps.capture.outputs.upload == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.capture.outputs.artifact_name }}
          path: ${{ runner.temp }}/promotion-approval/approval.json
          if-no-files-found: error
          retention-days: 90

  identify:
    name: Identify ready pull requests
    needs: approval
    if: always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') && github.ref == 'refs/heads/main' && (github.repository == 'astral-sh/uv-dev' || (github.repository == 'astral-sh/uv-security' && inputs.pull_request != '' && inputs.head_sha != ''))
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      promotions: ${{ steps.plan.outputs.promotions }}
      rebases: ${{ steps.plan.outputs.rebases }}
      promotion-count: ${{ steps.plan.outputs.promotion_count }}
      rebase-count: ${{ steps.plan.outputs.rebase_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan promotions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CAPTURED_APPROVAL: ${{ needs.approval.outputs.record }}
        run: |
          case "$GITHUB_REPOSITORY:$PROMOTION_LABEL" in
            astral-sh/uv-dev:bot:promote|astral-sh/uv-dev:bot:automerge|astral-sh/uv-security:bot:promote) ;;
            *)
              echo "The promotion label is not supported for this repository." >&2
              exit 1
              ;;
          esac

          plan_pull_request() {
            local number="$1" expected_head="$2"
            local source approval approval_id approval_event head_ref head_sha source_base source_base_sha
            local promoter promoter_permission existing existing_head_sha=''
            local base_ref base_sha='' previous_sha='' merge_sha='' merged_parent_number=''
            local parents parent parent_number promoted_parent ancestors ancestor comparison visited='[]'
            local record promotion_label plan promotion_ref promotion_repository refs candidate_head_sha
            if [ -n "$PULL_REQUEST_NUMBER" ]; then
              record="$CAPTURED_APPROVAL"
            else
              record=$(python3 agents/scripts/pull-request-promotion-approval.py load "$GITHUB_REPOSITORY" "$number") || return 1
            fi
            approval=$(python3 agents/scripts/pull-request-promotion-approval.py current "$GITHUB_REPOSITORY" "$number") || return 1
            if ! jq --exit-status --argjson approval "$approval" --argjson number "$number" \
              --arg expected_head "$expected_head" --arg repository "$GITHUB_REPOSITORY" \
              --argjson repository_id "$GITHUB_REPOSITORY_ID" '
                .schema == 2 and .number == $number
                and .repository.id == $repository_id and .repository.full_name == $repository
                and .approval == $approval and .approval != null
                and ($expected_head == "" or .head_sha == $expected_head)
              ' <<< "$record" > /dev/null; then
              echo "The recorded approval no longer matches this promotion." >&2
              return 1
            fi
            expected_head=$(jq --raw-output '.head_sha' <<< "$record")
            promotion_label=$(jq --raw-output '.approval.promotion_label' <<< "$record")
            promoter=$(jq --raw-output '.actor.login // empty' <<< "$approval")
            if [ -z "$promoter" ]; then
              echo "The pull request has no current human promotion event." >&2
              return 1
            fi
            approval_id=$(jq --raw-output '.id' <<< "$approval")
            approval_event=$(jq --raw-output '.event' <<< "$approval")
            source=$(python3 agents/scripts/pull-request-promotion-approval.py source "$GITHUB_REPOSITORY" "$number" \
              --repository-id "$GITHUB_REPOSITORY_ID" --head-sha "$expected_head" --head-ref "$(jq --raw-output .head_ref <<< "$record")" \
              --base-ref "$(jq --raw-output .base_ref <<< "$record")" \
              --approval-id "$approval_id" --approval-event "$approval_event" \
              --promotion-label "$promotion_label" --promoter "$promoter") || return 1
            head_ref=$(jq --raw-output '.head.ref' <<< "$source")
            head_sha=$(jq --raw-output '.head.sha' <<< "$source")
            source_base=$(jq --raw-output '.base.ref' <<< "$source")
            source_base_sha=$(jq --raw-output '.base.sha' <<< "$source")
            base_ref="$source_base"
            git check-ref-format "refs/heads/$base_ref" || return 1
            if [ "$GITHUB_REPOSITORY" = astral-sh/uv-security ]; then
              promoter_permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$promoter/permission") || return 1
              if ! jq --exit-status '.permission | IN("admin", "maintain", "write")' \
                <<< "$promoter_permission" > /dev/null; then
                echo "The private pull request was not approved by a repository writer." >&2
                return 1
              fi
            fi
            existing=$(bash agents/scripts/find-pull-request-promotion.sh "$GITHUB_REPOSITORY" "$number" "$head_ref" "$head_sha") || return 1
            if [ "$existing" != null ]; then
              if ! jq --exit-status '.state == "open" or .merged_at != null' <<< "$existing" > /dev/null; then
                echo "The existing promotion was closed without merging." >&2
                return 1
              fi
              base_ref=$(jq --raw-output '.base.ref' <<< "$existing")
              existing_head_sha=$(jq --raw-output '.head.sha' <<< "$existing")
            fi
            # A changed upstream head needs the same clean-rebase proof as a pending branch.
            if [ "$source_base" != main ] && { [ "$existing" = null ] || [ "$existing_head_sha" != "$head_sha" ]; }; then
              parents=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$source_base" --limit 1000 \
                --json number,headRefName,headRefOid,headRepository |
                jq --compact-output --arg source_base "$source_base" --arg source_repository "$GITHUB_REPOSITORY" \
                  '[.[] | select(.headRefName == $source_base and .headRepository.nameWithOwner == $source_repository)]') || return 1
              if [ "$(jq 'length' <<< "$parents")" -gt 1 ]; then
                echo "The stacked base has multiple possible source parents." >&2
                return 1
              fi
              parent_number=$(jq --raw-output '.[0].number // empty' <<< "$parents")
              if [ -n "$parent_number" ]; then
                parent=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$parent_number") || return 1
                if ! jq --exit-status --arg source_base "$source_base" --arg source_base_sha "$source_base_sha" \
                  --argjson repository_id "$GITHUB_REPOSITORY_ID" '
                    .base.repo.id == $repository_id and .head.repo.id == $repository_id
                    and .head.ref == $source_base and .head.sha == $source_base_sha
                  ' <<< "$parent" > /dev/null; then
                  echo "The source parent no longer matches the stacked base." >&2
                  return 1
                fi
                promoted_parent=$(bash agents/scripts/find-pull-request-promotion.sh "$GITHUB_REPOSITORY" "$parent_number" "$source_base" "$source_base_sha") || return 1
                if [ "$promoted_parent" = null ] || [ "$(jq --raw-output '.state' <<< "$promoted_parent")" = open ]; then
                  echo "Waiting for $GITHUB_REPOSITORY#$parent_number to merge upstream." >&2
                  echo null
                  return
                fi
                if ! jq --exit-status '.merged_at != null' <<< "$promoted_parent" > /dev/null; then
                  echo "The upstream parent was closed without merging." >&2
                  return 1
                fi
                previous_sha="$source_base_sha"
                base_ref=$(jq --raw-output '.base.ref' <<< "$promoted_parent")
                merge_sha=$(jq --raw-output '.merge_commit_sha' <<< "$promoted_parent")
                merged_parent_number=$(jq --raw-output '.number' <<< "$promoted_parent")
                visited=$(jq --null-input --compact-output --arg source_base "$source_base" '[$source_base]')
                # A legacy promotion may have merged into another copied stack branch.
                while [ "$base_ref" != main ]; do
                  if jq --exit-status --arg base_ref "$base_ref" 'index($base_ref) != null' <<< "$visited" > /dev/null; then
                    echo "The upstream stack contains a cycle." >&2
                    return 1
                  fi
                  visited=$(jq --compact-output --arg base_ref "$base_ref" '. + [$base_ref]' <<< "$visited")
                  ancestors=$(gh pr list --repo astral-sh/uv --state all --head "$base_ref" --limit 1000 \
                    --json number,headRefName,headRepository |
                    jq --compact-output --arg base_ref "$base_ref" \
                      '[.[] | select(.headRefName == $base_ref and .headRepository.nameWithOwner == "astral-sh/uv")]') || return 1
                  if [ "$(jq 'length' <<< "$ancestors")" -gt 1 ]; then
                    echo "The upstream stack has multiple possible parents." >&2
                    return 1
                  fi
                  parent_number=$(jq --raw-output '.[0].number // empty' <<< "$ancestors")
                  if [ -z "$parent_number" ]; then
                    break
                  fi
                  ancestor=$(gh api "repos/astral-sh/uv/pulls/$parent_number") || return 1
                  if ! jq --exit-status --arg base_ref "$base_ref" --argjson repository_id "$UV_REPOSITORY_ID" \
                    '.base.repo.id == $repository_id and .head.repo.id == $repository_id and .head.ref == $base_ref' \
                    <<< "$ancestor" > /dev/null; then
                    echo "The upstream ancestor changed repositories or branches." >&2
                    return 1
                  fi
                  if [ "$(jq --raw-output '.state' <<< "$ancestor")" = open ]; then
                    echo "Waiting for astral-sh/uv#$parent_number to merge." >&2
                    echo null
                    return
                  fi
                  if ! jq --exit-status '.merged_at != null' <<< "$ancestor" > /dev/null; then
                    echo "The upstream ancestor was closed without merging." >&2
                    return 1
                  fi
                  base_ref=$(jq --raw-output '.base.ref' <<< "$ancestor")
                  merge_sha=$(jq --raw-output '.merge_commit_sha' <<< "$ancestor")
                  merged_parent_number="$parent_number"
                done
              else
                ancestors=$(gh pr list --repo astral-sh/uv --state all --head "$source_base" --limit 1000 \
                  --json headRefName,headRepository |
                  jq --compact-output --arg source_base "$source_base" \
                    '[.[] | select(.headRefName == $source_base and .headRepository.nameWithOwner == "astral-sh/uv")]') || return 1
                if [ "$(jq 'length' <<< "$ancestors")" != 0 ]; then
                  echo "The stacked base has no verified uv-dev parent." >&2
                  return 1
                fi
              fi
            fi
            git check-ref-format "refs/heads/$base_ref" || return 1
            if [ "$existing" != null ] && [ "$existing_head_sha" != "$head_sha" ]; then
              if [ -z "$previous_sha" ] || [ "$base_ref" != "$(jq --raw-output '.base.ref' <<< "$existing")" ]; then
                echo "The existing promotion has no verified clean parent update." >&2
                return 1
              fi
            fi
            if [ "$existing" = null ]; then
              gh api "repos/astral-sh/uv/git/ref/heads/$base_ref" --silent || return 1
            fi
            if [ -n "$previous_sha" ]; then
              base_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$base_ref" --jq .object.sha) || return 1
              comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$merge_sha...$base_sha") || return 1
              if ! jq --exit-status '.status | IN("ahead", "identical")' <<< "$comparison" > /dev/null; then
                echo "Waiting for the merged parent to sync to $GITHUB_REPOSITORY." >&2
                echo null
                return
              fi
            fi
            plan=$(jq --null-input --compact-output \
              --argjson number "$number" --arg promoter "$promoter" \
              --arg approval_id "$approval_id" --arg approval_event "$approval_event" \
              --arg promotion_label "$promotion_label" \
              --arg head_ref "$head_ref" --arg head_sha "$head_sha" \
              --arg existing_head_sha "$existing_head_sha" \
              --arg source_base "$source_base" --arg source_base_sha "$source_base_sha" \
              --arg base_ref "$base_ref" --arg base_sha "$base_sha" \
              --arg previous_sha "$previous_sha" --arg merge_sha "$merge_sha" \
              --arg merged_parent_number "$merged_parent_number" '
                {$number, $promoter, $approval_id, $approval_event, $promotion_label,
                 $head_ref, $head_sha, $existing_head_sha, $source_base, $source_base_sha,
                 $base_ref, $base_sha, $previous_sha, $merge_sha, $merged_parent_number,
                 candidate_head_sha: "",
                 action: (if $previous_sha == "" then "promote" else "rebase" end)}') || return 1
            if [ -n "$previous_sha" ]; then
              if [ "$GITHUB_REPOSITORY" = astral-sh/uv-security ]; then
                promotion_repository=astral-sh/uv
                promotion_ref="automations/promote/security/$number"
              else
                promotion_repository="$GITHUB_REPOSITORY"
                promotion_ref="automations/promote/$number"
              fi
              refs=$(gh api "repos/$promotion_repository/git/matching-refs/heads/$promotion_ref") || return 1
              candidate_head_sha=$(jq --raw-output --arg ref "refs/heads/$promotion_ref" \
                '.[] | select(.ref == $ref) | .object.sha' <<< "$refs")
              if [ "$existing" != null ] && [ "$candidate_head_sha" != "$existing_head_sha" ]; then
                echo "The existing promotion branch changed or disappeared." >&2
                return 1
              fi
              if [ -n "$candidate_head_sha" ]; then
                python3 agents/scripts/pull-request-promotion-approval.py load-candidate "$GITHUB_REPOSITORY" "$number" \
                  --repository-id "$GITHUB_REPOSITORY_ID" --plan "$plan" \
                  --candidate-sha "$candidate_head_sha" > /dev/null || return 1
                plan=$(jq --compact-output --arg head "$candidate_head_sha" \
                  '.candidate_head_sha = $head | .existing_head_sha = $head | .action = "promote"' <<< "$plan")
              fi
            fi
            echo "$plan"
          }

          if [ -n "$PULL_REQUEST_NUMBER" ]; then
            if ! [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid pull request number." >&2
              exit 1
            fi
            if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "An approved pull request head SHA is required; refusing to promote it." >&2
              exit 1
            fi
            numbers="$PULL_REQUEST_NUMBER"
          else
            numbers=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
              --json number,isDraft,isCrossRepository,headRefName,labels |
              jq --raw-output '
                .[] | select(
                  ((.isDraft | not) or any(.labels[]; .name == "bot:promote" or .name == "bot:automerge"))
                  and (.isCrossRepository | not)
                  and (.headRefName | startswith("automations/promote/") | not)
                ) | .number')
          fi
          plans='[]'
          while IFS= read -r number; do
            if [ -z "$number" ]; then
              continue
            fi
            if candidate=$(plan_pull_request "$number" "$HEAD_SHA"); then
              if [ "$candidate" = null ]; then
                echo "- $GITHUB_REPOSITORY#$number is waiting for its parent." >> "$GITHUB_STEP_SUMMARY"
              else
                plans=$(jq --compact-output --argjson candidate "$candidate" '. + [$candidate]' <<< "$plans")
              fi
            elif [ -n "$PULL_REQUEST_NUMBER" ]; then
              exit 1
            else
              echo "- $GITHUB_REPOSITORY#$number could not be promoted; see the job log." >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$numbers"
          if [ "$(jq 'length' <<< "$plans")" -gt 256 ]; then
            echo "The promotion matrix exceeds 256 pull requests." >&2
            exit 1
          fi
          {
            echo "promotions=$(jq --compact-output '{include: .}' <<< "$plans")"
            echo "rebases=$(jq --compact-output '{include: [.[] | select(.action == "rebase")]}' <<< "$plans")"
            echo "promotion_count=$(jq 'length' <<< "$plans")"
            echo "rebase_count=$(jq '[.[] | select(.action == "rebase")] | length' <<< "$plans")"
          } >> "$GITHUB_OUTPUT"

  rebase:
    name: "Prepare promotion of ${{ github.repository }}#${{ matrix.number }}"
    needs: identify
    if: always() && needs.identify.result == 'success' && needs.identify.outputs.rebase-count != '0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.identify.outputs.rebases) }}
    uses: $/.github/workflows/update-pull-request-parent.yml
    with:
      number: ${{ format('{0}', matrix.number) }}
      source-base-ref: ${{ matrix.source_base }}
      base-ref: ${{ matrix.base_ref }}
      base-sha: ${{ matrix.base_sha }}
      base-previous-sha: ${{ matrix.previous_sha }}
      parent-merge-sha: ${{ matrix.merge_sha }}
      head-ref: ${{ matrix.head_ref }}
      head-sha: ${{ matrix.head_sha }}

  promote:
    name: "Promote ${{ github.repository }}#${{ matrix.number }}"
    needs: [identify, rebase]
    if: always() && needs.identify.result == 'success' && needs.identify.outputs.promotion-count != '0'
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-2' || 'ubuntu-slim' }}
    environment: automations
    env:
      PROMOTION_LABEL: ${{ matrix.promotion_label }}
    timeout-minutes: 10
    concurrency:
      group: promote-pull-request-${{ matrix.number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.identify.outputs.promotions) }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download parent update outcome
        if: matrix.action == 'rebase'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parent-update-outcome-${{ matrix.number }}-${{ matrix.head_sha }}
          path: ${{ runner.temp }}/parent-update-outcome

      - name: Check parent update outcome
        id: parent-update
        if: matrix.action == 'rebase'
        env:
          PULL_REQUEST_NUMBER: ${{ matrix.number }}
          SOURCE_BASE: ${{ matrix.source_base }}
          BASE_REF: ${{ matrix.base_ref }}
          BASE_SHA: ${{ matrix.base_sha }}
          BASE_PREVIOUS_SHA: ${{ matrix.previous_sha }}
          PARENT_MERGE_SHA: ${{ matrix.merge_sha }}
          HEAD_REF: ${{ matrix.head_ref }}
          HEAD_SHA: ${{ matrix.head_sha }}
        run: |
          result="$RUNNER_TEMP/parent-update-outcome/parent-update-outcome.json"
          jq --exit-status \
            --arg number "$PULL_REQUEST_NUMBER" --arg source_base "$SOURCE_BASE" \
            --arg base_ref "$BASE_REF" --arg base_sha "$BASE_SHA" \
            --arg previous_sha "$BASE_PREVIOUS_SHA" --arg merge_sha "$PARENT_MERGE_SHA" \
            --arg head_ref "$HEAD_REF" --arg head_sha "$HEAD_SHA" '
              .schema == 1 and .number == $number and .source_base_ref == $source_base
              and .base_ref == $base_ref and .base_sha == $base_sha
              and .previous_sha == $previous_sha and .merge_sha == $merge_sha
              and .head_ref == $head_ref and .head_sha == $head_sha
              and (.outcome | IN("clean", "conflicts", "empty", "rejected", "failed"))
              and (.candidate_head | type == "string")
              and (.rejection_reason | type == "string" and length <= 1000 and (test("[\\r\\n]") | not))
            ' "$result" > /dev/null
          outcome=$(jq --raw-output .outcome "$result")
          reason=$(jq --raw-output .rejection_reason "$result")
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          case "$outcome" in
            clean)
              candidate_head=$(jq --raw-output .candidate_head "$result")
              if [[ ! "$candidate_head" =~ ^[0-9a-f]{40}$ ]]; then
                echo "The clean parent update has no valid candidate revision." >&2
                exit 1
              fi
              echo "head_sha=$candidate_head" >> "$GITHUB_OUTPUT"
              ;;
            conflicts) reason="The parent update has merge conflicts; resolve them before approving promotion." ;;
            empty) reason="The parent update has no changes to promote." ;;
            rejected) reason="${reason:-The source or destination changed before its parent update.}" ;;
            failed) reason="${reason:-The parent update failed mechanical verification; inspect its job log.}" ;;
          esac
          if [ "$outcome" != clean ]; then
            echo "rejection_reason=$reason" >> "$GITHUB_OUTPUT"
            echo "$reason" >&2
            exit 1
          fi

      - name: Download rebased pull request
        if: matrix.action == 'rebase' && steps.parent-update.outputs.outcome == 'clean'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updated-pull-request-parent-${{ matrix.number }}-${{ matrix.head_sha }}
          path: ${{ runner.temp }}/updated-pull-request-parent

      - name: Verify promotion revision
        id: verify
        env:
          ACTION: ${{ matrix.action }}
          BASE_REF: ${{ matrix.base_ref }}
          BASE_SHA: ${{ matrix.base_sha }}
          HEAD_SHA: ${{ matrix.head_sha }}
          PARENT_MERGE_SHA: ${{ matrix.merge_sha }}
          EXISTING_HEAD_SHA: ${{ matrix.existing_head_sha }}
          PARENT_UPDATE_HEAD: ${{ steps.parent-update.outputs.head_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          promoted_head="$HEAD_SHA"
          if [ -n "$EXISTING_HEAD_SHA" ]; then
            if [[ ! "$EXISTING_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$ACTION" != promote ]; then
              echo "Invalid existing promotion revision." >&2
              exit 1
            fi
            promoted_head="$EXISTING_HEAD_SHA"
          elif [ "$ACTION" = "rebase" ]; then
            current_base=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
            if [ "$current_base" != "$BASE_SHA" ]; then
              echo "The promotion base changed; refusing to publish a stale rebase." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$PARENT_MERGE_SHA" "$BASE_SHA"
            bundle="$RUNNER_TEMP/updated-pull-request-parent/updated-parent.bundle"
            git bundle verify "$bundle"
            git -c core.hooksPath=/dev/null fetch --no-tags "$bundle" HEAD
            promoted_head=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [ "$promoted_head" != "$PARENT_UPDATE_HEAD" ]; then
              echo "The parent-update bundle does not match its recorded outcome." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$BASE_SHA" "$promoted_head"
          fi
          echo "head_sha=$promoted_head" >> "$GITHUB_OUTPUT"

      - name: Recheck promotion plan
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ matrix.number }}
          HEAD_REF: ${{ matrix.head_ref }}
          HEAD_SHA: ${{ matrix.head_sha }}
          SOURCE_BASE: ${{ matrix.source_base }}
          SOURCE_BASE_SHA: ${{ matrix.source_base_sha }}
          BASE_REF: ${{ matrix.base_ref }}
          BASE_SHA: ${{ matrix.base_sha }}
          PARENT_MERGE_SHA: ${{ matrix.merge_sha }}
          MERGED_PARENT_NUMBER: ${{ matrix.merged_parent_number }}
          CANDIDATE_HEAD_SHA: ${{ matrix.candidate_head_sha }}
          PROMOTED_HEAD: ${{ steps.verify.outputs.head_sha }}
          PROMOTER: ${{ matrix.promoter }}
          APPROVAL_ID: ${{ matrix.approval_id }}
          APPROVAL_EVENT: ${{ matrix.approval_event }}
        run: |
          source_pull_request=$(python3 agents/scripts/pull-request-promotion-approval.py source "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" \
            --repository-id "$GITHUB_REPOSITORY_ID" --head-sha "$HEAD_SHA" --head-ref "$HEAD_REF" --base-ref "$SOURCE_BASE" \
            --approval-id "$APPROVAL_ID" --approval-event "$APPROVAL_EVENT" \
            --promotion-label "$PROMOTION_LABEL" --promoter "$PROMOTER")
          if ! jq --exit-status --arg source_base "$SOURCE_BASE" --arg source_base_sha "$SOURCE_BASE_SHA" \
            --arg source_repository "$GITHUB_REPOSITORY" '
              .base.ref == $source_base
              and ($source_repository != "astral-sh/uv-security" or .base.sha == $source_base_sha)
              and ($source_repository != "astral-sh/uv-dev" or $source_base == "main" or .base.sha == $source_base_sha)
            ' <<< "$source_pull_request" > /dev/null; then
            echo "The source base changed before publication." >&2
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" = astral-sh/uv-security ]; then
            promoter_permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PROMOTER/permission")
            if ! jq --exit-status '.permission | IN("admin", "maintain", "write")' \
              <<< "$promoter_permission" > /dev/null; then
              echo "The private pull request is no longer approved by a repository writer." >&2
              exit 1
            fi
          fi
          existing=$(bash agents/scripts/find-pull-request-promotion.sh "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" "$HEAD_REF" "$HEAD_SHA")
          if [ "$existing" != null ]; then
            if ! jq --exit-status --arg base_ref "$BASE_REF" --arg promoted_head "$PROMOTED_HEAD" \
              '(.state == "open" or .merged_at != null) and .base.ref == $base_ref and .head.sha == $promoted_head' \
              <<< "$existing" > /dev/null; then
              echo "The existing promotion has a different state, base, or head." >&2
              exit 1
            fi
          else
            if [ -n "$CANDIDATE_HEAD_SHA" ]; then
              if [ "$GITHUB_REPOSITORY" = astral-sh/uv-security ]; then
                promotion_repository=astral-sh/uv
                promotion_ref="automations/promote/security/$PULL_REQUEST_NUMBER"
              else
                promotion_repository="$GITHUB_REPOSITORY"
                promotion_ref="automations/promote/$PULL_REQUEST_NUMBER"
              fi
              refs=$(gh api "repos/$promotion_repository/git/matching-refs/heads/$promotion_ref")
              current_head=$(jq --raw-output --arg ref "refs/heads/$promotion_ref" \
                '.[] | select(.ref == $ref) | .object.sha' <<< "$refs")
              if [ "$current_head" != "$CANDIDATE_HEAD_SHA" ]; then
                echo "The verified candidate branch changed before publication." >&2
                exit 1
              fi
            fi
            if [ -n "$PARENT_MERGE_SHA" ]; then
              merged_parent=$(gh api "repos/astral-sh/uv/pulls/$MERGED_PARENT_NUMBER")
              if ! jq --exit-status --arg base_ref "$BASE_REF" --arg merge_sha "$PARENT_MERGE_SHA" \
                --argjson repository_id "$UV_REPOSITORY_ID" \
                '.merged_at != null and .base.repo.id == $repository_id and .base.ref == $base_ref and .merge_commit_sha == $merge_sha' \
                <<< "$merged_parent" > /dev/null; then
                echo "The merged parent no longer matches the promotion plan." >&2
                exit 1
              fi
              current_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF" --jq .object.sha)
              if [ "$current_base" != "$BASE_SHA" ]; then
                echo "The promotion base changed; refusing to publish a stale rebase." >&2
                exit 1
              fi
            fi
          fi
          jq . <<< "$source_pull_request" > "$RUNNER_TEMP/pull-request.json"
          jq . <<< "$existing" > "$RUNNER_TEMP/upstream-pull-request.json"
          echo "upstream_number=$(jq --raw-output '.number // empty' <<< "$existing")" >> "$GITHUB_OUTPUT"

      - name: Capture verified promotion candidate
        id: candidate
        if: matrix.action == 'rebase' && steps.recheck.outputs.upstream_number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ matrix.number }}
          PROMOTION_PLAN: ${{ toJSON(matrix) }}
          PROMOTED_HEAD: ${{ steps.verify.outputs.head_sha }}
        run: |
          result=$(python3 agents/scripts/pull-request-promotion-approval.py capture-candidate \
            "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" --repository-id "$GITHUB_REPOSITORY_ID" \
            --plan "$PROMOTION_PLAN" --candidate-sha "$PROMOTED_HEAD")
          mkdir -p "$RUNNER_TEMP/promotion-candidate"
          jq '.record' <<< "$result" > "$RUNNER_TEMP/promotion-candidate/candidate.json"
          {
            echo "artifact_name=$(jq --raw-output .artifact_name <<< "$result")"
            echo "upload=$(jq --raw-output .upload <<< "$result")"
            echo "overwrite=$(jq --raw-output .overwrite <<< "$result")"
          } >> "$GITHUB_OUTPUT"

      - name: Persist verified promotion candidate
        if: steps.candidate.outputs.upload == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/promotion-candidate/candidate.json
          if-no-files-found: error
          overwrite: ${{ steps.candidate.outputs.overwrite == 'true' }}
          retention-days: 90

      - name: Get promotion token
        id: token
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: |
            astral-sh/uv
            ${{ github.repository }}
          # The fresh promotion branch can include workflow changes.
          permissions: |
            contents: write
            pull_requests: write
            workflows: write

      - name: Promote pull request
        id: publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ matrix.number }}
          HEAD_REF: ${{ matrix.head_ref }}
          HEAD_SHA: ${{ matrix.head_sha }}
          SOURCE_BASE: ${{ matrix.source_base }}
          SOURCE_BASE_SHA: ${{ matrix.source_base_sha }}
          BASE_REF: ${{ matrix.base_ref }}
          BASE_SHA: ${{ matrix.base_sha }}
          ACTION: ${{ matrix.action }}
          PROMOTER: ${{ matrix.promoter }}
          APPROVAL_ID: ${{ matrix.approval_id }}
          APPROVAL_EVENT: ${{ matrix.approval_event }}
          UPSTREAM_NUMBER: ${{ steps.recheck.outputs.upstream_number }}
          PROMOTED_HEAD: ${{ steps.verify.outputs.head_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          check_automerge_permission() {
            local promoter_permission
            promoter_permission=$(gh api "repos/astral-sh/uv/collaborators/$PROMOTER/permission") || return 1
            if ! jq --exit-status '.permission | IN("admin", "maintain", "write")' \
              <<< "$promoter_permission" > /dev/null; then
              echo "Auto-merge requires approval from an upstream repository writer." >&2
              return 1
            fi
          }

          # The publication token includes upstream metadata access; the planner token does not.
          if [ "$PROMOTION_LABEL" = bot:automerge ]; then
            check_automerge_permission
          fi
          if [ "$GITHUB_REPOSITORY" = astral-sh/uv-security ]; then
            promotion_ref="automations/promote/security/$PULL_REQUEST_NUMBER"
            marker="<!-- uv-security-promotion:$PULL_REQUEST_NUMBER:$HEAD_SHA -->"
            promotion_repository=astral-sh/uv
            promotion_repository_id="$UV_REPOSITORY_ID"
          else
            promotion_ref="automations/promote/$PULL_REQUEST_NUMBER"
            marker="<!-- uv-dev-promotion:$PULL_REQUEST_NUMBER:$HEAD_SHA -->"
            promotion_repository=astral-sh/uv-dev
            promotion_repository_id="$UV_DEV_REPOSITORY_ID"
          fi
          source_pull_request=$(python3 agents/scripts/pull-request-promotion-approval.py source "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" \
            --repository-id "$GITHUB_REPOSITORY_ID" --head-sha "$HEAD_SHA" --head-ref "$HEAD_REF" --base-ref "$SOURCE_BASE" \
            --approval-id "$APPROVAL_ID" --approval-event "$APPROVAL_EVENT" \
            --promotion-label "$PROMOTION_LABEL" --promoter "$PROMOTER")
          if ! jq --exit-status --slurpfile expected "$RUNNER_TEMP/pull-request.json" \
            --arg source_repository "$GITHUB_REPOSITORY" '
              .base.ref == $expected[0].base.ref
              and ($source_repository != "astral-sh/uv-security" or .base.sha == $expected[0].base.sha)
              and ($source_repository != "astral-sh/uv-dev" or .base.ref == "main" or .base.sha == $expected[0].base.sha)
            ' <<< "$source_pull_request" > /dev/null; then
            echo "The source base changed before publication." >&2
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" = astral-sh/uv-security ]; then
            promoter_permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PROMOTER/permission")
            if ! jq --exit-status '.permission | IN("admin", "maintain", "write")' \
              <<< "$promoter_permission" > /dev/null; then
              echo "The private pull request is no longer approved by a repository writer." >&2
              exit 1
            fi
          fi
          if [ -n "$UPSTREAM_NUMBER" ]; then
            upstream_pull_request=$(gh api "repos/astral-sh/uv/pulls/$UPSTREAM_NUMBER")
            if ! jq --exit-status --slurpfile expected "$RUNNER_TEMP/upstream-pull-request.json" \
              --arg marker "$marker" --arg promotion_ref "$promotion_ref" \
              --arg head_sha "$HEAD_SHA" --arg promoted_head "$PROMOTED_HEAD" --argjson uv_id "$UV_REPOSITORY_ID" '
                (.state == "open" or .merged_at != null)
                and .base.repo.id == $uv_id and .base.ref == $expected[0].base.ref
                and .head.repo.id == $expected[0].head.repo.id and .head.ref == $expected[0].head.ref
                and .head.sha == $promoted_head
                and (if .head.ref == $promotion_ref then
                  .user.login == "astral-automations-bot[bot]"
                  and ((.body // "" | sub("\\s+$"; "")) | endswith($marker))
                else .head.sha == $head_sha end)
              ' <<< "$upstream_pull_request" > /dev/null; then
              echo "The existing promotion changed before publication." >&2
              exit 1
            fi
          else
            refs=$(gh api "repos/$promotion_repository/git/matching-refs/heads/$promotion_ref")
            current_head=$(jq --raw-output --arg ref "refs/heads/$promotion_ref" \
              '.[] | select(.ref == $ref) | .object.sha' <<< "$refs")
            if [ -n "$current_head" ] && [ "$current_head" != "$PROMOTED_HEAD" ]; then
              echo "The promotion branch already exists at a different revision; refusing to overwrite it." >&2
              exit 1
            fi
            if [ -z "$current_head" ]; then
              if [ "$GITHUB_REPOSITORY" = astral-sh/uv-security ]; then
                # The private repository is not in uv's public fork network. Transfer
                # only the approved revision, without checking out its contents here.
                candidate_repository=$(git rev-parse --show-toplevel)
                promotion_git_directory="$RUNNER_TEMP/promotion.git"
                git -c core.hooksPath=/dev/null init --bare "$promotion_git_directory"
                promotion_git() {
                  git -C "$promotion_git_directory" -c core.hooksPath=/dev/null \
                    -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"
                }
                promotion_git fetch --no-tags https://github.com/astral-sh/uv.git \
                  "refs/heads/$BASE_REF:refs/heads/upstream-base"

                public_base="$SOURCE_BASE_SHA"
                if [ "$ACTION" = rebase ]; then
                  public_base="$BASE_SHA"
                fi
                # Do not disclose an unpublished private parent as part of another pull request.
                if ! promotion_git merge-base --is-ancestor "$public_base" refs/heads/upstream-base; then
                  echo "The private pull request base is not on its upstream branch." >&2
                  exit 1
                fi

                if [ "$ACTION" = rebase ]; then
                  # The preceding verification imported the rebased candidate bundle.
                  promotion_git fetch --no-tags "$candidate_repository" \
                    "$PROMOTED_HEAD:refs/heads/approved"
                  promotion_git merge-base --is-ancestor "$public_base" refs/heads/approved
                else
                  promotion_git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" \
                    "$HEAD_SHA:refs/heads/approved"
                fi
                test "$(promotion_git rev-parse refs/heads/approved)" = "$PROMOTED_HEAD"
                promotion_git merge-base refs/heads/upstream-base refs/heads/approved > /dev/null

                current_pull_request=$(python3 agents/scripts/pull-request-promotion-approval.py source "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" \
                  --repository-id "$GITHUB_REPOSITORY_ID" --head-sha "$HEAD_SHA" --head-ref "$HEAD_REF" --base-ref "$SOURCE_BASE" \
                  --approval-id "$APPROVAL_ID" --approval-event "$APPROVAL_EVENT" \
                  --promotion-label "$PROMOTION_LABEL" --promoter "$PROMOTER")
                if ! jq --exit-status --slurpfile expected "$RUNNER_TEMP/pull-request.json" '
                    .base.ref == $expected[0].base.ref and .base.sha == $expected[0].base.sha
                  ' <<< "$current_pull_request" > /dev/null; then
                  echo "The private pull request base changed before publication." >&2
                  exit 1
                fi
                promoter_permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PROMOTER/permission")
                if ! jq --exit-status '.permission | IN("admin", "maintain", "write")' \
                  <<< "$promoter_permission" > /dev/null; then
                  echo "The private pull request is no longer approved by its repository writer." >&2
                  exit 1
                fi

                promotion_git push --force-with-lease="refs/heads/$promotion_ref:" \
                  https://github.com/astral-sh/uv.git "$PROMOTED_HEAD:refs/heads/$promotion_ref"
              elif [ "$ACTION" = rebase ]; then
                # The imported bundle is never checked out in this writer job.
                git -c core.hooksPath=/dev/null -c credential.helper= \
                  -c 'credential.helper=!gh auth git-credential' push \
                  --force-with-lease="refs/heads/$promotion_ref:" \
                  "https://github.com/$promotion_repository.git" \
                  "$PROMOTED_HEAD:refs/heads/$promotion_ref"
              else
                if [ "$PROMOTED_HEAD" != "$HEAD_SHA" ]; then
                  echo "Unexpected promotion revision." >&2
                  exit 1
                fi
                gh api --method POST "repos/$promotion_repository/git/refs" \
                  --raw-field ref="refs/heads/$promotion_ref" \
                  --raw-field sha="$PROMOTED_HEAD" --silent
              fi
            fi
            upstream_pull_request=$(
              jq --arg base_ref "$BASE_REF" --arg head_ref "astral-sh:$promotion_ref" --arg marker "$marker" \
                --arg source_repository "$GITHUB_REPOSITORY" --arg promotion_repository "$promotion_repository" '
                {
                  title: .title,
                  body: ((.body // "" | gsub(
                    "(?<![[:alnum:]_/])#(?<number>[0-9]+)(?![[:alnum:]_])";
                    "\($source_repository)#\(.number)"
                  )) + "\n\n" + $marker),
                  base: $base_ref,
                  head: $head_ref,
                  head_repo: $promotion_repository
                }' <<< "$source_pull_request" |
                gh api --method POST repos/astral-sh/uv/pulls --input -
            )
            upstream_number=$(jq --exit-status --raw-output '.number | select(type == "number")' <<< "$upstream_pull_request")
            echo "upstream_number=$upstream_number" >> "$GITHUB_OUTPUT"
            if ! jq --exit-status --arg head_ref "$promotion_ref" --arg head_sha "$PROMOTED_HEAD" \
              --arg base_ref "$BASE_REF" --argjson uv_id "$UV_REPOSITORY_ID" \
              --argjson promotion_repository_id "$promotion_repository_id" \
              '.base.repo.id == $uv_id and .base.ref == $base_ref and .head.repo.id == $promotion_repository_id and .head.ref == $head_ref and .head.sha == $head_sha' \
              <<< "$upstream_pull_request" > /dev/null; then
              echo "The created upstream pull request has an unexpected head." >&2
              exit 1
            fi
          fi
          upstream_number=$(jq --exit-status --raw-output '.number | select(type == "number")' <<< "$upstream_pull_request")
          # Automation controls and triage labels belong to the source repository.
          upstream_labels=$(jq '{labels: [.labels[].name | select(test("^(bot|priority|size|risk|severity):") | not)]}' <<< "$source_pull_request")
          if jq --exit-status '.labels | length > 0' <<< "$upstream_labels" > /dev/null; then
            gh api --method POST "repos/astral-sh/uv/issues/$upstream_number/labels" \
              --input - --silent <<< "$upstream_labels"
          fi
          gh api --method POST "repos/astral-sh/uv/issues/$upstream_number/assignees" \
            --raw-field "assignees[]=$PROMOTER" --silent
          current_source=$(python3 agents/scripts/pull-request-promotion-approval.py source "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER" \
            --repository-id "$GITHUB_REPOSITORY_ID" --head-sha "$HEAD_SHA" --head-ref "$HEAD_REF" --base-ref "$SOURCE_BASE" \
            --approval-id "$APPROVAL_ID" --approval-event "$APPROVAL_EVENT" \
            --promotion-label "$PROMOTION_LABEL" --promoter "$PROMOTER")
          if ! jq --exit-status --slurpfile expected "$RUNNER_TEMP/pull-request.json" \
            '.base.ref == $expected[0].base.ref' <<< "$current_source" > /dev/null; then
            echo "The source base changed before it could be closed." >&2
            exit 1
          fi
          if [ "$PROMOTION_LABEL" = bot:automerge ]; then
            check_automerge_permission
            gh pr merge "$upstream_number" --repo astral-sh/uv --auto --squash \
              --match-head-commit "$PROMOTED_HEAD"
          fi
          gh pr close "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "Promoted to astral-sh/uv#$upstream_number."
          echo "Promoted $GITHUB_REPOSITORY#$PULL_REQUEST_NUMBER to astral-sh/uv#$upstream_number." >> "$GITHUB_STEP_SUMMARY"

      - name: Get recovery token
        id: recovery-token
        if: failure()
        uses: open-security-tools/ost-simple-sts@974a63a2daaaa40f7c6dec40d334f3da4421469e
        with:
          exchange-url: ${{ secrets.STS_API_URL }}/exchange
          audience: ${{ secrets.STS_API_URL }}
          repositories: ${{ github.repository }}
          permissions: |
            pull_requests: write

      - name: Recover rejected promotion
        if: failure() && steps.recovery-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.recovery-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ matrix.number }}
          HEAD_SHA: ${{ matrix.head_sha }}
          SOURCE_BASE: ${{ matrix.source_base }}
          PARENT_UPDATE_OUTCOME: ${{ steps.parent-update.outputs.outcome }}
          PARENT_UPDATE_REASON: ${{ steps.parent-update.outputs.rejection_reason }}
          PROMOTER: ${{ matrix.promoter }}
          APPROVAL_ID: ${{ matrix.approval_id }}
          UPSTREAM_NUMBER: ${{ steps.publish.outputs.upstream_number || steps.recheck.outputs.upstream_number }}
        run: |
          get_current_approval() {
            python3 agents/scripts/pull-request-promotion-approval.py current "$GITHUB_REPOSITORY" "$PULL_REQUEST_NUMBER"
          }

          current_approval=$(get_current_approval)
          pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
          if [ "$(jq --raw-output '.id // empty' <<< "$current_approval")" != "$APPROVAL_ID" ] || \
            [ "$(jq --raw-output '.promotion_label // empty' <<< "$current_approval")" != "$PROMOTION_LABEL" ] || \
            ! jq --exit-status --argjson repository_id "$GITHUB_REPOSITORY_ID" \
              --arg source_base "$SOURCE_BASE" --arg head_sha "$HEAD_SHA" \
              '.state == "open" and .base.repo.id == $repository_id and .head.repo.id == $repository_id
                and .base.ref == $source_base and .head.sha == $head_sha' \
              <<< "$pull_request" > /dev/null; then
            echo "The rejected promotion was superseded; leaving the pull request unchanged."
            exit 0
          fi

          if [ "$GITHUB_REPOSITORY" = astral-sh/uv-dev ] && \
            jq --exit-status '.draft | not' <<< "$pull_request" > /dev/null; then
            gh pr ready "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/assignees" \
            --raw-field "assignees[]=$PROMOTER" --silent

          comment="Promotion stopped."
          if [ -n "$PARENT_UPDATE_REASON" ]; then
            comment="$comment Parent update ($PARENT_UPDATE_OUTCOME): $PARENT_UPDATE_REASON"
          fi
          if [ "$GITHUB_REPOSITORY" = astral-sh/uv-dev ]; then
            comment="$comment Returned this pull request to draft."
          fi
          comment="$comment Assigned @$PROMOTER."
          if [ -n "$UPSTREAM_NUMBER" ]; then
            comment="$comment An upstream pull request was already created as astral-sh/uv#$UPSTREAM_NUMBER."
          fi
          comment="$comment Review the changes, then add \`$PROMOTION_LABEL\` to retry. [Promotion run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          gh pr comment "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$comment"

          current_approval=$(get_current_approval)
          pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
          if [ "$(jq --raw-output '.id // empty' <<< "$current_approval")" != "$APPROVAL_ID" ] || \
            [ "$(jq --raw-output '.promotion_label // empty' <<< "$current_approval")" != "$PROMOTION_LABEL" ] || \
            ! jq --exit-status --argjson repository_id "$GITHUB_REPOSITORY_ID" \
              --arg source_base "$SOURCE_BASE" --arg head_sha "$HEAD_SHA" \
              '.state == "open" and .base.repo.id == $repository_id and .head.repo.id == $repository_id
                and .base.ref == $source_base and .head.sha == $head_sha' \
              <<< "$pull_request" > /dev/null; then
            echo "The rejected promotion was superseded during recovery; leaving its label unchanged."
            exit 0
          fi
          if jq --exit-status --arg label "$PROMOTION_LABEL" \
            '.labels | any(.name == $label)' <<< "$pull_request" > /dev/null; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels/$PROMOTION_LABEL" --silent
          fi

          echo "Promotion stopped for $GITHUB_REPOSITORY#$PULL_REQUEST_NUMBER at $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"
