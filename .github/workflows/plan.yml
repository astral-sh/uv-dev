name: plan

on:
  workflow_call:
    inputs:
      base-sha:
        description: "The base SHA used to determine changed files"
        required: false
        type: string
      head-sha:
        description: "The head SHA used to determine changed files"
        required: false
        type: string
    outputs:
      test-code:
        description: "Whether code tests should run"
        value: ${{ jobs.plan.outputs.test-code }}
      review-security:
        description: "Whether the security review should run"
        value: ${{ jobs.plan.outputs.review-security }}
      check-schema:
        description: "Whether the schema check should run"
        value: ${{ jobs.plan.outputs.check-schema }}
      check-crates-policies:
        description: "Whether the crates.io publishing policy check should run"
        value: ${{ jobs.plan.outputs.check-crates-policies }}
      build-release-binaries:
        description: "Whether release binaries should be built"
        value: ${{ jobs.plan.outputs.build-release-binaries }}
      run-checks:
        description: "Whether checks should run"
        value: ${{ jobs.plan.outputs.run-checks }}
      test-publish:
        description: "Whether publish tests should run"
        value: ${{ jobs.plan.outputs.test-publish }}
      test-windows-trampoline:
        description: "Whether Windows trampoline tests should run"
        value: ${{ jobs.plan.outputs.test-windows-trampoline }}
      test-windows-trampoline-check-binary:
        description: "Whether the Windows trampoline binary check should run"
        value: ${{ jobs.plan.outputs.test-windows-trampoline-check-binary }}
      save-rust-cache:
        description: "Whether the Rust cache should be saved"
        value: ${{ jobs.plan.outputs.save-rust-cache }}
      run-bench:
        description: "Whether benchmarks should run"
        value: ${{ jobs.plan.outputs.run-bench }}
      test-smoke:
        description: "Whether smoke tests should run"
        value: ${{ jobs.plan.outputs.test-smoke }}
      test-ecosystem:
        description: "Whether ecosystem tests should run"
        value: ${{ jobs.plan.outputs.test-ecosystem }}
      test-integration:
        description: "Whether integration tests should run"
        value: ${{ jobs.plan.outputs.test-integration }}
      test-system:
        description: "Whether system tests should run"
        value: ${{ jobs.plan.outputs.test-system }}
      test-macos:
        description: "Whether macOS tests should run"
        value: ${{ jobs.plan.outputs.test-macos }}
      build-docker:
        description: "Whether the Docker image should be built"
        value: ${{ jobs.plan.outputs.build-docker }}
      push-docker:
        description: "Whether the Docker image should be pushed"
        value: ${{ jobs.plan.outputs.push-docker }}

permissions:
  contents: read

env:
  UV_LOCKED: 1

jobs:
  plan:
    runs-on: depot-ubuntu-24.04
    outputs:
      test-code: ${{ steps.plan.outputs.test_code }}
      review-security: ${{ steps.plan.outputs.review_security }}
      check-schema: ${{ steps.plan.outputs.check_schema }}
      check-crates-policies: ${{ steps.plan.outputs.check_crates_policies }}
      build-release-binaries: ${{ steps.plan.outputs.build_release_binaries }}
      run-checks: ${{ steps.plan.outputs.run_checks }}
      test-publish: ${{ steps.plan.outputs.test_publish }}
      test-windows-trampoline: ${{ steps.plan.outputs.test_windows_trampoline }}
      test-windows-trampoline-check-binary: ${{ steps.plan.outputs.test_windows_trampoline_check_binary }}
      save-rust-cache: ${{ steps.plan.outputs.save_rust_cache }}
      run-bench: ${{ steps.plan.outputs.run_bench }}
      test-smoke: ${{ steps.plan.outputs.test_smoke }}
      test-ecosystem: ${{ steps.plan.outputs.test_ecosystem }}
      test-integration: ${{ steps.plan.outputs.test_integration }}
      test-system: ${{ steps.plan.outputs.test_system }}
      test-macos: ${{ steps.plan.outputs.test_macos }}
      build-docker: ${{ steps.plan.outputs.build_docker }}
      push-docker: ${{ steps.plan.outputs.push_docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"

      - name: "Detect changes"
        id: detect-changes
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
        run: |
          version_head="${HEAD_SHA:-HEAD}"
          merge_base="$(git merge-base "${BASE_SHA:-origin/main}" "$version_head")"
          version_dir="$RUNNER_TEMP/uv-release-version"
          mkdir -p "$version_dir/base" "$version_dir/head"
          git show "${merge_base}:pyproject.toml" > "$version_dir/base/pyproject.toml"
          git show "${version_head}:pyproject.toml" > "$version_dir/head/pyproject.toml"
          base_version="$(uv version --short --project "$version_dir/base")"
          head_version="$(uv version --short --project "$version_dir/head")"
          if [[ "$base_version" == "$head_version" ]]; then
            uv_version_changed=false
          else
            uv_version_changed=true
          fi

          files=$(git diff --no-ext-diff --no-textconv --name-only "${BASE_SHA:-origin/main}...HEAD" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          changes=$(jq --null-input --compact-output --argjson files "$files" --argjson uv_version_changed "$uv_version_changed" '
            def changed($pattern): any($files[]; test($pattern));

            {
              "rust-code-changed": changed("\\.rs$"),
              "rust-deps-changed": changed("^(Cargo\\.toml|Cargo\\.lock|crates/.*/Cargo\\.toml)$"),
              "rust-config-changed": changed("^(rust-toolchain\\.toml$|crates/uv-build/rust-toolchain\\.toml$|\\.cargo/)"),
              "python-config-changed": changed("^(pyproject\\.toml|crates/.*/pyproject\\.toml)$"),
              "workflow-changed": changed("^\\.github/workflows/.*\\.yml$"),
              "release-workflow-changed": changed("^\\.github/workflows/(build-release-binaries|sign-release-binaries|release)\\.yml$"),
              "release-build-changed": changed("^(dist-workspace\\.toml|scripts/((check_uv_wheel_contents|patch-dist-manifest-checksums|repair-sdist-cargo-lock)\\.py|(extract-wheel-binaries|sign-release-macos|extract-github-release-binaries|inject-signed-github-release-binaries|plan-release-signing|assemble-release-artifacts)\\.py.*|dist-manifest-to-files\\.sh|verify-release-.*\\.(py.*|ps1)|test-release-wheels-.*|verify-github-release-.*))$"),
              "ci-workflow-changed": changed("^\\.github/workflows/ci\\.yml$"),
              "schema-changed": changed("^uv\\.schema\\.json$"),
              "publish-code-changed": changed("^(crates/uv-publish/|scripts/publish/|crates/uv/src/commands/publish\\.rs$)"),
              "trampoline-workflow-changed": changed("^\\.github/workflows/test-windows-trampolines\\.yml$"),
              "trampoline-code-changed": changed("^crates/(uv-trampoline|uv-trampoline-builder)/"),
              "trampoline-repro-changed": changed("^(crates/uv-trampoline/(rust-toolchain\\.toml|Dockerfile)$|crates/uv-trampoline/.*\\.rs$|crates/uv-trampoline-builder/trampolines/)"),
              "trampoline-build-scripts-changed": changed("^scripts/build-trampolines(-in-docker)?\\.sh$"),
              "trampoline-scripts-changed": changed("^scripts/(build-trampolines(-in-docker)?\\.sh|check-trampoline-version-consistency\\.py)$"),
              "uv-build-changed": changed("^crates/uv-build/"),
              "dockerfile-changed": changed("^Dockerfile$"),
              "docker-workflow-changed": changed("^\\.github/workflows/(build-docker|publish-docker|publish-docker-image)\\.yml$"),
              "bench-workflow-changed": changed("^(\\.github/workflows/bench\\.yml|scripts/codspeed-profiles\\.py.*)$"),
              "integration-changed": changed("^(\\.github/workflows/test-integration\\.yml$|test/integration/|scripts/(check_registry|check_cache_compat|registries-test)\\.py$)"),
              "system-workflow-changed": changed("^\\.github/workflows/test-system\\.yml$"),
              "system-test-changed": changed("^scripts/(check_system_python|check_embedded_python)\\.py$"),
              "uv-version-changed": $uv_version_changed,
              "any-code-changed": any($files[]; test("^(docs/|bin/|assets/|agents/|\\.claude/|\\.codex/)|^mkdocs.*\\.yml$|\\.md$") | not)
            } as $changes
            | $changes + {
              "any-rust-changed": ($changes."rust-code-changed" or $changes."rust-deps-changed" or $changes."rust-config-changed"),
              "release-build-changed": ($changes."release-build-changed" or $changes."python-config-changed" or $changes."rust-deps-changed" or $changes."rust-config-changed" or $changes."uv-build-changed" or $changes."release-workflow-changed"),
              "publish-changed": ($changes."publish-code-changed" or $changes."ci-workflow-changed"),
              "cache-relevant-changed": ($changes."rust-deps-changed" or $changes."rust-config-changed" or $changes."workflow-changed"),
              "docker-build-changed": ($changes."python-config-changed" or $changes."rust-deps-changed" or $changes."rust-config-changed" or $changes."dockerfile-changed" or $changes."docker-workflow-changed")
            }
          ')

          jq --exit-status --argjson changes "$changes" '
            (.required | sort) as $required
            | (($changes | type) == "object")
              and (($changes | keys | sort) == $required)
              and ($changes | all(.[]; type == "boolean"))
          ' .github/ci-changes.schema.json > /dev/null
          printf 'changes=%s\n' "$changes" >> "$GITHUB_OUTPUT"

      - name: "Plan"
        id: plan
        shell: bash
        env:
          CHANGES: ${{ steps.detect-changes.outputs.changes }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          jq --null-input --raw-output --argjson changes "$CHANGES" --argjson labels "$LABELS" --argjson on_main "$ON_MAIN" --arg repository "$REPOSITORY" --arg event_name "$EVENT_NAME" --arg head_repository "$HEAD_REPOSITORY" --arg base_ref "$BASE_REF" '
            def has_label($label): ($labels // []) | index($label) != null;

            {
              test_code: ((has_label("test:skip") | not) and ($changes."any-code-changed" or $on_main)),
              review_security: $changes."any-code-changed",
              check_schema: $changes."schema-changed",
              check_crates_policies: ($repository == "astral-sh/uv" and $event_name == "pull_request" and $head_repository == $repository and $base_ref == "main" and $changes."uv-version-changed"),
              build_release_binaries: ((has_label("test:skip") | not) and (has_label("build:skip") | not) and (has_label("build:skip-release") | not) and ($changes."release-build-changed" or has_label("build:release"))),
              run_checks: (has_label("test:skip") | not),
              test_publish: ($changes."publish-changed" or has_label("test:publish") or has_label("test:extended") or $on_main),
              test_windows_trampoline: ((has_label("test:skip") | not) and ($changes."trampoline-code-changed" or $changes."trampoline-scripts-changed" or $changes."trampoline-workflow-changed" or $changes."rust-deps-changed" or has_label("build:windows-trampoline") or $on_main)),
              test_windows_trampoline_check_binary: ((has_label("test:skip") | not) and ($changes."trampoline-repro-changed" or $changes."trampoline-build-scripts-changed" or has_label("build:windows-trampoline"))),
              save_rust_cache: ($on_main or $changes."cache-relevant-changed"),
              run_bench: ((has_label("test:skip") | not) and ($changes."any-rust-changed" or $changes."bench-workflow-changed" or $on_main)),
              test_smoke: (has_label("test:skip") | not),
              test_ecosystem: (has_label("test:skip") | not),
              test_integration: (has_label("test:integration") or has_label("test:extended") or $on_main or $changes."integration-changed"),
              test_system: (has_label("test:system") or has_label("test:extended") or $on_main or $changes."system-workflow-changed" or $changes."system-test-changed"),
              test_macos: (has_label("test:macos") or has_label("test:extended") or $on_main or ((has_label("test:skip") | not) and (has_label("build:skip") | not) and (has_label("build:skip-release") | not) and ($changes."release-build-changed" or has_label("build:release")))),
              build_docker: ((has_label("build:skip") | not) and (has_label("build:skip-docker") | not) and ($changes."docker-build-changed" or has_label("build:push-docker"))),
              push_docker: has_label("build:push-docker")
            }
            | to_entries[]
            | "\(.key)=\(.value)"
          ' >> "$GITHUB_OUTPUT"
