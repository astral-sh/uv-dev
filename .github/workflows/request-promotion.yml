name: Request promotion

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The uv-security pull request number"
        required: true
        type: string
      head_sha:
        description: "The uv-security pull request head SHA at dispatch time"
        required: true
        type: string

permissions: {}

concurrency:
  group: request-promotion-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  request:
    if: github.repository == 'astral-sh/uv-security'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Request promotion label
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: |
          if ! [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ && "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A pull request number and head SHA are required." >&2
            exit 1
          fi

          pull_request=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
          if ! jq --exit-status \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            '.state == "open" and (.draft | not) and .head.sha == $head_sha and .base.repo.id == $repository_id and .head.repo.id == $repository_id' \
            <<< "$pull_request" > /dev/null; then
            echo "The pull request is no longer ready at the dispatched head; skipping the reminder."
            exit 0
          fi

          ready_event_id=$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/events" --paginate --slurp |
              jq --raw-output '[.[][] | select(.event == "ready_for_review" and .actor.type == "User") | .id] | last // empty'
          )
          if [ -z "$ready_event_id" ]; then
            echo "The pull request has no human ready-for-review event." >&2
            exit 1
          fi

          marker="<!-- uv-security-promotion-ready:$ready_event_id -->"
          comments=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments" --paginate --slurp)
          if jq --exit-status --arg marker "$marker" \
            'any(.[][]; .user.login == "github-actions[bot]" and (.body | contains($marker)))' \
            <<< "$comments" > /dev/null; then
            echo "The promotion reminder was already posted for this ready-for-review event."
            exit 0
          fi

          comment="To promote this pull request to astral-sh/uv, add \`bot:promote\` after marking it ready for review. If the label was applied before this ready-for-review event, remove and re-add it."
          gh pr comment "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$comment $marker"
