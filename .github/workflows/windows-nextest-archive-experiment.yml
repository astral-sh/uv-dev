{
  "name": "Windows nextest archive experiment",
  "on": {
    "push": {
      "branches": [
        "zb/ci-windows-nextest-archive-20260909"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "compare": {
      "strategy": {
        "fail-fast": false,
        "max-parallel": 2,
        "matrix": {
          "replica": [
            1,
            2,
            3,
            4,
            5
          ]
        }
      },
      "uses": "./.github/workflows/windows-nextest-archive-replica.yml",
      "with": {
        "replica": "${{ matrix.replica }}"
      }
    }
  }
}
