name: "Load issue context"
description: "Load an issue artifact or legacy report into a caller-owned local directory."

inputs:
  issue-number:
    description: "The upstream issue whose report should be loaded."
    required: true
  repository:
    description: "The repository containing the upstream issue."
    default: ${{ github.repository }}
    required: false
  path:
    description: "A destination inside the workspace or runner temporary directory."
    required: true
  allow-missing:
    description: "Return exists=false when no report exists."
    default: "false"
    required: false
  template:
    description: "A Markdown template for initializing a new local report."
    required: false
  issue-file:
    description: "The verified issue JSON used with the template."
    required: false

outputs:
  exists:
    description: "Whether an existing report was loaded or a local report initialized."
    value: ${{ steps.load.outputs.exists }}
  revision:
    description: "The source revision to check before publishing an update."
    value: ${{ steps.load.outputs.revision }}
  path:
    description: "The absolute destination containing the issue context."
    value: ${{ steps.load.outputs.path }}

runs:
  using: "composite"
  steps:
    - name: "Load issue context"
      id: load
      shell: bash
      env:
        ALLOW_MISSING: ${{ inputs.allow-missing }}
        DIRECTORY: ${{ inputs.path }}
        GH_TOKEN: ${{ github.token }}
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: "1"
        ISSUE_FILE: ${{ inputs.issue-file }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        REPOSITORY: ${{ inputs.repository }}
        TEMPLATE: ${{ inputs.template }}
      run: |
        arguments=(
          load
          --repository "$REPOSITORY"
          --issue-number "$ISSUE_NUMBER"
          --path "$DIRECTORY"
        )
        if [ "$ALLOW_MISSING" = "true" ]; then
          arguments+=(--allow-missing)
        fi
        if [ -n "$TEMPLATE" ]; then
          arguments+=(--template "$TEMPLATE" --issue-file "$ISSUE_FILE")
        fi
        python3 "$GITHUB_ACTION_PATH/issue_context.py" "${arguments[@]}"
