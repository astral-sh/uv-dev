name: "Load Codex thread"
description: "Restore and verify one retained root Codex session."

inputs:
  artifact-id:
    description: "The numeric identifier of the retained Codex thread artifact."
    required: true
  run-id:
    description: "The numeric GitHub Actions run containing the retained artifact."
    required: true
  repository:
    description: "The repository containing the retained artifact; defaults to the current repository."
    required: false
  github-token:
    description: "A token with permission to read the artifact; defaults to the workflow token."
    required: false
  codex-home:
    description: "An existing Codex home directory whose sessions directory should be restored."
    default: "agents/codex"
    required: false

outputs:
  artifact-id:
    description: "The numeric identifier of the restored Codex thread artifact."
    value: ${{ steps.source.outputs.artifact-id }}
  codex-home:
    description: "The absolute Codex home containing the restored root session."
    value: ${{ steps.source.outputs.codex-home }}
  path:
    description: "The absolute sessions directory containing the restored root session."
    value: ${{ steps.source.outputs.path }}
  session-id:
    description: "The verified root Codex session identifier."
    value: ${{ steps.validate.outputs.session-id }}

runs:
  using: "composite"
  steps:
    - name: "Validate Codex thread source"
      id: source
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        DIRECTORY: ${{ inputs.codex-home }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
        RUN_ID: ${{ inputs.run-id }}
      run: |
        if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
          ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
          ! [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
          ! [[ "$DIRECTORY" =~ ^[A-Za-z0-9_./-]+$ ]]; then
          echo "The Codex thread source or destination is invalid." >&2
          exit 1
        fi

        resolve_path() {
          python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$1"
        }
        resolved_codex_home="$(resolve_path "$DIRECTORY")"
        resolved_runner_temp="$(resolve_path "$RUNNER_TEMP")"
        resolved_workspace="$(resolve_path "$GITHUB_WORKSPACE")"
        case "$resolved_codex_home" in
          "$resolved_runner_temp"/*|"$resolved_workspace"/*) ;;
          *)
            echo "The Codex home must be inside the runner or workspace." >&2
            exit 1
            ;;
        esac

        if [ ! -d "$resolved_codex_home" ]; then
          echo "The Codex home does not exist." >&2
          exit 1
        fi

        resolved_sessions="$resolved_codex_home/sessions"
        if [ -e "$resolved_sessions" ]; then
          echo "The Codex sessions destination already exists." >&2
          exit 1
        fi

        {
          printf 'artifact-id=%s\n' "$ARTIFACT_ID"
          printf 'codex-home=%s\n' "$resolved_codex_home"
          printf 'path=%s\n' "$resolved_sessions"
        } >> "$GITHUB_OUTPUT"

    - name: "Download Codex thread"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.github-token || github.token }}
        repository: ${{ inputs.repository || github.repository }}
        run-id: ${{ inputs.run-id }}
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ steps.source.outputs.path }}

    - name: "Validate root Codex session"
      id: validate
      shell: bash
      env:
        SESSIONS_DIRECTORY: ${{ steps.source.outputs.path }}
      run: |
        while IFS= read -r -d '' compressed_rollout; do
          zstd --decompress --stdout "$compressed_rollout" > "${compressed_rollout%.zst}"
        done < <(find "$SESSIONS_DIRECTORY" -type f -name '*.jsonl.zst' -print0)

        root_sessions=0
        root_session_id=
        while IFS= read -r -d '' rollout; do
          metadata="$(head -n 1 "$rollout")"
          if ! jq --exit-status '
            .type == "session_meta"
            and (.payload | type == "object")
            and (.payload.id | type == "string")
          ' <<< "$metadata" > /dev/null; then
            echo "The artifact contains an invalid Codex session." >&2
            exit 1
          fi

          if jq --exit-status '.payload.source == "exec"' <<< "$metadata" > /dev/null; then
            root_sessions=$((root_sessions + 1))
            root_session_id="$(jq --raw-output '.payload.id' <<< "$metadata")"
            session_workspace="$(jq --raw-output '.payload.cwd' <<< "$metadata")"
            if ! [[ "$root_session_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] ||
              [ "$session_workspace" != "$GITHUB_WORKSPACE" ]; then
              echo "The Codex session does not match the trusted workspace." >&2
              exit 1
            fi
          fi
        done < <(find "$SESSIONS_DIRECTORY" -type f -name '*.jsonl' -print0)

        if [ "$root_sessions" -ne 1 ]; then
          echo "The artifact must contain exactly one root Codex session." >&2
          exit 1
        fi

        printf 'session-id=%s\n' "$root_session_id" >> "$GITHUB_OUTPUT"
