name: "Set up Python automations"
description: "Install the trusted workflow's automation package independently of later checkouts."

outputs:
  executable:
    description: "The absolute path to the installed uv-automations command."
    value: ${{ steps.install.outputs.executable }}
  python:
    description: "The absolute path to the installed environment's Python interpreter."
    value: ${{ steps.install.outputs.python }}

runs:
  using: "composite"
  steps:
    - name: "Select uv checksum"
      id: uv
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) checksum=745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd ;;
          Linux-ARM64) checksum=2eaa5d94f5db7b3a1a092156b9420459e42ab0217d917fe74a876309cef9b5e9 ;;
          macOS-X64) checksum=5e287ef61cb6a9b61b3a83fef124fd143e400468a7dac794230147a810e17119 ;;
          macOS-ARM64) checksum=7e6ddb9316acc00f2296c82ff4d99977870ee34b2f0ddcae9444d714db9364ed ;;
          Windows-X64) checksum=a86c9dc7bad9b03f388583b7187c05fe9951c2e0d392217e8fd43d97787f6ec2 ;;
          Windows-ARM64) checksum=1efb2654b06e7063d4ac1fc9d49a9bda9a6704d82f035b589a2751a592f14151 ;;
          *) echo "Unsupported automation runner: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

    - name: "Install uv"
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.13"
        checksum: ${{ steps.uv.outputs.checksum }}
        enable-cache: false

    - name: "Install trusted automation runtime"
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: uv run --no-project --no-config --python 3.14 python "$ACTION_PATH/install.py"
