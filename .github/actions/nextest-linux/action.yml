name: Run uv nextest on linux
description: Prepare uv's linux test environment and run one partition.
inputs:
  partition:
    description: One-based partition number.
    default: "1"
  partitions:
    description: Total number of partitions.
    default: "1"
  save-cache:
    description: Whether to save the Rust build cache.
    default: "true"
runs:
  using: composite
  steps:
    - name: "Install Rust toolchain"
      shell: bash
      run: rustup toolchain install --profile minimal

    - uses: astral-sh/github-actions/rust-workspace-cache@52ea66bbf7dbe95fc9e2baae530cb3827214c530
      with:
        prefix-key: v1-rust-workspace
        key: ${{ hashFiles('Cargo.toml') }}
        profile: fast-build-nightly
        save-if: ${{ inputs.save-cache == 'true' }}

    - name: "Configure Python archive cache"
      # Share archives downloaded during setup with the tests.
      shell: bash
      run: echo "UV_PYTHON_CACHE_DIR=$RUNNER_TEMP/uv-python-cache" >> "$GITHUB_ENV"

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        # renovate: datasource=github-release-attachments depName=astral-sh/uv
        version: "0.13.5"
        checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"

    - name: "Install required Python versions"
      env:
        UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
      shell: bash
      run: |
        uv python install
        # Warm the cache for Unix-only tests
        uv python install 3.12d 3.13d 3.13t 3.13td

    - name: "Install Linux test dependencies"
      shell: bash
      run: |
        # Try the next configured mirror after the first failed download.
        cat /etc/apt/apt-mirrors.txt
        printf '%s\n' \
          'Acquire::Retries "0";' \
          'Acquire::http::Timeout "10";' \
          'Acquire::https::Timeout "10";' \
          | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
        # Use Ubuntu's Git and matching libcurl to avoid credential failures in private-repository tests.
        sudo apt install -y --no-install-recommends --allow-downgrades \
          git/noble-updates git-man/noble-updates libcurl3t64-gnutls/noble-updates gnome-keyring

    - name: "Start gnome-keyring"
      # run gnome-keyring with 'foobar' as password for the login keyring
      # this will create a new login keyring and unlock it
      # the login password doesn't matter, but the keyring must be unlocked for the tests to work
      shell: bash
      run: gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'

    - name: "Create btrfs filesystem"
      shell: bash
      run: |
        sudo apt install -y btrfs-progs
        truncate -s 1G /tmp/btrfs.img
        mkfs.btrfs /tmp/btrfs.img
        sudo mkdir /btrfs
        sudo mount -o loop /tmp/btrfs.img /btrfs
        sudo chown "$(id -u):$(id -g)" /btrfs

    - name: "Create tmpfs filesystem"
      shell: bash
      run: |
        sudo mkdir /tmpfs
        sudo mount -t tmpfs -o size=256m tmpfs /tmpfs
        sudo chown "$(id -u):$(id -g)" /tmpfs

    - name: "Create minix filesystem (low hardlink limit)"
      shell: bash
      run: |
        truncate -s 16M /tmp/minix.img
        mkfs.minix /tmp/minix.img
        sudo mkdir /minix
        sudo mount -o loop /tmp/minix.img /minix
        sudo chown "$(id -u):$(id -g)" /minix

    - name: "Cargo test"
      env:
        # Retry more than default to reduce flakes in CI
        UV_HTTP_RETRIES: 5
        RUST_BACKTRACE: 1
        UV_INTERNAL__TEST_COW_FS: /btrfs
        UV_INTERNAL__TEST_NOCOW_FS: /tmpfs
        UV_INTERNAL__TEST_ALT_FS: /tmpfs
        UV_INTERNAL__TEST_LOWLINKS_FS: /minix
      uses: astral-sh/github-actions/nextest@583fb5711db77c8554775b551079742d8a341e91
      with:
        name: linux
        partition: ${{ inputs.partition }}
        partitions: ${{ inputs.partitions }}
        junit-path: target/nextest/ci*/junit.xml
        arguments: >-
          ["--locked","--cargo-profile","fast-build-nightly","-Z","panic-abort-tests","-Z","checksum-freshness","--features","test-python-patch,test-universal,native-auth,secret-service","--workspace","--profile","ci-linux"]
