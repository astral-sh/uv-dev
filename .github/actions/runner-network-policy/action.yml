name: Runner network policy
description: Apply a reviewed network policy before later action hooks
inputs:
  profile:
    description: Name of the bundled, reviewed network profile
    required: true
  url-profile:
    description: Optional bundled URL policy; decrypts HTTPS to enforce methods, paths, and queries
    required: false
    default: ""
  privileges:
    description: Drop sudo and container-daemon access, or retain them explicitly
    required: false
    default: drop
  disposable:
    description: Confirm that this is a disposable Linux VM, not a persistent runner
    required: true
    default: "false"
runs:
  using: node24
  pre: pre.cjs
  main: main.cjs
  post: post.cjs
