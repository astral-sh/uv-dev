[package]
name = "uv-trampoline-builder"
version = "0.0.92"
description = "This is an internal component crate of uv"

edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
include = ["src/**/*", "trampolines/*.exe", "Cargo.toml", "README.md"]

[features]
default = ["production"]

# Expect tests to run against production builds of `uv-trampoline` binaries, rather than debug builds
production = []

# Enable the development tool for normalizing generated trampoline binaries.
normalize-pe-timestamps = ["dep:goblin", "goblin/pe32", "goblin/pe64"]

[lints]
workspace = true

[[bin]]
name = "normalize-pe-timestamps"
required-features = ["normalize-pe-timestamps"]

[dependencies]
uv-fs = { workspace = true }

anyhow = { workspace = true }
fs-err = { workspace = true }
goblin = { workspace = true, optional = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
async_zip = { workspace = true, features = ["zstd"] }
editpe = { workspace = true }
futures-lite = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_fs = { workspace = true }
anyhow = { workspace = true }
fs-err = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
which = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
goblin = { workspace = true, features = ["pe32", "pe64"] }

[lib]
doctest = false
