[package]
name = "uv-performance-memory-allocator"
version = "0.0.98"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false
test = false

[target.'cfg(all(target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1.50", default-features = false, features = ["v2"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
# Avoid faulting in huge pages for sparse allocator regions in small CLI processes.
mimalloc = { version = "0.1.50", default-features = false, features = ["v2", "no_thp"] }

[target.'cfg(all(not(target_os = "windows"), not(all(target_os = "linux", target_arch = "x86_64")), not(target_os = "openbsd"), not(target_os = "freebsd"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64")))'.dependencies]
tikv-jemallocator = { version = "0.6.0", default-features = false, features = ["background_threads_runtime_support"] }
